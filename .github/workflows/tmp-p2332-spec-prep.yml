name: P2-V0.23.32 Corrected Spec Preparation

on:
  push:
    branches:
      - ws/543-candidate-validation-repair
    paths:
      - .github/workflows/tmp-p2332-spec-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/543-candidate-validation-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate corrected specification before DSPy
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.23.32.md
      - name: Install local DSPy release LM
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Run mandatory DSPy SpecCritic and SpecCompiler
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:0.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: python scripts/compile_spec.py specs/P2-V0.23.32.md
      - name: Verify corrected protected DSPy evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.32.md
      - name: Commit corrected protected plan and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Parallax Spec Preparer'
          git config user.email 'parallax-spec@users.noreply.github.com'
          git add specs/compiled/P2-V0.23.32.plan.json
          git rm .github/workflows/tmp-p2332-spec-prep.yml
          git commit -m 'P2-V0.23.32 — refresh protected DSPy plan'
          git push origin HEAD:ws/543-candidate-validation-repair
