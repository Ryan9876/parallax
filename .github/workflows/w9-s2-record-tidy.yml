name: W9 S2 record tidy

on:
  push:
    branches:
      - records/w9-s2-release

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: records/w9-s2-release
          fetch-depth: 1
      - name: Correct architecture version relationship
        run: |
          python -c 'from pathlib import Path; p=Path("ARCHITECTURE.md"); s=p.read_text(); old="This version records W9-S1"; assert old in s; p.write_text(s.replace(old,"This version retains W9-S1",1))'
      - name: Commit tidy record
        run: |
          git config user.name "Ryan9876"
          git config user.email "ryansmith100@gmail.com"
          git rm .github/workflows/w9-s2-record-tidy.yml
          git add ARCHITECTURE.md
          git diff --cached --check
          git commit -m "Clarify W9-S2 architecture version relationship"
          git push origin HEAD:records/w9-s2-release
