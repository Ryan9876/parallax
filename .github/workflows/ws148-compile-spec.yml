name: WS148 Compile P2-V0.17.4

on:
  push:
    branches: [ws/w4-live-build-ux]
    paths: ['.github/workflows/ws148-compile-spec.yml']

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-live-build-ux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen2.5:0.5b
      - name: Validate and compile approved specification
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:0.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: |
          python scripts/validate_spec.py specs/P2-V0.17.4.md
          python scripts/compile_spec.py specs/P2-V0.17.4.md
      - name: Commit authentic compiled plan
        run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add specs/compiled/P2-V0.17.4.plan.json
          git diff --cached --quiet && exit 0
          git commit -m 'Compile P2-V0.17.4 with DSPy'
          git push origin HEAD:ws/w4-live-build-ux
