name: WS148 Scope Provider Evidence

on:
  push:
    branches: [ws/w4-live-build-ux]
    paths: ['.github/workflows/ws148-scope-provider-evidence.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-live-build-ux
      - run: python scripts/ws148_scope_provider_evidence.py
      - run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/client/scripts/live-build-smoke.mjs
          git commit -m 'Align Live Build provider evidence smoke labels'
          git push origin HEAD:ws/w4-live-build-ux
