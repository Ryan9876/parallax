name: P2-V0.23.25 Focused Implementation v2

on:
  push:
    branches: [fix/p2325-nested-source-and-transport-reconcile]
    paths:
      - '.github/workflows/implement-p2325-v2.yml'

permissions:
  contents: write

concurrency:
  group: p2325-focused-implementation-v2
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2325-nested-source-and-transport-reconcile
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Apply P2-V0.23.25 implementation
        run: |
          python scripts/p2325_apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/client/src/hooks/useEngineeringRun.ts')
          text = path.read_text()
          old = '        if (!isAuthoritativeAutonomyAdvance(current, reconciled)) throw caught;'
          new = '        if (!reconciled || !isAuthoritativeAutonomyAdvance(current, reconciled)) throw caught;'
          if text.count(old) != 1:
              raise SystemExit('expected one client reconciliation narrowing site')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate nested-source safety and canonicalization
        run: |
          set -euo pipefail
          python -m compileall -q services/api/parallax_api
          pytest -q \
            services/api/tests/test_nested_new_file_creation_v02325.py \
            services/api/tests/test_model_patch_canonicalization_v02318.py
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.25.md
          git diff --check
      - name: Validate client reconciliation contract
        working-directory: apps/client
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm run test:state
      - name: Prove protected authority surfaces are unchanged
        run: |
          set -euo pipefail
          git diff --quiet a2410243b3fc5db2a968e7027c97b790be9f1634 -- \
            services/api/parallax_api/code/agentic_candidate_recovery.py \
            services/api/parallax_api/intelligence/dspy_programs.py \
            services/api/parallax_api/intelligence/router.py \
            services/api/parallax_api/code/implementation_runtime.py
          grep -q '^MAX_VALIDATOR_REPAIR_RETRIES_PER_WORK_UNIT = 1$' services/api/parallax_api/code/agentic_candidate_recovery.py
      - name: Advance authoritative architecture after focused behavior passes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          if 'Version: 3.35' not in text:
              raise SystemExit('expected Architecture v3.35 baseline')
          text = text.replace('Version: 3.35', 'Version: 3.36', 1)
          marker = '## Version relationship\n\n'
          paragraph = (
              'Architecture v3.36 adds two bounded reliability contracts required for ordinary real-world development. '
              'A validated new text-file patch bound to the SHA-256 of empty content may carry side-effect-free missing-parent intent derived only from its normalized in-workspace target; preparation creates nothing, commit revalidates every parent segment before creating only the recorded missing directories, and rollback removes only recorded directories that remain empty. Existing path normalization, workspace containment, secret-sensitive target/content rejection, supported text-file allowlist, symlink rejection, strict patch verification/canonicalization, byte limits, candidate validation, source-lineage authority, Git/deployment authority, lifecycle authority and the human REVIEW ceiling remain unchanged. Multi-patch file-target ancestry conflicts fail before mutation. '
              'Separately, an autonomy HTTP/API failure remains authoritative, while only a response-less client transport exception may be reconciled through a read-only latest-run fetch; recovery requires the exact same Engineering Run with a strictly newer canonical revision and remains inside the existing eight-request continuation budget. No ambiguous request is replayed from an unchanged revision, and no model retry, timeout, provider, credential, queue or authority is widened. Architecture v3.35 remains the fresh final validator-repair identity foundation.\n\n'
          )
          if marker not in text:
              raise SystemExit('architecture version relationship marker missing')
          path.write_text(text.replace(marker, marker + paragraph, 1))
          PY
          git diff --check
      - name: Commit validated implementation and remove temporary tooling
        run: |
          set -euo pipefail
          git config user.name "Parallax Release Worker"
          git config user.email "parallax-release-worker@users.noreply.github.com"
          git checkout -- apps/client/package-lock.json 2>/dev/null || rm -f apps/client/package-lock.json
          rm -rf apps/client/.tmp-state apps/client/.tmp-observability apps/client/.tmp-guidance
          git rm \
            .github/workflows/prepare-p2325.yml \
            .github/workflows/implement-p2325.yml \
            .github/workflows/implement-p2325-v2.yml \
            scripts/p2325_apply.py
          git add \
            ARCHITECTURE.md \
            services/api/parallax_api/code/patching.py \
            services/api/parallax_api/code/implementation.py \
            services/api/parallax_api/code/model_patch_canonicalization.py \
            services/api/tests/test_nested_new_file_creation_v02325.py \
            apps/client/src/state/engineeringRunContinuation.ts \
            apps/client/src/hooks/useEngineeringRun.ts \
            apps/client/scripts/test-engineering-run-continuation.cjs
          git diff --cached --check
          git commit -m "P2-V0.23.25 — enable safe nested source creation and transport reconciliation"
          git push origin HEAD:fix/p2325-nested-source-and-transport-reconcile
