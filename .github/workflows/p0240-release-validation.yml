name: P2-V0.24.0 Release Validation

on:
  push:
    branches: [ws/p0240-platform-overhaul]
    paths:
      - 'services/api/**'
      - 'apps/client/**'
      - 'specs/P2-V0.24.0.md'
      - 'specs/compiled/P2-V0.24.0.plan.json'
      - 'ARCHITECTURE.md'
      - '.github/workflows/p0240-release-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0240-release-validation
  cancel-in-progress: true

jobs:
  persistence-and-authority:
    name: Cross-database, latency and authority gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parallax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parallax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate exact governed specification and authentic DSPy evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.24.0.md
      - name: Run P2-V0.24.0 focused authority regressions
        run: |
          python -m pytest -q             services/api/tests/test_p0240_persistence.py             services/api/tests/test_p0240_execution_boundaries.py             services/api/tests/test_p0240_offline_intelligence.py             services/api/tests/test_source_delivery_composition.py             services/api/tests/test_run_events.py             services/api/tests/test_worker_recovery.py
      - name: Prove additive SQLite schema initialization
        run: |
          python services/api/scripts/p0240_schema_probe.py             'sqlite:///:memory:'             --output release-evidence/p0240-sqlite-schema.json
      - name: Prove additive PostgreSQL schema initialization
        run: |
          python services/api/scripts/p0240_schema_probe.py             'postgresql://postgres:postgres@127.0.0.1:5432/parallax'             --output release-evidence/p0240-postgresql-schema.json
      - name: Measure P2-V0.23.50 to P2-V0.24.0 transition improvement
        run: |
          python services/api/scripts/p0240_transition_benchmark.py             --output release-evidence/p0240-transition-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0240-release-evidence
          path: release-evidence
          if-no-files-found: error
          retention-days: 30

  client-reconciliation:
    name: Client stream reconciliation gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install client dependencies
        working-directory: apps/client
        run: npm install --no-audit --no-fund
      - name: Typecheck and state contracts
        working-directory: apps/client
        run: |
          npm run typecheck
          npm run test:state
      - name: Prove replay, cursor, reconnect and canonical reconciliation
        working-directory: apps/client
        run: node scripts/test-run-observability-client.cjs
      - name: Export exact-head web client
        working-directory: apps/client
        run: npm run export:web
