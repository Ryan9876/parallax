name: WS84 DSPy Compile

on:
  push:
    branches: ['p2/release-composition-compile']
    paths:
      - 'specs/P2-V0.15.11.md'
      - '.github/workflows/ws84-compile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'specs/P2-V0.15.11.md'
      - '.github/workflows/ws84-compile.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - run: python scripts/validate_spec.py specs/P2-V0.15.11.md --spec-only
      - id: model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'provider=true' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=openai/gpt-5.6-sol' >> "$GITHUB_ENV"
          else
            echo 'provider=false' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=ollama_chat/llama3.2:1b' >> "$GITHUB_ENV"
            echo 'DSPY_API_BASE=http://127.0.0.1:11434' >> "$GITHUB_ENV"
            echo 'DSPY_API_KEY=' >> "$GITHUB_ENV"
            echo 'DSPY_LOCAL_DEVELOPMENT=1' >> "$GITHUB_ENV"
          fi
      - name: Install local DSPy LM
        if: steps.model.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b
      - name: Compile approved release correction
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py specs/P2-V0.15.11.md
      - run: python scripts/validate_spec.py specs/P2-V0.15.11.md --require-dspy
      - uses: actions/upload-artifact@v4
        with:
          name: ws84-dspy-plan
          path: specs/compiled/P2-V0.15.11.plan.json
          if-no-files-found: error
          retention-days: 14
