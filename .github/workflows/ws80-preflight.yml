name: WS80 Runtime Evidence Preflight

on:
  push:
    branches:
      - ws/app-runtime-evidence-reference-loop
    paths:
      - '.github/workflows/ws80-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/app-runtime-evidence-reference-loop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Compile Python sources
        run: python -m compileall -q services/api/parallax_api services/api/tests
      - name: Validate P2-V0.15.10 specification contract
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.15.10.md
      - name: Run runtime evidence/reference-loop tests
        run: pytest -q services/api/tests/test_app_builder_reference_loop.py
      - name: Run full API regression suite
        run: pytest -q services/api/tests
      - name: Remove temporary preflight workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ws80-preflight.yml
          git commit -m 'ci: remove #80 runtime evidence preflight'
          git push origin HEAD:ws/app-runtime-evidence-reference-loop
