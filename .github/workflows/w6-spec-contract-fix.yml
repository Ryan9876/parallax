name: W6 runtime activation spec contract fix

on:
  push:
    branches:
      - p2/w6-runtime-activation
    paths:
      - .github/workflows/w6-spec-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/w6-runtime-activation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize protected spec headings and approval state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('specs/P2-V0.19.7.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Status: DRAFT / SPEC-FIRST': 'Status: APPROVED FOR IMPLEMENTATION',
              '## 4. Owned scope': '## 4. Scope',
              '## 8. Development gate': '## 8. Release gate',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected spec contract text: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/validate_spec.py specs/P2-V0.19.7.md --spec-only
      - name: Commit normalized spec and remove one-time workflow
        run: |
          rm .github/workflows/w6-spec-contract-fix.yml
          git config user.name "Parallax Control Tower"
          git config user.email "actions@users.noreply.github.com"
          git add specs/P2-V0.19.7.md .github/workflows/w6-spec-contract-fix.yml
          git diff --cached --check
          git commit -m "spec: approve P2-V0.19.7 contract for DSPy gate"
          git push origin HEAD:p2/w6-runtime-activation
