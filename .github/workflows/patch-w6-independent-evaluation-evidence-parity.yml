name: Patch Wave 6 independent evaluation evidence parity

on:
  push:
    branches: [hotfix/w6-independent-evaluation-evidence-parity]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/w6-independent-evaluation-evidence-parity
          fetch-depth: 0
      - name: Apply bounded caller correction
        run: python .github/patch-w6-independent-evaluation-evidence-parity.py
      - name: Install API test dependencies
        run: python -m pip install -e 'services/api[dev]'
      - name: Run focused S3 regressions
        run: python -m pytest -q services/api/tests/test_agent_judgment.py services/api/tests/test_w6_independent_evaluation_evidence_parity.py
      - name: Verify durable diff and self-remove temporary tooling
        run: |
          git diff --check
          git rm .github/workflows/patch-w6-independent-evaluation-evidence-parity.yml
          git rm .github/patch-w6-independent-evaluation-evidence-parity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/parallax_api/code/agentic_runtime.py services/api/tests/test_w6_independent_evaluation_evidence_parity.py
          git commit -m 'fix(w6): avoid duplicate protected evaluation evidence'
          git push origin HEAD:hotfix/w6-independent-evaluation-evidence-parity
