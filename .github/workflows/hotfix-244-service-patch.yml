name: Hotfix 244 Service Patch

on:
  push:
    branches:
      - 'hotfix/244-repository-identity-guard'
    paths:
      - '.github/workflows/hotfix-244-service-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/244-repository-identity-guard
          fetch-depth: 0
      - name: Apply activation boundary guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/parallax_api/code/service.py')
          text = path.read_text(encoding='utf-8')

          import_needle = 'from ..models import Conversation, EngineeringRun, WorkSpecification\n'
          assert import_needle in text
          assert 'from ..intelligence.repository_identity import find_repository_identity_conflict\n' not in text
          text = text.replace(
              import_needle,
              import_needle + 'from ..intelligence.repository_identity import find_repository_identity_conflict\n',
              1,
          )

          method_needle = '    def _approved_work_specification(\n'
          assert method_needle in text
          methods = (
              '    @staticmethod\n'
              '    def _repository_target_texts(conversation: Conversation, specification: WorkSpecification) -> tuple[str, ...]:\n'
              '        latest_user = next(\n'
              '            (\n'
              '                item.content.strip()\n'
              '                for item in reversed(conversation.messages)\n'
              '                if item.role == "user" and item.content.strip()\n'
              '            ),\n'
              '            "",\n'
              '        )\n'
              '        return tuple(\n'
              '            value\n'
              '            for value in (latest_user, specification.title, specification.objective)\n'
              '            if isinstance(value, str) and value.strip()\n'
              '        )\n'
              '\n'
              '    def _assert_repository_identity_compatible(\n'
              '        self,\n'
              '        *,\n'
              '        conversation_id: str,\n'
              '        specification: WorkSpecification,\n'
              '    ) -> None:\n'
              '        conversation = self._conversation_for_access(conversation_id)\n'
              '        if conversation is None:\n'
              '            raise EngineeringRunNotFound("conversation not found")\n'
              '        if conversation.mode != "code" or conversation.project_id is None:\n'
              '            return\n'
              '        if self.projects is None or not self.owner_subject:\n'
              '            if self.require_project_binding:\n'
              '                raise SpecBindingError("Project repository binding service unavailable")\n'
              '            return\n'
              '        project = self.projects.get_for_owner(conversation.project_id, self.owner_subject)\n'
              '        if project is None:\n'
              '            raise EngineeringRunNotFound("Project not found")\n'
              '        if not project.repository_ref:\n'
              '            return\n'
              '        conflict = find_repository_identity_conflict(\n'
              '            canonical_repository_ref=project.repository_ref,\n'
              '            target_texts=self._repository_target_texts(conversation, specification),\n'
              '        )\n'
              '        if conflict is not None:\n'
              '            raise SpecBindingError(conflict.public_message)\n'
              '\n'
          )
          text = text.replace(method_needle, methods + method_needle, 1)

          return_needle = (
              '        if specification.revision < 1:\n'
              '            raise SpecBindingError("work specification revision is invalid")\n'
              '        return specification\n'
          )
          assert return_needle in text
          text = text.replace(
              return_needle,
              '        if specification.revision < 1:\n'
              '            raise SpecBindingError("work specification revision is invalid")\n'
              '        self._assert_repository_identity_compatible(\n'
              '            conversation_id=conversation_id,\n'
              '            specification=specification,\n'
              '        )\n'
              '        return specification\n',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify syntax
        run: |
          python -m py_compile services/api/parallax_api/code/service.py services/api/parallax_api/intelligence/repository_identity.py services/api/parallax_api/services/work_specifications.py
      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/hotfix-244-service-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/parallax_api/code/service.py .github/workflows/hotfix-244-service-patch.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'fix: guard run activation against repository mismatch'
          git push origin HEAD:hotfix/244-repository-identity-guard
