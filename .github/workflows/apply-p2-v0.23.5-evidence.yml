name: Apply P2-V0.23.5 Profile Evidence

on:
  push:
    branches:
      - p2/repository-aware-validation-toolchains
    paths:
      - .github/workflows/apply-p2-v0.23.5-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/repository-aware-validation-toolchains
          fetch-depth: 0
      - name: Persist bounded validation-profile evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing evidence anchor: {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          agent = 'services/api/parallax_api/code/agentic_runtime.py'
          replace(
              agent,
              '                        "candidate_content_digest": item.validation.content_digest,\n                        "proposal_digest": item.proposal_digest,\n',
              '                        "candidate_content_digest": item.validation.content_digest,\n                        "validation_profile_id": item.validation.validation_profile_id,\n                        "validation_profile_digest": item.validation.validation_profile_digest,\n                        "proposal_digest": item.proposal_digest,\n',
          )
          replace(
              agent,
              '                "selected_candidate_content_digest": selected.validation.content_digest,\n                "selected_proposal_digest": selected.proposal_digest,\n',
              '                "selected_candidate_content_digest": selected.validation.content_digest,\n                "selected_validation_profile_id": selected.validation.validation_profile_id,\n                "selected_validation_profile_digest": selected.validation.validation_profile_digest,\n                "selected_proposal_digest": selected.proposal_digest,\n',
          )

          impl = 'services/api/parallax_api/code/implementation_runtime.py'
          replace(
              impl,
              '        "execution_snapshot_id",\n        "candidate_content_digest",\n',
              '        "execution_snapshot_id",\n        "validation_profile_id",\n        "validation_profile_digest",\n        "candidate_content_digest",\n',
          )
          replace(
              impl,
              '    for key, limit in (("tool_id", 80), ("execution_snapshot_id", 180)):\n',
              '    for key, limit in (("tool_id", 80), ("execution_snapshot_id", 180), ("validation_profile_id", 80)):\n',
          )
          replace(
              impl,
              '    normalized = {"candidate_validation_failure": normalized_failure}\n',
              '    if "validation_profile_digest" in raw:\n        digest = raw["validation_profile_digest"]\n        if (\n            not isinstance(digest, str)\n            or len(digest) != 64\n            or any(ch not in "0123456789abcdef" for ch in digest)\n        ):\n            raise ValueError("candidate validation diagnostics contain an invalid validation profile digest")\n        normalized_failure["validation_profile_digest"] = digest\n\n    normalized = {"candidate_validation_failure": normalized_failure}\n',
          )
          PY
          python -m compileall -q services/api/parallax_api
          git diff --check
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/parallax_api/code/agentic_runtime.py services/api/parallax_api/code/implementation_runtime.py
          git commit -m "Persist protected validation profile evidence"
          git push origin HEAD:p2/repository-aware-validation-toolchains
