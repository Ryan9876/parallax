name: Hotfix 245 Failure Observability Patch

on:
  push:
    branches:
      - 'hotfix/245-failure-observability'
    paths:
      - '.github/workflows/hotfix-245-implementation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/245-failure-observability
          fetch-depth: 0

      - name: Apply bounded failure observability fix
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Allow the already-sanitized mutation flag into append-only run-event metadata.
          path = Path('services/api/parallax_api/code/run_events.py')
          text = path.read_text(encoding='utf-8')
          needle = '        "meaningful_progress",\n        "next_recovery_action",\n'
          replacement = '        "meaningful_progress",\n        "mutation_applied",\n        "next_recovery_action",\n'
          assert needle in text
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')

          # 2) A non-authoritative projection failure after a durable expected IMPLEMENT
          # failure must not replace the structured autonomous failure result.
          path = Path('services/api/parallax_api/code/autonomy.py')
          text = path.read_text(encoding='utf-8')
          assert 'from .domain import WorkflowStage\n' in text
          text = text.replace(
              'from .domain import WorkflowStage\n',
              'from .domain import AttemptStatus, WorkflowStage\n',
              1,
          )
          assert 'from .run_events import RunEventError\n' not in text
          text = text.replace(
              'from .implementation_runtime import ImplementationRuntimeError, ProtectedImplementationRuntime\n',
              'from .implementation_runtime import ImplementationRuntimeError, ProtectedImplementationRuntime\nfrom .run_events import RunEventError\n',
              1,
          )
          old = '''                    failed = self.service.complete_stage(
                        run_id=run.id,
                        stage=WorkflowStage.IMPLEMENT,
                        operation_key=stage_key,
                        expected_revision=run.revision,
                        passed=False,
                        evidence={
                            "error_class": type(exc).__name__,
                            "mutation_applied": False,
                        },
                        failure_code="AUTONOMOUS_IMPLEMENT_FAILED",
                        program_id="protected-implementation-runtime-v0.15.4",
                        tool_id="safe-source-implementation-v1",
                    )
                    steps.append(
                        AutonomyStep(
                            stage=stage.value,
                            outcome="FAILED",
                            attempt_id=failed.attempt_id,
                            replayed=failed.replayed,
                            tool_id="implementation-runtime",
                        )
                    )
                    return AutonomyResult(
                        run=failed.run,
                        stop_reason=AutonomyStopReason.IMPLEMENTATION_FAILED,
                        steps=tuple(steps),
                    )
'''
          new = '''                    try:
                        failed = self.service.complete_stage(
                            run_id=run.id,
                            stage=WorkflowStage.IMPLEMENT,
                            operation_key=stage_key,
                            expected_revision=run.revision,
                            passed=False,
                            evidence={
                                "error_class": type(exc).__name__,
                                "mutation_applied": False,
                            },
                            failure_code="AUTONOMOUS_IMPLEMENT_FAILED",
                            program_id="protected-implementation-runtime-v0.15.4",
                            tool_id="safe-source-implementation-v1",
                        )
                    except RunEventError:
                        # The EngineeringRun/attempt mutation commits before optional
                        # observation projection. Recover only the exact expected
                        # durable failure; never fabricate a result for an unknown
                        # or partially recorded mutation.
                        recorded = self.service.runs.find_operation(run.id, stage_key)
                        durable_run = self.service.get(run.id)
                        if (
                            recorded is None
                            or recorded.stage != WorkflowStage.IMPLEMENT.value
                            or recorded.status != AttemptStatus.FAILED.value
                            or recorded.failure_code != "AUTONOMOUS_IMPLEMENT_FAILED"
                            or durable_run.state != WorkflowStage.FAILED.value
                            or durable_run.resume_stage != WorkflowStage.IMPLEMENT.value
                            or durable_run.last_failure_code != "AUTONOMOUS_IMPLEMENT_FAILED"
                        ):
                            raise
                        steps.append(
                            AutonomyStep(
                                stage=stage.value,
                                outcome="FAILED",
                                attempt_id=recorded.id,
                                replayed=False,
                                tool_id="implementation-runtime",
                            )
                        )
                        return AutonomyResult(
                            run=durable_run,
                            stop_reason=AutonomyStopReason.IMPLEMENTATION_FAILED,
                            steps=tuple(steps),
                        )
                    steps.append(
                        AutonomyStep(
                            stage=stage.value,
                            outcome="FAILED",
                            attempt_id=failed.attempt_id,
                            replayed=failed.replayed,
                            tool_id="implementation-runtime",
                        )
                    )
                    return AutonomyResult(
                        run=failed.run,
                        stop_reason=AutonomyStopReason.IMPLEMENTATION_FAILED,
                        steps=tuple(steps),
                    )
'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # 3) Client projection must use authoritative FAILED run state as a fallback
          # without inventing provider/source success when event evidence is absent.
          path = Path('apps/client/src/lib/observabilityProjection.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "  key: 'event-plane' | 'worker' | 'source-lineage' | 'github' | 'vercel' | 'evaluation';",
              "  key: 'run' | 'event-plane' | 'worker' | 'source-lineage' | 'github' | 'vercel' | 'evaluation';",
              1,
          )
          assert "  'current_step',\n  'evaluation_id'," in text
          text = text.replace(
              "  'current_step',\n  'evaluation_id',",
              "  'current_step',\n  'error_class',\n  'evaluation_id',",
              1,
          )
          assert "  'meaningful_progress',\n  'next_recovery_action'," in text
          text = text.replace(
              "  'meaningful_progress',\n  'next_recovery_action',",
              "  'meaningful_progress',\n  'mutation_applied',\n  'next_recovery_action',",
              1,
          )
          pipeline_needle = "  return PIPELINE_STAGES.map((stage) => {\n"
          pipeline_insert = """  const failedStage = run.state === 'FAILED' && run.resume_stage && PIPELINE_STAGES.includes(run.resume_stage as PipelineStage)\n    ? run.resume_stage as PipelineStage\n    : null;\n\n  return PIPELINE_STAGES.map((stage) => {\n"""
          assert pipeline_needle in text
          text = text.replace(pipeline_needle, pipeline_insert, 1)
          event_branch = """    if (event) {\n      return { stage, status: statusForEvent(event), sequence: event.sequence, summary: event.summary };\n    }\n    // Existing authoritative run state may identify the currently active protected stage,\n"""
          event_replacement = """    if (event) {\n      return { stage, status: statusForEvent(event), sequence: event.sequence, summary: event.summary };\n    }\n    if (failedStage === stage) {\n      return {\n        stage,\n        status: 'FAILED',\n        sequence: null,\n        summary: run.last_failure_code ? `${stage} failed · ${run.last_failure_code}` : `${stage} failed`,\n      };\n    }\n    // Existing authoritative run state may identify the currently active protected stage,\n"""
          assert event_branch in text
          text = text.replace(event_branch, event_replacement, 1)
          signature = "export function componentHealth(events: RunEventDto[], transport: RunTransportState): ComponentHealthItem[] {\n"
          replacement_signature = "export function componentHealth(events: RunEventDto[], transport: RunTransportState, run?: EngineeringRunDto): ComponentHealthItem[] {\n"
          assert signature in text
          text = text.replace(signature, replacement_signature, 1)
          worker_needle = """  const worker = latestMatching(events, (event) => event.subsystem === 'WORKER' || Boolean(event.worker_execution_id));\n"""
          run_health = """  const authoritativeRun: ComponentHealthItem | null = run\n    ? run.state === 'FAILED'\n      ? {\n          key: 'run',\n          label: 'Engineering Run',\n          status: 'Failed',\n          detail: `${run.resume_stage || 'Run'} failed${run.last_failure_code ? ` · ${run.last_failure_code}` : ''}. Durable Engineering Run state remains authoritative even when optional component evidence is unavailable.`,\n          sequence: null,\n          tone: 'rust',\n        }\n      : run.state === 'REVIEW'\n        ? { key: 'run', label: 'Engineering Run', status: 'Review required', detail: 'Authoritative run reached the protected operator review boundary.', sequence: null, tone: 'olive' }\n        : run.state === 'COMPLETE'\n          ? { key: 'run', label: 'Engineering Run', status: 'Complete', detail: 'Authoritative run is complete.', sequence: null, tone: 'olive' }\n          : { key: 'run', label: 'Engineering Run', status: 'Active', detail: `Authoritative run state: ${run.state}.`, sequence: null, tone: 'teal' }\n    : null;\n\n  const worker = latestMatching(events, (event) => event.subsystem === 'WORKER' || Boolean(event.worker_execution_id));\n"""
          assert worker_needle in text
          text = text.replace(worker_needle, run_health, 1)
          return_needle = """  return [\n    transportItem,\n"""
          return_replacement = """  return [\n    ...(authoritativeRun ? [authoritativeRun] : []),\n    transportItem,\n"""
          assert return_needle in text
          text = text.replace(return_needle, return_replacement, 1)
          path.write_text(text, encoding='utf-8')

          # 4) Run Event Stream receives authoritative run state for truthful fallback health.
          path = Path('apps/client/src/components/observability/RunEventStream.tsx')
          text = path.read_text(encoding='utf-8')
          assert "import React from 'react';\n" in text
          text = text.replace(
              "import React from 'react';\n",
              "import React from 'react';\nimport type { EngineeringRunDto } from '../../lib/api';\n",
              1,
          )
          old = "function ComponentHealth({ events, transport }: { events: RunEventDto[]; transport: RunTransportState }) {\n  const items = componentHealth(events, transport);\n"
          new = "function ComponentHealth({ events, transport, run }: { events: RunEventDto[]; transport: RunTransportState; run: EngineeringRunDto }) {\n  const items = componentHealth(events, transport, run);\n"
          assert old in text
          text = text.replace(old, new, 1)
          assert "  events,\n  transport,\n  followLive," in text
          text = text.replace(
              "  events,\n  transport,\n  followLive,",
              "  run,\n  events,\n  transport,\n  followLive,",
              1,
          )
          assert "  events: RunEventDto[];\n  transport: RunTransportState;" in text
          text = text.replace(
              "  events: RunEventDto[];\n  transport: RunTransportState;",
              "  run: EngineeringRunDto;\n  events: RunEventDto[];\n  transport: RunTransportState;",
              1,
          )
          assert '<ComponentHealth events={events} transport={transport} />' in text
          text = text.replace(
              '<ComponentHealth events={events} transport={transport} />',
              '<ComponentHealth events={events} transport={transport} run={run} />',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # 5) Live Build exposes the durable failure code even with sparse/failed event projection.
          path = Path('apps/client/src/components/observability/LiveBuildWorkspace.tsx')
          text = path.read_text(encoding='utf-8')
          old = """  const alerts = recentAlerts(observer.view.events);\n  const last = observer.view.events[observer.view.events.length - 1];\n"""
          new = """  const last = observer.view.events[observer.view.events.length - 1];\n  const eventAlerts = recentAlerts(observer.view.events);\n  const durableFailureAlert = run.state === 'FAILED'\n    && !eventAlerts.some((alert) => Boolean(run.last_failure_code) && alert.detail.includes(run.last_failure_code || ''))\n    ? {\n        key: 'durable-run-failure',\n        sequence: last?.sequence ?? 0,\n        tone: 'rust' as const,\n        title: 'Durable run failure',\n        detail: `${run.resume_stage || 'Run'} failed${run.last_failure_code ? ` · ${run.last_failure_code}` : ''}.`,\n      }\n    : null;\n  const alerts = durableFailureAlert ? [durableFailureAlert, ...eventAlerts].slice(0, 5) : eventAlerts;\n"""
          assert old in text
          text = text.replace(old, new, 1)
          active_run = """        <View style={styles.factRow}><Text style={styles.factLabel}>PROJECT</Text><Text numberOfLines={1} style={styles.factValue}>{run.project_id || 'Historical unbound'}</Text></View>\n"""
          active_run_replacement = active_run + """        {run.last_failure_code ? <View style={styles.factRow}><Text style={styles.factLabel}>FAILURE</Text><Text style={[styles.factValue, styles.failureValue]}>{run.resume_stage || 'FAILED'} · {run.last_failure_code}</Text></View> : null}\n"""
          assert active_run in text
          text = text.replace(active_run, active_run_replacement, 1)
          runhero = """      </View>\n      <View style={styles.runCardGrid}>\n"""
          failure_banner = """      </View>\n      {run.state === 'FAILED' ? (\n        <View style={styles.runFailure} accessibilityLiveRegion=\"polite\" testID=\"live-build-durable-failure\">\n          <Text style={styles.runFailureTitle}>{run.resume_stage || 'Run'} failed</Text>\n          <Text style={styles.runFailureCode}>{run.last_failure_code || 'Failure code unavailable'}</Text>\n          <Text style={styles.contextNote}>This is authoritative Engineering Run state. Missing optional worker, provider, preview, lineage, or evaluation evidence does not mean the run is still waiting.</Text>\n        </View>\n      ) : null}\n      <View style={styles.runCardGrid}>\n"""
          assert runhero in text
          text = text.replace(runhero, failure_banner, 1)
          # Both desktop and focused Activity streams must receive the same authoritative run.
          text = text.replace(
              '<RunEventStream events={observer.view.events}',
              '<RunEventStream run={run} events={observer.view.events}',
          )
          text = text.replace(
              '<RunEventStream compact events={observer.view.events}',
              '<RunEventStream compact run={run} events={observer.view.events}',
          )
          style_needle = """  runStageStatus: { color: palette.teal700, fontSize: 10, fontWeight: '800', marginTop: 4 },\n  runCardGrid:"""
          style_replacement = """  runStageStatus: { color: palette.teal700, fontSize: 10, fontWeight: '800', marginTop: 4 },\n  runFailure: { padding: 14, borderRadius: 15, borderWidth: StyleSheet.hairlineWidth, borderColor: 'rgba(196,74,27,0.32)', backgroundColor: palette.rust100 },\n  runFailureTitle: { color: palette.rust700, fontSize: 13, lineHeight: 18, fontWeight: '800' },\n  runFailureCode: { color: palette.rust700, fontSize: 10, lineHeight: 15, fontWeight: '700', marginTop: 3, marginBottom: 5 },\n  failureValue: { color: palette.rust700 },\n  runCardGrid:"""
          assert style_needle in text
          text = text.replace(style_needle, style_replacement, 1)
          path.write_text(text, encoding='utf-8')

          # 6) API regression: exact failed IMPLEMENT event + structured failure when optional projection fails.
          path = Path('services/api/tests/test_run_event_runtime_integration.py')
          text = path.read_text(encoding='utf-8')
          assert 'from parallax_api.code.domain import WorkflowStage\n' in text
          text = text.replace(
              'from parallax_api.code.domain import WorkflowStage\n',
              'from parallax_api.code.autonomy import AutonomyCoordinator, AutonomyStopReason\nfrom parallax_api.code.domain import WorkflowStage\nfrom parallax_api.code.implementation_runtime import ImplementationRuntimeError\n',
              1,
          )
          addition = r'''

class _NeverExecutor:
    def probe(self, *, operation_key: str):
        raise AssertionError(f"unexpected executor probe: {operation_key}")

    def execute(self, spec):
        raise AssertionError(f"unexpected executor execution: {spec}")


class _FailingImplementationRuntime:
    def execute(self, **_kwargs):
        raise ImplementationRuntimeError("sanitized implementation failure", mutation_applied=False)


class _FailingProjectionSink:
    def emit(self, _event):
        raise RunEventPersistenceError("injected optional projection failure")


def test_failed_implement_attempt_projects_sanitized_failure_event(tmp_path):
    Session = session_factory(tmp_path)
    with Session() as session:
        repository = RunEventRepository(session)
        sink = PersistentRunEventSink(repository)
        project, _, service, run = activate(session, event_sink=sink)
        _, plan = plan_evidence(service, run)
        planned = service.complete_stage(
            run_id=run.id,
            stage=WorkflowStage.PLAN,
            operation_key="failure-event:plan",
            expected_revision=run.revision,
            passed=True,
            evidence=plan,
        )
        failed = service.complete_stage(
            run_id=run.id,
            stage=WorkflowStage.IMPLEMENT,
            operation_key="failure-event:implement",
            expected_revision=planned.run.revision,
            passed=False,
            evidence={"error_class": "ImplementationContractError", "mutation_applied": False},
            failure_code="AUTONOMOUS_IMPLEMENT_FAILED",
            program_id="protected-implementation-runtime-v0.15.4",
            tool_id="safe-source-implementation-v1",
        )

        assert failed.run.state == WorkflowStage.FAILED.value
        assert failed.run.resume_stage == WorkflowStage.IMPLEMENT.value
        assert failed.run.last_failure_code == "AUTONOMOUS_IMPLEMENT_FAILED"
        events = repository.list_for_run(project_id=project.id, run_id=run.id, limit=100)
        projected = next(
            event
            for event in events
            if event.append.stage == WorkflowStage.IMPLEMENT.value
            and event.append.outcome is RunEventOutcome.FAILED
        )
        assert projected.append.event_type is RunEventType.STAGE_RESULT
        assert projected.append.subsystem.value == "IMPLEMENTATION"
        assert projected.append.attempt_id == failed.attempt_id
        assert projected.append.failure_code == "AUTONOMOUS_IMPLEMENT_FAILED"
        assert projected.append.metadata["error_class"] == "ImplementationContractError"
        assert projected.append.metadata["mutation_applied"] is False
        serialized = json.dumps(projected.append.canonical_payload(), sort_keys=True)
        assert "sanitized implementation failure" not in serialized


def test_autonomy_returns_durable_failure_when_optional_event_projection_fails(tmp_path):
    Session = session_factory(tmp_path)
    with Session() as session:
        project, _, service, run = activate(session, event_sink=None)
        _, plan = plan_evidence(service, run)
        planned = service.complete_stage(
            run_id=run.id,
            stage=WorkflowStage.PLAN,
            operation_key="projection-failure:plan",
            expected_revision=run.revision,
            passed=True,
            evidence=plan,
        )
        service.event_sink = _FailingProjectionSink()

        result = AutonomyCoordinator(
            service,
            _NeverExecutor(),
            implementation_runtime=_FailingImplementationRuntime(),
        ).run(
            run_id=run.id,
            operation_key="projection-failure",
            expected_revision=planned.run.revision,
        )

        assert result.stop_reason is AutonomyStopReason.IMPLEMENTATION_FAILED
        assert result.run.state == WorkflowStage.FAILED.value
        assert result.run.resume_stage == WorkflowStage.IMPLEMENT.value
        assert result.run.last_failure_code == "AUTONOMOUS_IMPLEMENT_FAILED"
        attempts = [item for item in result.run.attempts if item.stage == WorkflowStage.IMPLEMENT.value]
        assert len(attempts) == 1
        assert attempts[0].status == "FAILED"
        assert result.steps[-1].attempt_id == attempts[0].id
        assert result.steps[-1].outcome == "FAILED"
        assert project.id == result.run.project_id
'''
          assert 'test_failed_implement_attempt_projects_sanitized_failure_event' not in text
          text = text.rstrip() + addition + '\n'
          path.write_text(text, encoding='utf-8')

          # 7) Client projection regression for sparse durable FAILED/IMPLEMENT state.
          path = Path('apps/client/scripts/test-observability-projection.cjs')
          text = path.read_text(encoding='utf-8')
          assert '  providerIdentities,\n  recentAlerts,\n' in text
          text = text.replace(
              '  providerIdentities,\n  recentAlerts,\n',
              '  providerIdentities,\n  projectPipeline,\n  recentAlerts,\n  safeEventMetadata,\n',
              1,
          )
          marker = """const emptySummary = observabilitySummary([]);\n"""
          failure_case = """const failedRun = {\n  state: 'FAILED',\n  resume_stage: 'IMPLEMENT',\n  last_failure_code: 'AUTONOMOUS_IMPLEMENT_FAILED',\n};\nconst sparseFailureEvents = [\n  event(1, { event_type: 'RUN_CREATED', outcome: 'STARTED', summary: 'Run created.' }),\n  event(2, { stage: 'SPECIFY', outcome: 'SUCCEEDED', summary: 'Specification bound.' }),\n  event(3, { stage: 'PLAN', outcome: 'SUCCEEDED', summary: 'Plan accepted.' }),\n];\nconst failedPipeline = projectPipeline(failedRun, sparseFailureEvents);\nconst implementFailure = failedPipeline.find((item) => item.stage === 'IMPLEMENT');\nassert.equal(implementFailure.status, 'FAILED');\nassert.equal(implementFailure.summary.includes('AUTONOMOUS_IMPLEMENT_FAILED'), true);\nconst failedHealth = componentHealth(sparseFailureEvents, 'LIVE', failedRun);\nconst authoritativeFailure = failedHealth.find((item) => item.key === 'run');\nassert.equal(authoritativeFailure.status, 'Failed');\nassert.equal(authoritativeFailure.detail.includes('IMPLEMENT failed'), true);\nassert.equal(authoritativeFailure.detail.includes('AUTONOMOUS_IMPLEMENT_FAILED'), true);\nconst safeFailureMetadata = safeEventMetadata(event(4, { metadata: { error_class: 'ImplementationContractError', mutation_applied: false } }));\nassert.equal(safeFailureMetadata.some((item) => item.key === 'error_class' && item.value === 'ImplementationContractError'), true);\nassert.equal(safeFailureMetadata.some((item) => item.key === 'mutation_applied' && item.value === 'false'), true);\n\nconst emptySummary = observabilitySummary([]);\n"""
          assert marker in text
          text = text.replace(marker, failure_case, 1)
          source_marker = """const dashboardSource = readFileSync('src/components/observability/RunEventStream.tsx', 'utf8');\n"""
          source_insert = """const liveBuildSource = readFileSync('src/components/observability/LiveBuildWorkspace.tsx', 'utf8');\nfor (const required of [\n  'live-build-durable-failure',\n  'Durable run failure',\n  'Missing optional worker, provider, preview, lineage, or evaluation evidence does not mean the run is still waiting.',\n]) {\n  assert.equal(liveBuildSource.includes(required), true, `Missing durable failure fallback marker: ${required}`);\n}\n\nconst dashboardSource = readFileSync('src/components/observability/RunEventStream.tsx', 'utf8');\n"""
          assert source_marker in text
          text = text.replace(source_marker, source_insert, 1)
          assert '  dashboardCompositionContract: true,\n' in text
          text = text.replace(
              '  dashboardCompositionContract: true,\n',
              '  durableFailureFallback: true,\n  dashboardCompositionContract: true,\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # 8) Browser/Skia release gate reproduces a FAILED run with only pre-failure events.
          path = Path('apps/client/scripts/live-build-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          marker = """  await mobile.getByLabel('Back to conversation').click();\n  await mobile.getByLabel('Message Parallax').waitFor();\n\n  assert(await desktop.locator('[data-testid=\"live-build-workspace\"]').count() === 1, 'Desktop Live Build workspace did not mount exactly once');\n"""
          replacement = """  await mobile.getByLabel('Back to conversation').click();\n  await mobile.getByLabel('Message Parallax').waitFor();\n\n  engineeringRun.state = 'FAILED';\n  engineeringRun.resume_stage = 'IMPLEMENT';\n  engineeringRun.last_failure_code = 'AUTONOMOUS_IMPLEMENT_FAILED';\n  engineeringRun.revision = 3;\n  engineeringRun.attempts = [{ id: '77777777-7777-4777-8777-777777777778', stage: 'IMPLEMENT', attempt_number: 1, status: 'FAILED', failure_code: 'AUTONOMOUS_IMPLEMENT_FAILED', evidence: { error_class: 'ImplementationContractError', mutation_applied: false }, started_at: now, completed_at: now }];\n  events.splice(3);\n\n  const failedMobile = await browser.newPage({ viewport: { width: 390, height: 844 } });\n  await failedMobile.goto('http://127.0.0.1:8770', { waitUntil: 'networkidle' });\n  await failedMobile.getByLabel('Open Live Build observability').click();\n  await failedMobile.getByRole('tab', { name: 'Run', exact: true }).click();\n  await failedMobile.getByTestId('live-build-durable-failure').waitFor({ timeout: 8000 });\n  await failedMobile.getByText('IMPLEMENT failed', { exact: true }).waitFor();\n  await failedMobile.getByText('AUTONOMOUS_IMPLEMENT_FAILED', { exact: true }).waitFor();\n  await failedMobile.getByRole('tab', { name: 'Activity', exact: true }).click();\n  await failedMobile.getByText('Engineering Run', { exact: true }).waitFor();\n  await failedMobile.getByText('Failed', { exact: true }).first().waitFor();\n  await failedMobile.getByText(/AUTONOMOUS_IMPLEMENT_FAILED/).first().waitFor();\n\n  assert(await desktop.locator('[data-testid=\"live-build-workspace\"]').count() === 1, 'Desktop Live Build workspace did not mount exactly once');\n"""
          assert marker in text
          text = text.replace(marker, replacement, 1)
          assert '    mobileLiveBuildEntryAndReturn: true,\n' in text
          text = text.replace(
              '    mobileLiveBuildEntryAndReturn: true,\n',
              '    mobileLiveBuildEntryAndReturn: true,\n    durableFailedRunFallback: true,\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify syntax and bounded markers
        run: |
          python -m py_compile services/api/parallax_api/code/run_events.py services/api/parallax_api/code/autonomy.py services/api/tests/test_run_event_runtime_integration.py
          grep -q 'mutation_applied' services/api/parallax_api/code/run_events.py
          grep -q 'live-build-durable-failure' apps/client/src/components/observability/LiveBuildWorkspace.tsx
          grep -q 'durableFailureFallback' apps/client/scripts/test-observability-projection.cjs

