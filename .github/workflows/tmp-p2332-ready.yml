name: P2-V0.23.32 Finalize PR Readiness

on:
  push:
    branches:
      - ws/543-candidate-validation-repair
    paths:
      - .github/workflows/tmp-p2332-ready.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/543-candidate-validation-repair
          fetch-depth: 0
      - name: Remove temporary workflow from final head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Validator'
          git config user.email 'parallax-release@users.noreply.github.com'
          git rm .github/workflows/tmp-p2332-ready.yml
          git commit -m 'P2-V0.23.32 — finalize exact PR head'
          git push origin HEAD:ws/543-candidate-validation-repair
      - name: Mark pull request ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 544 --repo Ryan9876/parallax
