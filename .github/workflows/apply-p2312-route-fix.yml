name: Apply P2-V0.23.12 route fix

on:
  push:
    branches: [fix/p2312-resume-state-snapshot]
    paths: [.github/workflows/apply-p2312-route-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot pre-resume scalar state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/api/parallax_api/routes/engineering_runs.py')
          text = path.read_text()
          old = '''    prior = invoke(lambda: svc.get(run_id))\n    result = invoke(lambda: svc.resume(run_id=run_id, **payload.model_dump()))\n    if prior.state == "FAILED" and result.run.state != "FAILED":\n        invoke(lambda: worker_recovery_service(svc).prepare_human_resume(run_id=run_id))\n'''
          new = '''    prior_state = invoke(lambda: svc.get(run_id)).state\n    result = invoke(lambda: svc.resume(run_id=run_id, **payload.model_dump()))\n    if prior_state == "FAILED" and result.run.state != "FAILED":\n        invoke(lambda: worker_recovery_service(svc).prepare_human_resume(run_id=run_id))\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new))
          PY
      - name: Run focused regression
        run: |
          python -m pip install -e 'services/api[dev]'
          pytest -q services/api/tests/test_resume_route_snapshot.py services/api/tests/test_worker_recovery.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/parallax_api/routes/engineering_runs.py
          git commit -m "Snapshot failed run state before resume worker re-arm"
          git push origin HEAD:fix/p2312-resume-state-snapshot
