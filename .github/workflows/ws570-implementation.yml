name: WS570 P2-V0.23.42 Implementation

on:
  push:
    branches:
      - ws/570-commit-bearing-empty-delivery
    paths:
      - scripts/ws570_apply.py
      - scripts/ws570_architecture.py
      - .github/workflows/ws570-implementation.yml

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/570-commit-bearing-empty-delivery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Require authentic compiled DSPy plan
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.42.md
      - name: Apply bounded semantic patch
        run: python scripts/ws570_apply.py
      - name: Compile changed API modules
        run: python -m compileall -q services/api/parallax_api/code/greenfield_github.py services/api/parallax_api/code/greenfield_composition.py services/api/parallax_api/code/greenfield_delivery_upgrade.py
      - name: Run focused P2-V0.23.42 regressions
        run: pytest -q services/api/tests/test_greenfield_github.py services/api/tests/test_greenfield_commit_bearing_delivery.py
      - name: Reconcile durable architecture after focused validation
        run: python scripts/ws570_architecture.py
      - name: Remove temporary workstream machinery
        run: |
          git rm -f scripts/ws570_apply.py scripts/ws570_architecture.py .github/workflows/ws570-spec-gate.yml .github/workflows/ws570-implementation.yml
      - name: Build exact local release candidate
        run: |
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add ARCHITECTURE.md specs/P2-V0.23.42.md specs/compiled/P2-V0.23.42.plan.json services/api/parallax_api/code/greenfield_github.py services/api/parallax_api/code/greenfield_composition.py services/api/parallax_api/code/greenfield_delivery_upgrade.py services/api/tests/test_greenfield_github.py services/api/tests/test_greenfield_commit_bearing_delivery.py
          git diff --cached --check
          git commit -m 'P2-V0.23.42 commit-bearing empty delivery compatibility'
      - name: Revalidate exact committed plan
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.42.md
      - name: Run full API regression on exact release candidate HEAD
        run: pytest -q services/api/tests
      - name: Restore clean validated HEAD
        run: |
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --porcelain)"
      - name: Push only the fully validated release candidate
        run: git push origin HEAD:ws/570-commit-bearing-empty-delivery
