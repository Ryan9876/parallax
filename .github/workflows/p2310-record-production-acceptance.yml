name: Record P2-V0.23.10 Production Acceptance

on:
  push:
    branches:
      - docs/p2310-production-acceptance
    paths:
      - .github/workflows/p2310-record-production-acceptance.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p2310-production-acceptance
      - name: Reconcile current state
        run: python scripts/reconcile_p2310_acceptance.py
      - name: Commit authoritative record
        run: |
          git config user.name parallax-workstream
          git config user.email actions@users.noreply.github.com
          rm .github/workflows/p2310-record-production-acceptance.yml
          rm scripts/reconcile_p2310_acceptance.py
          git add -A
          git diff --cached --check
          git commit -m "Record P2-V0.23.10 production acceptance"
          git push origin HEAD:docs/p2310-production-acceptance
