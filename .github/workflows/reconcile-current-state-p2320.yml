name: Reconcile P2-V0.23.20 Current State

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-current-state-p2320.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile authoritative current state
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/reconcile.py
          python /tmp/reconcile.py

      - name: Commit authoritative state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "parallax-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT-STATE.md
          git diff --cached --check
          git commit -m "Record P2-V0.23.20 deployment and greenfield blocker"
          git push origin HEAD:main
