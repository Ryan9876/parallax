name: Run P2-V0.23.11 patch
on:
  push:
    branches: [fix/human-resume-worker-rearm]
    paths: [.github/workflows/patch-human-resume-worker-rearm-v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/_patch_p2311.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/parallax_api/repositories/worker_executions.py services/api/parallax_api/code/worker_service.py services/api/parallax_api/routes/engineering_runs.py services/api/tests/test_worker_recovery.py
          git commit -m "Re-arm terminal worker after explicit failed-run resume"
          git push origin HEAD:fix/human-resume-worker-rearm
