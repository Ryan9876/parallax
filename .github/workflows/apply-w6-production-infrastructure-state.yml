name: Apply Wave 6 production infrastructure state

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'records/w6-production-infrastructure-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: records/w6-production-infrastructure-state
          fetch-depth: 0
      - name: Reconcile CURRENT-STATE and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CURRENT-STATE.md')
          text = path.read_text(encoding='utf-8')

          status = (
              'Status: **WAVE 5 PRODUCTION BASELINE RETAINED / MOBILE #261/#262 PRODUCTION-VERIFIED / '
              'RESPONSE-STREAM #271/#272 PRODUCTION-VERIFIED / P2-V0.18.10 MODEL-TRANSPORT STABILIZATION RETAINED / '
              'SAFE DELETION CORRECTIVE P2-V0.18.12 PRODUCTION-DEPLOYED AND INFRASTRUCTURE-VERIFIED / '
              'FINAL SAFE-DELETION ACCEPTANCE PENDING AUTHENTICATED POST-CUTOVER SMOKE / CLIENT READY / API READY / '
              'WAVE 6 CONTROL #263 ACTIVE / S1-S6 + W6-R1 #304 ACCEPTED AND INTEGRATED / '
              'WAVE 6 RELEASE #312 DEPLOYED AND INFRASTRUCTURE-VERIFIED ON main@831fef94 / '
              'AGENTIC CANDIDATE REPLAY + PROCESS RECREATION PROVEN / '
              'FINAL WAVE 6 RELEASE ACCEPTANCE PENDING AUTHENTICATED PROJECT-BOUND ENGINEERING RUN THROUGH REVIEW STOP**'
          )
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('Status: '):
                  lines[i] = status
                  break
          else:
              raise SystemExit('CURRENT-STATE status line not found')
          text = '\n'.join(lines) + '\n'

          old_truth = (
              'Production remains the deployment-verified Wave 5 generalized application-delivery platform plus the accepted '
              'stabilization chain through mobile #261/#262, response-stream #271/#272 and P2-V0.18.10 model transport.'
          )
          new_truth = (
              'Production is now cumulative through the Wave 6 API infrastructure activation on exact '
              '`main@831fef94aa1c94ff1178b1a325e8774d49fd8752`, while retaining the deployment-verified Wave 5 generalized '
              'application-delivery baseline and the accepted stabilization chain through mobile #261/#262, response-stream '
              '#271/#272, P2-V0.18.10 model transport and safe-deletion hardening. The client had no Wave 6 source delta and '
              'therefore retains its prior verified production artifact under the existing path-aware ignored-build contract.'
          )
          if old_truth not in text:
              raise SystemExit('production truth anchor drifted')
          text = text.replace(old_truth, new_truth, 1)

          old_safe = (
              'PR #294 merged to `main` as `109444dcd7e13bfe842dea71355607941258b073` after the exact corrective '
              'implementation head passed all required gates. Vercel deployed the corrective API SHA to production and the '
              'production alias is serving it. The client had no source delta, so its main deployment was intentionally canceled '
              'by the configured Ignored Build Step and the existing verified client artifact remains active.'
          )
          new_safe = (
              'PR #294 merged to `main` as `109444dcd7e13bfe842dea71355607941258b073` after the exact corrective '
              'implementation head passed all required gates. Vercel deployed that corrective API SHA and it remained the '
              'verified API rollback artifact until the Wave 6 production cutover. The client had no source delta, so its main '
              'deployment was intentionally canceled by the configured Ignored Build Step and the existing verified client '
              'artifact remains active.'
          )
          if old_safe not in text:
              raise SystemExit('safe-deletion production paragraph anchor drifted')
          text = text.replace(old_safe, new_safe, 1)

          old_wave = (
              'Wave 6 S1-S6 plus runtime-activation closure W6-R1 are accepted development architecture and are **not** '
              'production deployments. The S1-S6 integration checkpoint was extended by exact validated W6-R1 worker head '
              '`6244cefd8c7cc2dec923f815838e14747f47aef0`, which passed Workstream Spec Validation #492, Bounded Autonomy '
              'Pilot #699 and Parallax P2 CI #1103. PR #306 merged that exact candidate into '
              '`integration/wave6-agentic-control-plane` as `07f45319d166d52298b2b056cdab4c48c1accf25`. Fresh cumulative '
              'integration-head Workstream #493, Bounded Autonomy #700 and P2 CI #1104 all passed. Validation-only PR #308 was '
              'closed without merge to `main`; production remains unchanged.\n\n'
              'The prior whole-product activation gap is therefore closed at the validated integration level: the ordinary '
              'protected Engineering Run path can now invoke the accepted Wave 6 agentic decision plane under explicit '
              'server-owned activation. This changes no production state. Control Tower must use a separate production-release '
              'package to reconcile current `main`, explicitly enable the runtime, prove required private candidate-artifact '
              'storage/configuration, deploy the exact accepted release, and collect post-cutover runtime evidence before Wave 6 '
              'can be called deployed or deployment-verified.'
          )
          new_wave = (
              'Wave 6 S1-S6 plus runtime-activation closure W6-R1 remain the accepted development architecture and are now '
              '**production-deployed at the API infrastructure level** through release #312. The exact W6-R1 worker '
              '`6244cefd8c7cc2dec923f815838e14747f47aef0` passed Workstream Spec Validation #492, Bounded Autonomy Pilot '
              '#699 and Parallax P2 CI #1103; PR #306 integrated it as `07f45319d166d52298b2b056cdab4c48c1accf25`, and the '
              'record checkpoint was reconciled as `f55c07c188df7cd370d10a3f5478001a139061a0`. Release PR #313 and bounded '
              'production corrections #315, #318 and #321 culminated in exact production main '
              '`831fef94aa1c94ff1178b1a325e8774d49fd8752`.\n\n'
              'The production API deployment `dpl_Ag7tavEunrhQRGb3q8CxBTVVaQQw` is READY and owns the production aliases. '
              'Its fail-closed pre-cutover chain proved provider/source authority, exact delivery permission, projected source, '
              'private Blob, durable lineage composition, selected-candidate exact artifact round trip, engineering runtime '
              'bootstrap, process recreation/replay with no stage mutation, rollback behavior, deny-all execution snapshot and '
              'run-event schema presence. `/health` and `/ready` both return HTTP 200 and the exact deployment error/fatal scan '
              'is clean. Wave 6 is therefore **DEPLOYED AND INFRASTRUCTURE-VERIFIED, BUT NOT YET FULLY RELEASE-VERIFIED**: '
              'release #312 still requires an authenticated Project-bound production Engineering Run proving live agentic '
              'PLAN/IMPLEMENT -> exact-lineage BUILD/TEST/VERIFY -> Preview -> REVIEW stop. Authentication will not be weakened '
              'or bypassed merely to manufacture that final evidence.'
          )
          if old_wave not in text:
              raise SystemExit('Wave 6 current-truth anchor drifted')
          text = text.replace(old_wave, new_wave, 1)

          old_api_heading = '### Production API — corrective P2-V0.18.12\n'
          if old_api_heading not in text:
              raise SystemExit('safe deletion API heading not found')
          wave_api = '''### Production API — Wave 6 infrastructure activation

- Vercel project: `parallax-api`;
- production deployment: `dpl_Ag7tavEunrhQRGb3q8CxBTVVaQQw`;
- state: `READY`;
- target: `production`;
- exact Git SHA: `831fef94aa1c94ff1178b1a325e8774d49fd8752`;
- public production alias: `parallax-api-tan.vercel.app`;
- version-controlled activation: `PARALLAX_AGENTIC_RUNTIME_ENABLED=1`.

Production activation evidence:

- provider/source-tree preflight PASS with 538 entries;
- exact delivery-permission preflight PASS;
- projected-source preflight PASS with 492 lineage-eligible files / 5,013,766 UTF-8 bytes;
- private Blob and durable lineage composition PASS;
- agentic selected-candidate artifact preflight PASS (`artifact=366be26db9bf…`, exact round trip);
- projected bootstrap PASS with engineering runtime, process recreation, replay, no-stage-mutation, metadata rollback and Project rollback verified;
- execution-snapshot preflight PASS with deny-all restore, offline dependencies and no repository source present;
- run-event schema guard PASS;
- `GET /health` → HTTP 200;
- `GET /ready` → HTTP 200 with `database=ok`, `providers=ok`, `provider_targets=1`;
- exact deployment runtime scan found no `error`/`fatal` records.

The remaining Wave 6 release-acceptance item is an authenticated Project-bound Engineering Run over the protected production API through the REVIEW stop. Until that evidence exists, distinguish **production deployed / infrastructure-verified** from **fully release-verified**.

### Prior production API rollback — corrective P2-V0.18.12
'''
          text = text.replace(old_api_heading, wave_api, 1)

          replacements = {
              'Current production baseline: `main@a455b223ad4707aa7fe2ccd3470a5e7640c40da2`.':
                  'Current production baseline: `main@831fef94aa1c94ff1178b1a325e8774d49fd8752`.',
              'Wave 6 production deployment: **none**.':
                  'Wave 6 production deployment: `dpl_Ag7tavEunrhQRGb3q8CxBTVVaQQw` — **READY / infrastructure-verified**.',
              'Production activation flag state: **not claimed enabled**.':
                  'Production activation flag state: **enabled through version-controlled `PARALLAX_AGENTIC_RUNTIME_ENABLED=1`**.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Wave 6 identity anchor drifted: {old}')
              text = text.replace(old, new, 1)

          accepted_anchor = '### Accepted cumulative S1-S6 + W6-R1 evidence\n'
          if accepted_anchor not in text:
              raise SystemExit('Wave 6 accepted evidence anchor missing')
          activation = '''### Production release #312 evidence

- release candidate PR #313 exact head: `3d90bbedfeca16a1d0dcf4e564dde6832fa0085d`;
- qualified release merge: `a5c700762bcf8ebbd5605d7e5d47756bab10fb4e`;
- source-tree parity correction #314 / PR #315 merged as `8bd124244f9bb8175c417e4c4084cc15d9bea066`;
- API source-root correction #316 / PR #318 merged as `bafda5b3d42ca3662a075cefb8c83bd9b017392e`;
- service-runtime canary correction #319 / PR #321 exact worker `ce55f9c4fabd82774954007483997b9d52878e2c`;
- final production merge: `831fef94aa1c94ff1178b1a325e8774d49fd8752`;
- final correction Bounded Autonomy #711 — PASS;
- final correction Parallax P2 CI #1119 — PASS, including browser/Skia, protected promotion evaluation and DSPy release compilation/protected-plan verification;
- production deployment: `dpl_Ag7tavEunrhQRGb3q8CxBTVVaQQw` — READY;
- rollback API deployment retained: `dpl_FacxfrczQSQa8PUidqUA94hLT2Ex` at `109444dcd7e13bfe842dea71355607941258b073`;
- final authenticated Project-bound Engineering Run smoke: **pending**.

'''
          text = text.replace(accepted_anchor, activation + accepted_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git rm -f .github/workflows/apply-w6-production-infrastructure-state.yml
          git add CURRENT-STATE.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(state): record Wave 6 production infrastructure activation'
          git push origin HEAD:records/w6-production-infrastructure-state
