name: Dispatch P2-V0.23.10 Production Replay

on:
  push:
    branches:
      - qa/p2310-production-replay
    paths:
      - .github/workflows/dispatch-p2310-production-replay.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch trusted QA production replay
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/qa-production-replay.yml/dispatches" \
            -d '{"ref":"main","inputs":{"w9_s1_repository_ref":""}}'
          echo "Trusted QA production replay dispatched for P2-V0.23.10 verification."
