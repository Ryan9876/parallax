name: Update P2-V0.23.5 compatibility fixtures

on:
  push:
    branches: [p2/repository-aware-validation-toolchains]
    paths: ['.github/workflows/update-p2-v0-23-5-compat-tests.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/repository-aware-validation-toolchains
      - name: Update stale validation fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          lineage = Path('services/api/tests/test_lineage_sandbox_execution.py')
          text = lineage.read_text()
          old = '''    command, args, kwargs = instance.process_calls[0]\n    registered_command, registered_args = ProtectedCommandRegistry().invocation_for(WorkflowStage.BUILD)\n    assert command == registered_command\n    assert tuple(args) == registered_args\n'''
          new = '''    command, args, kwargs = instance.process_calls[0]\n    assert command == "python"\n    assert tuple(args) == ("-m", "compileall", "-q", ".")\n    assert evidence["validation_profile_id"] == "python-v1"\n    assert isinstance(evidence["validation_profile_digest"], str)\n    assert len(evidence["validation_profile_digest"]) == 64\n'''
          if old not in text:
              raise SystemExit('lineage compatibility assertion not found')
          lineage.write_text(text.replace(old, new, 1))

          diagnostics = Path('services/api/tests/test_w6_candidate_validation_diagnostics.py')
          text = diagnostics.read_text()
          old = '''        file_count=10,\n        total_bytes=1000,\n        stage_evidence=(\n'''
          new = '''        file_count=10,\n        total_bytes=1000,\n        validation_profile_id="python-v1",\n        validation_profile_digest="e" * 64,\n        stage_evidence=(\n'''
          if old not in text:
              raise SystemExit('candidate diagnostics fixture not found')
          diagnostics.write_text(text.replace(old, new, 1))

          separation = Path('services/api/tests/test_w6_s3_evidence_separation.py')
          text = separation.read_text()
          old = '''        file_count=1,\n        total_bytes=1,\n        stage_evidence='''
          new = '''        file_count=1,\n        total_bytes=1,\n        validation_profile_id="python-v1",\n        validation_profile_digest="e" * 64,\n        stage_evidence='''
          if text.count(old) != 2:
              raise SystemExit(f'expected two evidence-separation fixtures, found {text.count(old)}')
          separation.write_text(text.replace(old, new))
          PY
          git diff --check
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/tests/test_lineage_sandbox_execution.py services/api/tests/test_w6_candidate_validation_diagnostics.py services/api/tests/test_w6_s3_evidence_separation.py
          git commit -m "Update repository validation compatibility fixtures"
          git rm .github/workflows/update-p2-v0-23-5-compat-tests.yml
          git commit -m "Remove temporary compatibility workflow"
          git push origin HEAD:p2/repository-aware-validation-toolchains
