name: WS148 Match Provider Value

on:
  push:
    branches: [ws/w4-live-build-ux]
    paths: ['.github/workflows/ws148-match-provider-value.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-live-build-ux
      - run: python scripts/ws148_match_provider_value.py
      - run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/client/scripts/live-build-smoke.mjs
          git commit -m 'Match Live Build provider value evidence'
          git push origin HEAD:ws/w4-live-build-ux
