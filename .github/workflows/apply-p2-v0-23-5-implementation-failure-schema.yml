name: Apply P2-V0.23.5 implementation failure schema repair

on:
  push:
    branches:
      - fix/p2-v0-23-5-implementation-failure-schema
    paths:
      - .github/workflows/apply-p2-v0-23-5-implementation-failure-schema.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2-v0-23-5-implementation-failure-schema
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Align bounded implementation failure schema
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/parallax_api/code/implementation_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '''        "candidate_content_digest",\n        "candidate_is_canonical_lineage",\n'''
          new = '''        "candidate_content_digest",\n        "dependency_preparation_code",\n        "dependency_preparation_required",\n        "dependency_preparation_succeeded",\n        "dependency_probe_exit_code",\n        "dependency_prepare_exit_code",\n        "dependency_stdout_digest",\n        "dependency_stderr_digest",\n        "validation_network_locked",\n        "candidate_is_canonical_lineage",\n'''
          if old not in text:
              raise SystemExit('allowed-field anchor not found')
          text = text.replace(old, new, 1)

          old = '''    for key in ("invocation_digest", "stdout_digest", "stderr_digest", "candidate_content_digest"):\n'''
          new = '''    preparation_code = raw.get("dependency_preparation_code")\n    if preparation_code is not None:\n        if preparation_code not in {\n            "NOT_REQUIRED",\n            "READY",\n            "EXECUTION_PROFILE_UNAVAILABLE",\n            "DEPENDENCY_PREPARATION_FAILED",\n            "VALIDATION_NETWORK_LOCK_FAILED",\n        }:\n            raise ValueError("candidate validation diagnostics contain an invalid dependency preparation code")\n        normalized_failure["dependency_preparation_code"] = preparation_code\n\n    for key in (\n        "dependency_preparation_required",\n        "dependency_preparation_succeeded",\n        "validation_network_locked",\n    ):\n        if key not in raw:\n            continue\n        value = raw[key]\n        if not isinstance(value, bool):\n            raise ValueError("candidate validation diagnostics contain an invalid dependency preparation boolean")\n        normalized_failure[key] = value\n\n    for key in ("dependency_probe_exit_code", "dependency_prepare_exit_code"):\n        if key not in raw:\n            continue\n        value = raw[key]\n        if value is not None and (not isinstance(value, int) or isinstance(value, bool)):\n            raise ValueError("candidate validation diagnostics contain an invalid dependency preparation exit code")\n        normalized_failure[key] = value\n\n    for key in (\n        "invocation_digest",\n        "stdout_digest",\n        "stderr_digest",\n        "candidate_content_digest",\n        "dependency_stdout_digest",\n        "dependency_stderr_digest",\n    ):\n'''
          if old not in text:
              raise SystemExit('digest anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('services/api/tests/test_implementation_failure_preparation_diagnostics.py')
          test.write_text(r'''from __future__ import annotations

from parallax_api.code.implementation_runtime import ImplementationContractError


def _diagnostic() -> dict[str, object]:
    return {
        "candidate_validation_failure": {
            "candidate_id": "candidate-1",
            "failed_stage": "BUILD",
            "protected_success": False,
            "exit_code_present": False,
            "exit_code": None,
            "timed_out": False,
            "validation_profile_id": "dotnet-solution-v1",
            "validation_profile_digest": "a" * 64,
            "candidate_content_digest": "b" * 64,
            "dependency_preparation_code": "DEPENDENCY_PREPARATION_FAILED",
            "dependency_preparation_required": True,
            "dependency_preparation_succeeded": False,
            "dependency_probe_exit_code": 0,
            "dependency_prepare_exit_code": 1,
            "dependency_stdout_digest": "c" * 64,
            "dependency_stderr_digest": "d" * 64,
            "validation_network_locked": True,
            "candidate_is_canonical_lineage": False,
            "accepts_source_lineage": False,
            "source_lineage_accepted": False,
            "production_deployed": False,
        }
    }


def test_implementation_contract_preserves_bounded_prepare_diagnostics() -> None:
    exc = ImplementationContractError("failed", diagnostic_evidence=_diagnostic())
    failure = exc.diagnostic_evidence["candidate_validation_failure"]
    assert failure["dependency_preparation_code"] == "DEPENDENCY_PREPARATION_FAILED"
    assert failure["dependency_preparation_required"] is True
    assert failure["dependency_preparation_succeeded"] is False
    assert failure["dependency_probe_exit_code"] == 0
    assert failure["dependency_prepare_exit_code"] == 1
    assert failure["dependency_stdout_digest"] == "c" * 64
    assert failure["dependency_stderr_digest"] == "d" * 64
    assert failure["validation_network_locked"] is True


def test_implementation_contract_drops_non_allowlisted_prepare_material() -> None:
    diagnostic = _diagnostic()
    diagnostic["candidate_validation_failure"]["dependency_raw_output"] = "Bearer must-never-persist"
    exc = ImplementationContractError("failed", diagnostic_evidence=diagnostic)
    assert exc.diagnostic_evidence is None


def test_implementation_contract_drops_unknown_prepare_code() -> None:
    diagnostic = _diagnostic()
    diagnostic["candidate_validation_failure"]["dependency_preparation_code"] = "WIDEN_NETWORK_AND_RETRY"
    exc = ImplementationContractError("failed", diagnostic_evidence=diagnostic)
    assert exc.diagnostic_evidence is None
''', encoding='utf-8')
          PY
          python -m compileall -q services/api/parallax_api
          pytest -q \
            services/api/tests/test_implementation_failure_preparation_diagnostics.py \
            services/api/tests/test_w6_candidate_validation_diagnostics.py \
            services/api/tests/test_candidate_dependency_preparation_failure.py \
            services/api/tests/test_dependency_preparation.py
          git diff --check
      - name: Commit repair without temporary workflow
        run: |
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/parallax_api/code/implementation_runtime.py services/api/tests/test_implementation_failure_preparation_diagnostics.py
          git rm .github/workflows/apply-p2-v0-23-5-implementation-failure-schema.yml
          git diff --cached --check
          git commit -m "Preserve bounded PREPARE diagnostics through implementation failure"
          git push origin HEAD:fix/p2-v0-23-5-implementation-failure-schema
