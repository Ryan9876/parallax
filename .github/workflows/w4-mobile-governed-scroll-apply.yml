name: Apply W4 mobile governed scroll correction

on:
  push:
    branches:
      - ws/w4-mobile-governed-scroll
    paths:
      - scripts/apply_w4_mobile_scroll_hotfix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-mobile-governed-scroll
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded App layout correction
        run: python scripts/apply_w4_mobile_scroll_hotfix.py
      - name: Remove temporary mutation harness
        run: rm scripts/apply_w4_mobile_scroll_hotfix.py .github/workflows/w4-mobile-governed-scroll-apply.yml
      - name: Commit corrected client layout
        run: |
          set -euo pipefail
          git config user.name 'parallax-hotfix[bot]'
          git config user.email 'parallax-hotfix@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(client): restore mobile governed-context scrolling'
          git push origin HEAD:ws/w4-mobile-governed-scroll
