name: P2-V0.23.18 State Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/p2-v0-23-18-state-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile-current-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile authoritative current state
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path('CURRENT-STATE.md')
          text = path.read_text()
          marker = '## P2-V0.23.17 / P2-V0.23.18 — Dedicated QA identity and exact model patch intent — PRODUCTION-ACCEPTED'
          if marker not in text:
              status_old = ' / CURRENT-SOURCE OT TIME REPLAY PASSED TO REVIEW / RISK-TIERED CI/CD VALIDATION MAIN-VERIFIED**'
              status_new = ' / P2-V0.23.17 DEDICATED QA IDENTITY PRODUCTION-BEHAVIOR-ACCEPTED / P2-V0.23.18 EXACT MODEL PATCH INTENT PRODUCTION-ACCEPTED / CURRENT-SOURCE OT TIME REPLAY PASSED TO REVIEW / RISK-TIERED CI/CD VALIDATION MAIN-VERIFIED**'
              if status_old not in text:
                  raise SystemExit('expected status anchor missing')
              text = text.replace(status_old, status_new, 1)
              anchor = '## CI/CD development pipeline optimization — MAIN-VERIFIED\n'
              if anchor not in text:
                  raise SystemExit('current-state insertion anchor missing')
              encoded = ''
              section = base64.b64decode(encoded).decode('utf-8')
              text = text.replace(anchor, section + anchor, 1)
              path.write_text(text)
          PY

      - name: Commit authoritative state record
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CURRENT-STATE.md; then
            echo 'CURRENT-STATE.md already reconciled'
            exit 0
          fi
          git config user.name 'parallax-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add CURRENT-STATE.md
          git commit -m 'Record P2-V0.23.17 and P2-V0.23.18 production acceptance'
          git push origin HEAD:main
