name: WS69 DSPy Plan Proof

on:
  push:
    branches: [ws/app-runtime-composition]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate approved specification contract
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.15.6.md
      - name: Install local DSPy proof model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ws69-ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:1.5b
      - name: Compile P2-V0.15.6 through DSPy SpecCritic and SpecCompiler
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:1.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: python scripts/compile_spec.py specs/P2-V0.15.6.md
      - name: Validate committed-shape plan evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.15.6.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ws69-p2-v0.15.6-plan
          path: |
            specs/compiled/P2-V0.15.6.plan.json
            /tmp/ws69-ollama.log
          if-no-files-found: warn
          retention-days: 7
