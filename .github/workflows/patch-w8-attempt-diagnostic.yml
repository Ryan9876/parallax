name: Patch W8 attempt diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-w8-attempt-diagnostic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add bounded OT Time attempt diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/w9_s1_reference_trial.sh')
          text = path.read_text(encoding='utf-8')
          marker = '# W8-S2 bounded attempt diagnostic\n'
          block = '''\n# W8-S2 bounded attempt diagnostic\n# Diagnostic-only: authenticated QA identity reads one known failed QA-owned run and projects bounded attempt evidence.\nw8_diag_run_id="4af0668c-c9c9-48aa-8051-8d6e21597db8"\nif api "${API_BASE}/v1/engineering-runs/${w8_diag_run_id}" >/tmp/w8-diag-run.json 2>/dev/null; then\n  jq '{id,state,revision,last_failure_code,attempts:[.attempts[] | {stage,status,failure_code,evidence}]}' /tmp/w8-diag-run.json\nfi\n'''
          if marker not in text:
              path.write_text(text.rstrip() + '\n' + block, encoding='utf-8')
          PY
          git diff --check
      - name: Commit diagnostic and remove temporary workflow
        run: |
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add scripts/w9_s1_reference_trial.sh
          git rm .github/workflows/patch-w8-attempt-diagnostic.yml
          git diff --cached --check
          git commit -m "Expose bounded OT Time attempt evidence"
          git push origin HEAD:main
