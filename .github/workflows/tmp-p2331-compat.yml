name: P2-V0.23.31 PLAN Compatibility Patch

on:
  push:
    branches:
      - release/p2-v0.23.31
    paths:
      - .github/workflows/tmp-p2331-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/p2-v0.23.31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve existing PLAN verification seam
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('services/api/parallax_api/code/agentic_runtime.py')
          text = path.read_text(encoding='utf-8')

          anchor = '    def _verify_plan_evidence(\n'
          helper = '''    @staticmethod
              def _execution_contract_from_plan_evidence(evidence: dict[str, object]) -> ExecutionContract:
                  contract_id = evidence.get("execution_contract_id")
                  binding_reason = evidence.get("execution_contract_binding_reason")
                  target = evidence.get("execution_contract_target")
                  if not isinstance(contract_id, str) or not isinstance(binding_reason, str):
                      raise ValidationProfileError(ValidationProfileReason.EXECUTION_CONTRACT_DRIFT)
                  if target is not None and not isinstance(target, str):
                      raise ValidationProfileError(ValidationProfileReason.EXECUTION_CONTRACT_DRIFT)
                  return resolve_execution_contract(
                      contract_id,
                      binding_reason=binding_reason,
                      target=target,
                  )

          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'verify method anchor count={text.count(anchor)}')
          text = text.replace(anchor, helper + anchor, 1)

          text, count = re.subn(
              r'(    def _verify_plan_evidence\(.*?source_content_digest: str,\n    \)) -> tuple\[TeamPlan, ExecutionContract\]:',
              r'\1 -> TeamPlan:',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'verify return annotation replacement count={count}')

          old_contract = '''        contract_id = evidence.get("execution_contract_id")
                  binding_reason = evidence.get("execution_contract_binding_reason")
                  target = evidence.get("execution_contract_target")
                  if not isinstance(contract_id, str) or not isinstance(binding_reason, str):
                      raise ValidationProfileError(ValidationProfileReason.EXECUTION_CONTRACT_DRIFT)
                  if target is not None and not isinstance(target, str):
                      raise ValidationProfileError(ValidationProfileReason.EXECUTION_CONTRACT_DRIFT)
                  contract = resolve_execution_contract(
                      contract_id,
                      binding_reason=binding_reason,
                      target=target,
                  )
          '''
          if text.count(old_contract) != 1:
              raise SystemExit(f'contract resolution block count={text.count(old_contract)}')
          text = text.replace(old_contract, '        contract = self._execution_contract_from_plan_evidence(evidence)\n', 1)

          if text.count('        return plan, contract\n') != 1:
              raise SystemExit('verify tuple return anchor drifted')
          text = text.replace('        return plan, contract\n', '        return plan\n', 1)

          old_call = '            primary_plan, execution_contract = self._verify_plan_evidence(\n'
          if text.count(old_call) != 1:
              raise SystemExit(f'generate verify call count={text.count(old_call)}')
          text = text.replace(old_call, '            primary_plan = self._verify_plan_evidence(\n', 1)

          needle = '''                source_content_digest=lineage.content_digest,
                  )
                  execution_request = self._request_for_execution_contract(request, execution_contract)
          '''
          replacement = '''                source_content_digest=lineage.content_digest,
                  )
                  execution_contract = self._execution_contract_from_plan_evidence(self._plan_attempt(run))
                  execution_request = self._request_for_execution_contract(request, execution_contract)
          '''
          if text.count(needle) != 1:
              raise SystemExit(f'generate contract insertion count={text.count(needle)}')
          text = text.replace(needle, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Compile compatibility patch
        run: python -m compileall -q services/api/parallax_api/code/agentic_runtime.py
      - name: Commit compatibility patch and remove workflow
        shell: bash
        run: |
          git config user.name 'Parallax Runtime Patcher'
          git config user.email 'parallax-runtime@users.noreply.github.com'
          git add services/api/parallax_api/code/agentic_runtime.py
          git rm .github/workflows/tmp-p2331-compat.yml
          git commit -m 'P2-V0.23.31 — preserve PLAN verification compatibility'
          git push origin HEAD:release/p2-v0.23.31
