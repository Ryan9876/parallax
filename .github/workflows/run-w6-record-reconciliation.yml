name: Run Wave 6 production record reconciliation

on:
  push:
    branches: [records/w6-production-infrastructure]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: records/w6-production-infrastructure
          fetch-depth: 0
      - name: Execute staged reconciliation
        shell: python
        run: |
          from pathlib import Path

          staged = Path('.github/workflows/reconcile-w6-production-infrastructure.yml')
          lines = staged.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line == '          from pathlib import Path')
          end = next(i for i, line in enumerate(lines[start + 1:], start + 1) if line == '      - name: Validate record diff')
          code_lines = []
          for line in lines[start:end]:
              if line.startswith('          '):
                  code_lines.append(line[10:])
              elif line == '':
                  code_lines.append('')
              else:
                  raise SystemExit(f'unexpected staged-script indentation: {line!r}')
          code = '\n'.join(code_lines) + '\n'
          exec(compile(code, str(staged), 'exec'), {'__name__': '__main__'})
      - name: Validate and commit durable record only
        run: |
          git diff --check
          git rm -f .github/workflows/reconcile-w6-production-infrastructure.yml .github/workflows/run-w6-record-reconciliation.yml
          git add CURRENT-STATE.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record Wave 6 production infrastructure verification"
          git push origin HEAD:records/w6-production-infrastructure
