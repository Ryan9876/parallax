name: P2-V0.23.30 Focused Implementation

on:
  push:
    branches:
      - fix/p2330-source-anchored-validation-profile
    paths:
      - .github/workflows/tmp-p2330-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2330-source-anchored-validation-profile
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply governed implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('services/api/parallax_api/code/agentic_runtime.py')
          text = runtime.read_text()

          old = 'from .validation_toolchains import select_validation_profile'
          new = 'from .validation_toolchains import ValidationProfile, select_validation_profile'
          if text.count(old) != 1:
              raise SystemExit(f'expected one validation import, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_sig = '''    def validate_candidate(\n        self,\n        workspace_root: Path,\n        *,\n        operation_key: str,\n    ) -> CandidateValidationResult: ...'''
          new_sig = '''    def validate_candidate(\n        self,\n        workspace_root: Path,\n        *,\n        operation_key: str,\n        validation_profile: ValidationProfile,\n    ) -> CandidateValidationResult: ...'''
          if text.count(old_sig) != 1:
              raise SystemExit(f'expected one protocol signature, found {text.count(old_sig)}')
          text = text.replace(old_sig, new_sig, 1)

          old_impl = '''    def validate_candidate(\n        self,\n        workspace_root: Path,\n        *,\n        operation_key: str,\n    ) -> CandidateValidationResult:\n        profile = select_validation_profile(workspace_root)'''
          new_impl = '''    def validate_candidate(\n        self,\n        workspace_root: Path,\n        *,\n        operation_key: str,\n        validation_profile: ValidationProfile,\n    ) -> CandidateValidationResult:\n        if not isinstance(validation_profile, ValidationProfile):\n            raise AgenticRuntimeError("authoritative validation profile is required")\n        profile = validation_profile'''
          if text.count(old_impl) != 1:
              raise SystemExit(f'expected one concrete validator signature, found {text.count(old_impl)}')
          text = text.replace(old_impl, new_impl, 1)

          old_kind = '''    if isinstance(exc, OSError):\n        return "OS_BOUNDARY_ERROR"\n    if isinstance(exc, AgenticRuntimeError):\n        return "AGENTIC_CONTRACT_ERROR"'''
          new_kind = '''    if isinstance(exc, OSError):\n        return "OS_BOUNDARY_ERROR"\n    if isinstance(exc, ExecutionPolicyError):\n        return "VALIDATION_PROFILE_ERROR"\n    if isinstance(exc, AgenticRuntimeError):\n        return "AGENTIC_CONTRACT_ERROR"'''
          if text.count(old_kind) != 1:
              raise SystemExit(f'expected one admission classification seam, found {text.count(old_kind)}')
          text = text.replace(old_kind, new_kind, 1)

          old_method = '''    ) -> CandidateValidationResult:\n        with tempfile.TemporaryDirectory(prefix=f"parallax-{candidate_id}-") as temporary:\n            target = Path(temporary) / "candidate"\n            self._copy_candidate_workspace(base_workspace, target)'''
          new_method = '''    ) -> CandidateValidationResult:\n        validation_profile = select_validation_profile(base_workspace)\n        with tempfile.TemporaryDirectory(prefix=f"parallax-{candidate_id}-") as temporary:\n            target = Path(temporary) / "candidate"\n            self._copy_candidate_workspace(base_workspace, target)'''
          # This shape occurs only in AgenticControlPlane._candidate_validation.
          if text.count(old_method) != 1:
              raise SystemExit(f'expected one candidate-validation method seam, found {text.count(old_method)}')
          text = text.replace(old_method, new_method, 1)

          old_call = '''            return self.candidate_validator.validate_candidate(\n                target,\n                operation_key=f"{operation_key[:110]}:{candidate_id}",\n            )'''
          new_call = '''            return self.candidate_validator.validate_candidate(\n                target,\n                operation_key=f"{operation_key[:110]}:{candidate_id}",\n                validation_profile=validation_profile,\n            )'''
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one candidate validator call, found {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)
          runtime.write_text(text)

          for test_path in (
              Path('services/api/tests/test_execution_snapshot_profiles.py'),
              Path('services/api/tests/test_candidate_dependency_preparation_failure.py'),
          ):
              source = test_path.read_text()
              if 'from parallax_api.code.validation_toolchains import select_validation_profile' not in source:
                  anchor = 'from parallax_api.code.agentic_runtime import VercelCandidateValidationExecutor\n'
                  if anchor not in source:
                      raise SystemExit(f'import anchor missing in {test_path}')
                  source = source.replace(anchor, anchor + 'from parallax_api.code.validation_toolchains import select_validation_profile\n', 1)
              old_call_fragment = 'executor.validate_candidate(tmp_path.resolve(), operation_key='
              if old_call_fragment not in source:
                  raise SystemExit(f'direct validate call missing in {test_path}')
              source = source.replace(
                  old_call_fragment,
                  'executor.validate_candidate(tmp_path.resolve(), operation_key=',
                  1,
              )
              # Rewrite the complete one-line call by preserving its operation-key literal.
              lines = source.splitlines()
              for index, line in enumerate(lines):
                  if 'result = executor.validate_candidate(tmp_path.resolve(), operation_key=' in line:
                      prefix, tail = line.split('operation_key=', 1)
                      operation = tail.rsplit(')', 1)[0]
                      lines[index - 1:index + 1] = [
                          '    profile = select_validation_profile(tmp_path.resolve())',
                          '    result = executor.validate_candidate(',
                          '        tmp_path.resolve(),',
                          f'        operation_key={operation},',
                          '        validation_profile=profile,',
                          '    )',
                      ]
                      break
              else:
                  raise SystemExit(f'validate call rewrite failed in {test_path}')
              test_path.write_text('\n'.join(lines) + '\n')

          focused = Path('services/api/tests/test_source_anchored_candidate_validation_profile_v02330.py')
          focused.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\nimport pytest\n\nfrom parallax_api.code.agentic_runtime import (\n    AgenticRuntimeError,\n    VercelCandidateValidationExecutor,\n    _candidate_admission_failure_diagnostic,\n)\nfrom parallax_api.code.execution import ExecutionPolicyError\nfrom parallax_api.code.validation_toolchains import ValidationProfileError, select_validation_profile\n\n\ndef test_candidate_marker_edits_cannot_switch_authoritative_dotnet_profile(tmp_path: Path, monkeypatch):\n    base = tmp_path / "base"\n    candidate = tmp_path / "candidate"\n    base.mkdir()\n    candidate.mkdir()\n    (base / "OtTime.sln").write_text("fixture", encoding="utf-8")\n    (candidate / "package.json").write_text('{"scripts":{"test":"echo nope"}}', encoding="utf-8")\n    profile = select_validation_profile(base.resolve())\n    monkeypatch.delenv("PARALLAX_DOTNET_EXECUTION_SNAPSHOT_ID", raising=False)\n    executor = VercelCandidateValidationExecutor(\n        project_id="prj_test",\n        snapshot_id="snap_test-common-runtime",\n    )\n\n    def unexpected_sdk_call():\n        raise AssertionError("candidate profile pinning must fail before sandbox when .NET snapshot is unavailable")\n\n    executor._sdk = unexpected_sdk_call\n    result = executor.validate_candidate(\n        candidate.resolve(),\n        operation_key="p2330:pinned-dotnet",\n        validation_profile=profile,\n    )\n\n    assert result.validation_profile_id == "dotnet-v1"\n    assert result.file_count == 1\n    assert result.total_bytes > 0\n    assert result.passed is False\n    stage, evidence = result.stage_evidence[0]\n    assert stage == "BUILD"\n    assert evidence["dependency_preparation_code"] == "EXECUTION_PROFILE_UNAVAILABLE"\n\n\ndef test_candidate_validator_requires_server_owned_profile(tmp_path: Path):\n    (tmp_path / "package.json").write_text("{}", encoding="utf-8")\n    executor = VercelCandidateValidationExecutor(project_id="prj_test")\n    with pytest.raises(TypeError):\n        executor.validate_candidate(tmp_path.resolve(), operation_key="p2330:missing-profile")\n\n\n@pytest.mark.parametrize("exc", [ValidationProfileError("profile"), ExecutionPolicyError("policy")])\ndef test_profile_and_policy_errors_use_fixed_sanitized_admission_classification(exc):\n    diagnostic = _candidate_admission_failure_diagnostic(\n        "candidate-primary",\n        "DISPOSABLE_CANDIDATE_VALIDATION",\n        exc,\n    )\n    assert diagnostic["failure_kind"] == "VALIDATION_PROFILE_ERROR"\n    assert "profile" not in str(diagnostic)\n    assert "policy" not in str(diagnostic)\n    assert diagnostic["source_lineage_accepted"] is False\n    assert diagnostic["production_deployed"] is False\n\n\ndef test_plain_value_error_remains_value_contract_error():\n    diagnostic = _candidate_admission_failure_diagnostic(\n        "candidate-primary",\n        "DISPOSABLE_CANDIDATE_VALIDATION",\n        ValueError("raw detail must not persist"),\n    )\n    assert diagnostic["failure_kind"] == "VALUE_CONTRACT_ERROR"\n    assert "raw detail" not in str(diagnostic)\n''')
          PY
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Compile changed Python sources
        run: python -m compileall -q services/api/parallax_api/code services/api/tests/test_source_anchored_candidate_validation_profile_v02330.py
      - name: Run focused source-anchored profile regressions
        run: |
          pytest -q \
            services/api/tests/test_source_anchored_candidate_validation_profile_v02330.py \
            services/api/tests/test_execution_snapshot_profiles.py \
            services/api/tests/test_candidate_dependency_preparation_failure.py \
            services/api/tests/test_agentic_runtime_activation.py \
            services/api/tests/test_runtime_composition.py
      - name: Advance durable architecture after focused validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          if 'Version: 3.40' not in text:
              raise SystemExit('expected architecture v3.40 baseline')
          text = text.replace('Version: 3.40', 'Version: 3.41', 1)
          marker = '## Version relationship\n\n'
          if marker not in text:
              raise SystemExit('version relationship marker missing')
          paragraph = ('Architecture v3.41 pins disposable candidate validation authority to the immutable validation profile selected from the accepted-source/base workspace before any non-authoritative candidate mutation. Candidate edits still determine the source bytes transferred to the disposable sandbox and therefore what BUILD/TEST/VERIFY evaluates, but source-shape marker edits can no longer switch or invalidate the protected validation ecosystem, command set, dependency-preparation policy, or execution-snapshot family for that attempt. A validation ecosystem/profile transition requires a separately governed capability rather than model-authored source. ValidationProfileError/ExecutionPolicyError admission failures use only the fixed sanitized `VALIDATION_PROFILE_ERROR` classification without exception text. SafeImplementationEngine, deny-all validation networking, dependency preparation, source lineage, independent evaluation, Git/deployment/lifecycle authority, Luna/Terra/Sol routing, hosted timeout, retry ceilings, and the human REVIEW boundary are unchanged. Architecture v3.40 remains the coherent single-unit IMPLEMENT source-authoring foundation.\n\n')
          text = text.replace(marker, marker + paragraph, 1)
          path.write_text(text)
          PY
          grep -F 'Version: 3.41' ARCHITECTURE.md
          grep -F 'Architecture v3.41 pins disposable candidate validation authority' ARCHITECTURE.md
      - name: Validate governed specification after implementation
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.30.md
      - name: Commit validated implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'Parallax Runtime Implementer'
          git config user.email 'parallax-runtime@users.noreply.github.com'
          git add services/api/parallax_api/code/agentic_runtime.py \
            services/api/tests/test_execution_snapshot_profiles.py \
            services/api/tests/test_candidate_dependency_preparation_failure.py \
            services/api/tests/test_source_anchored_candidate_validation_profile_v02330.py \
            ARCHITECTURE.md
          git rm .github/workflows/tmp-p2330-implement.yml
          git commit -m 'P2-V0.23.30 — pin candidate validation to accepted-source profile'
          git push origin HEAD:fix/p2330-source-anchored-validation-profile
