name: Temporary P2-V0.23.16 DSPy compile

on:
  push:
    branches:
      - fix/webgl-preflight-reduced-graphics
    paths:
      - specs/P2-V0.23.16.md
      - .github/workflows/tmp-p2316-compile.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webgl-preflight-reduced-graphics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'
      - name: Install local development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Compile and validate exact specification
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:0.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: |
          python scripts/compile_spec.py specs/P2-V0.23.16.md
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.16.md
      - name: Commit generated plan and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "parallax-qa-compiler"
          git config user.email "actions@users.noreply.github.com"
          git add specs/compiled/P2-V0.23.16.plan.json
          git rm .github/workflows/tmp-p2316-compile.yml
          git diff --cached --check
          git commit -m "Compile P2-V0.23.16 DSPy plan"
          git push origin HEAD:fix/webgl-preflight-reduced-graphics
