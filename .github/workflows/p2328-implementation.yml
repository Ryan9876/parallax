name: P2-V0.23.28 Focused Implementation

on:
  push:
    branches: [fix/p2328-cross-work-unit-convergence]
    paths:
      - '.github/workflows/p2328-implementation.yml'
      - 'scripts/tmp_p2328_apply.py'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2328-cross-work-unit-convergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Apply governed implementation
        run: python scripts/tmp_p2328_apply.py
      - name: Focused P2-V0.23.28 validation
        run: |
          python -m pytest -q \
            services/api/tests/test_incremental_implement_convergence_v02327.py \
            services/api/tests/test_cross_work_unit_convergence_v02328.py \
            services/api/tests/test_implementation_proposal_preflight.py \
            services/api/tests/test_agentic_runtime_activation.py
          python -m compileall -q services/api/parallax_api
          git diff --check
      - name: Commit validated implementation and remove temporary helpers
        run: |
          set -euo pipefail
          rm .github/workflows/p2328-implementation.yml scripts/tmp_p2328_apply.py
          git config user.name 'Parallax Runtime Implementer'
          git config user.email 'parallax-runtime@users.noreply.github.com'
          git add \
            services/api/parallax_api/code/agentic_candidate_recovery.py \
            services/api/parallax_api/code/implementation_runtime.py \
            services/api/tests/test_cross_work_unit_convergence_v02328.py \
            .github/workflows/p2328-implementation.yml \
            scripts/tmp_p2328_apply.py
          git diff --cached --check
          git commit -m 'P2-V0.23.28 — implement plan-prefix convergence diagnostics'
          git push origin HEAD:fix/p2328-cross-work-unit-convergence
