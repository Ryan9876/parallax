name: WS580 P2-V0.23.43 Implementation

on:
  push:
    branches:
      - ws/580-lineage-scoped-delivery-branch
    paths:
      - .github/workflows/ws580-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/580-lineage-scoped-delivery-branch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Re-prove amended protected spec-first gate
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.43.md
      - name: Apply bounded lineage-scoped delivery-ledger semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          source = Path('services/api/parallax_api/code/source_delivery_composition.py')
          replace_once(source, 'from sqlalchemy import select\n', 'from sqlalchemy import func, select\n')
          replace_once(
              source,
              '''        conflicting = self.repository.session.scalar(\n            select(EngineeringAttempt).where(\n                EngineeringAttempt.run_id == run.id,\n                EngineeringAttempt.stage == _DELIVERY_RECORD_STAGE,\n            )\n        )\n        if conflicting is not None:\n            raise VerifiedDeliveryError("Engineering Run already has a different durable delivery record")\n\n        attempt = EngineeringAttempt(\n            run_id=run.id,\n            stage=_DELIVERY_RECORD_STAGE,\n            attempt_number=1,\n            operation_key=self.operation_key(lineage_id),\n            status=_DELIVERY_RECORD_STATUS,\n            program_id=_DELIVERY_RECORD_PROGRAM,\n            tool_id=_DELIVERY_RECORD_TOOL,\n            evidence_json=encoded,\n            completed_at=utcnow(),\n        )\n        try:\n            self.repository.session.add(attempt)\n            self.repository.session.commit()\n        except IntegrityError as exc:\n            self.repository.session.rollback()\n            replay = self.load(run_id=run.id, lineage_id=lineage_id)\n            if replay is None or self._canonical(replay) != encoded:\n                raise VerifiedDeliveryError("concurrent durable delivery record conflicted") from exc\n            return replay, True\n        return payload, False\n''',
              '''        operation_key = self.operation_key(lineage_id)\n        for insert_index in range(2):\n            current = self.repository.session.scalar(\n                select(func.max(EngineeringAttempt.attempt_number)).where(\n                    EngineeringAttempt.run_id == run.id,\n                    EngineeringAttempt.stage == _DELIVERY_RECORD_STAGE,\n                )\n            )\n            attempt_number = int(current or 0) + 1\n            attempt = EngineeringAttempt(\n                run_id=run.id,\n                stage=_DELIVERY_RECORD_STAGE,\n                attempt_number=attempt_number,\n                operation_key=operation_key,\n                status=_DELIVERY_RECORD_STATUS,\n                program_id=_DELIVERY_RECORD_PROGRAM,\n                tool_id=_DELIVERY_RECORD_TOOL,\n                evidence_json=encoded,\n                completed_at=utcnow(),\n            )\n            try:\n                self.repository.session.add(attempt)\n                self.repository.session.commit()\n                return payload, False\n            except IntegrityError as exc:\n                self.repository.session.rollback()\n                replay = self.load(run_id=run.id, lineage_id=lineage_id)\n                if replay is not None:\n                    if self._canonical(replay) != encoded:\n                        raise VerifiedDeliveryError("conflicting durable delivery record already exists") from exc\n                    return replay, True\n                claimed_attempt = self.repository.session.scalar(\n                    select(EngineeringAttempt).where(\n                        EngineeringAttempt.run_id == run.id,\n                        EngineeringAttempt.stage == _DELIVERY_RECORD_STAGE,\n                        EngineeringAttempt.attempt_number == attempt_number,\n                    )\n                )\n                if (\n                    insert_index == 0\n                    and claimed_attempt is not None\n                    and claimed_attempt.operation_key != operation_key\n                ):\n                    continue\n                raise VerifiedDeliveryError("concurrent durable delivery record conflicted") from exc\n        raise VerifiedDeliveryError("concurrent durable delivery record conflicted")\n''',
          )

          tests = Path('services/api/tests/test_source_delivery_composition.py')
          with tests.open('a', encoding='utf-8') as handle:
              handle.write('''\n\ndef test_durable_delivery_store_persists_multiple_same_run_lineages_without_run_transition(tmp_path) -> None:\n    project_id, run_id = str(uuid4()), str(uuid4())\n    first_lineage = \"src:\" + \"1\" * 64\n    second_lineage = \"src:\" + \"2\" * 64\n    engine = make_engine(f\"sqlite:///{tmp_path / 'same-run-delivery.db'}\")\n    Base.metadata.create_all(engine)\n    Session = sessionmaker(bind=engine, expire_on_commit=False)\n\n    with Session() as session:\n        session.add(\n            EngineeringRun(\n                id=run_id,\n                conversation_id=str(uuid4()),\n                spec_id=\"P2-V0.23.43\",\n                project_id=project_id,\n                state=\"REVIEW\",\n                revision=12,\n            )\n        )\n        session.commit()\n        repository = EngineeringRunRepository(session)\n        records = EngineeringAttemptDeliveryRecordStore(repository)\n        run = repository.get(run_id)\n        assert run is not None\n        first_payload = {\"project_id\": project_id, \"run_id\": run_id, \"lineage_id\": first_lineage, \"branch_name\": \"legacy-branch\"}\n        second_payload = {\"project_id\": project_id, \"run_id\": run_id, \"lineage_id\": second_lineage, \"branch_name\": \"replacement-branch\"}\n\n        stored_first, replayed_first = records.persist(run=run, lineage_id=first_lineage, payload=first_payload)\n        stored_second, replayed_second = records.persist(run=run, lineage_id=second_lineage, payload=second_payload)\n        exact_replay, replayed_exact = records.persist(run=run, lineage_id=first_lineage, payload=first_payload)\n\n        assert stored_first == first_payload and replayed_first is False\n        assert stored_second == second_payload and replayed_second is False\n        assert exact_replay == first_payload and replayed_exact is True\n        first_attempt = repository.find_operation(run_id, records.operation_key(first_lineage))\n        second_attempt = repository.find_operation(run_id, records.operation_key(second_lineage))\n        assert first_attempt is not None and first_attempt.attempt_number == 1\n        assert second_attempt is not None and second_attempt.attempt_number == 2\n        assert first_attempt.operation_key != second_attempt.operation_key\n        assert records.load(run_id=run_id, lineage_id=first_lineage) == first_payload\n        assert records.load(run_id=run_id, lineage_id=second_lineage) == second_payload\n        refreshed = repository.get(run_id)\n        assert refreshed is not None and refreshed.state == \"REVIEW\" and refreshed.revision == 12\n\n\ndef test_durable_delivery_store_retries_only_database_attempt_number_collision_once(tmp_path, monkeypatch) -> None:\n    project_id, run_id = str(uuid4()), str(uuid4())\n    existing_lineage = \"src:\" + \"3\" * 64\n    target_lineage = \"src:\" + \"4\" * 64\n    engine = make_engine(f\"sqlite:///{tmp_path / 'delivery-race.db'}\")\n    Base.metadata.create_all(engine)\n    Session = sessionmaker(bind=engine, expire_on_commit=False)\n\n    with Session() as session:\n        session.add(\n            EngineeringRun(\n                id=run_id,\n                conversation_id=str(uuid4()),\n                spec_id=\"P2-V0.23.43\",\n                project_id=project_id,\n                state=\"REVIEW\",\n                revision=12,\n            )\n        )\n        session.add(\n            EngineeringAttempt(\n                run_id=run_id,\n                stage=\"SOURCE_DELIVERY\",\n                attempt_number=1,\n                operation_key=EngineeringAttemptDeliveryRecordStore.operation_key(existing_lineage),\n                status=\"RECORDED\",\n                evidence_json=json.dumps({\"project_id\": project_id, \"run_id\": run_id, \"lineage_id\": existing_lineage}),\n            )\n        )\n        session.commit()\n        repository = EngineeringRunRepository(session)\n        records = EngineeringAttemptDeliveryRecordStore(repository)\n        run = repository.get(run_id)\n        assert run is not None\n        payload = {\"project_id\": project_id, \"run_id\": run_id, \"lineage_id\": target_lineage, \"branch_name\": \"target\"}\n\n        original_scalar = session.scalar\n        max_reads = 0\n\n        def stale_once(statement, *args, **kwargs):\n            nonlocal max_reads\n            rendered = str(statement)\n            if \"max(engineering_attempts.attempt_number)\" in rendered:\n                max_reads += 1\n                if max_reads == 1:\n                    return 0\n            return original_scalar(statement, *args, **kwargs)\n\n        monkeypatch.setattr(session, \"scalar\", stale_once)\n        stored, replayed = records.persist(run=run, lineage_id=target_lineage, payload=payload)\n\n        assert stored == payload and replayed is False\n        target_attempt = repository.find_operation(run_id, records.operation_key(target_lineage))\n        assert target_attempt is not None and target_attempt.attempt_number == 2\n        assert max_reads == 2\n        refreshed = repository.get(run_id)\n        assert refreshed is not None and refreshed.state == \"REVIEW\" and refreshed.revision == 12\n\n\ndef test_durable_delivery_store_fails_after_one_unresolved_attempt_number_retry(tmp_path, monkeypatch) -> None:\n    project_id, run_id = str(uuid4()), str(uuid4())\n    target_lineage = \"src:\" + \"7\" * 64\n    engine = make_engine(f\"sqlite:///{tmp_path / 'delivery-race-fail.db'}\")\n    Base.metadata.create_all(engine)\n    Session = sessionmaker(bind=engine, expire_on_commit=False)\n\n    with Session() as session:\n        session.add(\n            EngineeringRun(\n                id=run_id,\n                conversation_id=str(uuid4()),\n                spec_id=\"P2-V0.23.43\",\n                project_id=project_id,\n                state=\"REVIEW\",\n                revision=12,\n            )\n        )\n        for number, digit in ((1, \"5\"), (2, \"6\")):\n            lineage = \"src:\" + digit * 64\n            session.add(\n                EngineeringAttempt(\n                    run_id=run_id,\n                    stage=\"SOURCE_DELIVERY\",\n                    attempt_number=number,\n                    operation_key=EngineeringAttemptDeliveryRecordStore.operation_key(lineage),\n                    status=\"RECORDED\",\n                    evidence_json=json.dumps({\"project_id\": project_id, \"run_id\": run_id, \"lineage_id\": lineage}),\n                )\n            )\n        session.commit()\n        repository = EngineeringRunRepository(session)\n        records = EngineeringAttemptDeliveryRecordStore(repository)\n        run = repository.get(run_id)\n        assert run is not None\n        payload = {\"project_id\": project_id, \"run_id\": run_id, \"lineage_id\": target_lineage, \"branch_name\": \"target\"}\n\n        original_scalar = session.scalar\n        forced = iter((0, 1))\n\n        def two_stale_reads(statement, *args, **kwargs):\n            rendered = str(statement)\n            if \"max(engineering_attempts.attempt_number)\" in rendered:\n                return next(forced)\n            return original_scalar(statement, *args, **kwargs)\n\n        monkeypatch.setattr(session, \"scalar\", two_stale_reads)\n        with pytest.raises(VerifiedDeliveryError, match=\"concurrent durable delivery record conflicted\"):\n            records.persist(run=run, lineage_id=target_lineage, payload=payload)\n        assert repository.find_operation(run_id, records.operation_key(target_lineage)) is None\n        refreshed = repository.get(run_id)\n        assert refreshed is not None and refreshed.state == \"REVIEW\" and refreshed.revision == 12\n''')
          PY
      - name: Run focused branch, ledger, greenfield and historical replay regressions
        run: |
          pytest -q \
            services/api/tests/test_source_delivery_composition.py \
            services/api/tests/test_greenfield_commit_bearing_delivery.py \
            services/api/tests/test_app_builder_source_delivery_bridge.py
      - name: Reconcile Architecture v3.52 after complete semantic validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          old = ('Architecture v3.52 makes new accepted-source publication branch identity exact-lineage scoped while preserving historical delivery replay. '
                 'For one canonical Project/run and exact accepted `src:<64hex>` lineage, both ordinary and greenfield REVIEW delivery now derive the server-owned feature branch as `parallax/{project8}-{run8}-{lineage64}` using the complete lowercase lineage digest. Exact durable delivery records remain authoritative before provider mutation and continue replaying their stored historical branch names, including pre-v3.52 run-scoped refs. '
                 'A different accepted lineage in the same Engineering Run therefore receives a distinct deterministic branch while prior branches, pull requests and Previews remain untouched. An unexpected pre-existing computed branch still fails through the existing provider conflict/read-back boundary; no suffixing, adoption, force update, deletion or history rewrite is introduced. '
                 'P2-V0.23.42 repository-state classification, accepted-lineage authority, provider credentials/actions, default-branch restrictions, Preview ceiling, merge/production boundaries and human REVIEW completion authority are unchanged. Architecture v3.51 remains the commit-bearing-empty repository compatibility foundation.')
          new = ('Architecture v3.52 makes accepted-source publication identity exact-lineage scoped across both provider refs and the durable delivery ledger while preserving historical replay. '
                 'For one canonical Project/run and exact accepted `src:<64hex>` lineage, both ordinary and greenfield REVIEW delivery derive the server-owned feature branch as `parallax/{project8}-{run8}-{lineage64}` using the complete lowercase lineage digest. The durable `SOURCE_DELIVERY` operation key remains exact-lineage scoped, and a later accepted lineage in the same Engineering Run persists a distinct stage attempt using the deterministic next positive `SOURCE_DELIVERY` attempt number rather than conflicting with the earlier lineage record. '
                 'Exact durable replay remains authoritative before provider mutation and preserves stored historical branch names, including pre-v3.52 run-scoped refs, without creating another attempt. An `IntegrityError` first resolves exact-lineage replay; only a concurrently claimed stage attempt number for a different lineage may trigger one database-local recomputation and insert retry, with no provider call repeated and any second unresolved collision failing closed. '
                 'Prior branches, pull requests, Previews and delivery attempts remain untouched. Unexpected pre-existing provider branches still fail through the existing conflict/read-back boundary; no suffixing, adoption, force update, deletion or history rewrite is introduced. No schema migration or Engineering Run lifecycle revision/state change is required. '
                 'P2-V0.23.42 repository-state classification, accepted-lineage authority, provider credentials/actions/retries, default-branch restrictions, Preview ceiling, merge/production boundaries and human REVIEW completion authority are unchanged. Architecture v3.51 remains the commit-bearing-empty repository compatibility foundation.')
          if text.count(old) != 1:
              raise SystemExit('expected exact pre-ledger Architecture v3.52 paragraph')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run full applicable API regression and compile gates
        run: |
          pytest -q services/api/tests
          python -m compileall -q services/api/parallax_api
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.43.md
      - name: Persist validated complete P2-V0.23.43 semantics
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add \
            services/api/parallax_api/code/source_delivery_composition.py \
            services/api/tests/test_source_delivery_composition.py \
            ARCHITECTURE.md
          git diff --cached --check
          git commit -m 'Complete P2-V0.23.43 lineage-scoped delivery ledger'
          git push origin HEAD:ws/580-lineage-scoped-delivery-branch
