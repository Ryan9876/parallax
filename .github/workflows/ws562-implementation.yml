name: WS562 P2-V0.23.39 Implementation

on:
  push:
    branches:
      - 'ws/562-canonical-empty-tree-replay'
    paths:
      - '.github/workflows/ws562-implementation.yml'

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/562-canonical-empty-tree-replay
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'

      - name: Validate protected DSPy plan
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.39.md

      - name: Apply bounded canonical empty-tree replay implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('services/api/parallax_api/code/greenfield_github.py')
          source = source_path.read_text()

          constant_anchor = '_CLEANUP_MESSAGE = "Finalize Parallax empty greenfield baseline"\n_ACTOR = {'
          constant_replacement = (
              '_CLEANUP_MESSAGE = "Finalize Parallax empty greenfield baseline"\n'
              '_CANONICAL_EMPTY_TREE_SHA = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"\n'
              '_ACTOR = {'
          )
          if source.count(constant_anchor) != 1:
              raise SystemExit('canonical empty-tree constant anchor mismatch')
          source = source.replace(constant_anchor, constant_replacement, 1)

          replay_anchor = '''        cleanup_tree_sha = _text(_dict(cleanup.get("tree")).get("sha"))
          cleanup_tree = self._tree_payload(repository_ref, cleanup_tree_sha)
          if _list(cleanup_tree.get("tree")):
              raise ProviderClientError("GREENFIELD_BASELINE_MISMATCH")
          '''
          replay_replacement = '''        cleanup_tree_sha = _text(_dict(cleanup.get("tree")).get("sha"))
          if cleanup_tree_sha != _CANONICAL_EMPTY_TREE_SHA:
              raise ProviderClientError("GREENFIELD_BASELINE_MISMATCH")
          '''
          if source.count(replay_anchor) != 1:
              raise SystemExit('existing baseline replay anchor mismatch')
          source = source.replace(replay_anchor, replay_replacement, 1)
          source_path.write_text(source)

          tests_path = Path('services/api/tests/test_greenfield_github.py')
          tests = tests_path.read_text()
          empty_tree_anchor = 'EMPTY_TREE = "f" * 40'
          canonical_empty_tree = 'EMPTY_TREE = "4b825dc642cb6eb9a060e54bf8d69288fbee4904"'
          if tests.count(empty_tree_anchor) != 1:
              raise SystemExit('test empty-tree constant anchor mismatch')
          tests = tests.replace(empty_tree_anchor, canonical_empty_tree, 1)

          regression_marker = 'def test_existing_canonical_empty_tree_replay_omits_provider_tree_get() -> None:'
          if regression_marker in tests:
              raise SystemExit('canonical empty-tree regressions already present')
          tests += r'''


def test_existing_canonical_empty_tree_replay_omits_provider_tree_get() -> None:
    methods: list[str] = []
    requested_paths: list[str] = []

    def exact(request: httpx.Request) -> httpx.Response:
        methods.append(request.method)
        path = request.url.path
        requested_paths.append(path)
        if path == "/repos/Ryan9876/empty-target":
            return _repo()
        if path.endswith("/git/ref/heads/main"):
            return httpx.Response(200, json={"object": {"sha": BASELINE}})
        if path.endswith(f"/git/commits/{BASELINE}"):
            payload = _commit(
                "Finalize Parallax empty greenfield baseline",
                [{"sha": BOOTSTRAP}],
                EMPTY_TREE,
            )
            payload["author"] = {**ACTOR, "date": "2026-09-02T04:01:01Z"}
            payload["committer"] = {**ACTOR, "date": "2026-09-02T00:01:01-04:00"}
            return httpx.Response(200, json=payload)
        if path.endswith(f"/git/trees/{EMPTY_TREE}"):
            raise AssertionError("canonical empty tree must not require provider Trees GET during replay")
        if path.endswith(f"/git/commits/{BOOTSTRAP}"):
            payload = _commit(
                "Initialize Parallax greenfield baseline",
                [],
                BOOTSTRAP_TREE,
            )
            payload["author"] = {**ACTOR, "date": "2026-09-02T04:01:00Z"}
            payload["committer"] = {**ACTOR, "date": "2026-09-02T00:01:00-04:00"}
            return httpx.Response(200, json=payload)
        if path.endswith(f"/git/trees/{BOOTSTRAP_TREE}"):
            return _bootstrap_tree()
        if path.endswith(f"/git/blobs/{BLOB}"):
            return httpx.Response(
                200,
                json={
                    "encoding": "base64",
                    "content": base64.b64encode(CONTENT.encode()).decode(),
                },
            )
        raise AssertionError(request.url)

    replay = _client(exact).initialize_empty_baseline(REPOSITORY, PROVENANCE)

    assert replay.initialized is False
    assert replay.baseline_revision == BASELINE
    assert replay.bootstrap_revision == BOOTSTRAP
    assert set(methods) == {"GET"}
    assert not any(path.endswith(f"/git/trees/{EMPTY_TREE}") for path in requested_paths)


def test_existing_baseline_rejects_noncanonical_cleanup_tree_without_normalizing_missing_tree() -> None:
    noncanonical_tree = OTHER
    tree_reads = 0

    def mismatch(request: httpx.Request) -> httpx.Response:
        nonlocal tree_reads
        path = request.url.path
        if path == "/repos/Ryan9876/empty-target":
            return _repo()
        if path.endswith("/git/ref/heads/main"):
            return httpx.Response(200, json={"object": {"sha": BASELINE}})
        if path.endswith(f"/git/commits/{BASELINE}"):
            return httpx.Response(
                200,
                json=_commit(
                    "Finalize Parallax empty greenfield baseline",
                    [{"sha": BOOTSTRAP}],
                    noncanonical_tree,
                ),
            )
        if path.endswith(f"/git/trees/{noncanonical_tree}"):
            tree_reads += 1
            return httpx.Response(404, json={"message": "Not Found"})
        raise AssertionError(request.url)

    with pytest.raises(ProviderClientError, match="GREENFIELD_BASELINE_MISMATCH"):
        _client(mismatch).initialize_empty_baseline(REPOSITORY, PROVENANCE)

    assert tree_reads == 0
'''
          tests_path.write_text(tests)
          PY

      - name: Run focused greenfield regressions
        run: pytest -q services/api/tests/test_greenfield_github.py

      - name: Compile API
        run: python -m compileall -q services/api/parallax_api

      - name: Run full API regression suite
        run: pytest -q services/api/tests

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add services/api/parallax_api/code/greenfield_github.py services/api/tests/test_greenfield_github.py
          git diff --cached --check
          git commit -m 'Implement P2-V0.23.39 canonical empty-tree replay compatibility'
          git push origin HEAD:ws/562-canonical-empty-tree-replay
