name: P2-V0.23.9 Record Reconciliation

on:
  push:
    branches: [ws/hosted-model-escalation-order]
    paths:
      - '.github/workflows/hosted-model-escalation-dspy-compile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile durable architecture and current state
        run: |
          python - <<'PY'
          from pathlib import Path

          architecture = Path('ARCHITECTURE.md')
          text = architecture.read_text()
          old_header = '''Version: 3.22\nStatus: Authoritative\n\n## Version relationship\n\nArchitecture v3.22 is a bounded implementation-candidate recovery extension to v3.21, not a platform rewrite. Architecture v3.21 remains the authoritative empty-greenfield source-authority foundation.'''
          new_header = '''Version: 3.23\nStatus: Authoritative\n\n## Version relationship\n\nArchitecture v3.23 makes hosted implementation-agent selection priority explicit, server-owned, and independent from cryptographic identity ordering. It is a routing-policy refinement to v3.22, not a platform rewrite. Architecture v3.22 remains the authoritative bounded implementation-candidate recovery foundation, and v3.21 remains the authoritative empty-greenfield source-authority foundation.'''
          if text.count(old_header) != 1:
              raise SystemExit('ARCHITECTURE header target drifted')
          text = text.replace(old_header, new_header, 1)
          marker = '## Bounded implementation-candidate recovery\n'
          section = '''## Server-owned hosted model escalation\n\nArchitecture v3.23 separates implementation-agent identity from model-selection priority. `AgentIdentity.digest` remains a cryptographic identity/integrity value only; lexical SHA-256 order has no economic or capability meaning and cannot select which hosted model runs first.\n\nThe admitted roster now carries bounded server-owned `selection_priority` metadata. Roster canonicalization orders agents by `(selection_priority, identity_digest)`, so equivalent priority values retain deterministic digest tie-breaking while explicit priority controls selection. Priority is serialized into admitted-roster evidence and therefore changes the roster digest and orchestration plan identity when policy changes. Browser input, repository content, model output, and provider responses cannot supply or alter this value.\n\nThe released hosted implementation order is `openai/gpt-5.6-luna` first, `openai/gpt-5.6-terra` second, and `openai/gpt-5.6-sol` last. The smallest-capable-team rule remains authoritative: a serial equal-capability implementation unit selects Luna; two genuinely parallel independent equal-capability units may select Luna and Terra; Sol is retained as the final bounded alternate rather than being selected because its identity digest happens to sort first.\n\n`UnitPlan` and `TeamPlan` canonicalize selected and eligible identities against the priority-ordered admitted roster. Scheduling therefore consumes one stable priority sequence, and P2-V0.23.8 candidate-rejection recovery naturally escalates through that same sequence without a separate retry-order authority. Capability eligibility, concurrency and reassignment bounds, protected proposal validation, independent evaluation, safe canonical mutation, source lineage, Git/deployment authority, worker-loss recovery, and the REVIEW ceiling are unchanged.\n\nThe ordinary non-agentic `ModelRouter` retains its existing hosted `Luna -> Terra -> Sol` sequence. Architecture v3.23 changes only agent-team selection semantics that previously allowed deterministic identity-digest ordering to override that intended escalation policy.\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('ARCHITECTURE section marker drifted')
          text = text.replace(marker, section + marker, 1)
          architecture.write_text(text)

          current = Path('CURRENT-STATE.md')
          text = current.read_text()
          status = 'Status: **WAVES 1–8 DEPLOYMENT-VERIFIED / PYTHON AND .NET SOURCE-ONLY FULL EXPERIENCE ACCEPTED / P2-V0.23.8 BOUNDED CANDIDATE RECOVERY DEPLOYMENT-VERIFIED / W9-S1 P2-V0.23.7 GREENFIELD AUTHORITY IMPLEMENTED + API DEPLOYMENT-VERIFIED / CANONICAL GREENFIELD ACCEPTANCE PENDING FRESH APPROVED EMPTY TARGET / W9-S2 API PRODUCTION-DEPLOYMENT-VERIFIED / SAFE-DELETION DEPLOYMENT-VERIFIED + PRODUCTION-ACCEPTED**'
          replacement = 'Status: **WAVES 1–8 DEPLOYMENT-VERIFIED / PYTHON AND .NET SOURCE-ONLY FULL EXPERIENCE ACCEPTED / P2-V0.23.8 BOUNDED CANDIDATE RECOVERY DEPLOYMENT-VERIFIED / P2-V0.23.9 HOSTED MODEL ESCALATION IMPLEMENTED + VALIDATED / DEPLOYMENT PENDING / W9-S1 P2-V0.23.7 GREENFIELD AUTHORITY IMPLEMENTED + API DEPLOYMENT-VERIFIED / CANONICAL GREENFIELD ACCEPTANCE PENDING FRESH APPROVED EMPTY TARGET / W9-S2 API PRODUCTION-DEPLOYMENT-VERIFIED / SAFE-DELETION DEPLOYMENT-VERIFIED + PRODUCTION-ACCEPTED**'
          if text.count(status) != 1:
              raise SystemExit('CURRENT-STATE status target drifted')
          text = text.replace(status, replacement, 1)
          marker = '## Production components\n'
          section = '''## P2-V0.23.9 — Hosted model escalation ordering — IMPLEMENTED / VALIDATED / DEPLOYMENT PENDING\n\nWorkstream: #453. Release PR: #454. Governing specification: `P2-V0.23.9`. Architecture: `ARCHITECTURE.md` v3.23.\n\nProduction evidence exposed that autonomous IMPLEMENT could invoke `openai/gpt-5.6-sol -> openai/gpt-5.6-terra -> openai/gpt-5.6-luna` even though the canonical hosted escalation policy is `Luna -> Terra -> Sol`. The cause was deterministic SHA-256 identity sorting inside agent-team orchestration. Cryptographic identity had unintentionally become routing priority.\n\nThe validated implementation adds bounded server-owned selection priority to admitted-agent evidence and canonicalizes roster, selected-team and unit-eligibility order from that policy. Hosted implementation priorities are now Luna `0`, Terra `1`, Sol `2`; equal priorities retain identity-digest tie determinism. Candidate-rejection recovery inherits the same canonical sequence and remains bounded by the existing reassignment ceiling. Capability admission, proposal validation, candidate validation, source mutation, lineage, Git/deployment and REVIEW authority are unchanged.\n\nValidation evidence before implementation: Workstream Spec Validation run `33288164174` PASS; authentic DSPy SpecCritic/SpecCompiler run `33288470611`, job `99195779587`, model `ollama_chat/qwen2.5:0.5b`, protected score `1.000`, and `validate_spec.py --require-dspy` PASS. Focused implementation bootstrap run `33288875691`, job `99196856050`, passed exact spec validation plus orchestration, candidate-recovery and runtime-activation regressions before committing implementation head `db35e3a622e637520ad9433d0a521533472f814c`.\n\nThis section does **not** claim production deployment. The currently deployed API remains the v3.22 runtime recorded below until exact-head release gates, merge, deployment READY evidence, and a representative production autonomous run prove Luna-first behavior.\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('CURRENT-STATE production marker drifted')
          text = text.replace(marker, section + marker, 1)
          current.write_text(text)
          PY
      - name: Commit authoritative records
        run: |
          git config user.name "parallax-workstream"
          git config user.email "actions@users.noreply.github.com"
          git add ARCHITECTURE.md CURRENT-STATE.md
          git diff --cached --check
          git commit -m "Record hosted model escalation architecture"
          git push origin HEAD:ws/hosted-model-escalation-order
