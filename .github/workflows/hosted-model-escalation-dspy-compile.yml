name: P2-V0.23.9 Implement Bootstrap

on:
  push:
    branches: [ws/hosted-model-escalation-order]
    paths:
      - '.github/workflows/hosted-model-escalation-dspy-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p2-v0-23-9-implement-bootstrap
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Incorporate latest main
        run: |
          git fetch origin main
          git config user.name "parallax-workstream"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'
      - name: Apply exact priority-order implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement target, found {count}")
              file.write_text(text.replace(old, new, 1))

          orchestration = "services/api/parallax_api/code/agent_team_orchestration.py"
          runtime = "services/api/parallax_api/code/agentic_runtime.py"

          replace_once(
              orchestration,
              "_MAX_FANOUT = 16\n\n_SHA256_RE",
              "_MAX_FANOUT = 16\n_MAX_SELECTION_PRIORITY = 10_000\n_DEFAULT_SELECTION_PRIORITY = 100\n\n_SHA256_RE",
          )
          replace_once(
              orchestration,
              '''class AdmittedAgent:\n    identity: AgentIdentity\n    admitted_work_kinds: tuple[str, ...]\n    admitted_capabilities: tuple[str, ...] = ()\n\n    def __post_init__(self) -> None:\n        if not isinstance(self.identity, AgentIdentity):\n            raise OrchestrationError("admitted agent requires S1 AgentIdentity")\n        work = _token_set(self.admitted_work_kinds, field="admitted_work_kinds", required=True)\n        capabilities = _token_set(self.admitted_capabilities, field="admitted_capabilities")\n        if any(item not in self.identity.declared_work_kinds for item in work):\n            raise OrchestrationError("server admission cannot invent undeclared work kinds")\n        if any(item not in self.identity.declared_capabilities for item in capabilities):\n            raise OrchestrationError("server admission cannot invent undeclared capabilities")\n        object.__setattr__(self, "admitted_work_kinds", work)\n        object.__setattr__(self, "admitted_capabilities", capabilities)\n''',
              '''class AdmittedAgent:\n    identity: AgentIdentity\n    admitted_work_kinds: tuple[str, ...]\n    admitted_capabilities: tuple[str, ...] = ()\n    selection_priority: int = _DEFAULT_SELECTION_PRIORITY\n\n    def __post_init__(self) -> None:\n        if not isinstance(self.identity, AgentIdentity):\n            raise OrchestrationError("admitted agent requires S1 AgentIdentity")\n        work = _token_set(self.admitted_work_kinds, field="admitted_work_kinds", required=True)\n        capabilities = _token_set(self.admitted_capabilities, field="admitted_capabilities")\n        if any(item not in self.identity.declared_work_kinds for item in work):\n            raise OrchestrationError("server admission cannot invent undeclared work kinds")\n        if any(item not in self.identity.declared_capabilities for item in capabilities):\n            raise OrchestrationError("server admission cannot invent undeclared capabilities")\n        if (\n            not isinstance(self.selection_priority, int)\n            or isinstance(self.selection_priority, bool)\n            or not 0 <= self.selection_priority <= _MAX_SELECTION_PRIORITY\n        ):\n            raise OrchestrationError("agent selection priority is outside protected bounds")\n        object.__setattr__(self, "admitted_work_kinds", work)\n        object.__setattr__(self, "admitted_capabilities", capabilities)\n''',
          )
          replace_once(
              orchestration,
              '            "admitted_capabilities": list(self.admitted_capabilities),\n            "server_owned_admission": True,',
              '            "admitted_capabilities": list(self.admitted_capabilities),\n            "selection_priority": self.selection_priority,\n            "server_owned_admission": True,',
          )
          replace_once(
              orchestration,
              '        ordered = tuple(sorted(entries, key=lambda item: item.identity_digest))',
              '        ordered = tuple(sorted(entries, key=lambda item: (item.selection_priority, item.identity_digest)))',
          )
          replace_once(
              orchestration,
              '        eligible = tuple(sorted(_sha256(item, field="eligible_agent_digest") for item in self.eligible_agent_digests))',
              '        eligible = tuple(_sha256(item, field="eligible_agent_digest") for item in self.eligible_agent_digests)',
          )
          replace_once(
              orchestration,
              '''        selected = tuple(sorted(_sha256(item, field="selected_agent_digest") for item in self.selected_agent_digests))\n        if not selected or len(selected) > self.limits.max_team_size or len(set(selected)) != len(selected):\n            raise OrchestrationError("selected team is empty, duplicate, or over limit")\n        roster_ids = {entry.identity_digest for entry in self.roster.entries}\n        if not set(selected) <= roster_ids:\n            raise OrchestrationError("selected team contains non-admitted agent")\n        object.__setattr__(self, "selected_agent_digests", selected)\n        plans = tuple(sorted(self.unit_plans, key=lambda item: item.work_unit_id))\n        if {item.work_unit_id for item in plans} != {item.unit_id for item in self.graph.units}:\n            raise OrchestrationError("unit plan coverage does not match work graph")\n        object.__setattr__(self, "unit_plans", plans)\n''',
              '''        selected_input = tuple(_sha256(item, field="selected_agent_digest") for item in self.selected_agent_digests)\n        if (\n            not selected_input\n            or len(selected_input) > self.limits.max_team_size\n            or len(set(selected_input)) != len(selected_input)\n        ):\n            raise OrchestrationError("selected team is empty, duplicate, or over limit")\n        roster_order = tuple(entry.identity_digest for entry in self.roster.entries)\n        roster_ids = set(roster_order)\n        selected_set = set(selected_input)\n        if not selected_set <= roster_ids:\n            raise OrchestrationError("selected team contains non-admitted agent")\n        selected = tuple(digest for digest in roster_order if digest in selected_set)\n        object.__setattr__(self, "selected_agent_digests", selected)\n        plans = tuple(sorted(self.unit_plans, key=lambda item: item.work_unit_id))\n        if {item.work_unit_id for item in plans} != {item.unit_id for item in self.graph.units}:\n            raise OrchestrationError("unit plan coverage does not match work graph")\n        canonical_plans: list[UnitPlan] = []\n        for item in plans:\n            eligible_set = set(item.eligible_agent_digests)\n            if len(eligible_set) != len(item.eligible_agent_digests):\n                raise OrchestrationError("unit plan contains duplicate eligible agents")\n            if not eligible_set <= roster_ids:\n                raise OrchestrationError("unit plan contains non-admitted eligible agent")\n            canonical_eligible = tuple(digest for digest in roster_order if digest in eligible_set)\n            canonical_plans.append(UnitPlan(item.work_unit_id, canonical_eligible))\n        object.__setattr__(self, "unit_plans", tuple(canonical_plans))\n''',
          )

          replace_once(
              runtime,
              '''_MODEL_ORDER = (\n    "openai/gpt-5.6-luna",\n    "openai/gpt-5.6-terra",\n    "openai/gpt-5.6-sol",\n)\n''',
              '''_MODEL_ORDER = (\n    "openai/gpt-5.6-luna",\n    "openai/gpt-5.6-terra",\n    "openai/gpt-5.6-sol",\n)\n_MODEL_SELECTION_PRIORITY = {model: priority for priority, model in enumerate(_MODEL_ORDER)}\n_DEFAULT_AGENT_SELECTION_PRIORITY = 100\n''',
          )
          replace_once(
              runtime,
              '                "team_selection": "smallest-capable-team",',
              '                "team_selection": "smallest-capable-team:server-priority-v1",',
          )
          replace_once(
              runtime,
              '''                AdmittedAgent(\n                    adapter.describe(),\n                    admitted_work_kinds=("implementation",),\n                    admitted_capabilities=("bounded-source-evidence",),\n                )\n''',
              '''                AdmittedAgent(\n                    adapter.describe(),\n                    admitted_work_kinds=("implementation",),\n                    admitted_capabilities=("bounded-source-evidence",),\n                    selection_priority=_MODEL_SELECTION_PRIORITY.get(\n                        getattr(adapter, "model", ""),\n                        _DEFAULT_AGENT_SELECTION_PRIORITY,\n                    ),\n                )\n''',
          )

          orchestration_tests = Path("services/api/tests/test_agent_team_orchestration.py")
          text = orchestration_tests.read_text()
          marker = "def test_server_owned_selection_priority_controls_smallest_team_order():"
          if marker in text:
              raise SystemExit("priority orchestration tests already present")
          text += '''\n\ndef _priority_admitted(name: str, priority: int) -> AdmittedAgent:\n    identity = agent(name)\n    return AdmittedAgent(\n        identity=identity,\n        admitted_work_kinds=("implementation",),\n        admitted_capabilities=identity.declared_capabilities,\n        selection_priority=priority,\n    )\n\n\ndef test_server_owned_selection_priority_controls_smallest_team_order():\n    priority_roster = AdmittedRoster(\n        (\n            _priority_admitted("priority-sol", 2),\n            _priority_admitted("priority-luna", 0),\n            _priority_admitted("priority-terra", 1),\n        )\n    )\n    assert tuple(item.identity.agent_id for item in priority_roster.entries) == (\n        "priority-luna",\n        "priority-terra",\n        "priority-sol",\n    )\n\n    serial_plan = ready_plan(serial=True, selected_roster=priority_roster)\n    assert tuple(serial_plan.roster.get(item).identity.agent_id for item in serial_plan.selected_agent_digests) == (\n        "priority-luna",\n    )\n    assert serial_plan.roster.get(schedule_team_plan(serial_plan).ready[0].agent_identity_digest).identity.agent_id == "priority-luna"\n\n    parallel_plan = ready_plan(selected_roster=priority_roster)\n    assert tuple(parallel_plan.roster.get(item).identity.agent_id for item in parallel_plan.selected_agent_digests) == (\n        "priority-luna",\n        "priority-terra",\n    )\n    assert "priority-sol" not in {\n        parallel_plan.roster.get(item).identity.agent_id for item in parallel_plan.selected_agent_digests\n    }\n\n\ndef test_priority_order_is_deterministic_evidence_and_digest_ties_remain_canonical():\n    first = AdmittedRoster(\n        (\n            _priority_admitted("priority-sol", 2),\n            _priority_admitted("priority-luna", 0),\n            _priority_admitted("priority-terra", 1),\n        )\n    )\n    second = AdmittedRoster(tuple(reversed(first.entries)))\n    assert first.digest == second.digest\n    assert ready_plan(selected_roster=first).plan_id == ready_plan(selected_roster=second).plan_id\n\n    changed = AdmittedRoster(\n        (\n            _priority_admitted("priority-sol", 2),\n            _priority_admitted("priority-luna", 3),\n            _priority_admitted("priority-terra", 1),\n        )\n    )\n    assert changed.digest != first.digest\n\n    tied = AdmittedRoster(\n        (\n            _priority_admitted("tie-c", 5),\n            _priority_admitted("tie-a", 5),\n            _priority_admitted("tie-b", 5),\n        )\n    )\n    assert tuple(item.identity_digest for item in tied.entries) == tuple(\n        sorted(item.identity_digest for item in tied.entries)\n    )\n'''
          orchestration_tests.write_text(text)

          recovery_tests = Path("services/api/tests/test_agentic_candidate_recovery.py")
          text = recovery_tests.read_text()
          replace_target = '''    agents = tuple(\n        AdmittedAgent(\n            _identity(name),\n            admitted_work_kinds=("implementation",),\n            admitted_capabilities=("bounded-source-evidence",),\n        )\n        for name in ("model-a", "model-b", "model-c")\n    )\n'''
          replace_value = '''    agents = tuple(\n        AdmittedAgent(\n            _identity(name),\n            admitted_work_kinds=("implementation",),\n            admitted_capabilities=("bounded-source-evidence",),\n            selection_priority=priority,\n        )\n        for priority, name in enumerate(("model-luna", "model-terra", "model-sol"))\n    )\n'''
          if text.count(replace_target) != 1:
              raise SystemExit("candidate recovery agent fixture replacement target drifted")
          text = text.replace(replace_target, replace_value, 1)
          insert = '''\n\ndef _model_label(plan, digest: str) -> str:\n    value = plan.roster.get(digest).identity.model_runtime_label\n    assert value is not None\n    return value\n'''
          anchor = "\n\ndef test_candidate_rejection_reassigns_to_next_admitted_agent_with_fresh_identity():"
          if text.count(anchor) != 1:
              raise SystemExit("candidate recovery test anchor drifted")
          text = text.replace(anchor, insert + anchor, 1)
          text = text.replace(
              "    assert original.agent_identity_digest is not None\n\n    retry = candidate_recovery_assignment(",
              "    assert original.agent_identity_digest is not None\n    assert _model_label(plan, original.agent_identity_digest) == \"model-luna\"\n\n    retry = candidate_recovery_assignment(",
              1,
          )
          text = text.replace(
              "    assert retry.agent_identity_digest != original.agent_identity_digest\n",
              "    assert retry.agent_identity_digest != original.agent_identity_digest\n    assert _model_label(plan, retry.agent_identity_digest) == \"model-terra\"\n",
              1,
          )
          second_anchor = "    assert retry2 is not None\n    assert retry2.agent_identity_digest not in {\n"
          if text.count(second_anchor) != 1:
              raise SystemExit("candidate recovery second-retry anchor drifted")
          text = text.replace(
              second_anchor,
              "    assert retry2 is not None\n    assert retry2.agent_identity_digest is not None\n    assert _model_label(plan, retry2.agent_identity_digest) == \"model-sol\"\n    assert retry2.agent_identity_digest not in {\n",
              1,
          )
          recovery_tests.write_text(text)

          activation_tests = Path("services/api/tests/test_agentic_runtime_activation.py")
          text = activation_tests.read_text()
          if "def test_hosted_runtime_admits_canonical_model_priority_independent_of_adapter_input_order():" in text:
              raise SystemExit("hosted runtime priority test already present")
          text += '''\n\ndef test_hosted_runtime_admits_canonical_model_priority_independent_of_adapter_input_order():\n    from parallax_api.code.agentic_runtime import AgenticControlPlane, HostedImplementationAgent, _MODEL_ORDER\n\n    control = object.__new__(AgenticControlPlane)\n    control.adapters = tuple(HostedImplementationAgent(model) for model in reversed(_MODEL_ORDER))\n    roster = control._roster\n    model_by_digest = {\n        HostedImplementationAgent(model).describe().digest: model\n        for model in _MODEL_ORDER\n    }\n    assert tuple(model_by_digest[item.identity_digest] for item in roster.entries) == _MODEL_ORDER\n    assert tuple(item.selection_priority for item in roster.entries) == (0, 1, 2)\n'''
          activation_tests.write_text(text)
          PY
      - name: Validate exact protected specification evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.9.md
      - name: Focused orchestration and recovery regression
        run: |
          python -m compileall -q services/api/parallax_api/code
          pytest -q \
            services/api/tests/test_agent_team_orchestration.py \
            services/api/tests/test_agentic_candidate_recovery.py \
            services/api/tests/test_agentic_runtime_activation.py
      - name: Commit validated implementation
        run: |
          git add \
            services/api/parallax_api/code/agent_team_orchestration.py \
            services/api/parallax_api/code/agentic_runtime.py \
            services/api/tests/test_agent_team_orchestration.py \
            services/api/tests/test_agentic_candidate_recovery.py \
            services/api/tests/test_agentic_runtime_activation.py
          git diff --cached --check
          git commit -m "Preserve hosted model escalation priority"
          git push origin HEAD:ws/hosted-model-escalation-order
