name: P2-V0.23.9 DSPy Compile

on:
  push:
    branches: [ws/hosted-model-escalation-order]
    paths:
      - 'specs/P2-V0.23.9.md'
      - '.github/workflows/hosted-model-escalation-dspy-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'
      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:1.5b
      - name: Compile exact specification
        timeout-minutes: 10
        env:
          DSPY_MODEL: ollama_chat/qwen2.5-coder:1.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: python scripts/compile_spec.py specs/P2-V0.23.9.md
      - name: Verify authentic compiled evidence
        env:
          DSPY_MODEL: ollama_chat/qwen2.5-coder:1.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.9.md
      - uses: actions/upload-artifact@v4
        with:
          name: p2-v0-23-9-dspy-plan
          path: specs/compiled/P2-V0.23.9.plan.json
          if-no-files-found: error
          retention-days: 7
