name: W8-S4 DSPy Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'specs/P2-V0.22.0.md'
      - '.github/workflows/w8-s4-dspy-evidence.yml'
  workflow_dispatch:

jobs:
  compile:
    name: Compile P2-V0.22.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'

      - id: model
        name: Select provider-backed or local DSPy model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "name=openai/gpt-5.6-sol" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "name=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi

      - name: Install local DSPy development LM
        if: steps.model.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b

      - name: Run DSPy SpecCritic + SpecCompiler for W8-S4
        timeout-minutes: 8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py specs/P2-V0.22.0.md

      - name: Verify compiled plan against protected W8-S4 contract
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.22.0.md

      - name: Record W8-S4 DSPy evidence status
        if: success()
        env:
          PROVIDER: ${{ steps.model.outputs.provider }}
          MODEL: ${{ steps.model.outputs.name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('specs/compiled/w8-s4-dspy-run-status.json').write_text(json.dumps({
              'executed': True,
              'spec_id': 'P2-V0.22.0',
              'spec_compiler_executed': True,
              'spec_critic_executed': True,
              'model': os.environ['MODEL'],
              'provider_backed': os.environ['PROVIDER'] == 'true',
              'artifact': 'P2-V0.22.0.plan.json',
              'protected_metrics_required': True
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w8-s4-dspy-evidence
          path: |
            specs/compiled/P2-V0.22.0.plan.json
            specs/compiled/w8-s4-dspy-run-status.json
            /tmp/ollama.log
          if-no-files-found: error
          retention-days: 14
