name: P2-V0.23.25 Regression Alignment

on:
  push:
    branches:
      - fix/p2325-nested-source-and-transport-reconcile
    paths:
      - .github/workflows/fix-p2325-regression-test.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2325-nested-source-and-transport-reconcile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Align superseded regression contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/api/tests/test_code_patching.py')
          text = p.read_text()
          old = '''def test_new_text_file_can_be_created_only_under_existing_safe_parent(tmp_path):
              (tmp_path / "src").mkdir()
              after = "def ready():\\n    return True\\n"
              patch_text = unified("src/ready.py", "", after, creating=True)
              engine = TextPatchEngine()
          
              prepared = engine.prepare(
                  tmp_path,
                  SourcePatch("src/ready.py", EMPTY_SHA256, patch_text),
              )
              assert prepared.existed is False
              assert not (tmp_path / "src" / "ready.py").exists()
              engine.commit(tmp_path, prepared)
              assert (tmp_path / "src" / "ready.py").read_text(encoding="utf-8") == after
          
              missing_parent_patch = unified("missing/new.py", "", "x = 1\\n", creating=True)
              with pytest.raises(UnsafeTargetError):
                  engine.prepare(tmp_path, SourcePatch("missing/new.py", EMPTY_SHA256, missing_parent_patch))
          '''
          new = '''def test_new_text_file_can_create_bounded_missing_safe_parent_at_commit(tmp_path):
              (tmp_path / "src").mkdir()
              after = "def ready():\\n    return True\\n"
              patch_text = unified("src/ready.py", "", after, creating=True)
              engine = TextPatchEngine()
          
              prepared = engine.prepare(
                  tmp_path,
                  SourcePatch("src/ready.py", EMPTY_SHA256, patch_text),
              )
              assert prepared.existed is False
              assert not (tmp_path / "src" / "ready.py").exists()
              engine.commit(tmp_path, prepared)
              assert (tmp_path / "src" / "ready.py").read_text(encoding="utf-8") == after
          
              missing_parent_patch = unified("missing/new.py", "", "x = 1\\n", creating=True)
              missing = engine.prepare(tmp_path, SourcePatch("missing/new.py", EMPTY_SHA256, missing_parent_patch))
              assert missing.existed is False
              assert not (tmp_path / "missing").exists()
              engine.commit(tmp_path, missing)
              assert (tmp_path / "missing" / "new.py").read_text(encoding="utf-8") == "x = 1\\n"
          '''
          if old not in text:
              raise SystemExit('expected legacy test block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Run full API regression suite
        run: |
          pip install -e 'services/api[dev]'
          python -m pytest services/api/tests -q
          git diff --check
      - name: Commit aligned regression and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-p2325-regression-test.yml
          git config user.name 'Parallax Release Worker'
          git config user.email 'parallax-release-worker@users.noreply.github.com'
          git add services/api/tests/test_code_patching.py .github/workflows/fix-p2325-regression-test.yml
          git commit -m 'P2-V0.23.25 — align nested source regression contract'
          git push origin HEAD:fix/p2325-nested-source-and-transport-reconcile
