name: Apply P2-V0.23.5 PREPARE diagnostic projection

on:
  push:
    branches:
      - fix/p2-v0-23-5-prepare-diagnostic-projection
    paths:
      - .github/workflows/apply-p2-v0-23-5-prepare-diagnostic.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2-v0-23-5-prepare-diagnostic-projection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Project bounded PREPARE diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('services/api/parallax_api/code/agentic_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          old = '''    for key in ("invocation_digest", "stdout_digest", "stderr_digest"):\n        digest = _sha256_value(evidence.get(key))\n        if digest is not None:\n            diagnostic[key] = digest\n    content_digest = _sha256_value(validation.content_digest)\n'''
          new = '''    for key in (\n        "invocation_digest",\n        "stdout_digest",\n        "stderr_digest",\n        "dependency_stdout_digest",\n        "dependency_stderr_digest",\n    ):\n        digest = _sha256_value(evidence.get(key))\n        if digest is not None:\n            diagnostic[key] = digest\n\n    preparation_code = evidence.get("dependency_preparation_code")\n    if preparation_code in {\n        "NOT_REQUIRED",\n        "READY",\n        "EXECUTION_PROFILE_UNAVAILABLE",\n        "DEPENDENCY_PREPARATION_FAILED",\n        "VALIDATION_NETWORK_LOCK_FAILED",\n    }:\n        diagnostic["dependency_preparation_code"] = preparation_code\n    for key in (\n        "dependency_preparation_required",\n        "dependency_preparation_succeeded",\n        "validation_network_locked",\n    ):\n        value = evidence.get(key)\n        if isinstance(value, bool):\n            diagnostic[key] = value\n    for key in ("dependency_probe_exit_code", "dependency_prepare_exit_code"):\n        value = evidence.get(key)\n        if value is None or (isinstance(value, int) and not isinstance(value, bool)):\n            diagnostic[key] = value\n\n    content_digest = _sha256_value(validation.content_digest)\n'''
          if old not in text:
              raise SystemExit('runtime diagnostic anchor not found')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('services/api/tests/test_w6_candidate_validation_diagnostics.py')
          text = test.read_text(encoding='utf-8')
          old = '''                    "protected_success": False,\n                    "execution_snapshot_id": "snap_validation-test",\n'''
          new = '''                    "protected_success": False,\n                    "execution_snapshot_id": "snap_validation-test",\n                    "dependency_preparation_required": True,\n                    "dependency_preparation_succeeded": False,\n                    "dependency_preparation_code": "DEPENDENCY_PREPARATION_FAILED",\n                    "dependency_probe_exit_code": 0,\n                    "dependency_prepare_exit_code": 1,\n                    "dependency_stdout_digest": "f" * 64,\n                    "dependency_stderr_digest": "1" * 64,\n                    "validation_network_locked": True,\n                    "dependency_raw_output": "Bearer must-never-persist",\n'''
          if old not in text:
              raise SystemExit('test evidence anchor not found')
          text = text.replace(old, new, 1)
          old = '''    assert diagnostic["production_deployed"] is False\n    assert "stdout_excerpt" not in diagnostic\n    assert "stderr_excerpt" not in diagnostic\n'''
          new = '''    assert diagnostic["production_deployed"] is False\n    assert diagnostic["dependency_preparation_required"] is True\n    assert diagnostic["dependency_preparation_succeeded"] is False\n    assert diagnostic["dependency_preparation_code"] == "DEPENDENCY_PREPARATION_FAILED"\n    assert diagnostic["dependency_probe_exit_code"] == 0\n    assert diagnostic["dependency_prepare_exit_code"] == 1\n    assert diagnostic["dependency_stdout_digest"] == "f" * 64\n    assert diagnostic["dependency_stderr_digest"] == "1" * 64\n    assert diagnostic["validation_network_locked"] is True\n    assert "stdout_excerpt" not in diagnostic\n    assert "stderr_excerpt" not in diagnostic\n    assert "dependency_raw_output" not in diagnostic\n'''
          if old not in text:
              raise SystemExit('test assertion anchor not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q services/api/parallax_api
          pytest -q services/api/tests/test_w6_candidate_validation_diagnostics.py services/api/tests/test_candidate_dependency_preparation_failure.py services/api/tests/test_dependency_preparation.py
          git diff --check
      - name: Commit bounded diagnostic projection
        run: |
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/parallax_api/code/agentic_runtime.py services/api/tests/test_w6_candidate_validation_diagnostics.py
          git rm .github/workflows/apply-p2-v0-23-5-prepare-diagnostic.yml
          git diff --cached --check
          git commit -m "Persist bounded PREPARE failure diagnostics"
          git push origin HEAD:fix/p2-v0-23-5-prepare-diagnostic-projection
