name: Prepare P2-V0.23.17

on:
  push:
    branches:
      - security/p2317-admit-parallax-qa
    paths:
      - .github/workflows/p2317-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/p2317-admit-parallax-qa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch authoritative architecture
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Compile and validate P2-V0.23.17
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:0.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ""
          DSPY_LOCAL_DEVELOPMENT: "1"
        run: |
          python scripts/compile_spec.py specs/P2-V0.23.17.md
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.17.md
      - name: Commit prepared evidence
        run: |
          git config user.name "parallax-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ARCHITECTURE.md specs/compiled/P2-V0.23.17.plan.json
          if git diff --cached --quiet; then
            echo "Prepared evidence already present"
            exit 0
          fi
          git commit -m "Refresh P2-V0.23.17 architecture and DSPy plan"
          git push origin HEAD:security/p2317-admit-parallax-qa
