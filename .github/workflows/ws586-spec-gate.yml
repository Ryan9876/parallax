name: WS586 P2-V0.23.46 Spec Gate

on:
  push:
    branches:
      - ws/586-canonical-empty-tree-replay
    paths:
      - specs/P2-V0.23.46.md
      - .github/workflows/ws586-spec-gate.yml

permissions:
  contents: write

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPEC_PATH: specs/P2-V0.23.46.md
      DSPY_MODEL: ollama_chat/qwen2.5:0.5b
      DSPY_API_BASE: http://127.0.0.1:11434
      DSPY_API_KEY: ''
      DSPY_LOCAL_DEVELOPMENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/586-canonical-empty-tree-replay
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate specification structure
        run: python scripts/validate_spec.py --spec-only "$SPEC_PATH"
      - name: Install and start local DSPy model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen2.5:0.5b
      - name: Compile authentic DSPy plan
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Strictly validate compiled DSPy evidence
        run: python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
      - name: Persist compiled plan
        run: |
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add specs/compiled/P2-V0.23.46.plan.json
          if git diff --cached --quiet; then
            echo 'Compiled plan already persisted.'
          else
            git commit -m 'Compile P2-V0.23.46 DSPy plan'
            git push origin HEAD:ws/586-canonical-empty-tree-replay
          fi
