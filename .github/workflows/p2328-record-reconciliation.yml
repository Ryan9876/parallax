name: P2-V0.23.28 Record Reconciliation

on:
  push:
    branches:
      - record/p2328-deployment-verification
    paths:
      - scripts/tmp_p2328_record.py
      - .github/workflows/p2328-record-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record/p2328-deployment-verification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply authoritative current-state reconciliation
        run: python scripts/tmp_p2328_record.py
      - name: Validate record consistency
        run: |
          python scripts/validate_spec.py specs/P2-V0.23.28.md
          grep -q '^Version: 3.39$' ARCHITECTURE.md
          grep -q 'P2-V0.23.28 — plan-prefix IMPLEMENT convergence' CURRENT-STATE.md
          git diff --check
      - name: Commit reconciled record and remove temporary helpers
        run: |
          set -euo pipefail
          rm .github/workflows/p2328-record-reconciliation.yml scripts/tmp_p2328_record.py
          git config user.name 'Parallax Record Reconciler'
          git config user.email 'parallax-records@users.noreply.github.com'
          git add CURRENT-STATE.md .github/workflows/p2328-record-reconciliation.yml scripts/tmp_p2328_record.py
          git diff --cached --check
          git commit -m 'P2-V0.23.28 — record deployment-verified current state'
          git push origin HEAD:record/p2328-deployment-verification
