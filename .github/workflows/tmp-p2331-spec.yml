name: P2-V0.23.31 Spec-First Preparation

on:
  push:
    branches:
      - release/p2-v0.23.31
    paths:
      - .github/workflows/tmp-p2331-spec.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/p2-v0.23.31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate approved spec contract
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.23.31.md
      - id: model
        name: Select DSPy development model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'provider=true' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=openai/gpt-5.6-sol' >> "$GITHUB_ENV"
          else
            echo 'provider=false' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=ollama_chat/llama3.2:1b' >> "$GITHUB_ENV"
            echo 'DSPY_API_BASE=http://127.0.0.1:11434' >> "$GITHUB_ENV"
            echo 'DSPY_API_KEY=' >> "$GITHUB_ENV"
            echo 'DSPY_LOCAL_DEVELOPMENT=1' >> "$GITHUB_ENV"
          fi
      - name: Install local DSPy model when needed
        if: steps.model.outputs.provider != 'true'
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b
      - name: Compile with DSPy SpecCritic and SpecCompiler
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py specs/P2-V0.23.31.md
      - name: Verify protected DSPy evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.31.md
      - name: Commit protected plan and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'Parallax Spec Compiler'
          git config user.email 'parallax-spec@users.noreply.github.com'
          git add specs/compiled/P2-V0.23.31.plan.json
          git rm .github/workflows/tmp-p2331-spec.yml
          git commit -m 'P2-V0.23.31 — commit protected DSPy plan'
          git push origin HEAD:release/p2-v0.23.31
