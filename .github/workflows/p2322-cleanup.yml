name: P2-V0.23.22 Cleanup Generated Artifacts

on:
  push:
    branches:
      - ws/p2322-request-bounded-autonomy
    paths:
      - .github/workflows/p2322-cleanup.yml
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/p2322-request-bounded-autonomy
          fetch-depth: 0
      - name: Remove generated validation/install artifacts
        run: |
          set -euo pipefail
          rm -rf \
            apps/client/.tmp-state \
            apps/client/.tmp-observability \
            apps/client/.tmp-guidance \
            services/api/parallax_api.egg-info
          rm -f apps/client/package-lock.json
          rm .github/workflows/p2322-cleanup.yml
      - name: Verify only cleanup changes are pending
        run: |
          set -euo pipefail
          test ! -e apps/client/.tmp-state
          test ! -e apps/client/.tmp-observability
          test ! -e apps/client/.tmp-guidance
          test ! -e services/api/parallax_api.egg-info
          test ! -e apps/client/package-lock.json
          test ! -e .github/workflows/p2322-cleanup.yml
          git status --short
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Worker'
          git config user.email 'parallax-release-worker@users.noreply.github.com'
          git add -A
          git commit -m 'P2-V0.23.22 — remove generated validation artifacts'
          git push origin HEAD:ws/p2322-request-bounded-autonomy
