name: Temporary Vercel Connect Preview Canary

on:
  push:
    branches:
      - hotfix/vercel-connect-connector-encoding

permissions:
  contents: read
  id-token: write

jobs:
  connect-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub Actions OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Wait for Preview and exercise real Connect chain
        env:
          TRUSTED_OIDC: ${{ steps.oidc.outputs.token }}
          PREVIEW_URL: https://parallax-api-git-hotfix-vercel-connect-connector-encoding-lew7.vercel.app/__connect_probe
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            code="$(curl -sS -o probe.json -w '%{http_code}' \
              -H "x-vercel-trusted-oidc-idp-token: ${TRUSTED_OIDC}" \
              "${PREVIEW_URL}" || true)"
            if [ "${code}" = "200" ]; then
              python - <<'PY'
          import json
          with open('probe.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload.get('ready') is True, payload
          assert payload.get('repository') == 'github:Ryan9876/parallax', payload
          assert payload.get('default_branch') == 'main', payload
          head = payload.get('head_revision')
          assert isinstance(head, str) and len(head) == 40, payload
          print('real Vercel OIDC -> Connect -> GitHub repository resolution: PASS')
          PY
              exit 0
            fi
            echo "Preview canary attempt ${attempt}: HTTP ${code}"
            sleep 10
          done
          echo 'Preview Connect canary did not reach a successful provider-chain response.' >&2
          cat probe.json >&2 || true
          exit 1
