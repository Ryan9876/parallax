name: W8 S2 DSPy Bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'specs/P2-V0.21.1.md'
      - '.github/workflows/w8-s2-dspy-bootstrap.yml'

concurrency:
  group: w8-s2-dspy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate specification contract
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.21.1.md
      - id: model
        name: Select provider-backed or local DSPy model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi
      - name: Install local DSPy development LM
        if: steps.model.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Compile exact W8 S2 specification
        timeout-minutes: 8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py specs/P2-V0.21.1.md
      - name: Verify protected compiled-plan evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.21.1.md
      - name: Print generated plan for governed capture
        run: |
          echo 'W8_S2_PLAN_BEGIN'
          cat specs/compiled/P2-V0.21.1.plan.json
          echo 'W8_S2_PLAN_END'
