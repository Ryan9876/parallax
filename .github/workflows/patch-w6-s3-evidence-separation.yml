name: Patch Wave 6 S3 evidence separation

on:
  push:
    branches:
      - hotfix/w6-s3-evidence-separation

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/w6-s3-evidence-separation
          fetch-depth: 0
      - name: Apply correction
        run: python scripts/patch_w6_s3_evidence_separation.py
      - name: Install test dependencies
        run: python -m pip install -e 'services/api[dev]'
      - name: Run focused regressions
        run: python -m pytest -q services/api/tests/test_w6_s3_evidence_separation.py services/api/tests/test_w6_candidate_validation_diagnostics.py
      - name: Self-remove and commit durable diff
        run: |
          git diff --check
          git rm .github/workflows/patch-w6-s3-evidence-separation.yml scripts/patch_w6_s3_evidence_separation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/parallax_api/code/agentic_runtime.py services/api/tests/test_w6_s3_evidence_separation.py
          git diff --cached --check
          git commit -m 'fix(w6): separate protected S3 evaluation evidence'
          git push origin HEAD:hotfix/w6-s3-evidence-separation
