name: Temporary P2-V0.23.15 current-state reconcile

on:
  push:
    branches:
      - docs/p2315-production-acceptance

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p2315-production-acceptance
      - name: Reconcile authoritative current state
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          path = Path('CURRENT-STATE.md')
          text = path.read_text(encoding='utf-8')

          status = (
              'Status: **WAVES 1–8 DEPLOYMENT-VERIFIED / PYTHON AND .NET SOURCE-ONLY FULL EXPERIENCE '
              'PRODUCTION-ACCEPTED / P2-V0.23.10 LUNA-FIRST HOSTED SELECTION PRODUCTION-ACCEPTED / '
              'P2-V0.23.13 FAILED-IMPLEMENT HUMAN REPLAN PRODUCTION-ACCEPTED / P2-V0.23.14 RECOVERED-WORKER '
              'PLAN REBIND PRODUCTION-ACCEPTED / P2-V0.23.15 STRUCTURED-OUTPUT ROUTING CLASSIFICATION '
              'PRODUCTION-ACCEPTED / CURRENT-SOURCE OT TIME REPLAY PASSED TO REVIEW**'
          )
          text, count = re.subn(r'^Status: \*\*.*\*\*$', status, text, count=1, flags=re.MULTILINE)
          assert count == 1, 'top-level Status line not found'

          heading = '## P2-V0.23.15 — Structured-output validation classification — PRODUCTION-ACCEPTED'
          assert heading not in text, 'P2-V0.23.15 section already present'
          marker = '## Production components'
          assert marker in text, 'Production components marker missing'
          section_b64 = ''
          section = base64.b64decode(section_b64).decode('utf-8')
          text = text.replace(marker, section + marker, 1)

          api_start = text.index('### API')
          api_end = text.index('\n## ', api_start)
          api = text[api_start:api_end]
          old_source = '- source: `c6c7b80e912f4f68efe43b8fa83ee30b8c18ee20`;'
          old_deployment = '- production deployment: `dpl_2kQpJfG9hk5gppPySMBbgT3Zi4Nz`;'
          old_architecture = '- architecture: `ARCHITECTURE.md` v3.27.'
          assert old_source in api, 'old API source marker missing'
          assert old_deployment in api, 'old API deployment marker missing'
          assert old_architecture in api, 'old API architecture marker missing'
          api = api.replace(old_source, '- source: `04b1893e3a520202a77614fd1ff4ab00dac0ab1c`;', 1)
          api = api.replace(old_deployment, '- production deployment: `dpl_EngoShekvZLYDC3mfdyzDwP8rUpx`;', 1)
          api = api.replace(old_architecture, '- architecture: `ARCHITECTURE.md` v3.28.', 1)
          text = text[:api_start] + api + text[api_end:]

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit authoritative record and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "parallax-record-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/tmp-p2315-current-state.yml
          git add CURRENT-STATE.md
          git diff --cached --check
          git commit -m "Record P2-V0.23.15 production acceptance"
          git push origin HEAD:docs/p2315-production-acceptance
