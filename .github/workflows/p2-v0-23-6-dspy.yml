name: P2-V0.23.6 DSPy Qualification

on:
  push:
    branches:
      - work/w8-s2-profile-snapshots
    paths:
      - specs/P2-V0.23.6.md
      - .github/workflows/p2-v0-23-6-dspy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p2-v0-23-6-dspy
  cancel-in-progress: true

jobs:
  qualify-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate protected spec contract
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.23.6.md
      - name: Install local DSPy qualification model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:1.5b
      - name: Run authentic DSPy SpecCritic and SpecCompiler
        timeout-minutes: 8
        env:
          DSPY_MODEL: ollama_chat/qwen2.5-coder:1.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: python scripts/compile_spec.py specs/P2-V0.23.6.md
      - name: Validate compiled protected plan
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.6.md
      - name: Commit exact qualified DSPy plan
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/compiled/P2-V0.23.6.plan.json
          git diff --cached --quiet && exit 0
          git commit -m "Compile protected P2-V0.23.6 DSPy plan"
          git push origin HEAD:work/w8-s2-profile-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-v0-23-6-dspy-evidence
          path: |
            specs/compiled/P2-V0.23.6.plan.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
