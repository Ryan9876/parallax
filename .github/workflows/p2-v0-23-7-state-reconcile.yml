name: P2-V0.23.7 State Reconcile

on:
  push:
    branches:
      - qa/restore-production-replay
    paths:
      - .github/workflows/p2-v0-23-7-state-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/restore-production-replay
          fetch-depth: 0
      - name: Reconcile authoritative current state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('CURRENT-STATE.md')
          text = path.read_text(encoding='utf-8')

          old_status = 'Status: **WAVES 1–8 DEPLOYMENT-VERIFIED / PYTHON AND .NET SOURCE-ONLY FULL EXPERIENCE ACCEPTED / W9-S1 CONTROLLED REFERENCE OBSERVATION COMPLETE WITH GREENFIELD INITIALIZATION AUTHORITY STILL OPEN / W9-S2 API PRODUCTION-DEPLOYMENT-VERIFIED / SAFE-DELETION FINAL AUTHENTICATED DESTRUCTIVE SMOKE OPEN**'
          new_status = 'Status: **WAVES 1–8 DEPLOYMENT-VERIFIED / PYTHON AND .NET SOURCE-ONLY FULL EXPERIENCE ACCEPTED / W9-S1 P2-V0.23.7 GREENFIELD AUTHORITY IMPLEMENTED + API DEPLOYMENT-VERIFIED / CANONICAL GREENFIELD ACCEPTANCE PENDING FRESH APPROVED EMPTY TARGET / W9-S2 API PRODUCTION-DEPLOYMENT-VERIFIED / SAFE-DELETION FINAL AUTHENTICATED DESTRUCTIVE SMOKE OPEN**'
          if old_status not in text:
              raise SystemExit('expected status baseline not found')
          text = text.replace(old_status, new_status, 1)

          old_para = 'The separate W9-S1 empty-greenfield initialization boundary remains open. A repository with no public commit has no source revision for the public read-only transport to bootstrap, so canonical greenfield initialization still needs exact explicit repository mutation authority or another governed initialization mechanism.'
          new_para = ('W9-S1 empty-greenfield initialization authority is now implemented and production-deployment-verified under P2-V0.23.7 / Architecture v3.21. Parallax can positively inspect an exact credentialed repository as empty, create an explicit zero-file greenfield root lineage, preserve the ordinary protected lifecycle, and at REVIEW use a separate fixed `repository.initialize-empty` capability before ordinary bounded publication. The canonical Decision Ledger end-to-end acceptance is not yet complete because its fixed disposable repository was initialized by earlier Parallax QA fixture activity before this release; v3.21 did not mutate that target.')
          if old_para not in text:
              raise SystemExit('expected greenfield baseline paragraph not found')
          text = text.replace(old_para, new_para, 1)

          old_api = '''- source: `e204d69ed0d6a9a69d68374ad63e8a1dbd630813`;\n- production deployment: `dpl_8e87ZdYGACUvf4YvivsSWwomDE5n`;\n- Vercel project: `parallax-api` / `prj_4lhve1AXZntfauaGHvkuaGWC6KJX`;\n- state: `READY`;\n- canonical production alias: `parallax-api-tan.vercel.app`;\n- architecture: `ARCHITECTURE.md` v3.20.'''
          new_api = '''- source: `2619aada4d3fd732589c6489a99ebe95dcc0d01d`;\n- production deployment: `dpl_8LBreMU3LGxUR8RWW8LfSCJRGxxx`;\n- Vercel project: `parallax-api` / `prj_4lhve1AXZntfauaGHvkuaGWC6KJX`;\n- state: `READY`;\n- canonical production alias: `parallax-api-tan.vercel.app`;\n- architecture: `ARCHITECTURE.md` v3.21.'''
          if old_api not in text:
              raise SystemExit('expected API deployment block not found')
          text = text.replace(old_api, new_api, 1)

          marker = '## Wave 9 S2 — Governed skill intake and capability catalog\n'
          if marker not in text:
              raise SystemExit('Wave 9 S2 marker not found')
          release = '''## P2-V0.23.7 — Empty-greenfield repository authority — DEPLOYMENT-VERIFIED / CANONICAL TARGET REPLACEMENT REQUIRED\n\nWorkstream follow-up: #442.\n\nArchitecture: `ARCHITECTURE.md` v3.21.\n\nRelease evidence:\n\n- release PR: #443;\n- exact green release head: `a36a81d379e8f9b696f0879afa7126c31761a0e8`;\n- application release merge: `2619aada4d3fd732589c6489a99ebe95dcc0d01d`;\n- production API deployment: `dpl_8LBreMU3LGxUR8RWW8LfSCJRGxxx`;\n- deployment state: `READY`;\n- exact deployment source: `2619aada4d3fd732589c6489a99ebe95dcc0d01d`;\n- production provider/storage preflight: PASS;\n- exact-repository scoped delivery-token preflight: PASS;\n- projected-source, private Blob, lineage composition and agentic-runtime preflights: PASS;\n- exact-head specification, API regression, Bounded Autonomy, client/browser/Skia, DSPy release compilation and protected-promotion gates: PASS.\n\nDurable behavior now supports a positively authenticated empty GitHub repository without manufacturing source or widening authority. Empty classification requires exact credentialed inspection; ambiguous/provider failures remain fail-closed. A zero-file `greenfield` root is explicit durable lineage, and accepted implementation must become non-empty before validation. Missing repository authorization is surfaced as structured `REPOSITORY_AUTHORIZATION_REQUIRED` with same-run retry. Empty-baseline mutation is REVIEW-only, fixed, idempotent and isolated behind `repository.initialize-empty`; normal GitHub delivery, Preview ceiling and human REVIEW boundary remain unchanged.\n\n### Canonical Decision Ledger acceptance target was consumed before v3.21\n\nThe fixed target `Ryan9876/sickbeard` is no longer an empty repository. Its root commit `b7e8399724e38ee60b3380aa02ecb079a43acee3` was created at `2026-08-29T20:46:01Z` with message `Initialize minimal Parallax QA source fixture`, followed by four serial commits titled `Complete minimal Parallax QA source fixture`. Those commits predate the v3.21 production deployment by roughly nineteen minutes and contain QA-only fixture content. They are therefore not evidence that the v3.21 greenfield initializer ran.\n\nAfter v3.21 became READY, bounded QA replay `33285377567` / job `99187551677` obtained the existing approved `parallax://qa-production` OIDC identity, but `scripts/w9_s1_reference_trial.sh` correctly stopped at its preflight with `Decision Ledger target is no longer greenfield; refusing to start trial.` No new Project/run or v3.21 repository mutation was created by that attempt.\n\nThe repository history is preserved rather than destructively rewritten. Canonical AC-27 remains pending a fresh user-approved truly empty repository with exact GitHub App/Vercel Connect coverage and the required Preview target readiness. This is an acceptance-fixture prerequisite, not an unverified runtime implementation claim.\n\n'''
          text = text.replace(marker, release + marker, 1)

          old_other = '- #406 — code-side greenfield repository-authority remediation is deployment-verified; canonical empty-repository initialization authority remains unresolved for W9-S1;'
          new_other = '- #442 — P2-V0.23.7 empty-greenfield authority is implementation- and deployment-verified; canonical Decision Ledger acceptance remains pending a fresh approved empty target because the prior disposable target was consumed by legacy QA fixture activity;'
          if old_other in text:
              text = text.replace(old_other, new_other, 1)

          old_auth = '''`CURRENT-STATE.md` was updated after the deployment-verified P2-V0.23.6 release and successful authenticated W8-S2 OT Time production acceptance. It now records the exact runtime deployment, qualified snapshots, canonical workflow, Project, Engineering Run, lifecycle state/revision and source-only ZIP handoff evidence and marks Wave 8 complete.\n\n`ARCHITECTURE.md` remains authoritative at v3.20. It already records the durable profile-qualified snapshot contract, public-source/deployment separation, bounded PREPARE behavior, source-only handoff, immutable lineage and REVIEW ceiling proven by this acceptance; no further architecture revision is required.'''
          new_auth = '''`CURRENT-STATE.md` was updated after the deployment-verified P2-V0.23.7 release. It records the exact v3.21 runtime source/deployment and preflight evidence, distinguishes implementation/deployment verification from the still-pending canonical greenfield benchmark acceptance, and records that the fixed Decision Ledger target was consumed by legacy QA fixture activity before v3.21.\n\n`ARCHITECTURE.md` remains authoritative at v3.21. PR #443 already records the durable positive-empty inspection, zero-file greenfield lineage, structured authorization recovery and isolated REVIEW-only empty-baseline mutation contract; no additional architecture revision is required for this state reconciliation.'''
          if old_auth not in text:
              raise SystemExit('expected authoritative record block not found')
          text = text.replace(old_auth, new_auth, 1)

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/p2-v0-23-7-state-reconcile.yml
          git config user.name parallax-state-bot
          git config user.email actions@users.noreply.github.com
          git add CURRENT-STATE.md .github/workflows/p2-v0-23-7-state-reconcile.yml
          git commit -m "Record P2-V0.23.7 deployment and W9 target state"
          git push origin HEAD:qa/restore-production-replay
