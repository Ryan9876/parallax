name: Compile P2-V0.23.6

on:
  push:
    branches:
      - p2/profile-specific-execution-environments
    paths:
      - .github/workflows/compile-p2-v0-23-6.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/profile-specific-execution-environments
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Validate protected spec contract before compilation
        run: python scripts/validate_spec.py specs/P2-V0.23.6.md --spec-only
      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama-p2-v0-23-6.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen2.5-coder:1.5b
      - name: Run authentic DSPy critic and compiler
        env:
          DSPY_MODEL: ollama_chat/qwen2.5-coder:1.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: python scripts/compile_spec.py specs/P2-V0.23.6.md
      - name: Require DSPy evidence
        env:
          DSPY_MODEL: ollama_chat/qwen2.5-coder:1.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: python scripts/validate_spec.py specs/P2-V0.23.6.md --require-dspy
      - name: Commit compiled plan and remove temporary compiler
        run: |
          test -s specs/compiled/P2-V0.23.6.plan.json
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add specs/compiled/P2-V0.23.6.plan.json
          git rm .github/workflows/compile-p2-v0-23-6.yml
          git diff --cached --check
          git commit -m "Compile P2-V0.23.6 with DSPy"
          git push origin HEAD:p2/profile-specific-execution-environments
