name: P2-V0.23.14 Architecture Reconcile

on:
  push:
    branches:
      - fix/p2314-plan-aware-worker-checkpoint
    paths:
      - .github/workflows/p2314-architecture.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2314-plan-aware-worker-checkpoint
          fetch-depth: 0
      - name: Update authoritative architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          if 'Version: 3.26' not in text:
              raise SystemExit('expected architecture version 3.26 not found')
          text = text.replace('Version: 3.26', 'Version: 3.27', 1)
          old = 'Architecture v3.26 adds human-authorized PLAN refresh for Project-bound agentic retries that begin from FAILED IMPLEMENT, so current server-owned orchestration and routing policy is re-established before worker reassignment.'
          new = 'Architecture v3.27 completes human-authorized PLAN refresh by allowing the recovered durable worker to bind its next accepted checkpoint to exactly the freshly persisted protected PLAN; default worker PLAN-reference immutability remains authoritative. Architecture v3.26 remains the failed-IMPLEMENT PLAN-refresh foundation, so current server-owned orchestration and routing policy is re-established before worker reassignment.'
          if text.count(old) != 1:
              raise SystemExit('version relationship marker drifted')
          text = text.replace(old, new, 1)
          marker = '## Human-authorized terminal-worker re-arm\n'
          if text.count(marker) != 1:
              raise SystemExit('worker architecture insertion marker drifted')
          section = '''## Human-authorized refreshed-PLAN worker binding\n\nArchitecture v3.27 preserves worker checkpoint `plan_ref` immutability as the default rule and adds one narrowly derived exception required to make the v3.26 explicit failed-IMPLEMENT PLAN refresh internally coherent. A historical worker checkpoint is never rewritten merely because current orchestration policy changed.\n\nA changed worker `plan_ref` is admissible only when authoritative Engineering Run attempt history proves the latest complete refresh cycle: a persisted `PLAN / RESUMED` control attempt contains server-authored `plan_refresh_authorized=true`, and a later protected `PLAN / PASSED` attempt contains a valid server-owned `team_plan_id`. The incoming checkpoint must equal exactly `agentic-plan:<team_plan_id>` from that successful refreshed PLAN. Browser/request parameters, model output, repository content, worker-local flags, and exception strings cannot create or select this authority.\n\nA newer refresh control immediately invalidates any prior derived replacement authority until a later protected PLAN passes. A missing, false, malformed, incomplete, arbitrary, or historical PLAN reference fails closed. Engineering Run PLAN attempts are consumed in their durable ordered attempt relationship, so refresh-cycle interpretation is deterministic.\n\nThe first accepted checkpoint under the refreshed PLAN persists that new `plan_ref`; ordinary checkpoint equality then becomes authoritative again. Another change requires another complete explicit human-authorized refresh cycle. Historical PLAN attempts, run events, worker events, checkpoint revisions, source-lineage evidence, and lease-generation history remain preserved.\n\nThis rule grants no additional lease, reassignment, retry, source mutation, source-lineage acceptance, Git/provider, deployment, approval, or REVIEW authority. Existing Work Specification binding, source-lineage equality, bounded worker recovery, candidate recovery, model-routing, validation, and REVIEW ceilings remain unchanged. No database migration or public API field is introduced.\n\n'''
          text = text.replace(marker, section + marker, 1)
          path.write_text(text)
          PY
      - name: Commit architecture record
        run: |
          git config user.name "parallax-qa-compiler"
          git config user.email "actions@users.noreply.github.com"
          git add ARCHITECTURE.md
          git diff --cached --check
          git commit -m "P2-V0.23.14: record architecture v3.27"
          git push origin HEAD:fix/p2314-plan-aware-worker-checkpoint
