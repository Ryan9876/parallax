name: WS 580 P2-V0.23.43 DSPy Gate

on:
  push:
    branches:
      - 'p2/580-lineage-scoped-publication'
    paths:
      - 'specs/P2-V0.23.43.md'
      - '.github/workflows/ws-580-spec-gate.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPEC_PATH: specs/P2-V0.23.43.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/580-lineage-scoped-publication
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Validate exact specification contract before compile
        run: python scripts/validate_spec.py --spec-only "$SPEC_PATH"
      - id: credentials
        name: Select authentic DSPy model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'provider=true' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=openai/gpt-5.6-sol' >> "$GITHUB_ENV"
          else
            echo 'provider=false' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=ollama_chat/llama3.2:1b' >> "$GITHUB_ENV"
            echo 'DSPY_API_BASE=http://127.0.0.1:11434' >> "$GITHUB_ENV"
            echo 'DSPY_API_KEY=' >> "$GITHUB_ENV"
          fi
      - name: Install local Ollama development LM
        if: steps.credentials.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b
      - name: Compile exact spec with authentic DSPy critic and compiler
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Validate protected compiled plan
        run: python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
      - name: Persist exact compiled plan on workstream branch
        run: |
          set -euo pipefail
          PLAN='specs/compiled/P2-V0.23.43.plan.json'
          test -f "$PLAN"
          git config user.name 'Parallax Workstream Gate'
          git config user.email 'parallax-workstream@users.noreply.github.com'
          git add "$PLAN"
          if git diff --cached --quiet; then
            echo 'Compiled plan already matches exact spec.'
            exit 0
          fi
          git commit -m 'Compile P2-V0.23.43 with authentic DSPy gate'
          git push origin HEAD:p2/580-lineage-scoped-publication
