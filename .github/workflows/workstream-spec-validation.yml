name: Parallax Workstream Spec Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'specs/**'
      - 'scripts/compile_spec.py'
      - 'scripts/validate_spec.py'
      - 'services/api/parallax_api/intelligence/**'
      - '.github/workflows/workstream-spec-validation.yml'
  push:
    branches: [main]
    paths:
      - 'specs/**'
      - 'scripts/compile_spec.py'
      - 'scripts/validate_spec.py'
      - 'services/api/parallax_api/intelligence/**'
      - '.github/workflows/workstream-spec-validation.yml'
  workflow_dispatch:

concurrency:
  group: parallax-workstream-specs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Changed specification contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      count: ${{ steps.changed.outputs.count }}
      paths: ${{ steps.changed.outputs.paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'

      - id: changed
        name: Select changed Parallax specifications
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ZERO_SHA='0000000000000000000000000000000000000000'
          BASE=''

          if [ "$EVENT_NAME" = 'pull_request' ]; then
            BASE="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = 'push' ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "$ZERO_SHA" ]; then
            BASE="$PUSH_BEFORE_SHA"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -n "$BASE" ]; then
            git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1 || true
            DELETED="$(git diff --name-only --diff-filter=D "$BASE" "$GITHUB_SHA" -- 'specs/P2-*.md' | sort -u)"
            if [ -n "$DELETED" ]; then
              echo 'FAIL: versioned Parallax specifications may not be deleted by a workstream:'
              printf '%s\n' "$DELETED"
              exit 1
            fi
            SPECS="$(git diff --name-only --diff-filter=AMR "$BASE" "$GITHUB_SHA" -- 'specs/P2-*.md' | sort -u)"
          else
            SPECS=''
          fi

          COUNT="$(printf '%s\n' "$SPECS" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo 'paths<<EOF'
            printf '%s\n' "$SPECS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo 'No changed Parallax specifications in this event.'
          else
            echo "Changed Parallax specifications ($COUNT):"
            printf '%s\n' "$SPECS"
          fi

      - name: Validate changed specification contracts
        env:
          CHANGED_SPECS: ${{ steps.changed.outputs.paths }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          changed = [Path(line) for line in os.environ.get('CHANGED_SPECS', '').splitlines() if line]
          if not changed:
              print('PASS: no changed Parallax specifications require contract validation')
              raise SystemExit(0)

          pattern = re.compile(r'^P2-V\d+\.\d+\.\d+\.md$')
          invalid = [path for path in changed if not pattern.fullmatch(path.name)]
          if invalid:
              print('FAIL: changed Parallax specifications must use semantic P2-Vx.y.z.md identities:')
              for path in invalid:
                  print(f'  - {path}')
              raise SystemExit(1)

          for path in changed:
              if not path.exists():
                  print(f'FAIL: changed specification is missing from the candidate tree: {path}')
                  raise SystemExit(1)
              subprocess.run(
                  [sys.executable, 'scripts/validate_spec.py', '--spec-only', str(path)],
                  check=True,
              )

          print(f'PASS: validated {len(changed)} changed Parallax specification contract(s)')
          PY

  changed-spec-dspy:
    name: Changed specification DSPy gate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'

      - id: model
        name: Select provider-backed or local DSPy model
        if: needs.contracts.outputs.count != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'provider=true' >> "$GITHUB_OUTPUT"
            echo 'name=openai/gpt-5.6-sol' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=openai/gpt-5.6-sol' >> "$GITHUB_ENV"
          else
            echo 'provider=false' >> "$GITHUB_OUTPUT"
            echo 'name=ollama_chat/qwen2.5:0.5b' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=ollama_chat/qwen2.5:0.5b' >> "$GITHUB_ENV"
            echo 'DSPY_API_BASE=http://127.0.0.1:11434' >> "$GITHUB_ENV"
            echo 'DSPY_API_KEY=' >> "$GITHUB_ENV"
            echo 'DSPY_LOCAL_DEVELOPMENT=1' >> "$GITHUB_ENV"
          fi

      - name: Install local DSPy development LM
        if: needs.contracts.outputs.count != '0' && steps.model.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/workstream-ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b

      - name: Compile and protect changed specification contracts
        if: needs.contracts.outputs.count != '0'
        env:
          CHANGED_SPECS: ${{ needs.contracts.outputs.paths }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            echo "Compiling $spec"
            python scripts/compile_spec.py "$spec"
            python scripts/validate_spec.py --require-dspy "$spec"
          done <<< "$CHANGED_SPECS"

      - name: Record changed-spec DSPy status
        if: always()
        env:
          CHANGED_SPECS: ${{ needs.contracts.outputs.paths }}
          CHANGED_COUNT: ${{ needs.contracts.outputs.count }}
          PROVIDER: ${{ steps.model.outputs.provider }}
          MODEL: ${{ steps.model.outputs.name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          specs = [line for line in os.environ.get('CHANGED_SPECS', '').splitlines() if line]
          status = {
              'executed': bool(specs),
              'changed_count': int(os.environ.get('CHANGED_COUNT') or 0),
              'specifications': specs,
              'spec_compiler_executed': bool(specs),
              'spec_critic_executed': bool(specs),
              'model': os.environ.get('MODEL') or None,
              'provider_backed': os.environ.get('PROVIDER') == 'true',
              'protected_metrics_required': True,
          }
          target = Path('specs/compiled/workstream-dspy-run-status.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workstream-spec-evidence
          path: |
            specs/compiled/*.plan.json
            specs/compiled/workstream-dspy-run-status.json
            /tmp/workstream-ollama.log
          if-no-files-found: warn
          retention-days: 14
