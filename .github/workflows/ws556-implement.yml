name: WS556 Exact Vercel Repository Discovery Implementation

on:
  push:
    branches:
      - 'ws/556-vercel-repository-discovery'
    paths:
      - '.github/workflows/ws556-implement.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply exact-repository discovery implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          code_path = Path('services/api/parallax_api/code/delivery_readiness.py')
          code = code_path.read_text(encoding='utf-8')
          if '_MAX_PROJECTS = 100' not in code:
              raise SystemExit('expected _MAX_PROJECTS baseline not found')
          code = code.replace('_MAX_PROJECTS = 100', '_MAX_REPOSITORY_PROJECTS = 2', 1)

          replacement = '''    def _matches(self, *, github_repo_id: int) -> list[dict[str, object]]:
              response = self._send(
                  "GET",
                  "/v9/projects",
                  params={"repoId": github_repo_id, "limit": _MAX_REPOSITORY_PROJECTS},
              )
              self._raise_status(response)
              payload = self._payload(response)
              projects = payload.get("projects")
              if not isinstance(projects, list):
                  raise ProviderClientError("PROVIDER_INVALID_RESPONSE")
              pagination = payload.get("pagination")
              if not isinstance(pagination, dict) or "next" not in pagination:
                  raise ProviderClientError("PROVIDER_INVALID_RESPONSE")

              matches: list[dict[str, object]] = []
              for item in projects:
                  if not isinstance(item, dict):
                      raise ProviderClientError("PROVIDER_INVALID_RESPONSE")
                  project_id = item.get("id")
                  result_identity = project_id if isinstance(project_id, str) and project_id else None
                  link = item.get("link")
                  if not isinstance(link, dict) or link.get("type") != "github":
                      raise ProviderClientError(
                          "TARGET_REPOSITORY_UNVERIFIED",
                          result_identity=result_identity,
                      )
                  if self._repo_id(link.get("repoId")) != github_repo_id:
                      raise ProviderClientError(
                          "TARGET_REPOSITORY_MISMATCH",
                          result_identity=result_identity,
                      )
                  matches.append(item)

              # Two exact candidates already prove ambiguity. A continuation
              # cursor cannot make that identity safer or authorize selection.
              if len(matches) < _MAX_REPOSITORY_PROJECTS and pagination.get("next") not in {None, 0, ""}:
                  raise ProviderClientError("TARGET_DISCOVERY_UNBOUNDED")
              return matches

'''
          pattern = re.compile(
              r'    def _matches\(self, \*, github_repo_id: int\) -> list\[dict\[str, object\]\]:\n.*?(?=    def _assert_no_production_deployment)',
              flags=re.DOTALL,
          )
          code, count = pattern.subn(replacement, code, count=1)
          if count != 1:
              raise SystemExit(f'expected one _matches replacement, got {count}')
          code_path.write_text(code, encoding='utf-8')

          tests_path = Path('services/api/tests/test_w8_delivery_readiness.py')
          tests = tests_path.read_text(encoding='utf-8')
          updated_test = '''def test_readiness_reuses_only_exact_numeric_github_repository_match():
              requests: list[tuple[str, str]] = []

              def handler(request: httpx.Request) -> httpx.Response:
                  requests.append((request.method, request.url.path))
                  if request.url.path == "/v9/projects":
                      assert request.url.params.get("teamId") == TEAM_ID
                      assert request.url.params.get("repoId") == "424242"
                      assert request.url.params.get("limit") == "2"
                      return httpx.Response(
                          200,
                          json={
                              "projects": [_project_payload()],
                              "pagination": {"next": None},
                          },
                      )
                  if request.url.path == "/v9/projects/prj_ot_time":
                      return httpx.Response(200, json=_project_payload())
                  raise AssertionError(f"unexpected request: {request.method} {request.url}")

              client = VercelProjectReadinessRestClient(
                  _vercel_credentials(),
                  credential_ref=READINESS_REF,
                  team_id=TEAM_ID,
                  transport=httpx.MockTransport(handler),
              )
              result = client.ensure(
                  repository_ref=REPOSITORY_REF,
                  github_repo_id=424242,
                  production_branch="main",
                  project_name="ot-time-px-11111111",
              )

              assert result.created is False
              assert result.target.project_id == "prj_ot_time"
              assert result.target.github_repo_id == 424242
              assert requests == [("GET", "/v9/projects"), ("GET", "/v9/projects/prj_ot_time")]


'''
          test_pattern = re.compile(
              r'def test_readiness_reuses_only_exact_numeric_github_repository_match\(\):\n.*?(?=def test_missing_target_is_created_once_verified_and_reused_without_production_mutation)',
              flags=re.DOTALL,
          )
          tests, count = test_pattern.subn(updated_test, tests, count=1)
          if count != 1:
              raise SystemExit(f'expected one readiness test replacement, got {count}')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          cat > services/api/tests/test_p2_v02336_vercel_repository_discovery.py <<'PY'
          from __future__ import annotations

          import json

          import httpx
          import pytest

          from parallax_api.code.delivery_readiness import VercelProjectReadinessRestClient
          from parallax_api.code.production_delivery import EnvironmentVercelCredentialProvider
          from parallax_api.tools.providers.common import ProviderClientError


          REPOSITORY_REF = "github:Ryan9876/parallax-qa1"
          REPOSITORY_ID = 987654321
          TEAM_ID = "team_JgE8AWWz36uzRbeR6V6EWg9k"
          READINESS_REF = f"readiness:{TEAM_ID}"
          TOKEN = "vercel-readiness-test-token"
          PROJECT_NAME = "parallax-qa1-px-11111111"


          def _credentials() -> EnvironmentVercelCredentialProvider:
              return EnvironmentVercelCredentialProvider(
                  TOKEN,
                  allowed_targets=frozenset({READINESS_REF}),
              )


          def _project(project_id: str = "prj_qa1", *, repo_id: int = REPOSITORY_ID):
              return {
                  "id": project_id,
                  "name": PROJECT_NAME,
                  "accountId": TEAM_ID,
                  "link": {"type": "github", "repoId": repo_id},
              }


          def _client(handler) -> VercelProjectReadinessRestClient:
              return VercelProjectReadinessRestClient(
                  _credentials(),
                  credential_ref=READINESS_REF,
                  team_id=TEAM_ID,
                  transport=httpx.MockTransport(handler),
              )


          def _assert_exact_query(request: httpx.Request) -> None:
              assert request.method == "GET"
              assert request.url.path == "/v9/projects"
              assert request.url.params.get("teamId") == TEAM_ID
              assert request.url.params.get("repoId") == str(REPOSITORY_ID)
              assert request.url.params.get("limit") == "2"


          def _ensure(client: VercelProjectReadinessRestClient):
              return client.ensure(
                  repository_ref=REPOSITORY_REF,
                  github_repo_id=REPOSITORY_ID,
                  production_branch="main",
                  project_name=PROJECT_NAME,
              )


          def test_exact_repo_filter_reuses_one_readback_verified_target():
              def handler(request: httpx.Request) -> httpx.Response:
                  if request.url.path == "/v9/projects":
                      _assert_exact_query(request)
                      return httpx.Response(200, json={"projects": [_project()], "pagination": {"next": None}})
                  if request.url.path == "/v9/projects/prj_qa1":
                      return httpx.Response(200, json=_project())
                  raise AssertionError(f"unexpected request: {request.method} {request.url}")

              result = _ensure(_client(handler))
              assert result.created is False
              assert result.target.project_id == "prj_qa1"
              assert result.target.github_repo_id == REPOSITORY_ID


          def test_filtered_provider_repo_mismatch_fails_before_mutation():
              mutations = 0

              def handler(request: httpx.Request) -> httpx.Response:
                  nonlocal mutations
                  if request.method != "GET":
                      mutations += 1
                  _assert_exact_query(request)
                  return httpx.Response(
                      200,
                      json={"projects": [_project(repo_id=REPOSITORY_ID + 1)], "pagination": {"next": None}},
                  )

              with pytest.raises(ProviderClientError, match="TARGET_REPOSITORY_MISMATCH"):
                  _ensure(_client(handler))
              assert mutations == 0


          def test_filtered_provider_malformed_project_fails_closed():
              def handler(request: httpx.Request) -> httpx.Response:
                  _assert_exact_query(request)
                  return httpx.Response(200, json={"projects": [{"id": "prj_bad"}], "pagination": {"next": None}})

              with pytest.raises(ProviderClientError, match="TARGET_REPOSITORY_UNVERIFIED"):
                  _ensure(_client(handler))


          @pytest.mark.parametrize(
              "pagination",
              [None, {}, {"next": 123}],
          )
          def test_incomplete_filtered_discovery_fails_closed(pagination):
              def handler(request: httpx.Request) -> httpx.Response:
                  _assert_exact_query(request)
                  payload = {"projects": []}
                  if pagination is not None:
                      payload["pagination"] = pagination
                  return httpx.Response(200, json=payload)

              expected = "TARGET_DISCOVERY_UNBOUNDED" if pagination == {"next": 123} else "PROVIDER_INVALID_RESPONSE"
              with pytest.raises(ProviderClientError, match=expected):
                  _ensure(_client(handler))


          def test_two_exact_candidates_are_ambiguous_even_with_continuation():
              def handler(request: httpx.Request) -> httpx.Response:
                  _assert_exact_query(request)
                  return httpx.Response(
                      200,
                      json={
                          "projects": [_project("prj_one"), _project("prj_two")],
                          "pagination": {"next": 123},
                      },
                  )

              with pytest.raises(ProviderClientError, match="TARGET_AMBIGUOUS"):
                  _ensure(_client(handler))


          def test_creation_conflict_reconciliation_uses_same_exact_filter():
              list_calls = 0
              post_calls = 0

              def handler(request: httpx.Request) -> httpx.Response:
                  nonlocal list_calls, post_calls
                  if request.url.path == "/v9/projects":
                      _assert_exact_query(request)
                      list_calls += 1
                      projects = [] if list_calls == 1 else [_project()]
                      return httpx.Response(200, json={"projects": projects, "pagination": {"next": None}})
                  if request.url.path == "/v11/projects":
                      post_calls += 1
                      assert json.loads(request.content) == {
                          "name": PROJECT_NAME,
                          "gitRepository": {"type": "github", "repo": "Ryan9876/parallax-qa1"},
                      }
                      return httpx.Response(409, json={"error": {"code": "project_already_exists"}})
                  if request.url.path == "/v9/projects/prj_qa1":
                      return httpx.Response(200, json=_project())
                  if request.url.path == "/v6/deployments":
                      assert request.url.params.get("projectId") == "prj_qa1"
                      assert request.url.params.get("target") == "production"
                      return httpx.Response(200, json={"deployments": []})
                  raise AssertionError(f"unexpected request: {request.method} {request.url}")

              result = _ensure(_client(handler))
              assert result.created is False
              assert result.target.project_id == "prj_qa1"
              assert list_calls == 2
              assert post_calls == 1
          PY

      - name: Restore temporary gate workflow and remove implementation harness
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/optimize-spec.yml
          git rm .github/workflows/ws556-implement.yml

      - name: Install API dependencies
        run: pip install -e 'services/api[dev]'

      - name: Validate protected spec plan
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.36.md

      - name: Run focused delivery-readiness regressions
        run: |
          pytest -q \
            services/api/tests/test_p2_v02336_vercel_repository_discovery.py \
            services/api/tests/test_w8_delivery_readiness.py \
            services/api/tests/test_w8_delivery_readiness_contract.py
          python -m compileall -q services/api/parallax_api
          git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "Ryan9876"
          git config user.email "ryansmith100@gmail.com"
          git add \
            .github/workflows/optimize-spec.yml \
            specs/P2-V0.23.36.md \
            specs/compiled/P2-V0.23.36.plan.json \
            services/api/parallax_api/code/delivery_readiness.py \
            services/api/tests/test_w8_delivery_readiness.py \
            services/api/tests/test_p2_v02336_vercel_repository_discovery.py
          git commit -m "Implement P2-V0.23.36 exact Vercel repository discovery"
          git push origin HEAD:ws/556-vercel-repository-discovery
