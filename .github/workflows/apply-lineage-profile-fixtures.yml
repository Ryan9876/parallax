name: Apply Lineage Profile Fixtures

on:
  push:
    branches:
      - p2/repository-aware-validation-toolchains
    paths:
      - .github/workflows/apply-lineage-profile-fixtures.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/repository-aware-validation-toolchains
          fetch-depth: 0
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/api/tests/test_lineage_sandbox_execution.py')
          text = path.read_text(encoding='utf-8')
          old = '''    files = files or {\n        "README.md": b"hello\\n",\n        "src/app.py": b"value = 2\\n",\n    }\n    entries = []\n'''
          new = '''    files = dict(files or {\n        "README.md": b"hello\\n",\n        "src/app.py": b"value = 2\\n",\n    })\n    files.setdefault("services/api/pyproject.toml", b"[project]\\nname='parallax-api'\\n")\n    files.setdefault("services/api/parallax_api/__init__.py", b"")\n    files.setdefault("services/api/tests/test_code_execution_kernel.py", b"")\n    files.setdefault("services/api/tests/test_code_autonomy.py", b"")\n    files.setdefault("scripts/.profile-fixture", b"")\n    entries = []\n'''
          if old not in text:
              raise SystemExit('lineage fixture anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('assert evidence["source_file_count"] == 96', 'assert evidence["source_file_count"] == len(expected)', 1)
          text = text.replace('assert len(filesystem.batch_flushes[0]) == 96', 'assert len(filesystem.batch_flushes[0]) == len(expected)', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/tests/test_lineage_sandbox_execution.py
          git commit -m "Align lineage fixtures with bounded Python profile"
          git push origin HEAD:p2/repository-aware-validation-toolchains
