name: P2-V0.23.28 Spec Preparation

on:
  push:
    branches: [fix/p2328-cross-work-unit-convergence]
    paths:
      - 'specs/P2-V0.23.28.md'
      - '.github/workflows/p2328-spec-prep.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2328-cross-work-unit-convergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate specification contract
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.23.28.md
      - name: Install local DSPy release LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Compile and verify protected DSPy plan
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:0.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: |
          python scripts/compile_spec.py specs/P2-V0.23.28.md
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.28.md
      - name: Commit protected plan and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/p2328-spec-prep.yml
          git config user.name 'Parallax Spec Compiler'
          git config user.email 'parallax-spec@users.noreply.github.com'
          git add specs/compiled/P2-V0.23.28.plan.json .github/workflows/p2328-spec-prep.yml
          git diff --cached --check
          git commit -m 'P2-V0.23.28 — commit protected DSPy plan'
          git push origin HEAD:fix/p2328-cross-work-unit-convergence
