name: Run canonical Wave 6 production infrastructure reconciliation

on:
  push:
    branches: [records/w6-production-infrastructure]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: records/w6-production-infrastructure
          fetch-depth: 0
      - name: Apply robust authoritative record patch and self-remove
        run: |
          python .github/reconcile_w6_production_infrastructure.py
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          # Normalize trailing whitespace only on lines introduced/modified by
          # this record patch. Historical untouched Markdown hard breaks remain.
          diff = subprocess.run(
              ['git', 'diff', '--unified=0', '--', 'CURRENT-STATE.md'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          changed = set()
          for match in re.finditer(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@', diff, re.MULTILINE):
              start = int(match.group(1))
              count = int(match.group(2) or '1')
              changed.update(range(start, start + count))
          path = Path('CURRENT-STATE.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          for number in changed:
              if 1 <= number <= len(lines):
                  lines[number - 1] = lines[number - 1].rstrip(' \t')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git diff --check
          git rm -f \
            .github/workflows/reconcile-w6-production-infrastructure.yml \
            .github/workflows/run-reconcile-w6-production-infrastructure.yml \
            .github/workflows/run-w6-record-reconciliation.yml \
            .github/reconcile_w6_production_infrastructure.py
          git add CURRENT-STATE.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(state): record Wave 6 production infrastructure verification'
          git push origin HEAD:records/w6-production-infrastructure
