name: WS586 P2-V0.23.46 Implementation

on:
  push:
    branches:
      - ws/586-canonical-empty-tree-replay
    paths:
      - .github/workflows/ws586-implementation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/586-canonical-empty-tree-replay
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Re-prove protected spec-first gate
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.46.md
      - name: Run focused canonical empty-tree regressions
        run: pytest -q services/api/tests/test_provider_clients.py
      - name: Run full API regression and compile gate
        run: |
          pytest -q services/api/tests
          python -m compileall -q services/api/parallax_api
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.46.md
      - name: Advance Architecture v3.55 after semantic validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("ARCHITECTURE.md")
          text = path.read_text(encoding="utf-8")
          if text.count("Version: 3.54") != 1:
              raise SystemExit("expected exact Architecture v3.54 baseline")
          text = text.replace("Version: 3.54", "Version: 3.55", 1)
          marker = "## Version relationship\n\n"
          if text.count(marker) != 1:
              raise SystemExit("expected one Version relationship marker")
          paragraph = (
              "Architecture v3.55 reuses the established v3.48 universal canonical Git empty-tree compatibility rule inside exact partial-publication replay. "
              "After v3.54 resolves exact parent/replay commits to structurally validated tree.sha identities, the GitHub replay snapshot boundary may synthesize an empty snapshot only when the resolved tree identity equals the universal canonical Git empty-tree SHA 4b825dc642cb6eb9a060e54bf8d69288fbee4904. "
              "That exact identity requires no Trees GET because authenticated production evidence already proves GitHub may return 404 for the canonical empty-tree object even when a verified commit references it. Every non-canonical tree identity still requires the bounded provider Trees GET, and any non-canonical 404 remains SOURCE_NOT_FOUND. "
              "All deterministic lineage message, expected-parent, changed-path, supported-mode, exact-size, accepted-content-digest, one-shot ref acknowledgement, non-force mutation, Preview-only and human REVIEW boundaries remain unchanged. Architecture v3.54 remains the exact commit-to-tree identity foundation and v3.48 remains the canonical-empty provider-compatibility foundation.\n\n"
          )
          path.write_text(text.replace(marker, marker + paragraph, 1), encoding="utf-8")
          PY
      - name: Persist validated architecture record
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add ARCHITECTURE.md
          git diff --cached --check
          git commit -m 'Document P2-V0.23.46 canonical empty-tree replay'
          git push origin HEAD:ws/586-canonical-empty-tree-replay
