name: W6-R1 P2-V0.19.7 semantic gate

on:
  push:
    branches:
      - p2/w6-runtime-activation
    paths:
      - specs/P2-V0.19.7.md
      - specs/compiled/P2-V0.19.7.plan.json
      - .github/workflows/w6-r1-spec-gate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Validate approved spec and authentic committed DSPy evidence
        run: |
          python scripts/validate_spec.py specs/P2-V0.19.7.md --spec-only
          python scripts/validate_spec.py specs/P2-V0.19.7.md --require-dspy
      - name: Verify DSPy development workflow restoration
        run: |
          test "$(git hash-object .github/workflows/optimize-spec.yml)" = "6478b5ac11eeedbd5b4d4711feb4193394ac1bdd"
