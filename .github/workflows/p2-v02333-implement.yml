name: P2-V0.23.33 Implementation Validation

on:
  push:
    branches:
      - ws/546-candidate-repair-plan-identity
    paths:
      - specs/compiled/P2-V0.23.33.plan.json
      - .github/workflows/p2-v02333-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPEC_PATH: specs/P2-V0.23.33.md
      PLAN_PATH: specs/compiled/P2-V0.23.33.plan.json
      TARGET_BRANCH: ws/546-candidate-repair-plan-identity
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Require exact protected DSPy plan before implementation
        id: gate
        run: |
          if [ ! -f "$PLAN_PATH" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Protected DSPy plan is not committed yet; implementation remains gated.'
            exit 0
          fi
          python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Apply canonical PLAN identity correction
        if: steps.gate.outputs.ready == 'true'
        run: python .github/workstream/p2_v02333_apply.py runtime
      - name: Focused P2-V0.23.33 behavior validation
        if: steps.gate.outputs.ready == 'true'
        run: |
          pytest -q \
            services/api/tests/test_candidate_plan_identity_v02333.py \
            services/api/tests/test_candidate_validation_repair_v02332.py \
            services/api/tests/test_agentic_candidate_recovery.py \
            services/api/tests/test_agentic_runtime_activation.py
      - name: Reconcile architecture v3.44 after focused validation
        if: steps.gate.outputs.ready == 'true'
        run: python .github/workstream/p2_v02333_apply.py architecture
      - name: Full API regression
        if: steps.gate.outputs.ready == 'true'
        run: pytest -q services/api/tests
      - name: Revalidate governed spec and remove temporary workstream tooling
        if: steps.gate.outputs.ready == 'true'
        run: |
          python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
          rm -f \
            .github/workflows/p2-v02333-prepare.yml \
            .github/workflows/p2-v02332-reconcile.yml \
            .github/workflows/p2-v02333-implement.yml \
            .github/workstream/p2_v02333_apply.py
      - name: Commit validated implementation without overwriting newer branch work
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'parallax-workstream-gate'
          git config user.email 'parallax-workstream-gate@users.noreply.github.com'
          git commit -m 'P2-V0.23.33 — preserve canonical durable PLAN across candidate repair'
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
