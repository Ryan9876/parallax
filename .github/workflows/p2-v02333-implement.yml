name: P2-V0.23.33 Implementation Validation

on:
  push:
    branches:
      - ws/546-candidate-repair-plan-identity
    paths:
      - specs/compiled/P2-V0.23.33.plan.json
      - .github/workflows/p2-v02333-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPEC_PATH: specs/P2-V0.23.33.md
      PLAN_PATH: specs/compiled/P2-V0.23.33.plan.json
      TARGET_BRANCH: ws/546-candidate-repair-plan-identity
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Require exact protected DSPy plan before implementation
        id: gate
        run: |
          if [ ! -f "$PLAN_PATH" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Protected DSPy plan is not committed yet; implementation remains gated.'
            exit 0
          fi
          python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Apply canonical PLAN identity correction and focused regressions
        if: steps.gate.outputs.ready == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime_path = 'services/api/parallax_api/code/agentic_runtime.py'
          runtime = Path(runtime_path).read_text(encoding='utf-8')
          old_signature = '''    def _proposal_for_plan(\n        self,\n        plan: TeamPlan,\n        request: ImplementationGenerationRequest,\n        *,\n        proposal_validator: Callable[[ImplementationProposal], bool],\n        alternative_round: int,\n    ) -> tuple[\n'''
          helper_and_signature = '''    @staticmethod\n    def _assert_candidate_plan_compatible(\n        candidate_plan: TeamPlan,\n        canonical_plan: TeamPlan,\n    ) -> None:\n        if not isinstance(candidate_plan, TeamPlan) or not isinstance(canonical_plan, TeamPlan):\n            raise AgenticRuntimeError("candidate PLAN compatibility requires canonical TeamPlan values")\n        candidate = candidate_plan.identity\n        canonical = canonical_plan.identity\n        protected_fields = (\n            "project_id",\n            "run_id",\n            "work_specification_id",\n            "work_specification_revision",\n            "work_specification_digest",\n            "acceptance_ids",\n            "agent_protocol_version",\n            "policy_digest",\n            "work_graph_digest",\n        )\n        if any(getattr(candidate, field) != getattr(canonical, field) for field in protected_fields):\n            raise AgenticRuntimeError("candidate-local plan drifted from canonical durable PLAN")\n        if candidate_plan.graph.digest != canonical_plan.graph.digest:\n            raise AgenticRuntimeError("candidate-local work graph drifted from canonical durable PLAN")\n        if candidate_plan.limits.as_dict() != canonical_plan.limits.as_dict():\n            raise AgenticRuntimeError("candidate-local orchestration limits drifted from canonical durable PLAN")\n        canonical_roster = {entry.identity_digest for entry in canonical_plan.roster.entries}\n        candidate_roster = {entry.identity_digest for entry in candidate_plan.roster.entries}\n        if not candidate_roster <= canonical_roster:\n            raise AgenticRuntimeError("candidate-local plan introduced an agent outside canonical PLAN admission")\n        if not set(candidate_plan.selected_agent_digests) <= canonical_roster:\n            raise AgenticRuntimeError("candidate-local selected producer is outside canonical PLAN admission")\n        for unit_plan in candidate_plan.unit_plans:\n            canonical_plan.graph.get(unit_plan.work_unit_id)\n            if not set(unit_plan.eligible_agent_digests) <= canonical_roster:\n                raise AgenticRuntimeError("candidate-local work-unit eligibility exceeded canonical PLAN admission")\n\n    def _proposal_for_plan(\n        self,\n        plan: TeamPlan,\n        request: ImplementationGenerationRequest,\n        *,\n        proposal_validator: Callable[[ImplementationProposal], bool],\n        alternative_round: int,\n        canonical_plan: TeamPlan | None = None,\n    ) -> tuple[\n'''
          if old_signature not in runtime:
              raise SystemExit('agentic_runtime.py proposal signature anchor missing')
          runtime = runtime.replace(old_signature, helper_and_signature, 1)
          old_body = '''        tuple[str, ...],\n        tuple[str, ...],\n    ]:\n        completed: set[str] = set()\n'''
          new_body = '''        tuple[str, ...],\n        tuple[str, ...],\n    ]:\n        durable_plan = canonical_plan or plan\n        self._assert_candidate_plan_compatible(plan, durable_plan)\n        completed: set[str] = set()\n'''
          if old_body not in runtime:
              raise SystemExit('agentic_runtime.py proposal body anchor missing')
          runtime = runtime.replace(old_body, new_body, 1)
          old_call = '''            proposal, attempts, models, result_digests, task_digests = self._proposal_for_plan(\n                plan,\n                request,\n                proposal_validator=proposal_validator,\n                alternative_round=alternative_round,\n            )\n'''
          new_call = '''            proposal, attempts, models, result_digests, task_digests = self._proposal_for_plan(\n                plan,\n                request,\n                proposal_validator=proposal_validator,\n                alternative_round=alternative_round,\n                canonical_plan=primary_plan,\n            )\n'''
          if old_call not in runtime:
              raise SystemExit('agentic_runtime.py _make_candidate call anchor missing')
          runtime = runtime.replace(old_call, new_call, 1)
          Path(runtime_path).write_text(runtime, encoding='utf-8')

          live_path = Path('services/api/parallax_api/code/agentic_runtime_live.py')
          live = live_path.read_text(encoding='utf-8')
          live_old = '''    def _proposal_for_plan(\n        self,\n        plan: TeamPlan,\n        request: ImplementationGenerationRequest,\n        *,\n        proposal_validator,\n        alternative_round: int,\n    ) -> tuple[\n'''
          live_new = '''    def _proposal_for_plan(\n        self,\n        plan: TeamPlan,\n        request: ImplementationGenerationRequest,\n        *,\n        proposal_validator,\n        alternative_round: int,\n        canonical_plan: TeamPlan | None = None,\n    ) -> tuple[\n'''
          if live.count(live_old) != 1:
              raise SystemExit('agentic_runtime_live.py signature anchor missing')
          live = live.replace(live_old, live_new, 1)
          live_start_old = '''    ]:\n        run = self.service.get(plan.identity.run_id)\n        lineage = self._lineage(run)\n'''
          live_start_new = '''    ]:\n        durable_plan = canonical_plan or plan\n        self._assert_candidate_plan_compatible(plan, durable_plan)\n        run = self.service.get(durable_plan.identity.run_id)\n        lineage = self._lineage(run)\n'''
          if live.count(live_start_old) != 1:
              raise SystemExit('agentic_runtime_live.py body anchor missing')
          live = live.replace(live_start_old, live_start_new, 1)
          start = live.index('    def _proposal_for_plan(')
          end = live.index('    def generate_protected(', start)
          region = live[start:end]
          region, checkpoint_count = re.subn(
              r'(self\.worker_bridge\.checkpoint\(\n\s*lease,\n\s*)plan=plan,',
              r'\1plan=durable_plan,',
              region,
          )
          if checkpoint_count < 3:
              raise SystemExit(f'agentic_runtime_live.py expected at least 3 checkpoint plan replacements, got {checkpoint_count}')
          live = live[:start] + region + live[end:]
          live_path.write_text(live, encoding='utf-8')

          recovery_path = Path('services/api/parallax_api/code/agentic_candidate_recovery.py')
          recovery = recovery_path.read_text(encoding='utf-8')
          recovery_old = '''    def _proposal_for_plan(\n        self,\n        plan: TeamPlan,\n        request: ImplementationGenerationRequest,\n        *,\n        proposal_validator: Callable[[ImplementationProposal], bool],\n        alternative_round: int,\n    ) -> tuple[\n'''
          recovery_new = '''    def _proposal_for_plan(\n        self,\n        plan: TeamPlan,\n        request: ImplementationGenerationRequest,\n        *,\n        proposal_validator: Callable[[ImplementationProposal], bool],\n        alternative_round: int,\n        canonical_plan: TeamPlan | None = None,\n    ) -> tuple[\n'''
          if recovery.count(recovery_old) != 1:
              raise SystemExit('agentic_candidate_recovery.py signature anchor missing')
          recovery = recovery.replace(recovery_old, recovery_new, 1)
          recovery_start_old = '''    ]:\n        run = self.service.get(plan.identity.run_id)\n        lineage = self._lineage(run)\n'''
          recovery_start_new = '''    ]:\n        durable_plan = canonical_plan or plan\n        self._assert_candidate_plan_compatible(plan, durable_plan)\n        run = self.service.get(durable_plan.identity.run_id)\n        lineage = self._lineage(run)\n'''
          if recovery.count(recovery_start_old) != 1:
              raise SystemExit('agentic_candidate_recovery.py body anchor missing')
          recovery = recovery.replace(recovery_start_old, recovery_start_new, 1)
          start = recovery.index('    def _proposal_for_plan(')
          end = recovery.index('\n\ndef build_resilient_live_agentic_runtime_composition(', start)
          region = recovery[start:end]
          region, recovery_checkpoint_count = re.subn(
              r'(self\.worker_bridge\.checkpoint\(\n\s*lease,\n\s*)plan=plan,',
              r'\1plan=durable_plan,',
              region,
          )
          if recovery_checkpoint_count < 4:
              raise SystemExit(f'agentic_candidate_recovery.py expected at least 4 checkpoint plan replacements, got {recovery_checkpoint_count}')
          recovery = recovery[:start] + region + recovery[end:]
          recovery_path.write_text(recovery, encoding='utf-8')

          test_path = Path('services/api/tests/test_candidate_plan_identity_v02333.py')
          test_path.write_text(r'''from __future__ import annotations

from dataclasses import replace
from datetime import datetime, timezone
from hashlib import sha256
from types import SimpleNamespace

import pytest

from parallax_api.code.agent_protocol import AgentIdentity
from parallax_api.code.agent_team_orchestration import (
    AdmittedAgent,
    AdmittedRoster,
    OrchestrationLimits,
    TeamPlan,
    WorkGraph,
    WorkUnit,
    build_team_plan,
    schedule_team_plan,
)
from parallax_api.code.agentic_runtime import AgenticControlPlane, AgenticRuntimeError
from parallax_api.code.agentic_runtime_live import LiveAgenticControlPlane
from parallax_api.code.source_context import SourceContextSnapshot
from parallax_api.code.worker_recovery import WorkerLease
from parallax_api.intelligence.implementation_generation import (
    AcceptanceRequirement,
    ImplementationGenerationRequest,
)


def _digest(value: str) -> str:
    return sha256(value.encode()).hexdigest()


def _identity(name: str) -> AgentIdentity:
    return AgentIdentity(
        agent_id=name,
        agent_version="1.0.0",
        adapter_id="protected-implementation-generation",
        adapter_version="1.0.0",
        provider_kind="openai",
        declared_work_kinds=("implementation",),
        declared_capabilities=("bounded-source-evidence",),
        model_runtime_label=name,
    )


def _plans() -> tuple[TeamPlan, TeamPlan]:
    entries = tuple(
        AdmittedAgent(
            _identity(name),
            admitted_work_kinds=("implementation",),
            admitted_capabilities=("bounded-source-evidence",),
            selection_priority=priority,
        )
        for priority, name in enumerate(("model-luna", "model-terra"))
    )
    graph = WorkGraph(
        approved_acceptance_ids=("AC-01",),
        units=(
            WorkUnit(
                unit_id="implementation",
                work_kind="implementation",
                acceptance_ids=("AC-01",),
                required_capabilities=("bounded-source-evidence",),
                coordination_domains=("source",),
            ),
        ),
    )
    limits = OrchestrationLimits(
        max_team_size=2,
        max_concurrency=2,
        max_reassignments_per_work_unit=2,
        max_replans=3,
        max_no_progress=3,
    )

    def build(roster: AdmittedRoster) -> TeamPlan:
        decision = build_team_plan(
            project_id="11111111-1111-1111-1111-111111111111",
            run_id="22222222-2222-2222-2222-222222222222",
            work_specification_id="33333333-3333-3333-3333-333333333333",
            work_specification_revision=1,
            work_specification_digest=_digest("spec"),
            graph=graph,
            roster=roster,
            policy_digest=_digest("policy"),
            limits=limits,
        )
        assert decision.plan is not None
        return decision.plan

    canonical = build(AdmittedRoster(entries))
    challenger = build(AdmittedRoster((entries[1],)))
    assert canonical.plan_id != challenger.plan_id
    assert canonical.graph.digest == challenger.graph.digest
    return canonical, challenger


def _request() -> ImplementationGenerationRequest:
    return ImplementationGenerationRequest(
        work_specification_id="33333333-3333-3333-3333-333333333333",
        work_specification_revision=1,
        work_specification_digest=_digest("spec"),
        title="Bound candidate-local producer identity",
        objective="Keep the protected PLAN durable while selecting an alternate producer.",
        constraints=("Do not change authority.",),
        acceptance=(AcceptanceRequirement(id="AC-01", text="The bounded change is produced."),),
        source_context=SourceContextSnapshot(
            files=(),
            digest=_digest("source-context"),
            total_bytes=0,
            excluded_secret_files=0,
            omitted_bounded_files=0,
        ),
    )


def test_candidate_local_plan_compatibility_allows_only_subordinate_producer_selection():
    canonical, challenger = _plans()
    AgenticControlPlane._assert_candidate_plan_compatible(challenger, canonical)
    assert challenger.selected_agent_digests != canonical.selected_agent_digests

    incompatible_identity = replace(challenger.identity, policy_digest=_digest("different-policy"))
    incompatible = replace(challenger, identity=incompatible_identity)
    with pytest.raises(AgenticRuntimeError, match="drifted from canonical durable PLAN"):
        AgenticControlPlane._assert_candidate_plan_compatible(incompatible, canonical)


def test_candidate_local_plan_cannot_introduce_agent_outside_canonical_admission():
    canonical, challenger = _plans()
    outsider = AdmittedAgent(
        _identity("model-outsider"),
        admitted_work_kinds=("implementation",),
        admitted_capabilities=("bounded-source-evidence",),
        selection_priority=0,
    )
    graph = canonical.graph
    decision = build_team_plan(
        project_id=canonical.identity.project_id,
        run_id=canonical.identity.run_id,
        work_specification_id=canonical.identity.work_specification_id,
        work_specification_revision=canonical.identity.work_specification_revision,
        work_specification_digest=canonical.identity.work_specification_digest,
        graph=graph,
        roster=AdmittedRoster((outsider,)),
        policy_digest=canonical.identity.policy_digest,
        limits=canonical.limits,
    )
    assert decision.plan is not None
    with pytest.raises(AgenticRuntimeError, match="outside canonical PLAN admission"):
        AgenticControlPlane._assert_candidate_plan_compatible(decision.plan, canonical)


class _DispatchReached(RuntimeError):
    pass


class _ProbeWorkerBridge:
    def __init__(self) -> None:
        self.plan_ids: list[str] = []
        self.evidence_refs: list[tuple[str, ...]] = []
        self.stopped = False

    def acquire(self, *, run_id: str) -> WorkerLease:
        return WorkerLease(
            execution_id="candidate-plan-probe",
            run_id=run_id,
            owner_id="worker:candidate-plan-probe",
            generation=1,
            expires_at=datetime.now(timezone.utc),
        )

    def checkpoint(self, lease, *, plan, work_unit_id, source_lineage_ref, step, evidence_refs, state=None):
        self.plan_ids.append(plan.plan_id)
        self.evidence_refs.append(evidence_refs)
        if step == "AGENT_DISPATCH":
            raise _DispatchReached("captured canonical checkpoint")
        return lease

    def stop_bounded(self, *, run_id: str) -> None:
        self.stopped = True


class _Service:
    def __init__(self, run) -> None:
        self.run = run

    def get(self, run_id: str):
        assert run_id == self.run.id
        return self.run


class _Allocator:
    def __init__(self, run) -> None:
        self.run = run

    def current_lineage(self, identity):
        assert identity.project_id == self.run.project_id
        assert identity.run_id == self.run.id
        return SimpleNamespace(
            project_id=self.run.project_id,
            run_id=self.run.id,
            lineage_id="lineage-primary",
            content_digest=_digest("accepted-source"),
        )


def test_live_repair_dispatch_uses_candidate_identity_but_canonical_worker_plan_ref():
    canonical, challenger = _plans()
    primary_assignment = schedule_team_plan(canonical).ready[0]
    repair_assignment = schedule_team_plan(challenger).ready[0]
    assert primary_assignment.attempt_id != repair_assignment.attempt_id
    assert primary_assignment.operation_id != repair_assignment.operation_id
    assert primary_assignment.request_id != repair_assignment.request_id

    run = SimpleNamespace(
        id=canonical.identity.run_id,
        project_id=canonical.identity.project_id,
    )
    control = object.__new__(LiveAgenticControlPlane)
    control.service = _Service(run)
    control.allocator = _Allocator(run)
    probe = _ProbeWorkerBridge()
    control.worker_bridge = probe

    with pytest.raises(_DispatchReached):
        control._proposal_for_plan(
            challenger,
            _request(),
            proposal_validator=lambda proposal: True,
            alternative_round=2,
            canonical_plan=canonical,
        )

    assert probe.stopped is True
    assert probe.plan_ids == [canonical.plan_id]
    assert any(f"assignment:{repair_assignment.attempt_id}" in refs for refs in probe.evidence_refs)


class _ProposalThreadStop(RuntimeError):
    pass


class _ProposalThreadProbe(AgenticControlPlane):
    def _proposal_for_plan(self, plan, request, *, proposal_validator, alternative_round, canonical_plan=None):
        self.threaded = (plan, canonical_plan, alternative_round)
        raise _ProposalThreadStop("captured")


def test_make_candidate_threads_primary_plan_as_canonical_durable_plan(tmp_path):
    canonical, challenger = _plans()
    control = object.__new__(_ProposalThreadProbe)
    control.threaded = None
    with pytest.raises(_ProposalThreadStop):
        control._make_candidate(
            run=SimpleNamespace(),
            primary_plan=canonical,
            plan=challenger,
            request=_request(),
            base_workspace=tmp_path,
            validation_profile=SimpleNamespace(),
            proposal_validator=lambda proposal: True,
            operation_key="candidate-plan-thread",
            candidate_id="candidate-repair",
            alternative_round=2,
        )
    assert control.threaded == (challenger, canonical, 2)
''', encoding='utf-8')
          PY
      - name: Focused P2-V0.23.33 behavior validation
        if: steps.gate.outputs.ready == 'true'
        run: |
          pytest -q \
            services/api/tests/test_candidate_plan_identity_v02333.py \
            services/api/tests/test_candidate_validation_repair_v02332.py \
            services/api/tests/test_agentic_candidate_recovery.py \
            services/api/tests/test_agentic_runtime_activation.py
      - name: Reconcile architecture v3.44 after focused validation
        if: steps.gate.outputs.ready == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          if text.count('Version: 3.43') != 1:
              raise SystemExit('expected Architecture v3.43 baseline exactly once')
          text = text.replace('Version: 3.43', 'Version: 3.44', 1)
          anchor = '## Version relationship\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('architecture version relationship anchor missing')
          paragraph = (
              'Architecture v3.44 separates the canonical durable PLAN identity from subordinate disposable candidate-local producer selection during one protected IMPLEMENT attempt. The exact `primary_plan` accepted at PLAN remains the only worker-checkpoint `plan_ref` unless the existing explicit human-authorized PLAN-refresh cycle runs. A bounded challenger or validation-repair `TeamPlan` may continue to select a different already-admitted producer and therefore retain distinct assignment, operation, request and attempt identity, but it is non-authoritative selection evidence only. Before sharing the canonical worker checkpoint, server-owned code requires exact Project, Engineering Run, Work Specification ID/revision/digest, acceptance contract, agent-protocol version, orchestration policy, work-graph and orchestration-limit compatibility, and requires every candidate-local roster/selected/eligible agent to remain within the canonical PLAN admission. Live and resilient proposal generation schedule tasks and admit results against the candidate-local plan while every durable AGENT_DISPATCH/convergence/result/proposal checkpoint remains bound to the canonical protected PLAN. Candidate count, Luna/Terra/Sol admission, 60-second hosted timeout, zero hidden provider retries, per-work-unit recovery, final validator repair, static-web repair eligibility, execution-contract authority, SafeImplementationEngine, disposable BUILD/TEST/VERIFY, source-lineage/Git/deployment/lifecycle authority and the human REVIEW ceiling are unchanged. Architecture v3.43 remains the bounded static-web validation-repair foundation.\n\n'
          )
          text = text.replace(anchor, anchor + paragraph, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Full API regression
        if: steps.gate.outputs.ready == 'true'
        run: pytest -q services/api/tests
      - name: Revalidate governed spec and remove temporary workstream workflows
        if: steps.gate.outputs.ready == 'true'
        run: |
          python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
          rm -f \
            .github/workflows/p2-v02333-prepare.yml \
            .github/workflows/p2-v02332-reconcile.yml \
            .github/workflows/p2-v02333-implement.yml
      - name: Commit validated implementation without overwriting newer branch work
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git add \
            services/api/parallax_api/code/agentic_runtime.py \
            services/api/parallax_api/code/agentic_runtime_live.py \
            services/api/parallax_api/code/agentic_candidate_recovery.py \
            services/api/tests/test_candidate_plan_identity_v02333.py \
            ARCHITECTURE.md \
            CURRENT-STATE.md \
            specs/P2-V0.23.33.md \
            specs/compiled/P2-V0.23.33.plan.json \
            .github/workflows
          git config user.name 'parallax-workstream-gate'
          git config user.email 'parallax-workstream-gate@users.noreply.github.com'
          git commit -m 'P2-V0.23.33 — preserve canonical durable PLAN across candidate repair'
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
