name: Reconcile W6 runtime records on PR

on:
  pull_request:
    branches:
      - integration/wave6-agentic-control-plane

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'records/w6-runtime-activation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: records/w6-runtime-activation
          fetch-depth: 0
      - name: Reconcile records and remove temporary automation
        shell: bash
        run: |
          python scripts/reconcile_w6_runtime_records.py
          git rm .github/workflows/reconcile-w6-runtime-records.yml
          git rm .github/workflows/reconcile-w6-runtime-records-pr.yml
          git rm scripts/reconcile_w6_runtime_records.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE.md CURRENT-STATE.md
          git diff --cached --check
          git commit -m "docs: reconcile Wave 6 runtime activation records"
          git push origin HEAD:records/w6-runtime-activation
