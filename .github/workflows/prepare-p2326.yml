name: P2-V0.23.26 Spec Preparation

on:
  push:
    branches:
      - fix/p2326-server-canonicalized-content
    paths:
      - .github/workflows/prepare-p2326.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2326-server-canonicalized-content
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate protected specification contract
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.23.26.md
      - name: Select provider-backed or local DSPy model
        id: model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY}" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi
      - name: Install local DSPy development LM
        if: steps.model.outputs.provider != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Run DSPy SpecCritic and SpecCompiler
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py specs/P2-V0.23.26.md
      - name: Verify protected DSPy plan evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.26.md
      - name: Commit generated plan only
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Parallax Spec Compiler"
          git config user.email "actions@users.noreply.github.com"
          git add specs/compiled/P2-V0.23.26.plan.json
          if git diff --cached --quiet; then
            echo "Compiled plan already current"
            exit 0
          fi
          git commit -m "P2-V0.23.26 — compile protected DSPy plan"
          git push origin HEAD:fix/p2326-server-canonicalized-content
