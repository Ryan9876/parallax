name: WS148 Fix Strict Types

on:
  push:
    branches: [ws/w4-live-build-ux]
    paths: ['.github/workflows/ws148-fix-types.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-live-build-ux
      - run: python scripts/ws148_fix_types.py
      - run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/client/src/App.tsx apps/client/src/components/observability/LiveBuildWorkspace.tsx apps/client/src/components/observability/RunEventStream.tsx apps/client/src/lib/observabilityProjection.ts
          git commit -m 'Fix strict Live Build presentation types'
          git push origin HEAD:ws/w4-live-build-ux
