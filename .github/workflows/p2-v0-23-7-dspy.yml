name: P2-V0.23.7 DSPy Gate

on:
  push:
    branches: [work/w9-s1-repository-authorization]
    paths:
      - 'specs/P2-V0.23.7.md'
      - '.github/workflows/p2-v0-23-7-dspy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p2-v0-23-7-dspy
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'
      - name: Restore required non-goals contract section
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('specs/P2-V0.23.7.md')
          text = path.read_text(encoding='utf-8')
          if '\n## 9. Non-goals\n' not in text:
              text = text.rstrip() + '''

## 9. Non-goals

- No in-product Vercel Connect consent initiation without a separately proven workload authentication mechanism.
- No PAT, reusable Vercel personal/team token, GitHub user token, password or static provider credential.
- No production GitHub connector attachment to preview solely to widen test authority.
- No all-repositories GitHub grant, arbitrary repository mutation API, client-selected refs/paths/content or force updates.
- No placeholder README, `.gitkeep`, template application, hidden reference implementation or benchmark-specific source.
- No target-repository mutation before verified REVIEW delivery.
- No accepted application source committed directly to the default branch by the greenfield initializer.
- No bypass of protected lineage, BUILD/TEST/VERIFY, exact PR/Preview read-back or the REVIEW human ceiling.
- No automatic production promotion or change to frozen Decision Ledger benchmark semantics.
'''
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate protected specification structure
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.23.7.md
      - name: Configure repository-approved local DSPy model
        run: |
          echo "DSPY_MODEL=ollama_chat/qwen2.5-coder:1.5b" >> "$GITHUB_ENV"
          echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
          echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
          echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:1.5b
      - name: Compile exact protected specification
        run: python scripts/compile_spec.py specs/P2-V0.23.7.md
      - name: Verify authentic DSPy evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.7.md
      - name: Commit exact qualified specification and generated plan
        run: |
          set -euo pipefail
          git config user.name "parallax-spec-compiler"
          git config user.email "actions@users.noreply.github.com"
          git add specs/P2-V0.23.7.md specs/compiled/P2-V0.23.7.plan.json
          if git diff --cached --quiet; then
            echo "Qualified spec and compiled plan already current"
            exit 0
          fi
          git commit -m "Qualify amended P2-V0.23.7 DSPy plan"
          git push origin HEAD:work/w9-s1-repository-authorization
