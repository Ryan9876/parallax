name: Apply P2-V0.23.5 Runtime Integration

on:
  push:
    branches:
      - p2/repository-aware-validation-toolchains
    paths:
      - .github/workflows/apply-p2-v0.23.5-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/repository-aware-validation-toolchains
          fetch-depth: 0
      - name: Apply bounded profile integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing: {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          agent = 'services/api/parallax_api/code/agentic_runtime.py'
          replace(
              agent,
              'from .workspace_lineage import ProjectRunIdentity\n',
              'from .validation_toolchains import select_validation_profile\nfrom .workspace_lineage import ProjectRunIdentity\n',
          )
          replace(
              agent,
              'class CandidateValidationResult:\n    content_digest: str\n    file_count: int\n    total_bytes: int\n    stage_evidence: tuple[tuple[str, dict[str, object]], ...]\n',
              'class CandidateValidationResult:\n    content_digest: str\n    file_count: int\n    total_bytes: int\n    validation_profile_id: str\n    validation_profile_digest: str\n    stage_evidence: tuple[tuple[str, dict[str, object]], ...]\n',
          )
          replace(
              agent,
              '        files = self._source_files(workspace_root)\n        content_digest = self._content_digest(files)\n',
              '        profile = select_validation_profile(workspace_root)\n        files = self._source_files(workspace_root)\n        content_digest = self._content_digest(files)\n',
          )
          replace(
              agent,
              '            self.registry.spec_for(stage, operation_key=f"{operation_key}:{stage.value.lower()}").timeout_seconds\n',
              '            profile.spec_for(stage, operation_key=f"{operation_key}:{stage.value.lower()}").timeout_seconds\n',
          )
          replace(
              agent,
              '                    spec = self.registry.spec_for(\n                        stage,\n                        operation_key=f"{operation_key[:120]}:candidate:{stage.value.lower()}",\n                    )\n                    self.policy.validate(spec)\n                    registered = self.registry.spec_for(stage, operation_key=spec.operation_key)\n                    if spec != registered:\n                        raise ExecutionPolicyError("candidate execution spec drifted from protected registry")\n                    command, args = self.registry.invocation_for(stage)\n',
              '                    spec = profile.spec_for(\n                        stage,\n                        operation_key=f"{operation_key[:120]}:candidate:{stage.value.lower()}",\n                    )\n                    self.policy.validate(spec)\n                    registered = profile.spec_for(stage, operation_key=spec.operation_key)\n                    if spec != registered:\n                        raise ExecutionPolicyError("candidate execution spec drifted from protected validation profile")\n                    command, args = profile.invocation_for(stage)\n',
          )
          replace(
              agent,
              '                            "candidate_total_bytes": total_bytes,\n                            "execution_snapshot_id": self.snapshot_id,\n',
              '                            "candidate_total_bytes": total_bytes,\n                            "validation_profile_id": profile.profile_id.value,\n                            "validation_profile_digest": profile.digest,\n                            "execution_snapshot_id": self.snapshot_id,\n',
          )
          replace(
              agent,
              '            total_bytes=total_bytes,\n            stage_evidence=tuple(stage_evidence),\n',
              '            total_bytes=total_bytes,\n            validation_profile_id=profile.profile_id.value,\n            validation_profile_digest=profile.digest,\n            stage_evidence=tuple(stage_evidence),\n',
          )
          replace(
              agent,
              '    for key, limit in (("tool_id", 80), ("execution_snapshot_id", 180)):\n',
              '    for key, limit in (("tool_id", 80), ("execution_snapshot_id", 180), ("validation_profile_id", 80), ("validation_profile_digest", 80)):\n',
          )

          lineage = 'services/api/parallax_api/code/lineage_sandbox_execution.py'
          replace(
              lineage,
              'from .workspace_allocator import MaterializedWorkspace\n',
              'from .validation_toolchains import select_validation_profile\nfrom .workspace_allocator import MaterializedWorkspace\n',
          )
          replace(
              lineage,
              '        started = time.monotonic()\n        workspace: MaterializedWorkspace | None = None\n        evidence: dict[str, object] | None = None\n',
              '        started = time.monotonic()\n        workspace: MaterializedWorkspace | None = None\n        evidence: dict[str, object] | None = None\n        execution_spec = spec\n        validation_profile_id: str | None = None\n        validation_profile_digest: str | None = None\n',
          )
          replace(
              lineage,
              '            self.policy.validate(spec)\n            registered = self.registry.spec_for(spec.stage, operation_key=spec.operation_key)\n            if spec != registered:\n                raise ExecutionPolicyError("execution spec does not match the protected command registry")\n            command, args = self.registry.invocation_for(spec.stage)\n            identity = self._identity(project_ref, run_id)\n',
              '            self.policy.validate(spec)\n            identity = self._identity(project_ref, run_id)\n',
          )
          replace(
              lineage,
              '            lineage, files = self._validate_workspace(\n                workspace,\n                identity=identity,\n                lineage_id=source_lineage_ref,\n            )\n\n            self._require_provider_identity()\n',
              '            lineage, files = self._validate_workspace(\n                workspace,\n                identity=identity,\n                lineage_id=source_lineage_ref,\n            )\n            profile = select_validation_profile(workspace.path)\n            validation_profile_id = profile.profile_id.value\n            validation_profile_digest = profile.digest\n            execution_spec = profile.spec_for(spec.stage, operation_key=spec.operation_key)\n            self.policy.validate(execution_spec)\n            command, args = profile.invocation_for(spec.stage)\n\n            self._require_provider_identity()\n',
          )
          text = Path(lineage).read_text(encoding='utf-8')
          text = text.replace('execution_time_limit=spec.timeout_seconds + 30,', 'execution_time_limit=execution_spec.timeout_seconds + 30,', 1)
          text = text.replace('cwd=self._sandbox_cwd(spec.working_directory),', 'cwd=self._sandbox_cwd(execution_spec.working_directory),', 1)
          text = text.replace('kill_after=spec.timeout_seconds,', 'kill_after=execution_spec.timeout_seconds,', 1)
          text = text.replace('                spec,\n                exit_code=result.returncode,', '                execution_spec,\n                exit_code=result.returncode,', 1)
          text = text.replace('                spec,\n                exit_code=None,', '                execution_spec,\n                exit_code=None,', 1)
          text = text.replace('"execution_working_directory": self._sandbox_cwd(spec.working_directory),', '"execution_working_directory": self._sandbox_cwd(execution_spec.working_directory),', 1)
          text = text.replace(
              '                    "execution_snapshot_verified": True,\n                    "execution_working_directory": self._sandbox_cwd(execution_spec.working_directory),\n',
              '                    "execution_snapshot_verified": True,\n                    "validation_profile_id": validation_profile_id,\n                    "validation_profile_digest": validation_profile_digest,\n                    "execution_working_directory": self._sandbox_cwd(execution_spec.working_directory),\n',
              1,
          )
          text = text.replace(
              '                    "execution_snapshot_verified": False,\n',
              '                    "execution_snapshot_verified": False,\n                    "validation_profile_id": validation_profile_id,\n                    "validation_profile_digest": validation_profile_digest,\n',
              1,
          )
          Path(lineage).write_text(text, encoding='utf-8')
          PY
          python -m compileall -q services/api/parallax_api
          git diff --check
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/parallax_api/code/agentic_runtime.py services/api/parallax_api/code/lineage_sandbox_execution.py
          git commit -m "Use repository-aware protected validation profiles"
          git push origin HEAD:p2/repository-aware-validation-toolchains
