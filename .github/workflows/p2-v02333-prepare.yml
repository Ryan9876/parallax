name: P2-V0.23.33 Protected Spec Preparation

on:
  push:
    branches:
      - ws/546-candidate-repair-plan-identity
    paths:
      - specs/P2-V0.23.33.md
      - .github/workflows/p2-v02333-prepare.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPEC_PATH: specs/P2-V0.23.33.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Validate spec contract
        run: python scripts/validate_spec.py --spec-only "$SPEC_PATH"
      - id: model
        name: Select DSPy development model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'provider=true' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=openai/gpt-5.6-sol' >> "$GITHUB_ENV"
          else
            echo 'provider=false' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=ollama_chat/qwen2.5:0.5b' >> "$GITHUB_ENV"
            echo 'DSPY_API_BASE=http://127.0.0.1:11434' >> "$GITHUB_ENV"
            echo 'DSPY_API_KEY=' >> "$GITHUB_ENV"
          fi
      - name: Install local DSPy LM
        if: steps.model.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen2.5:0.5b
      - name: Compile exact spec with SpecCritic and SpecCompiler
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Verify protected DSPy evidence
        run: python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
      - name: Commit exact compiled plan
        run: |
          set -euo pipefail
          plan="specs/compiled/P2-V0.23.33.plan.json"
          git add "$plan"
          if git diff --cached --quiet; then
            echo 'Compiled plan already current.'
            exit 0
          fi
          git config user.name 'parallax-spec-gate'
          git config user.email 'parallax-spec-gate@users.noreply.github.com'
          git commit -m 'P2-V0.23.33 — commit protected DSPy plan'
          git push origin HEAD:ws/546-candidate-repair-plan-identity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-v02333-spec-evidence
          path: |
            specs/compiled/P2-V0.23.33.plan.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
