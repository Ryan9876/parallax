name: P2-V0.23.30 Behavior Acceptance Reconciliation

on:
  push:
    branches:
      - record/p2330-behavior-acceptance
    paths:
      - .github/workflows/tmp-p2330-behavior-record.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record/p2330-behavior-acceptance
          fetch-depth: 0
      - name: Reconcile authenticated behavior evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CURRENT-STATE.md')
          text = path.read_text()

          old_tail = ' / P2-V0.23.30 SOURCE-ANCHORED CANDIDATE VALIDATION PROFILE PRODUCTION-DEPLOYMENT-VERIFIED / AUTHENTICATED REAL-PATH ACCEPTANCE PENDING**'
          new_tail = ' / P2-V0.23.30 SOURCE-ANCHORED CANDIDATE VALIDATION PROFILE PRODUCTION-BEHAVIOR-ACCEPTED / LATER BOUNDED BLOCKER EXPOSED / P2-V0.23.31 EXPLICIT EXECUTION CONTRACT + END-TO-END ACCEPTANCE REPLAY ACTIVE**'
          if old_tail not in text:
              raise SystemExit('expected P2-V0.23.30 status tail not found')
          text = text.replace(old_tail, new_tail, 1)

          old_heading = '## P2-V0.23.30 — source-anchored candidate validation profile — PRODUCTION-DEPLOYMENT-VERIFIED / AUTHENTICATED REAL-PATH ACCEPTANCE PENDING'
          new_heading = '## P2-V0.23.30 — source-anchored candidate validation profile — PRODUCTION-BEHAVIOR-ACCEPTED / LATER BOUNDED BLOCKER EXPOSED'
          if old_heading not in text:
              raise SystemExit('expected P2-V0.23.30 heading not found')
          text = text.replace(old_heading, new_heading, 1)

          old_para = ('Deployment verification is complete. Workstream #536 remains open only for final authenticated real-path acceptance through the normal signed-in product path. Acceptance requires Engineering Run `3a1ba66a-5649-42b6-81ee-91684fe06bbc` (or equivalent exact work) to enter disposable BUILD/TEST/VERIFY under the accepted-source pinned profile, or to expose a still-later bounded blocker with server-owned diagnostics. This evidence must not be manufactured by bypassing user authentication or session ownership.')
          new_para = ('Authenticated real-path acceptance for P2-V0.23.30 is complete under the workstream’s explicit later-bounded-blocker alternative. On exact production deployment `dpl_Gygn6JBjVdPhbSkLvSKvuXrh7SGm`, the signed-in retry of Engineering Run `3a1ba66a-5649-42b6-81ee-91684fe06bbc` restored session ownership, resumed successfully, read authoritative source lineage, and exercised a real Vercel sandbox lifecycle. The subsequent IMPLEMENT request completed Luna and Terra generation and advanced candidate admission to `DISPOSABLE_CANDIDATE_VALIDATION`, where the protected runtime emitted the new bounded diagnostic `failure_kind=VALIDATION_PROFILE_ERROR`. This proves the P2-V0.23.30 classification/profile-pinning boundary is active and exposes a still-later architectural blocker: execution/validation capability remains inferred from source shape rather than being bound as an explicit project/run execution contract. Workstream #536 is closed completed; successor #539 / P2-V0.23.31 owns explicit execution-contract binding plus deterministic end-to-end acceptance replay so production users are no longer the primary fault-discovery loop.')
          if old_para not in text:
              raise SystemExit('expected P2-V0.23.30 acceptance paragraph not found')
          text = text.replace(old_para, new_para, 1)

          path.write_text(text)
          PY
      - name: Verify reconciliation
        shell: bash
        run: |
          grep -F 'P2-V0.23.30 SOURCE-ANCHORED CANDIDATE VALIDATION PROFILE PRODUCTION-BEHAVIOR-ACCEPTED / LATER BOUNDED BLOCKER EXPOSED / P2-V0.23.31 EXPLICIT EXECUTION CONTRACT + END-TO-END ACCEPTANCE REPLAY ACTIVE' CURRENT-STATE.md
          grep -F '## P2-V0.23.30 — source-anchored candidate validation profile — PRODUCTION-BEHAVIOR-ACCEPTED / LATER BOUNDED BLOCKER EXPOSED' CURRENT-STATE.md
          grep -F 'successor #539 / P2-V0.23.31' CURRENT-STATE.md
      - name: Commit reconciliation and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'Parallax Record Reconciler'
          git config user.email 'parallax-records@users.noreply.github.com'
          git add CURRENT-STATE.md
          git rm .github/workflows/tmp-p2330-behavior-record.yml
          git commit -m 'P2-V0.23.30 — record authenticated later-blocker acceptance'
          git push origin HEAD:record/p2330-behavior-acceptance
