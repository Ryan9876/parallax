name: Hotfix 245 Apply

on:
  push:
    branches:
      - hotfix/245-failure-observability
    paths:
      - .github/workflows/hotfix-245-apply.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/245-failure-observability
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/hotfix_245_patch.py
      - name: Verify syntax and markers
        run: |
          python -m py_compile services/api/parallax_api/code/run_events.py services/api/parallax_api/code/autonomy.py services/api/tests/test_run_event_runtime_integration.py
          grep -q 'mutation_applied' services/api/parallax_api/code/run_events.py
          grep -q 'live-build-durable-failure' apps/client/src/components/observability/LiveBuildWorkspace.tsx
          grep -q 'durableFailureFallback' apps/client/scripts/test-observability-projection.cjs
      - name: Commit patch and remove harness
        run: |
          rm scripts/hotfix_245_patch.py
          rm .github/workflows/hotfix-245-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'fix: surface durable implementation failures in Live Build'
          git push origin HEAD:hotfix/245-failure-observability
