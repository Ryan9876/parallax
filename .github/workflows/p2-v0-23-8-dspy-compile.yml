name: P2-V0.23.8 DSPy Compile

on:
  push:
    branches: [fix/agentic-candidate-recovery]
    paths:
      - 'specs/P2-V0.23.8.md'
      - '.github/workflows/p2-v0-23-8-dspy-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p2-v0-23-8-dspy-compile
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agentic-candidate-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'

      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:1.5b

      - name: Compile exact candidate recovery specification
        timeout-minutes: 10
        env:
          DSPY_MODEL: ollama_chat/qwen2.5-coder:1.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: python scripts/compile_spec.py specs/P2-V0.23.8.md

      - name: Verify authentic compiled evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.8.md

      - name: Commit generated plan only
        run: |
          set -euo pipefail
          git config user.name "parallax-spec-compiler"
          git config user.email "actions@users.noreply.github.com"
          git add specs/compiled/P2-V0.23.8.plan.json
          if git diff --cached --quiet; then
            echo "Compiled plan already current"
            exit 0
          fi
          git commit -m "Compile P2-V0.23.8 DSPy plan"
          git push origin HEAD:fix/agentic-candidate-recovery
