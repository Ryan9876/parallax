name: Apply P2-V0.23.5 PREPARE Runtime v3

on:
  push:
    branches:
      - p2/repository-aware-validation-toolchains
    paths:
      - .github/workflows/apply-p2-v0.23.5-prepare-runtime-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/repository-aware-validation-toolchains
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Apply governed semantic changes
        run: python scripts/apply_p2_v0_23_5_prepare.py
      - name: Validate focused contracts
        run: |
          python -m compileall -q services/api/parallax_api
          git diff --check
          pytest -q \
            services/api/tests/test_dependency_preparation.py \
            services/api/tests/test_validation_toolchains.py \
            services/api/tests/test_lineage_sandbox_execution.py \
            services/api/tests/test_w6_candidate_validation_diagnostics.py \
            services/api/tests/test_w6_s3_evidence_separation.py
      - name: Commit semantic implementation
        run: |
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add \
            services/api/parallax_api/code/validation_toolchains.py \
            services/api/parallax_api/code/agentic_runtime.py \
            services/api/parallax_api/code/lineage_sandbox_execution.py \
            services/api/tests/test_validation_toolchains.py \
            services/api/tests/test_lineage_sandbox_execution.py
          git diff --cached --check
          git commit -m "Add bounded dependency preparation for protected validation"
          git push origin HEAD:p2/repository-aware-validation-toolchains
