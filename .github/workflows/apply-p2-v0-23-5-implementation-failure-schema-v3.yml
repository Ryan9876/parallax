name: Apply implementation failure schema v3

on:
  push:
    branches:
      - fix/p2-v0-23-5-implementation-failure-schema
    paths:
      - .github/workflows/apply-p2-v0-23-5-implementation-failure-schema-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2-v0-23-5-implementation-failure-schema
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - run: python scripts/apply_p2_v0_23_5_implementation_failure_schema.py
      - run: python -m compileall -q services/api/parallax_api
      - run: pytest -q services/api/tests/test_implementation_failure_preparation_diagnostics.py services/api/tests/test_w6_candidate_validation_diagnostics.py services/api/tests/test_candidate_dependency_preparation_failure.py services/api/tests/test_dependency_preparation.py
      - run: git diff --check
      - name: Commit clean repair
        run: |
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/parallax_api/code/implementation_runtime.py services/api/tests/test_implementation_failure_preparation_diagnostics.py
          git rm .github/workflows/apply-p2-v0-23-5-implementation-failure-schema.yml .github/workflows/apply-p2-v0-23-5-implementation-failure-schema-v2.yml .github/workflows/apply-p2-v0-23-5-implementation-failure-schema-v3.yml scripts/apply_p2_v0_23_5_implementation_failure_schema.py
          git diff --cached --check
          git commit -m "Preserve bounded PREPARE diagnostics through implementation failure"
          git push origin HEAD:fix/p2-v0-23-5-implementation-failure-schema
