name: WS562 P2-V0.23.39 Reconcile

on:
  push:
    branches:
      - 'ws/562-canonical-empty-tree-replay'
    paths:
      - '.github/workflows/ws562-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/562-canonical-empty-tree-replay
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'

      - name: Apply authoritative record reconciliation
        run: python scripts/ws562_reconcile.py

      - name: Validate protected DSPy plan
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.39.md

      - name: Run focused greenfield regressions
        run: pytest -q services/api/tests/test_greenfield_github.py

      - name: Compile API
        run: python -m compileall -q services/api/parallax_api

      - name: Run full API regression suite
        run: pytest -q services/api/tests

      - name: Commit exact validated release candidate and remove temporary harnesses
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add ARCHITECTURE.md CURRENT-STATE.md
          git rm .github/workflows/ws562-spec-gate.yml .github/workflows/ws562-implementation.yml .github/workflows/ws562-reconcile.yml scripts/ws562_apply.py scripts/ws562_reconcile.py
          git diff --cached --check
          git commit -m 'Reconcile P2-V0.23.39 validated release candidate'
          git push origin HEAD:ws/562-canonical-empty-tree-replay
