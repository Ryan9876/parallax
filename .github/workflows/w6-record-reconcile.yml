name: Wave 6 record reconciliation

on:
  push:
    branches:
      - ws/w6-record-reconcile
    paths:
      - .github/workflows/w6-record-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w6-record-reconcile
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update authoritative Wave 6 records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          architecture = Path('ARCHITECTURE.md')
          text = architecture.read_text(encoding='utf-8')

          replacements = [
              ('Version: 3.7', 'Version: 3.8'),
              (
                  '  ├─ bounded candidate competition + synthesis evidence\n  ├─ conversation + Work Specification persistence',
                  '  ├─ bounded candidate competition + synthesis evidence\n  ├─ integrated agentic reference proof + Wave 5 comparison\n  ├─ conversation + Work Specification persistence',
              ),
              (
                  'Wave 6 S1-S5 are accepted on the governed Wave 6 integration branch but are not production deployments.',
                  'Wave 6 S1-S6 are accepted on the governed Wave 6 integration branch but are not production deployments. The release audit identified that ordinary Engineering Runtime composition does not yet activate the accepted S1-S5 agentic control plane, so runtime activation closure #304 / P2-V0.19.7 is required before any Wave 6 production promotion.',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'ARCHITECTURE expected text missing: {old[:80]!r}')
              text = text.replace(old, new, 1)

          s6_anchor = '## Project-scoped tool authority\n'
          if s6_anchor not in text:
              raise SystemExit('ARCHITECTURE S6 insertion anchor missing')
          s6_section = '''## Wave 6 integrated reference proof\n\nWave 6 S6 composes the accepted S1-S5 protocol, orchestration, independent-evaluation, routing/economic and competition/synthesis evidence with existing protected worker/source/delivery evidence into one deterministic read-only reference proof. It is accepted on the governed Wave 6 integration branch and creates no new execution or authority path.\n\nThe proof binds exact canonical Project ID, Engineering Run ID, Work Specification ID/revision/digest and stable acceptance IDs through S2 team/schedule identity, S3 candidate/evaluator policy, S4 routing evidence, S5 competition evidence, exact candidate/source-lineage identity and bounded verified Preview delivery evidence. Identity or lineage substitution fails closed.\n\nProtected deterministic failure and `HUMAN_REQUIRED` take precedence over quality/economic/benchmark claims. A supported integrated proof requires a READY Preview, preserved correctness/safety/privacy/governance guardrails and a material Wave 5 comparison improvement on an appropriate fixture. Benchmark dimensions distinguish observed, unknown and incomparable state; missing values are never treated as free, fast or successful.\n\nProof/recovery fingerprints are deterministic and replay-safe. Bounded worker reassignment evidence may be included, but the proof itself cannot acquire a worker lease, mutate source, accept lineage, invoke providers, route spending, transition an Engineering Run, merge, production-deploy, approve release, complete REVIEW or resolve a protected human boundary. Safe serialization excludes source bytes, patches, credentials, raw provider payloads, prompts, hidden reasoning, arbitrary commands and arbitrary URLs.\n\nS6 proves the accepted control-plane contracts and their evidence composition; it does not by itself activate those decisions in the ordinary production Engineering Runtime. Whole-product release audit therefore keeps Wave 6 production promotion blocked on #304 / P2-V0.19.7, which must attach the accepted agentic decision plane to the existing protected runtime without creating a second canonical writer or weakening the current source-lineage/validation/provider/REVIEW boundaries.\n\n'''
          text = text.replace(s6_anchor, s6_section + s6_anchor, 1)

          failure_anchor = '- competition context/policy/candidate drift, deterministic candidate failure, producer/evaluator identity conflict, stale or ineligible routing evidence, cross-Project evidence, unvalidated synthesis or replay conflict: disqualify the affected candidate or stop with bounded fallback/no-selection/HUMAN_REQUIRED; never manufacture a winner;\n'
          if failure_anchor not in text:
              raise SystemExit('ARCHITECTURE failure anchor missing')
          text = text.replace(
              failure_anchor,
              failure_anchor + '- integrated reference-proof identity/evidence drift, non-ready Preview evidence, benchmark guardrail regression or missing material improvement: return the bounded proof failure disposition; never convert benchmark evidence into execution, source acceptance, deployment or REVIEW authority;\n',
              1,
          )

          trust_old = '''16. server-owned tool capability registry;\n17. server-owned provider target/credential registry, request-scoped runtime OIDC identity, fixed hosted model transport and encoded connector wire contract;\n18. persisted provider action/audit and replay identity;\n19. protected evaluation/promotion policy;\n20. optional non-authoritative run-event projection behind migration + exact activation flag;\n21. governed logical workspace deletion with retained protected evidence, authoritative Engineering Run terminality, owner-scoped destructive authority and external-provider separation;\n22. governed production release authority plus distinct fail-closed build-time provider/source/durability/bootstrap preflights and runtime Connect/model-routing verification.\n'''
          trust_new = '''16. exact integrated S1-S5 reference-proof/benchmark identity with deterministic failure precedence, guardrail-parity requirements and no mutation/release authority;\n17. server-owned tool capability registry;\n18. server-owned provider target/credential registry, request-scoped runtime OIDC identity, fixed hosted model transport and encoded connector wire contract;\n19. persisted provider action/audit and replay identity;\n20. protected evaluation/promotion policy;\n21. optional non-authoritative run-event projection behind migration + exact activation flag;\n22. governed logical workspace deletion with retained protected evidence, authoritative Engineering Run terminality, owner-scoped destructive authority and external-provider separation;\n23. governed production release authority plus distinct fail-closed build-time provider/source/durability/bootstrap preflights and runtime Connect/model-routing verification.\n'''
          if trust_old not in text:
              raise SystemExit('ARCHITECTURE trust-boundary block missing')
          text = text.replace(trust_old, trust_new, 1)
          architecture.write_text(text, encoding='utf-8')

          current = Path('CURRENT-STATE.md')
          state = current.read_text(encoding='utf-8')
          status_re = re.compile(r'^Status: \*\*.*?\*\*$', re.MULTILINE)
          status = 'Status: **WAVE 5 PRODUCTION BASELINE RETAINED / MOBILE #261/#262 PRODUCTION-VERIFIED / RESPONSE-STREAM #271/#272 PRODUCTION-VERIFIED / P2-V0.18.10 MODEL-TRANSPORT STABILIZATION RETAINED / SAFE DELETION CORRECTIVE P2-V0.18.12 PRODUCTION-DEPLOYED AND INFRASTRUCTURE-VERIFIED / FINAL SAFE-DELETION ACCEPTANCE PENDING AUTHENTICATED POST-CUTOVER SMOKE / CLIENT READY / API READY / WAVE 6 CONTROL #263 ACTIVE / S1-S6 ACCEPTED AND INTEGRATED / CUMULATIVE S1-S6 CHECKPOINT VALIDATED / WAVE 6 NOT DEPLOYED / RELEASE AUDIT FOUND LIVE RUNTIME-ACTIVATION GAP / #304 P2-V0.19.7 SPEC-FIRST CLOSURE ACTIVE / PRODUCTION PROMOTION BLOCKED PENDING RUNTIME ACTIVATION + RELEASE PROOF**'
          state, count = status_re.subn(status, state, count=1)
          if count != 1:
              raise SystemExit('CURRENT-STATE status line replacement failed')

          old_wave_paragraph = re.compile(
              r'Wave 6 S1-S5 remain accepted development architecture and are \*\*not\*\* production deployments\..*?production remains unchanged\.\n',
              re.DOTALL,
          )
          new_wave_paragraph = '''Wave 6 S1-S6 are accepted development architecture and are **not** production deployments. The production-synchronized S1-S5 checkpoint was extended by accepted S6 worker head `75d6a51f8d014e70772a54f032370ead64c965bb`, merged through PR #300 into `integration/wave6-agentic-control-plane` as `01dda9f0328ca3f6ce2cf31f9c236c4603cef638`. Exact worker gates Workstream #485, Bounded Autonomy #692 and P2 CI #1096 passed, followed by fresh cumulative integration-head Workstream #486, Bounded Autonomy #693 and P2 CI #1097. Temporary validation PR #302 was closed without merge to `main`; production remains unchanged.\n\nWhole-product release audit then found a material activation gap: the Wave 6 delta provides accepted S1-S6 protocols/decision layers/reference proof, but ordinary `EngineeringRuntimeComposition` / `AutonomyCoordinator` does not yet invoke the S1-S5 agentic control plane during a normal build. Shipping that state would deploy validated primitives without fulfilling the operator-facing Wave 6 runtime objective. Control Tower therefore opened #304 / `P2-V0.19.7` as a required runtime-activation release closure. No Wave 6 production promotion is authorized until that closure is integrated and release-qualified.\n'''
          state, count = old_wave_paragraph.subn(new_wave_paragraph, state, count=1)
          if count != 1:
              raise SystemExit('CURRENT-STATE production Wave 6 paragraph replacement failed')

          start = state.find('## Wave 6 — Agentic Development Control Plane\n')
          end = state.find('## Rollback\n', start)
          if start < 0 or end < 0:
              raise SystemExit('CURRENT-STATE Wave 6 section bounds missing')
          wave_section = '''## Wave 6 — Agentic Development Control Plane\n\nControl Tower: #263.  \nAuthoritative integration branch: `integration/wave6-agentic-control-plane`.  \nCurrent accepted S1-S6 integration head: `01dda9f0328ca3f6ce2cf31f9c236c4603cef638`.  \nCurrent production baseline: `main@a455b223ad4707aa7fe2ccd3470a5e7640c40da2`.  \nWave 6 production deployment: **none**.\n\n### Accepted cumulative S1-S6 evidence\n\n- accepted production-synchronized S1-S5 checkpoint: `f8b5bcd9b40f13777c16e3d323030b814dc4fa86`;\n- S6 authorized record parent: `fed6662c0d7d228b714c31237ec5088076b9a2aa`;\n- S6 exact validated worker head: `75d6a51f8d014e70772a54f032370ead64c965bb`;\n- S6 canonical PR #300: **MERGED TO INTEGRATION ONLY**;\n- resulting cumulative integration head: `01dda9f0328ca3f6ce2cf31f9c236c4603cef638`;\n- S6 worker Workstream Spec Validation #485 — **PASS**;\n- S6 worker Bounded Autonomy Pilot #692 — **PASS**;\n- S6 worker Parallax P2 CI #1096 — **PASS**;\n- cumulative integration Workstream Spec Validation #486 — **PASS**;\n- cumulative integration Bounded Autonomy Pilot #693 — **PASS**;\n- cumulative integration Parallax P2 CI #1097 — **PASS**;\n- temporary main-targeted validation PR #302: **CLOSED WITHOUT MERGE**;\n- long-lived PR #275 remains **DRAFT / DO NOT MERGE** and is not a production release candidate.\n\nAccepted/integrated semantic state:\n\n1. #264 / S1 Agent Adapter & Evidence Protocol — **COMPLETE / ACCEPTED / INTEGRATED**;\n2. #265 / S2 Dynamic Development Team Orchestration — **COMPLETE / ACCEPTED / INTEGRATED**;\n3. #266 / S3 Independent Evaluation & Quality Judgment — **COMPLETE / ACCEPTED / INTEGRATED**;\n4. #267 / S4 Outcome Routing & Development Economics — **COMPLETE / ACCEPTED / INTEGRATED**;\n5. #281 repository source-tree capacity prerequisite — **COMPLETE / ACCEPTED / INTEGRATED**;\n6. #268 / S5 Candidate Competition & Synthesis — **COMPLETE / ACCEPTED / INTEGRATED**;\n7. #269 / S6 Agentic Development Integrated Reference Proof — **COMPLETE / ACCEPTED / INTEGRATED**.\n\n### Release-closure decision — #304 / P2-V0.19.7\n\nAfter S1-S6 integration, a whole-product audit compared the accepted Wave 6 objective with the actual integration diff and live runtime composition. The accepted Wave 6 production-code delta adds the agent protocol, team orchestration, independent judgment, routing/economics, competition/synthesis and integrated reference proof, but does not modify the ordinary `EngineeringRuntimeComposition`, `AutonomyCoordinator` or `ProtectedImplementationRuntime` path to invoke those decisions for a normal Engineering Run.\n\nThat gap is material: deploying `01dda9f...` would make the primitives importable and validated but would not make the normal Parallax build flow automatically select/manage one or more agents. Control Tower therefore treats Wave 6 as **integrated but not production-release-qualified**.\n\n#304 / `W6-R1` / `P2-V0.19.7` is the required closure workstream. Its branch is `p2/w6-runtime-activation`, based exactly on `01dda9f0328ca3f6ce2cf31f9c236c4603cef638`. It is spec-first and must activate the accepted S1-S5 decision plane inside the existing single-writer protected Engineering Run/source-lineage/BUILD/TEST/VERIFY/Preview/REVIEW path without inventing a second authority path. Production promotion remains blocked until #304 is validated, accepted, integrated, record-reconciled and separately release-verified.\n\n'''
          state = state[:start] + wave_section + state[end:]
          current.write_text(state, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit records
        run: |
          rm .github/workflows/w6-record-reconcile.yml
          git config user.name "Parallax Control Tower"
          git config user.email "actions@users.noreply.github.com"
          git add ARCHITECTURE.md CURRENT-STATE.md .github/workflows/w6-record-reconcile.yml
          git diff --cached --check
          git commit -m "docs: reconcile Wave 6 integration and runtime-activation gate"
          git push origin HEAD:ws/w6-record-reconcile
