name: Run Wave 6 production state reconciliation

on:
  push:
    branches: [records/w6-production-infrastructure-state]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: records/w6-production-infrastructure-state
          fetch-depth: 0
      - name: Apply authoritative state patch
        run: |
          python .github/reconcile_w6_production_state.py
          git diff --check
          git rm -f .github/workflows/apply-w6-production-infrastructure-state.yml
          git rm -f .github/workflows/run-w6-record-reconcile.yml
          git rm -f .github/reconcile_w6_production_state.py
          git add CURRENT-STATE.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(state): record Wave 6 production infrastructure activation'
          git push origin HEAD:records/w6-production-infrastructure-state
