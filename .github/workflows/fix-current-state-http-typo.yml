name: Fix Current State HTTP Typo

on:
  push:
    branches:
      - docs/fix-current-state-http-typo
    paths:
      - .github/workflows/fix-current-state-http-typo.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-current-state-http-typo
          fetch-depth: 0
      - name: Correct authoritative record typo
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CURRENT-STATE.md')
          text = path.read_text()
          if 'HTTT 200' not in text:
              raise SystemExit('Expected typo anchor missing')
          path.write_text(text.replace('HTTT 200', 'HTTP 200', 1))
          PY
      - name: Commit correction
        run: |
          git config user.name "parallax-record-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT-STATE.md
          git commit -m "Fix CURRENT-STATE client HTTP status typo"
          git push origin HEAD:docs/fix-current-state-http-typo
