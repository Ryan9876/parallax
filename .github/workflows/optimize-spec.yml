name: DSPy Spec Optimization

on:
  push:
    branches:
      - 'p2/**'
    paths:
      - 'specs/**'
      - 'scripts/compile_spec.py'
      - 'scripts/optimize_spec.py'
      - 'scripts/validate_spec.py'
      - 'services/api/parallax_api/intelligence/**'
      - '.github/workflows/optimize-spec.yml'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SPEC_PATH: specs/P2-V0.20.6.md
      DSPY_MODEL: ollama_chat/llama3.2:1b
      DSPY_API_BASE: http://127.0.0.1:11434
      DSPY_API_KEY: ''
      DSPY_LOCAL_DEVELOPMENT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate approved S6 contract before compilation
        run: python scripts/validate_spec.py "$SPEC_PATH" --spec-only
      - name: Install credential-free local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b
      - name: Run DSPy SpecCritic and SpecCompiler
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Verify protected DSPy evidence contract
        run: python scripts/validate_spec.py "$SPEC_PATH" --require-dspy
      - name: Record exact development evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('specs/compiled/dspy-run-status.json')
          path.write_text(json.dumps({
              'executed': True,
              'spec_compiler_executed': True,
              'spec_critic_executed': True,
              'model': 'ollama_chat/llama3.2:1b',
              'provider_backed': False,
              'local_development_view': True,
              'compiler_artifact': 'P2-V0.20.6.plan.json',
              'purpose': 'W7-S6 authentic DSPy development evidence; protected metrics still gate integration/release.'
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Persist exact generated plan to evidence branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/compiled/P2-V0.20.6.plan.json
          if git diff --cached --quiet; then
            echo 'Generated plan already committed.'
          else
            git commit -m 'W7-S6: persist authentic DSPy plan [dspy evidence]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w7-s6-dspy-spec-evidence
          path: |
            specs/compiled/P2-V0.20.6.plan.json
            specs/compiled/dspy-run-status.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
