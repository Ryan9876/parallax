name: WS70 Helper Validate and Compile

on:
  push:
    branches:
      - 'p2/ws70-validate'
    paths:
      - '.github/workflows/optimize-spec.yml'

permissions:
  contents: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/app-provider-clients
          fetch-depth: 0
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: python -m pip install -e 'services/api[dev]'
      - name: Validate workstream specification
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.15.7.md
      - name: Run focused provider-client tests
        run: python -m pytest -q services/api/tests/test_provider_client_spec.py services/api/tests/test_provider_clients.py services/api/tests/test_provider_client_security.py
      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen2.5:0.5b
      - name: Compile and validate P2-V0.15.7
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:0.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: |
          python scripts/compile_spec.py specs/P2-V0.15.7.md
          python scripts/validate_spec.py specs/P2-V0.15.7.md --require-dspy
      - name: Commit generated plan to worker branch
        run: |
          set -euo pipefail
          PLAN=specs/compiled/P2-V0.15.7.plan.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PLAN"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'spec: compile P2-V0.15.7 protected plan'
          git push origin HEAD:ws/app-provider-clients
      - name: Record success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_SHA: ${{ steps.head.outputs.sha }}
        run: gh issue comment 70 --body "WS70 helper validation SUCCESS: run ${GITHUB_RUN_ID}, worker head ${WORKER_SHA}. Focused tests and DSPy compile/require-dspy passed; generated plan was committed if changed."
      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_SHA: ${{ steps.head.outputs.sha }}
        run: gh issue comment 70 --body "WS70 helper validation FAILED: run ${GITHUB_RUN_ID}, worker head ${WORKER_SHA}. No success claim; inspect the named failed step before continuing."
