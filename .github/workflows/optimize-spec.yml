name: DSPy P2-V0.16.2 Compiler

on:
  push:
    branches: [p2/w3-visual-validation-compiler]
    paths:
      - 'specs/P2-V0.16.2.md'
      - 'scripts/compile_spec.py'
      - 'services/api/parallax_api/intelligence/**'
      - '.github/workflows/optimize-spec.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPEC_PATH: specs/P2-V0.16.2.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - run: python scripts/validate_spec.py --spec-only "$SPEC_PATH"

      - id: credentials
        name: Select DSPy development model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo 'provider=true' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=openai/gpt-5.6-sol' >> "$GITHUB_ENV"
          else
            echo 'provider=false' >> "$GITHUB_OUTPUT"
            echo 'DSPY_MODEL=ollama_chat/llama3.2:1b' >> "$GITHUB_ENV"
            echo 'DSPY_API_BASE=http://127.0.0.1:11434' >> "$GITHUB_ENV"
            echo 'DSPY_API_KEY=' >> "$GITHUB_ENV"
            echo 'DSPY_LOCAL_DEVELOPMENT=1' >> "$GITHUB_ENV"
          fi

      - name: Install local Ollama development LM
        if: steps.credentials.outputs.provider == 'false'
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b

      - name: Compile exact approved spec with DSPy critic + compiler
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py "$SPEC_PATH"

      - name: Validate protected DSPy plan evidence
        run: python scripts/validate_spec.py --require-dspy "$SPEC_PATH"

      - name: Commit generated plan only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/compiled/P2-V0.16.2.plan.json
          if git diff --cached --quiet; then
            echo 'Generated plan is already committed.'
            exit 0
          fi
          git commit -m 'Compile P2-V0.16.2 DSPy plan [skip ci]'
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-v0-16-2-dspy-evidence
          path: |
            specs/compiled/P2-V0.16.2.plan.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
