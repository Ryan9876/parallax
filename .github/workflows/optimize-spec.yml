name: DSPy Spec Optimization

on:
  workflow_dispatch:
  push:
    branches: ['p2/**']
    paths:
      - 'specs/**'
      - '.github/workflows/optimize-spec.yml'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SPEC_PATH: specs/P2-V0.22.2.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - run: python scripts/validate_spec.py --spec-only "$SPEC_PATH"
      - name: Configure credential-free DSPy compiler
        run: |
          echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
          echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
          echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
          echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
      - name: Install local Ollama development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Compile approved spec with DSPy critic + compiler
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Verify compiled plan against protected contract
        run: python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspy-spec-evidence
          path: |
            specs/compiled/P2-V0.22.2.plan.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
