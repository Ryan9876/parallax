name: DSPy Spec Optimization

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Specification path
        required: true
        default: specs/P2-V0.1.0.md
  push:
    branches:
      - 'p2/**'
    paths:
      - 'specs/**'
      - 'scripts/compile_spec.py'
      - 'scripts/optimize_spec.py'
      - 'services/api/parallax_api/intelligence/**'
      - 'services/api/tests/test_metrics.py'
      - '.github/workflows/optimize-spec.yml'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SPEC_PATH: ${{ github.event.inputs.spec || 'specs/P2-V0.1.0.md' }}
      DSPY_MODEL: openai/gpt-5.6-sol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - run: python scripts/validate_spec.py "$SPEC_PATH"

      - id: credentials
        name: Detect provider credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo '{"executed":false,"reason":"provider-backed run started"}' > specs/compiled/dspy-run-status.json
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo '{"executed":false,"reason":"OPENAI_API_KEY secret is not configured"}' > specs/compiled/dspy-run-status.json
            echo "DSPy provider run skipped because OPENAI_API_KEY is not configured."
          fi

      - name: Compile spec with DSPy critic + compiler
        if: steps.credentials.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py "$SPEC_PATH"

      - name: Optimize SpecCompiler with MIPROv2
        if: steps.credentials.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/optimize_spec.py "$SPEC_PATH"

      - name: Record successful DSPy evidence
        if: steps.credentials.outputs.available == 'true' && success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('specs/compiled/dspy-run-status.json')
          path.write_text(json.dumps({
              'executed': True,
              'model': 'openai/gpt-5.6-sol',
              'compiler_artifact': 'P2-V0.1.0.plan.json',
              'optimizer_artifact': 'optimized-program.json',
              'evidence_artifact': 'optimized-program-evidence.json'
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspy-spec-evidence
          path: |
            specs/compiled/P2-V0.1.0.plan.json
            specs/compiled/optimized-program.json
            specs/compiled/optimized-program-evidence.json
            specs/compiled/dspy-run-status.json
          if-no-files-found: warn
          retention-days: 14
