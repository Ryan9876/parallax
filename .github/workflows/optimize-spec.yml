name: DSPy Spec Optimization

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Specification path
        required: true
        default: specs/P2-V0.22.2.md
  push:
    branches:
      - 'p2/**'
    paths:
      - 'specs/**'
      - 'scripts/compile_spec.py'
      - 'scripts/optimize_spec.py'
      - 'services/api/parallax_api/intelligence/**'
      - 'services/api/tests/test_metrics.py'
      - '.github/workflows/optimize-spec.yml'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SPEC_PATH: ${{ github.event.inputs.spec || 'specs/P2-V0.22.2.md' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - run: python scripts/validate_spec.py --spec-only "$SPEC_PATH"
      - id: credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "model=openai/gpt-5.6-sol" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "model=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi
      - name: Install local Ollama development LM
        if: steps.credentials.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Compile approved spec with DSPy critic + compiler
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Verify compiled plan
        run: python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspy-spec-evidence
          path: |
            specs/compiled/P2-V0.22.2.plan.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
