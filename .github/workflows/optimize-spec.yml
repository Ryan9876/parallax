name: Wave 5 Deployment Record Sync

on:
  push:
    branches:
      - 'release/w5-deployment-record'
    paths:
      - '.github/workflows/optimize-spec.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/w5-deployment-record
          fetch-depth: 2
      - name: Verify exact Wave 5 release parent
        run: |
          test "$(git rev-parse HEAD^)" = "c39b5352be940f4052baa65c7cdd9d7c3ec773bb"
      - name: Record deployment-verified Wave 5 state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CURRENT-STATE.md')
          state = path.read_text(encoding='utf-8')
          lines = state.splitlines()

          for index, line in enumerate(lines):
              if line.startswith('Release: '):
                  lines[index] = 'Release: Wave 5 generalized application delivery is **deployment-verified in production**. Validated release candidate `2fb01805ba612228d116ca4c4d8d0980d7886007` merged to `main` as `c39b5352be940f4052baa65c7cdd9d7c3ec773bb`; production API deployment `dpl_9fdjDUX73b8VDcRA2ipVuXhwtgKc` is READY on that exact merge SHA. The Wave 5 release has no client-runtime changes, so the existing deployment-verified client `dpl_HxCGSRkEuJJ6qmHwokwPSM6XMcEn` remains current production.'
                  break
          else:
              raise SystemExit('CURRENT-STATE Release marker not found')

          for index, line in enumerate(lines):
              if line.startswith('Status: '):
                  lines[index] = 'Status: **WAVE 5 RELEASED / PRODUCTION DEPLOYMENT-VERIFIED / API READY / CLIENT RETAINED AND VERIFIED / HUMAN REVIEW BOUNDARY PRESERVED / ROLLBACK AVAILABLE / SINGLE-USER PRODUCTION PROMOTION STANDING AUTHORITY ACTIVE**'
                  break
          else:
              raise SystemExit('CURRENT-STATE Status marker not found')

          state = '\n'.join(lines) + '\n'

          wave5_start = state.index('## Wave 5 validated integration state\n')
          production_start = state.index('## Current production truth\n')
          wave5 = '''## Wave 5 production release and deployment verification\n\nControl Tower #215 accepted and serialized all six Wave 5 workstreams through S6 #221. Expected-head S6 integration produced cumulative code head `14961d06d5e3b1c83f9d45c94bcc0727a2ec115a`, which passed Workstream Spec Validation #346 (`32916448744`), Bounded Autonomy #548 (`32916448731`), P2 CI #905 (`32916448734`) and the applicable Vercel Preview checks. Authoritative record synchronization then produced final release candidate `2fb01805ba612228d116ca4c4d8d0980d7886007`; that exact head passed Workstream Spec Validation #350 (`32916927549`), Bounded Autonomy #552 (`32916927563`), P2 CI #909 (`32916927597`), full API regression, browser/Skia acceptance, protected Code/Engineering/Reason promotion evaluation and regression rejection, release DSPy compilation/plan verification, and both Vercel release checks.\n\nExpected-head PR #241 merged the validated release candidate to `main` as `c39b5352be940f4052baa65c7cdd9d7c3ec773bb`. The release diff contains the Wave 5 repository-intelligence, governed-skill, service-binding, objective-orchestration, validated-memory, generalization-proof, tests/specs/benchmark, and authoritative-record changes only. It contains no database migration, production environment/configuration change, credential change, provider-authority mutation or client-runtime change.\n\nProduction deployment verification on 2026-08-25 established:\n\n- Vercel API deployment `dpl_9fdjDUX73b8VDcRA2ipVuXhwtgKc` is `READY`, target `production`, bound to exact Git SHA `c39b5352be940f4052baa65c7cdd9d7c3ec773bb`, with `aliasError=null` and aliases `parallax-api-tan.vercel.app`, `parallax-api-lew7.vercel.app`, and `parallax-api-git-main-lew7.vercel.app`.\n- the production API build passed provider registration/source-tree/private-Blob verification, exact repository delivery-permission verification, projected-source validation, private immutable Blob get/put/get, lineage composition plus metadata rollback, projected bootstrap plus process recreation/replay/no-stage-mutation/project rollback, execution-snapshot deny-all/offline-dependency verification, and the Wave 4 run-event schema guard;\n- `https://parallax-api-tan.vercel.app/health` returned HTTP 200 with `status=ok`;\n- `https://parallax-api-tan.vercel.app/ready` returned HTTP 200 with `status=ready`, `database=ok`, `providers=ok`, and exactly one registered provider target;\n- unauthenticated `https://parallax-api-tan.vercel.app/v1/projects` returned HTTP 401 with `Authentication required` and a Bearer challenge;\n- the project-level runtime-error query for the post-cutover hour returned no runtime errors, and deployment-scoped `error`/`fatal` logs returned no entries.\n- Wave 5 contains no client-runtime change. Vercel therefore canceled/ignored the `main@c39b5352...` client production build as non-app-affecting, while deployment `dpl_HxCGSRkEuJJ6qmHwokwPSM6XMcEn` remains `READY`, `aliasError=null`, retains `parallax-ashy-one-20.vercel.app`, `parallax-lew7.vercel.app`, and `parallax-git-main-lew7.vercel.app`, and the production alias returned HTTP 200 after the API cutover.\n\nThe integrated Wave 5 capability set is now production-released at the source/application boundary: deterministic repository compatibility evidence; exact-digest governed skills constrained by server-owned capabilities; Project-scoped logical service bindings with opaque secret slots; exact Project/run/Work Specification/repository-profile objective orchestration with fail-closed `HUMAN_REQUIRED`; provenance-bound private-by-default validated engineering memory with explicit sanitized sharing and unchanged fresh-validation requirements; and the permanent multi-shape generalization/reference proof. `REVIEW` / `HUMAN_REQUIRED` remains the autonomous ceiling, and no Wave 5 memory/skill/repository evidence surface can grant execution, provider, deployment or approval authority.\n\n`ARCHITECTURE.md` v3.1 remains the durable architecture record for these contracts. `PROJECT-CONSTITUTION.md` and `DESIGN-SYSTEM.md` remain unchanged because Wave 5 did not change constitutional authority or the visual language.\n\n'''
          state = state[:wave5_start] + wave5 + state[production_start:]

          current_start = state.index('## Current production truth\n')
          history_start = state.index('## Wave 4 autonomous IMPLEMENT progression recovery\n')
          current = '''## Current production truth\n\nThe deployment-verified production API/runtime binary is Vercel deployment `dpl_9fdjDUX73b8VDcRA2ipVuXhwtgKc` from Wave 5 release merge `main@c39b5352be940f4052baa65c7cdd9d7c3ec773bb`. It is `READY`, has no alias error, and owns `parallax-api-tan.vercel.app`, `parallax-api-lew7.vercel.app`, and `parallax-api-git-main-lew7.vercel.app`. Live post-cutover health/readiness/authentication checks and deployment-scoped runtime-error scans are clean as recorded above.\n\nThe deployment-verified production client remains Vercel deployment `dpl_HxCGSRkEuJJ6qmHwokwPSM6XMcEn` from application head `main@ff8e2395df081ebff376d703dfd97f3c10008240`. Wave 5 changes no client-runtime file, so its release-triggered client deployment was canceled/ignored as expected rather than replacing the binary. The retained client is `READY`, has no alias error, owns `parallax-ashy-one-20.vercel.app`, `parallax-lew7.vercel.app`, and `parallax-git-main-lew7.vercel.app`, and served HTTP 200 after the Wave 5 API cutover.\n\nThe exact Wave 5 release candidate `2fb01805ba612228d116ca4c4d8d0980d7886007` passed Parallax P2 CI #909, Bounded Autonomy Pilot #552, Workstream Spec Validation #350, protected promotion evaluation, release DSPy compilation/plan verification, full API regression, browser/Skia acceptance, and both Vercel release checks before expected-head merge. The pure cumulative S1-S6 code head `14961d06d5e3b1c83f9d45c94bcc0727a2ec115a` had independently passed P2 CI #905, Bounded Autonomy #548, Workstream #346 and its applicable Vercel Preview checks before authoritative record synchronization.\n\nThe immediately preceding known-good API production deployment `dpl_ExFCK2iMVDbJbRiBZcL4faspHaw5` from `main@ff8e2395df081ebff376d703dfd97f3c10008240` remains `READY` and is the immediate application rollback reference for Wave 5. The older API rollback deployment `dpl_2L4R6g3em7LJc7XWdRp5rueGFRK1` remains available as an earlier known-good reference. Routine rollback remains non-destructive and follows the existing flag-first/application-deployment policy.\n\nThe client did not change in Wave 5. Its immediately preceding known-good fallback `dpl_vDHBaGyi4q3pAGvNpULJwi8p95RR` remains available as the client rollback candidate, while current production remains `dpl_HxCGSRkEuJJ6qmHwokwPSM6XMcEn`.\n\nThis post-cutover `CURRENT-STATE.md` reconciliation is a record-only repository change. It must not be treated as a new application/runtime binary release when merged; the Wave 5 application deployment identity remains `main@c39b5352be940f4052baa65c7cdd9d7c3ec773bb` / API deployment `dpl_9fdjDUX73b8VDcRA2ipVuXhwtgKc`.\n\n'''
          state = state[:current_start] + current + state[history_start:]
          path.write_text(state, encoding='utf-8')
          PY
      - name: Restore canonical workflow and commit record-only reconciliation
        run: |
          git show c39b5352be940f4052baa65c7cdd9d7c3ec773bb:.github/workflows/optimize-spec.yml > .github/workflows/optimize-spec.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT-STATE.md .github/workflows/optimize-spec.yml
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/optimize-spec.yml CURRENT-STATE.md | sort)"
          test "$changed" = "$expected"
          test "$(git hash-object .github/workflows/optimize-spec.yml)" = "6478b5ac11eeedbd5b4d4711feb4193394ac1bdd"
          git commit -m "docs(state): record Wave 5 deployment verification"
          git push origin HEAD:release/w5-deployment-record
