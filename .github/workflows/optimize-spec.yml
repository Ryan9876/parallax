name: DSPy Spec Optimization

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Specification path
        required: true
        default: specs/P2-V0.18.8.md
  push:
    branches:
      - 'p2/**'
      - 'ws/response-rate-limit-recovery'
    paths:
      - 'specs/**'
      - 'scripts/compile_spec.py'
      - 'scripts/optimize_spec.py'
      - 'services/api/parallax_api/intelligence/**'
      - 'services/api/tests/test_metrics.py'
      - '.github/workflows/optimize-spec.yml'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SPEC_PATH: ${{ github.event.inputs.spec || 'specs/P2-V0.18.8.md' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Validate approved spec contract before DSPy compilation
        run: python scripts/validate_spec.py "$SPEC_PATH" --spec-only

      - id: credentials
        name: Select DSPy development model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "model=openai/gpt-5.6-sol" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "model=ollama_chat/llama3.2:1b" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/llama3.2:1b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi

      - name: Install local Ollama development LM
        if: steps.credentials.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b

      - name: Compile approved spec with DSPy critic + compiler
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py "$SPEC_PATH"

      - name: Validate authentic compiled plan
        run: python scripts/validate_spec.py "$SPEC_PATH" --require-dspy

      - name: Optimize SpecCompiler with MIPROv2
        if: steps.credentials.outputs.provider == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/optimize_spec.py "$SPEC_PATH"

      - name: Record DSPy development evidence
        if: success()
        env:
          PROVIDER: ${{ steps.credentials.outputs.provider }}
          MODEL: ${{ steps.credentials.outputs.model }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          provider = os.environ['PROVIDER'] == 'true'
          path = Path('specs/compiled/dspy-run-status.json')
          path.write_text(json.dumps({
              'executed': True,
              'spec_compiler_executed': True,
              'spec_critic_executed': True,
              'model': os.environ['MODEL'],
              'provider_backed': provider,
              'optimizer_executed': provider,
              'compiler_artifact': 'P2-V0.18.8.plan.json',
              'optimizer_artifact': 'optimized-program.json' if provider else None,
              'evidence_artifact': 'optimized-program-evidence.json' if provider else None,
              'purpose': 'Production stabilization #271 development-method evidence; protected metrics still gate implementation and promotion.'
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspy-spec-evidence-P2-V0.18.8
          path: |
            specs/compiled/P2-V0.18.8.plan.json
            specs/compiled/optimized-program.json
            specs/compiled/optimized-program-evidence.json
            specs/compiled/dspy-run-status.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
