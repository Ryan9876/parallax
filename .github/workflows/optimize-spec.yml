name: DSPy Spec Optimization

on:
  push:
    branches:
      - 'p2/w7-s1-parallaxbench-evidence'
    paths:
      - 'specs/P2-V0.20.1.md'
      - '.github/workflows/optimize-spec.yml'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SPEC_PATH: specs/P2-V0.20.1.md
      DSPY_MODEL: ollama_chat/llama3.2:1b
      DSPY_API_BASE: http://127.0.0.1:11434
      DSPY_API_KEY: ''
      DSPY_LOCAL_DEVELOPMENT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Validate specification contract before compilation
        run: python scripts/validate_spec.py "$SPEC_PATH" --spec-only
      - name: Install local Ollama development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b
      - name: Compile exact Wave 7 S1 spec with DSPy SpecCritic + SpecCompiler
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Verify protected compiled plan
        run: python scripts/validate_spec.py "$SPEC_PATH" --require-dspy
      - name: Emit exact plan evidence
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('specs/compiled/P2-V0.20.1.plan.json')
          raw = path.read_bytes()
          print('PARALLAXBENCH_PLAN_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('PARALLAXBENCH_PLAN_BEGIN')
          print(raw.decode('utf-8'))
          print('PARALLAXBENCH_PLAN_END')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dspy-w7-s1-parallaxbench-evidence
          path: |
            specs/compiled/P2-V0.20.1.plan.json
            /tmp/ollama.log
          if-no-files-found: error
          retention-days: 14
