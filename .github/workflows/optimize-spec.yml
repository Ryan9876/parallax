name: S6 Mechanical Test Correction

on:
  push:
    branches:
      - 'ws/w5-generalization-proof'
    paths:
      - '.github/workflows/optimize-spec.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w5-generalization-proof
          fetch-depth: 0

      - name: Apply exact S6-owned test fixture corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/tests/test_wave5_generalization.py')
          text = path.read_text(encoding='utf-8')

          replacements = (
              (
                  'def _runtime_environment(tmp_path: Path):\n    engine = make_engine',
                  'def _runtime_environment(tmp_path: Path):\n    tmp_path.mkdir(parents=True, exist_ok=True)\n    engine = make_engine',
              ),
              (
                  'def _correction_run(tmp_path: Path):\n    engine = make_engine',
                  'def _correction_run(tmp_path: Path):\n    tmp_path.mkdir(parents=True, exist_ok=True)\n    engine = make_engine',
              ),
              (
                  '                acceptance_criteria=["Fresh corrected lineage passes protected validation."],',
                  '                acceptance_criteria=[\n                    "Fresh corrected lineage passes protected validation.",\n                    "Accepted Work Specification and evaluator policy remain unchanged during correction.",\n                ],',
              ),
          )

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Restore canonical workflow and commit only mechanical correction
        run: |
          git checkout a1280eeb078a8c40dadd8aa46e1910e199d4f2a3 -- .github/workflows/optimize-spec.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/tests/test_wave5_generalization.py .github/workflows/optimize-spec.yml
          printf '%s\n' \
            '.github/workflows/optimize-spec.yml' \
            'services/api/tests/test_wave5_generalization.py' > /tmp/expected-paths
          git diff --cached --name-only | sort > /tmp/actual-paths
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git commit -m "test(w5): fix generalization proof fixtures"
          git push origin HEAD:ws/w5-generalization-proof
