name: DSPy Spec Optimization

on:
  push:
    branches:
      - 'p2/**'
    paths:
      - 'specs/**'
      - 'scripts/compile_spec.py'
      - 'services/api/parallax_api/intelligence/**'
      - '.github/workflows/optimize-spec.yml'

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[dspy evidence]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SPEC_PATH: specs/P2-V0.20.5.md
      PLAN_PATH: specs/compiled/P2-V0.20.5.plan.json
      DSPY_MODEL: ollama_chat/llama3.2:1b
      DSPY_API_BASE: http://127.0.0.1:11434
      DSPY_API_KEY: ''
      DSPY_LOCAL_DEVELOPMENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate approved S5 contract before compilation
        run: python scripts/validate_spec.py "$SPEC_PATH" --spec-only
      - name: Install credential-free local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b
      - name: Run DSPy SpecCritic and SpecCompiler
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Verify protected DSPy evidence contract
        run: python scripts/validate_spec.py "$SPEC_PATH" --require-dspy
      - name: Record exact development evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          plan = Path('specs/compiled/P2-V0.20.5.plan.json')
          digest = hashlib.sha256(plan.read_bytes()).hexdigest()
          Path('specs/compiled/dspy-run-status.json').write_text(json.dumps({
              'executed': True,
              'spec_id': 'P2-V0.20.5',
              'spec_compiler_executed': True,
              'spec_critic_executed': True,
              'model': 'ollama_chat/llama3.2:1b',
              'provider_backed': False,
              'local_development_view': True,
              'compiler_artifact': 'P2-V0.20.5.plan.json',
              'plan_sha256': digest,
              'purpose': 'Authentic DSPy development-method evidence; protected deterministic metrics remain authoritative.'
          }, indent=2) + '\n', encoding='utf-8')
          print(f'P2-V0.20.5 plan sha256={digest}')
          PY
      - name: Persist exact generated plan to evidence branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PLAN_PATH"
          if git diff --cached --quiet; then
            echo 'Generated plan already matches branch.'
            exit 0
          fi
          git commit -m 'W7-S5: persist authentic DSPy plan [dspy evidence]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w7-s5-dspy-spec-evidence
          path: |
            specs/compiled/P2-V0.20.5.plan.json
            specs/compiled/dspy-run-status.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
