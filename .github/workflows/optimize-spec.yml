name: WS70 Helper Compile Protected Plan

on:
  push:
    branches:
      - 'p2/ws70-plan'
    paths:
      - 'specs/P2-V0.15.7.md'
      - '.github/workflows/optimize-spec.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install -e 'services/api[dev]'
      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen2.5:0.5b
      - name: Compile and validate P2-V0.15.7
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:0.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: |
          python scripts/compile_spec.py specs/P2-V0.15.7.md
          python scripts/validate_spec.py specs/P2-V0.15.7.md --require-dspy
      - name: Commit generated plan to worker branch
        run: |
          set -euo pipefail
          PLAN=specs/compiled/P2-V0.15.7.plan.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin ws/app-provider-clients
          git checkout -B ws/app-provider-clients origin/ws/app-provider-clients
          git checkout "$GITHUB_SHA" -- "$PLAN"
          git add "$PLAN"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'spec: compile P2-V0.15.7 protected plan'
          git push origin HEAD:ws/app-provider-clients
