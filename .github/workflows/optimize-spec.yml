name: DSPy Spec Optimization

on:
  workflow_dispatch:
  push:
    branches:
      - 'ws/w5-validated-memory'
    paths:
      - 'specs/P2-V0.18.5.md'
      - '.github/workflows/optimize-spec.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    env:
      SPEC_PATH: specs/P2-V0.18.5.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'

      - name: Validate approved specification contract
        run: python scripts/validate_spec.py "$SPEC_PATH" --spec-only

      - id: credentials
        name: Select DSPy development model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "model=openai/gpt-5.6-sol" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "model=ollama_chat/llama3.2:1b" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/llama3.2:1b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi

      - name: Install local Ollama development LM
        if: steps.credentials.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b

      - name: Compile approved spec with DSPy SpecCritic and SpecCompiler
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py "$SPEC_PATH"

      - name: Validate protected compiled-plan evidence
        run: python scripts/validate_spec.py "$SPEC_PATH" --require-dspy

      - name: Commit exact compiled plan to worker branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/compiled/P2-V0.18.5.plan.json
          if git diff --cached --quiet; then
            echo "Compiled plan already current"
          else
            git commit -m "spec(w5): compile validated-memory DSPy plan"
            git push origin HEAD:ws/w5-validated-memory
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspy-spec-evidence-P2-V0.18.5
          path: |
            specs/compiled/P2-V0.18.5.plan.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
