name: DSPy P2-V0.16.3 Compiler

on:
  push:
    branches:
      - 'p2/w3-autonomous-correction-compiler'
    paths:
      - 'specs/P2-V0.16.3.md'
      - 'scripts/compile_spec.py'
      - 'services/api/parallax_api/intelligence/**'
      - '.github/workflows/optimize-spec.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SPEC_PATH: specs/P2-V0.16.3.md
      DSPY_MODEL: ollama_chat/llama3.2:1b
      DSPY_API_BASE: http://127.0.0.1:11434
      DSPY_API_KEY: ''
      DSPY_LOCAL_DEVELOPMENT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate approved specification
        run: python scripts/validate_spec.py "$SPEC_PATH"
      - name: Install local Ollama development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b
      - name: Compile approved spec with DSPy critic + compiler
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Commit authentic compiled plan on compiler branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/compiled/P2-V0.16.3.plan.json
          if git diff --cached --quiet; then
            echo 'Compiled plan unchanged.'
          else
            git commit -m 'spec: compile P2-V0.16.3 with DSPy'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspy-p2-v0-16-3-evidence
          path: |
            specs/compiled/P2-V0.16.3.plan.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
