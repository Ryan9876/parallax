name: DSPy Spec Optimization

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Specification path
        required: true
        default: specs/P2-V0.1.0.md
  push:
    branches:
      - 'p2/**'
      - 'ws/w5-service-bindings'
    paths:
      - 'specs/P2-V0.18.3.md'
      - '.github/workflows/optimize-spec.yml'

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SPEC_PATH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.spec || 'specs/P2-V0.18.3.md' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - run: python scripts/validate_spec.py --spec-only "$SPEC_PATH"

      - id: credentials
        name: Select DSPy development model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "model=openai/gpt-5.6-sol" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "model=ollama_chat/llama3.2:1b" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/llama3.2:1b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi

      - name: Install local Ollama development LM
        if: steps.credentials.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b

      - name: Compile approved spec with DSPy critic + compiler
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py "$SPEC_PATH"

      - name: Optimize SpecCompiler with MIPROv2
        if: steps.credentials.outputs.provider == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/optimize_spec.py "$SPEC_PATH"

      - name: Validate generated protected DSPy evidence
        run: python scripts/validate_spec.py --require-dspy "$SPEC_PATH"

      - name: Commit exact generated plan to worker branch
        if: github.event_name == 'push' && github.ref_name == 'ws/w5-service-bindings'
        run: |
          set -euo pipefail
          plan="specs/compiled/P2-V0.18.3.plan.json"
          test -f "$plan"
          git config user.name 'parallax-dspy[bot]'
          git config user.email 'parallax-dspy@users.noreply.github.com'
          git add "$plan"
          if git diff --cached --quiet; then
            echo 'Generated plan is unchanged.'
            exit 0
          fi
          git commit -m 'spec(w5): compile P2-V0.18.3 with DSPy'
          git push origin HEAD:ws/w5-service-bindings

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspy-spec-evidence
          path: |
            specs/compiled/P2-V0.18.3.plan.json
            specs/compiled/optimized-program.json
            specs/compiled/optimized-program-evidence.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
