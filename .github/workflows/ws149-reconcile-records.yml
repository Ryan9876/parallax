name: WS149 Reconcile Authoritative Records

on:
  push:
    branches: [integration/wave4-live-development]
    paths: ['.github/workflows/ws149-reconcile-records.yml']

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/wave4-live-development
      - run: python scripts/ws149_reconcile_records.py
      - run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ARCHITECTURE.md DESIGN-SYSTEM.md CURRENT-STATE.md
          git diff --cached --quiet && exit 0
          git commit -m 'Reconcile Wave 4 pre-production authoritative records'
          git push origin HEAD:integration/wave4-live-development
