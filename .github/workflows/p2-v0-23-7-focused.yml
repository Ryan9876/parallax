name: P2-V0.23.7 Focused Greenfield Tests

on:
  push:
    branches: [work/w9-s1-repository-authorization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-v0-23-7-focused
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'
      - name: Validate protected spec and DSPy evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.7.md
      - name: Run greenfield lineage and allocator tests
        run: >-
          pytest -q
          services/api/tests/test_greenfield_lineage.py
          services/api/tests/test_code_workspace_lineage.py
          services/api/tests/test_code_workspace_allocator.py
