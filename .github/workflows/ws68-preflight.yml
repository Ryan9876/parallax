name: WS68 Durable Lineage Preflight

on:
  push:
    branches:
      - ws/app-durable-lineage
    paths:
      - '.github/workflows/ws68-preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/app-durable-lineage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Compile Python sources
        run: python -m compileall -q services/api/parallax_api services/api/tests
      - name: Validate P2-V0.15.5 specification contract
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.15.5.md
      - name: Run durable lineage focused tests
        run: |
          pytest -q \
            services/api/tests/test_code_workspace_lineage.py \
            services/api/tests/test_code_workspace_allocator.py \
            services/api/tests/test_code_durable_lineage.py
      - name: Run full API regression suite
        run: pytest -q services/api/tests
      - name: Remove temporary preflight workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ws68-preflight.yml
          git commit -m 'ci: remove #68 preflight workflow'
          git push origin HEAD:ws/app-durable-lineage
