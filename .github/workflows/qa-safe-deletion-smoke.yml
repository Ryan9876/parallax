name: Safe Deletion Production Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qa-safe-deletion-smoke.yml
      - scripts/qa_safe_deletion_smoke.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-safe-deletion-production-smoke
  cancel-in-progress: false

jobs:
  authenticated-safe-deletion-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Request bounded Parallax QA OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=parallax%3A%2F%2Fqa-production"
          token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${request_url}" | jq -r '.value')"
          test -n "${token}"
          test "${token}" != "null"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Run authenticated production safe-deletion smoke
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          API_BASE: https://parallax-api-tan.vercel.app
        run: bash scripts/qa_safe_deletion_smoke.sh

      - name: Upload bounded smoke evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: safe-deletion-production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parallax-safe-deletion-evidence.json
          if-no-files-found: error
          retention-days: 30
