name: Implement P2-V0.23.21

on:
  push:
    branches:
      - fix/p2321-greenfield-inspection-diagnostics
    paths:
      - .github/workflows/implement-p2321.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2321-greenfield-inspection-diagnostics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'

      - name: Apply bounded diagnostic implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/parallax_api/code/greenfield_composition.py')
          text = path.read_text(encoding='utf-8')

          old = 'from hashlib import sha256\n\nfrom ..models import EngineeringRun\n'
          new = 'from hashlib import sha256\nimport logging\n\nfrom ..models import EngineeringRun\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected import boundary')
          text = text.replace(old, new, 1)

          old = 'REPOSITORY_AUTHORIZATION_REQUIRED = "REPOSITORY_AUTHORIZATION_REQUIRED"\n\n\nclass RepositoryAuthorizationRequiredError(RuntimeError):\n'
          new = (
              'REPOSITORY_AUTHORIZATION_REQUIRED = "REPOSITORY_AUTHORIZATION_REQUIRED"\n'
              '_UNCLASSIFIED_PROVIDER_FAILURE = "UNCLASSIFIED_PROVIDER_FAILURE"\n\n'
              'logger = logging.getLogger(__name__)\n\n\n'
              'class RepositoryAuthorizationRequiredError(RuntimeError):\n'
          )
          if text.count(old) != 1:
              raise SystemExit('unexpected constant boundary')
          text = text.replace(old, new, 1)

          old = '    return None\n\n\ndef is_repository_authorization_required(error: BaseException) -> bool:\n'
          new = '''    return None


def _log_greenfield_repository_inspection_failure(error: BaseException) -> str:
    """Emit only server-owned event text plus a protected normalized result code."""

    result_code = _provider_result_code(error) or _UNCLASSIFIED_PROVIDER_FAILURE
    logger.warning(
        "greenfield_repository_inspection_failed result_code=%s",
        result_code,
    )
    return result_code


def is_repository_authorization_required(error: BaseException) -> bool:
'''
          if text.count(old) != 1:
              raise SystemExit('unexpected provider-result helper boundary')
          text = text.replace(old, new, 1)

          old = '''            except Exception as inspection_error:
                if is_repository_authorization_required(inspection_error):
'''
          new = '''            except Exception as inspection_error:
                _log_greenfield_repository_inspection_failure(inspection_error)
                if is_repository_authorization_required(inspection_error):
'''
          if text.count(old) != 1:
              raise SystemExit('unexpected inspection error boundary')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add focused diagnostic regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > services/api/tests/test_greenfield_inspection_diagnostics.py <<'PY'
          from __future__ import annotations

          import logging

          from parallax_api.code.greenfield_composition import (
              _log_greenfield_repository_inspection_failure,
              _provider_result_code,
          )
          from parallax_api.tools.contracts import (
              ToolAuditRecord,
              ToolConsequence,
              ToolExecutionResult,
              ToolOutcome,
          )
          from parallax_api.tools.providers import (
              ProviderActionEvidence,
              ProviderActionFailed,
              ProviderActionState,
          )


          PROJECT = "11111111-1111-4111-8111-111111111111"


          def _provider_failure(code: str) -> ProviderActionFailed:
              execution = ToolExecutionResult(succeeded=False, result_code=code)
              audit = ToolAuditRecord(
                  request_id="request:greenfield-diagnostic",
                  capability_id="cap:greenfield-diagnostic",
                  project_ref=PROJECT,
                  tool="github",
                  action="repository.inspect",
                  actor_ref="actor:parallax-runtime",
                  consequence=ToolConsequence.READ,
                  authority_allowed=True,
                  outcome=ToolOutcome.FAILED,
                  deny_reason=None,
                  approval_id=None,
                  request_digest="a" * 64,
                  result_digest=execution.digest,
                  result_code=code,
                  result_identity=None,
              )
              evidence = ProviderActionEvidence(
                  provider="github",
                  action="repository.inspect",
                  state=ProviderActionState.FAILED,
                  project_ref=PROJECT,
                  repository_identity_digest="b" * 64,
                  result_status=code,
              )
              return ProviderActionFailed(evidence=evidence, audit=audit)


          def test_protected_provider_result_code_is_logged_without_raw_exception(caplog) -> None:
              failure = _provider_failure("CREDENTIAL_SCOPE_MISMATCH")
              raw = RuntimeError("raw-provider-secret-token")
              failure.__cause__ = raw

              with caplog.at_level(logging.WARNING, logger="parallax_api.code.greenfield_composition"):
                  result = _log_greenfield_repository_inspection_failure(failure)

              assert result == "CREDENTIAL_SCOPE_MISMATCH"
              assert _provider_result_code(failure) == "CREDENTIAL_SCOPE_MISMATCH"
              assert caplog.messages == [
                  "greenfield_repository_inspection_failed result_code=CREDENTIAL_SCOPE_MISMATCH"
              ]
              assert "raw-provider-secret-token" not in caplog.text


          def test_unclassified_failure_uses_fixed_server_owned_fallback(caplog) -> None:
              raw = RuntimeError("external-body-with-sensitive-material")

              with caplog.at_level(logging.WARNING, logger="parallax_api.code.greenfield_composition"):
                  result = _log_greenfield_repository_inspection_failure(raw)

              assert result == "UNCLASSIFIED_PROVIDER_FAILURE"
              assert caplog.messages == [
                  "greenfield_repository_inspection_failed result_code=UNCLASSIFIED_PROVIDER_FAILURE"
              ]
              assert "external-body-with-sensitive-material" not in caplog.text


          def test_authorization_required_remains_a_normalized_protected_code(caplog) -> None:
              failure = _provider_failure("REPOSITORY_AUTHORIZATION_REQUIRED")

              with caplog.at_level(logging.WARNING, logger="parallax_api.code.greenfield_composition"):
                  result = _log_greenfield_repository_inspection_failure(failure)

              assert result == "REPOSITORY_AUTHORIZATION_REQUIRED"
              assert caplog.messages == [
                  "greenfield_repository_inspection_failed result_code=REPOSITORY_AUTHORIZATION_REQUIRED"
              ]
          PY

      - name: Validate focused release surface
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.21.md
          python -m compileall -q services/api/parallax_api services/api/tests/test_greenfield_inspection_diagnostics.py
          python -m pytest \
            services/api/tests/test_greenfield_inspection_diagnostics.py \
            services/api/tests/test_greenfield_recovery_contract.py \
            services/api/tests/test_greenfield_github.py \
            -q
          git diff --check

      - name: Remove temporary release scaffolding and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-p2321.yml .github/workflows/implement-p2321.yml
          git config user.name "parallax-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            services/api/parallax_api/code/greenfield_composition.py \
            services/api/tests/test_greenfield_inspection_diagnostics.py \
            .github/workflows/prepare-p2321.yml \
            .github/workflows/implement-p2321.yml
          git commit -m "Add bounded greenfield inspection diagnostics"
          git push origin HEAD:fix/p2321-greenfield-inspection-diagnostics
