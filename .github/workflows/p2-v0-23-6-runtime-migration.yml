name: P2-V0.23.6 Runtime Migration

on:
  push:
    branches:
      - work/w8-s2-profile-snapshots
    paths:
      - .github/scripts/p2_v0_23_6_runtime_migration.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/w8-s2-profile-snapshots
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact guarded migration
        run: python .github/scripts/p2_v0_23_6_runtime_migration.py
      - name: Compile changed protected runtime
        run: |
          python -m py_compile \
            services/api/parallax_api/execution_environment.py \
            services/api/parallax_api/code/agentic_runtime.py \
            services/api/parallax_api/code/lineage_sandbox_execution.py
          git diff --check
      - name: Commit migrated runtime
        run: |
          if git diff --quiet; then
            echo 'Migration produced no changes' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/parallax_api/code/agentic_runtime.py
          git commit -m 'Bind candidate validation to profile-qualified snapshots'
          git push origin HEAD:work/w8-s2-profile-snapshots
