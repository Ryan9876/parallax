name: WS580 P2-V0.23.43 Finalize

on:
  push:
    branches:
      - ws/580-lineage-scoped-delivery-branch
    paths:
      - .github/workflows/ws580-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/580-lineage-scoped-delivery-branch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Re-prove amended protected specification
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.43.md
      - name: Apply exact validated ledger patch
        run: python scripts/ws580_finalize.py
      - name: Compile Python sources
        run: python -m compileall -q services/api/parallax_api services/api/tests
      - name: Run focused branch ledger greenfield and replay regressions
        run: |
          pytest -q \
            services/api/tests/test_source_delivery_composition.py \
            services/api/tests/test_greenfield_commit_bearing_delivery.py \
            services/api/tests/test_app_builder_source_delivery_bridge.py
      - name: Run full API regression suite
        run: pytest -q services/api/tests
      - name: Re-check exact spec and patch hygiene
        run: |
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.43.md
          git diff --check
      - name: Persist clean validated semantic head
        run: |
          set -euo pipefail
          rm -f scripts/ws580_finalize.py
          rm -f .github/workflows/ws580-finalize.yml
          rm -f .github/workflows/ws580-implementation.yml
          rm -f .github/workflows/ws580-implement.yml
          rm -f .github/workflows/ws580-ledger-correction.yml
          rm -f .github/workflows/ws580-spec-gate.yml
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test ! -e scripts/ws580_finalize.py
          test ! -e .github/workflows/ws580-finalize.yml
          test ! -e .github/workflows/ws580-implementation.yml
          test ! -e .github/workflows/ws580-implement.yml
          test ! -e .github/workflows/ws580-ledger-correction.yml
          test ! -e .github/workflows/ws580-spec-gate.yml
          git diff --cached --quiet && { echo 'No semantic diff to commit' >&2; exit 1; }
          git commit -m 'Complete P2-V0.23.43 lineage-scoped delivery identity'
          git push origin HEAD:ws/580-lineage-scoped-delivery-branch
