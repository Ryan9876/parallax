name: P2-V0.23.28 Architecture Validation

on:
  push:
    branches: [fix/p2328-cross-work-unit-convergence]
    paths:
      - '.github/workflows/p2328-architecture.yml'
      - 'scripts/tmp_p2328_arch.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2328-cross-work-unit-convergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Apply architecture record
        run: python scripts/tmp_p2328_arch.py
      - name: Validate architecture and governed implementation
        run: |
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.28.md
          python -m pytest -q \
            services/api/tests/test_incremental_implement_convergence_v02327.py \
            services/api/tests/test_cross_work_unit_convergence_v02328.py \
            services/api/tests/test_implementation_proposal_preflight.py \
            services/api/tests/test_agentic_runtime_activation.py
          grep -q '^Version: 3.39$' ARCHITECTURE.md
          grep -q 'plan-prefix rejection keeps only the current work unit' ARCHITECTURE.md
          git diff --check
      - name: Commit validated architecture and remove temporary helpers
        run: |
          set -euo pipefail
          rm .github/workflows/p2328-architecture.yml scripts/tmp_p2328_arch.py
          git config user.name 'Parallax Architecture Validator'
          git config user.email 'parallax-architecture@users.noreply.github.com'
          git add ARCHITECTURE.md .github/workflows/p2328-architecture.yml scripts/tmp_p2328_arch.py
          git diff --cached --check
          git commit -m 'P2-V0.23.28 — record plan-prefix convergence architecture'
          git push origin HEAD:fix/p2328-cross-work-unit-convergence
