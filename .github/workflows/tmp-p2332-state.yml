name: P2-V0.23.32 Deployment State Reconciliation

on:
  push:
    branches:
      - record/p2332-deployment-verification
    paths:
      - .github/workflows/tmp-p2332-state.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record/p2332-deployment-verification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile authoritative current state
        run: python scripts/tmp_p2332_state.py
      - name: Validate record
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.32.md
          grep -q '^Version: 3.43$' ARCHITECTURE.md
          grep -q 'P2-V0.23.32 — bounded candidate validation repair and explicit canary contract identity — PRODUCTION-DEPLOYMENT-VERIFIED' CURRENT-STATE.md
          grep -q 'P2-V0.23.31 — explicit execution contract and end-to-end acceptance replay — PRODUCTION-BEHAVIOR-ACCEPTED / LATER BOUNDED BLOCKER EXPOSED' CURRENT-STATE.md
          git diff --check
          test "$(git diff --name-only | sort)" = 'CURRENT-STATE.md'
      - name: Commit record and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Validator'
          git config user.email 'parallax-release@users.noreply.github.com'
          git rm .github/workflows/tmp-p2332-state.yml scripts/tmp_p2332_state.py
          git add CURRENT-STATE.md
          git commit -m 'P2-V0.23.32 — record production deployment verification'
          git push origin HEAD:record/p2332-deployment-verification
