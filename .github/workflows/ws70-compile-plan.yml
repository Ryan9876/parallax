name: WS70 Compile Protected Plan

on:
  pull_request:
    branches:
      - integration/wave2-app-builder
    types: [opened, synchronize, reopened]
    paths:
      - 'specs/P2-V0.15.7.md'
      - '.github/workflows/ws70-compile-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: python -m pip install -e 'services/api[dev]'
      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          ollama pull qwen2.5:0.5b
      - name: Compile and validate P2-V0.15.7
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:0.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: |
          python scripts/compile_spec.py specs/P2-V0.15.7.md
          python scripts/validate_spec.py specs/P2-V0.15.7.md --require-dspy
      - uses: actions/upload-artifact@v4
        with:
          name: ws70-compiled-plan
          path: specs/compiled/P2-V0.15.7.plan.json
          if-no-files-found: error
          retention-days: 14
