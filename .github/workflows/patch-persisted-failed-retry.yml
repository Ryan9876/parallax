name: Patch persisted failed-run retry

on:
  push:
    branches:
      - fix/resume-autonomy-handoff
    paths:
      - .github/workflows/patch-persisted-failed-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make persisted failed runs retryable on mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/client/src/components/mobile/MobileExperience.tsx')
          text = path.read_text()

          old = """  const currentIndex = currentJourneyIndex(specification, run);\n  const currentStep = JOURNEY_STEPS[currentIndex] ?? JOURNEY_STEPS[0]!;\n  const currentActivity = runFailure\n    ? 'Something needs attention'"""
          new = """  const currentIndex = currentJourneyIndex(specification, run);\n  const currentStep = JOURNEY_STEPS[currentIndex] ?? JOURNEY_STEPS[0]!;\n  const retryableFailure = Boolean(runFailure || run?.state === 'FAILED');\n  const currentActivity = retryableFailure\n    ? 'Something needs attention'"""
          if old not in text:
              raise SystemExit('currentActivity anchor not found')
          text = text.replace(old, new, 1)

          old = """        {runFailure ? <Text style={styles.activityCopy}>Parallax stopped safely. Your saved work is still here, and you can retry this step.</Text> : run?.last_failure_code ? <Text style={styles.activityCopy}>Something needs attention before Parallax can continue.</Text> : null}\n        {plainError(effectiveError) ? <Text accessibilityLiveRegion=\"polite\" style={styles.error}>{plainError(effectiveError)}</Text> : null}\n        {runFailure && run ? ("""
          new = """        {retryableFailure ? <Text style={styles.activityCopy}>Parallax stopped safely. Your saved work is still here, and you can retry this step.</Text> : run?.last_failure_code ? <Text style={styles.activityCopy}>Something needs attention before Parallax can continue.</Text> : null}\n        {plainError(effectiveError) ? <Text accessibilityLiveRegion=\"polite\" style={styles.error}>{plainError(effectiveError)}</Text> : null}\n        {retryableFailure && run ? ("""
          if old not in text:
              raise SystemExit('retry CTA anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/client/src/components/mobile/MobileExperience.tsx
          git commit -m "Expose retry for persisted failed runs"
          git push origin HEAD:fix/resume-autonomy-handoff
