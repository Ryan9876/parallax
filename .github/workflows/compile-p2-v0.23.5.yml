name: Compile P2-V0.23.5

on:
  push:
    branches:
      - p2/repository-aware-validation-toolchains
    paths:
      - specs/P2-V0.23.5.md
      - .github/workflows/compile-p2-v0.23.5.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Validate spec before compilation
        run: python scripts/validate_specs.py --spec-only specs/P2-V0.23.5.md
      - name: Start local DSPy development model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull qwen2.5-coder:1.5b
      - name: Compile authentic DSPy plan
        env:
          DSPY_MODEL: ollama_chat/qwen2.5-coder:1.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
        run: python scripts/compile_spec.py specs/P2-V0.23.5.md
      - name: Validate protected compiled plan
        run: python scripts/validate_specs.py --require-dspy specs/P2-V0.23.5.md
      - uses: actions/upload-artifact@v4
        with:
          name: p2-v0.23.5-dspy-plan
          path: specs/compiled/P2-V0.23.5.plan.json
          if-no-files-found: error
          retention-days: 7
