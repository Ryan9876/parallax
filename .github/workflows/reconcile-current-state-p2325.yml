name: P2-V0.23.25 Current State Reconciliation

on:
  push:
    branches:
      - record/p2325-deployment-verification
    paths:
      - .github/workflows/reconcile-current-state-p2325.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record/p2325-deployment-verification
      - name: Reconcile authoritative current state
        shell: bash
        env:
          SECTION_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('CURRENT-STATE.md')
          text = p.read_text()
          status_old = 'P2-V0.23.24 FRESH FINAL VALIDATOR REPAIR PRODUCTION-BEHAVIOR-VERIFIED**'
          status_new = status_old[:-2] + ' / P2-V0.23.25 SAFE NESTED SOURCE CREATION + TRANSPORT RECONCILIATION PRODUCTION-DEPLOYMENT-VERIFIED / REAL-PATH BEHAVIOR ACCEPTANCE PENDING**'
          if status_old not in text:
              raise SystemExit('expected status tail not found')
          text = text.replace(status_old, status_new, 1)
          marker = '## P2-V0.23.24 — fresh final validator repair generation — PRODUCTION-BEHAVIOR-VERIFIED\n'
          if marker not in text:
              raise SystemExit('P2-V0.23.24 insertion marker not found')
          section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          text = text.replace(marker, section + marker, 1)
          p.write_text(text)
          PY
      - name: Validate record scope
        run: |
          git diff --check
          git diff -- CURRENT-STATE.md
          test "$(git status --short | awk '$2 != "CURRENT-STATE.md" && $2 != ".github/workflows/reconcile-current-state-p2325.yml" {count++} END {print count+0}')" -eq 0
      - name: Commit record and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/reconcile-current-state-p2325.yml
          git config user.name 'Parallax Record Reconciler'
          git config user.email 'parallax-records@users.noreply.github.com'
          git add CURRENT-STATE.md .github/workflows/reconcile-current-state-p2325.yml
          git commit -m 'P2-V0.23.25 — record deployment-verified current state'
          git push origin HEAD:record/p2325-deployment-verification
