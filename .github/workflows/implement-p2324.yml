name: P2-V0.23.24 Focused Implementation

on:
  push:
    branches: [fix/p2324-fresh-validator-repair]
    paths:
      - '.github/workflows/implement-p2324.yml'

permissions:
  contents: write

concurrency:
  group: p2324-focused-implementation
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2324-fresh-validator-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'

      - name: Apply bounded final-repair freshness implementation
        env:
          PATCH_SCRIPT_B64: 
        run: |
          python - <<'PY'
          import base64, os
          payload = base64.b64decode(os.environ['PATCH_SCRIPT_B64'])
          compile(payload, 'p2324_patch.py', 'exec')
          exec(payload, {'__name__': '__main__'})
          PY

      - name: Compile and run focused regressions
        run: |
          set -euo pipefail
          python -m compileall -q services/api/parallax_api
          pytest -q \
            services/api/tests/test_candidate_repair_guidance_v0239.py \
            services/api/tests/test_agentic_candidate_recovery.py \
            services/api/tests/test_final_validator_repair_freshness_v02324.py
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.24.md
          git diff --check

      - name: Prove protected authority surfaces are untouched
        run: |
          set -euo pipefail
          git diff --quiet e0f9088d1d1c80a8df355b45a933c486f9e8aac4 -- \
            services/api/parallax_api/intelligence/dspy_programs.py \
            services/api/parallax_api/code/implementation_runtime.py \
            services/api/parallax_api/code/model_patch_canonicalization.py
          test "$(grep -c '^MAX_VALIDATOR_REPAIR_RETRIES_PER_WORK_UNIT = 1$' services/api/parallax_api/code/agentic_candidate_recovery.py)" = '1'

      - name: Commit validated implementation and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name "Parallax Release Worker"
          git config user.email "parallax-release-worker@users.noreply.github.com"
          git rm .github/workflows/prepare-p2324.yml .github/workflows/implement-p2324.yml
          git add ARCHITECTURE.md \
            services/api/parallax_api/code/agentic_candidate_recovery.py \
            services/api/tests/test_final_validator_repair_freshness_v02324.py
          git diff --cached --check
          git commit -m "P2-V0.23.24 — make final validator repair generation fresh"
          git push origin HEAD:fix/p2324-fresh-validator-repair