name: Apply P2-V0.23.5 Regression Repair

on:
  push:
    branches:
      - fix/p2-v0-23-5-regressions
    paths:
      - .github/workflows/apply-p2-v0.23.5-regression-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2-v0-23-5-regressions
          fetch-depth: 0
      - name: Restore pre-materialization guard and lineage fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          lineage = Path('services/api/parallax_api/code/lineage_sandbox_execution.py')
          text = lineage.read_text(encoding='utf-8')
          old = '''            self.policy.validate(spec)\n            identity = self._identity(project_ref, run_id)\n'''
          new = '''            self.policy.validate(spec)\n            # The caller spec is a stage-authorization envelope, not repository\n            # command authority. Preserve the inherited anti-injection boundary:\n            # reject any altered tool/args/cwd/timeout before accepted source is\n            # reconstructed. Repository-specific commands are derived only after\n            # exact lineage materialization below.\n            registered_spec = self.registry.spec_for(spec.stage, operation_key=spec.operation_key)\n            if spec != registered_spec:\n                raise ExecutionPolicyError("protected execution spec is not the server-registered stage envelope")\n            identity = self._identity(project_ref, run_id)\n'''
          if old not in text:
              raise SystemExit('lineage guard anchor not found')
          lineage.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('services/api/tests/test_lineage_sandbox_execution.py')
          text = tests.read_text(encoding='utf-8')
          old = '''    files = files or {\n        "README.md": b"hello\\n",\n        "src/app.py": b"value = 2\\n",\n    }\n    entries = []\n'''
          new = '''    files = dict(files or {\n        "README.md": b"hello\\n",\n        "src/app.py": b"value = 2\\n",\n    })\n    # Synthetic inherited fixtures now include the minimum established Parallax\n    # source shape so profile selection reaches the same execution behavior these\n    # tests have always exercised. Empty directories are not lineage artifacts,\n    # so one bounded file establishes each required directory.\n    files.setdefault("services/api/pyproject.toml", b"[project]\\nname='parallax-api'\\n")\n    files.setdefault("services/api/parallax_api/__init__.py", b"")\n    files.setdefault("services/api/tests/test_code_execution_kernel.py", b"")\n    files.setdefault("services/api/tests/test_code_autonomy.py", b"")\n    files.setdefault("scripts/.profile-fixture", b"")\n    entries = []\n'''
          if old not in text:
              raise SystemExit('lineage fixture anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace('    assert evidence["source_file_count"] == 96\n', '    assert evidence["source_file_count"] == len(expected)\n', 1)
          text = text.replace('    assert len(filesystem.batch_flushes[0]) == 96\n', '    assert len(filesystem.batch_flushes[0]) == len(expected)\n', 1)
          tests.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q services/api/parallax_api
          git diff --check
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/parallax_api/code/lineage_sandbox_execution.py services/api/tests/test_lineage_sandbox_execution.py
          git commit -m "Restore protected lineage execution invariants"
          git push origin HEAD:fix/p2-v0-23-5-regressions
