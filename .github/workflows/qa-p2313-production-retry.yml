name: QA P2-V0.23.14 Production Retry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qa-p2313-production-retry.yml
      - services/api/parallax_api/services/github_actions_identity.py
      - services/api/parallax_api/code/service.py
      - services/api/parallax_api/code/state_machine.py
      - services/api/parallax_api/code/worker_recovery.py
      - services/api/parallax_api/routes/engineering_runs.py
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-p2314-production-retry
  cancel-in-progress: false

jobs:
  retry-affected-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE: https://parallax-api-tan.vercel.app
      RUN_ID: 03bb96e1-5f42-483f-bca3-5b8d6d3bf4cb
      COOKIE_JAR: /tmp/parallax.cookies
    steps:
      - name: Request GitHub Actions OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=parallax%3A%2F%2Fqa-production"
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${request_url}" | jq -r '.value')"
          test -n "${token}"
          test "${token}" != "null"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Wait for production and establish QA session
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          authenticated=0
          for attempt in $(seq 1 36); do
            status="$(curl --silent --show-error \
              --output /tmp/session.json \
              --write-out '%{http_code}' \
              --cookie-jar "${COOKIE_JAR}" \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -X POST "${API_BASE}/v1/session/qa-automation" || true)"
            if [ "${status}" = "200" ] && jq -e '.authenticated == true' /tmp/session.json >/dev/null 2>&1; then
              authenticated=1
              echo "QA session established on attempt ${attempt}"
              break
            fi
            echo "QA session not admitted yet: status=${status}; attempt=${attempt}/36"
            sleep 10
          done
          if [ "${authenticated}" != "1" ]; then
            echo "Production never admitted the exact QA workflow identity" >&2
            cat /tmp/session.json >&2 || true
            exit 1
          fi

      - name: Capture pre-retry durable state
        id: before
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              --cookie "${COOKIE_JAR}" \
              -H "X-Parallax-Session: 1" \
              -H "Content-Type: application/json" \
              "$@"
          }
          api "${API_BASE}/v1/engineering-runs/${RUN_ID}" >/tmp/run-before.json
          state="$(jq -r '.state' /tmp/run-before.json)"
          resume_stage="$(jq -r '.resume_stage // ""' /tmp/run-before.json)"
          revision="$(jq -r '.revision' /tmp/run-before.json)"
          echo "Pre-retry: state=${state}; resume_stage=${resume_stage}; revision=${revision}"
          jq '{id,state,revision,resume_stage,last_failure_code,attempts:[.attempts[-10:][]? | {attempt_number,stage,status,failure_code,evidence}]}' /tmp/run-before.json
          case "${state}" in
            FAILED)
              test "${resume_stage}" = "IMPLEMENT"
              ;;
            IMPLEMENT)
              echo "Run still reflects the pre-fix active-IMPLEMENT/terminal-worker anomaly; normalization is required."
              ;;
            *)
              echo "Unexpected pre-retry state ${state}; refusing to mutate the fixture." >&2
              exit 1
              ;;
          esac
          echo "state=${state}" >> "${GITHUB_OUTPUT}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Normalize stale active IMPLEMENT if required
        id: normalize
        shell: bash
        env:
          BEFORE_STATE: ${{ steps.before.outputs.state }}
          EXPECTED_REVISION: ${{ steps.before.outputs.revision }}
        run: |
          set -euo pipefail
          revision="${EXPECTED_REVISION}"
          if [ "${BEFORE_STATE}" = "IMPLEMENT" ]; then
            operation_key="qa-p2314-normalize-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            jq -n \
              --arg operation_key "${operation_key}" \
              --argjson expected_revision "${EXPECTED_REVISION}" \
              '{operation_key:$operation_key,expected_revision:$expected_revision}' >/tmp/normalize-request.json
            status="$(curl --silent --show-error --max-time 900 \
              --output /tmp/normalize-response.json --write-out '%{http_code}' \
              --cookie "${COOKIE_JAR}" \
              -H "X-Parallax-Session: 1" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/normalize-request.json \
              -X POST "${API_BASE}/v1/engineering-runs/${RUN_ID}/autonomous" || true)"
            echo "Normalization autonomous HTTP ${status}"
            jq '.' /tmp/normalize-response.json || cat /tmp/normalize-response.json || true

            curl --fail-with-body --silent --show-error \
              --cookie "${COOKIE_JAR}" \
              -H "X-Parallax-Session: 1" \
              -H "Content-Type: application/json" \
              "${API_BASE}/v1/engineering-runs/${RUN_ID}" >/tmp/run-normalized.json
            state="$(jq -r '.state' /tmp/run-normalized.json)"
            resume_stage="$(jq -r '.resume_stage // ""' /tmp/run-normalized.json)"
            revision="$(jq -r '.revision' /tmp/run-normalized.json)"
            echo "Normalized state=${state}; resume_stage=${resume_stage}; revision=${revision}"
            jq '{id,state,revision,resume_stage,last_failure_code,attempts:[.attempts[-8:][]? | {attempt_number,stage,status,failure_code,evidence}]}' /tmp/run-normalized.json
            test "${state}" = "FAILED"
            test "${resume_stage}" = "IMPLEMENT"
          fi
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Act as user - retry failed IMPLEMENT run
        id: retry
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.normalize.outputs.revision }}
        run: |
          set -euo pipefail
          operation_key="qa-p2314-retry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg operation_key "${operation_key}" \
            --argjson expected_revision "${EXPECTED_REVISION}" \
            '{operation_key:$operation_key,expected_revision:$expected_revision}' >/tmp/resume-request.json
          status="$(curl --silent --show-error --max-time 120 \
            --output /tmp/resume-response.json --write-out '%{http_code}' \
            --cookie "${COOKIE_JAR}" \
            -H "X-Parallax-Session: 1" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/resume-request.json \
            -X POST "${API_BASE}/v1/engineering-runs/${RUN_ID}/resume" || true)"
          echo "Resume HTTP ${status}"
          jq '{attempt_id,replayed,run:{id:.run.id,state:.run.state,revision:.run.revision,resume_stage:.run.resume_stage,last_failure_code:.run.last_failure_code}}' /tmp/resume-response.json || cat /tmp/resume-response.json
          test "${status}" = "200"
          state="$(jq -r '.run.state' /tmp/resume-response.json)"
          revision="$(jq -r '.run.revision' /tmp/resume-response.json)"
          test "${state}" = "PLAN"
          test "${revision}" -gt "${EXPECTED_REVISION}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Act as user - continue autonomously once
        id: autonomous
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.retry.outputs.revision }}
        run: |
          set -euo pipefail
          operation_key="qa-p2314-autonomous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg operation_key "${operation_key}" \
            --argjson expected_revision "${EXPECTED_REVISION}" \
            '{operation_key:$operation_key,expected_revision:$expected_revision}' >/tmp/autonomous-request.json
          status="$(curl --silent --show-error --max-time 900 \
            --output /tmp/autonomous-response.json --write-out '%{http_code}' \
            --cookie "${COOKIE_JAR}" \
            -H "X-Parallax-Session: 1" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/autonomous-request.json \
            -X POST "${API_BASE}/v1/engineering-runs/${RUN_ID}/autonomous" || true)"
          echo "Autonomous HTTP ${status}"
          jq '{stop_reason,run:{id:.run.id,state:.run.state,revision:.run.revision,resume_stage:.run.resume_stage,last_failure_code:.run.last_failure_code},steps}' /tmp/autonomous-response.json || cat /tmp/autonomous-response.json
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Capture post-retry evidence
        if: always()
        shell: bash
        run: |
          set +e
          api() {
            curl --silent --show-error \
              --cookie "${COOKIE_JAR}" \
              -H "X-Parallax-Session: 1" \
              -H "Content-Type: application/json" \
              "$@"
          }
          echo '--- run after ---'
          api "${API_BASE}/v1/engineering-runs/${RUN_ID}" >/tmp/run-after.json
          jq '{id,state,revision,resume_stage,last_failure_code,attempts:[.attempts[-16:][]? | {attempt_number,stage,status,failure_code,evidence}]}' /tmp/run-after.json
          echo '--- worker health ---'
          api "${API_BASE}/v1/engineering-runs/${RUN_ID}/worker-health" >/tmp/worker.json
          jq '.' /tmp/worker.json
          echo '--- latest events ---'
          api "${API_BASE}/v1/engineering-runs/${RUN_ID}/events" >/tmp/events.json
          jq 'if type=="array" then .[-30:] elif .events then {events:.events[-30:],next_after_sequence,has_more} else . end' /tmp/events.json
          echo '--- P2-V0.23.14 evidence markers ---'
          jq '[.attempts[]? | select(.stage=="PLAN") | {attempt_number,status,evidence}] | .[-6:]' /tmp/run-after.json
          jq 'if .checkpoint then {state,lease_generation,checkpoint_revision,current_step,checkpoint:.checkpoint} else . end' /tmp/worker.json
          echo '--- runtime decision ---'
          state="$(jq -r '.state // "UNKNOWN"' /tmp/run-after.json)"
          failure="$(jq -r '.last_failure_code // ""' /tmp/run-after.json)"
          autonomous_http="${{ steps.autonomous.outputs.status }}"
          plan_passed="$(jq '[.attempts[]? | select(.stage=="PLAN" and .status=="PASSED")] | length' /tmp/run-after.json)"
          lease_generation="$(jq -r '.lease_generation // 0' /tmp/worker.json)"
          current_step="$(jq -r '.current_step // ""' /tmp/worker.json)"
          echo "Post-retry state=${state}; failure=${failure:-none}; autonomous_http=${autonomous_http}; plan_passed=${plan_passed}; lease_generation=${lease_generation}; current_step=${current_step:-none}"

          if [ "${autonomous_http}" != "200" ] || [ "${plan_passed}" -lt 1 ] || [ "${lease_generation}" -lt 3 ]; then
            echo "P2-V0.23.14 retry boundary was not proven." >&2
            exit 1
          fi

          if [ "${state}" = "FAILED" ]; then
            dep_code="$(jq -r '[.. | objects | .dependency_preparation_code? // empty] | last // ""' /tmp/run-after.json)"
            probe_exit="$(jq -r '[.. | objects | .dependency_probe_exit_code? // empty] | last // ""' /tmp/run-after.json)"
            prepare_exit="$(jq -r '[.. | objects | .dependency_prepare_exit_code? // empty] | last // ""' /tmp/run-after.json)"
            if [ "${dep_code}" = "DEPENDENCY_PREPARATION_FAILED" ] && [ "${probe_exit}" = "0" ] && [ "${prepare_exit}" = "1" ]; then
              echo "P2-V0.23.14 accepted: retry reached fresh PLAN and a new worker generation; this immutable historical fixture then failed later during .NET dependency preparation. Fresh current-source replay owns that downstream verdict."
              exit 0
            fi
            echo "Retry failed for an unclassified downstream reason: ${failure:-none}" >&2
            exit 1
          fi

          echo "P2-V0.23.14 accepted: retry crossed the fresh PLAN and worker-generation boundary without a downstream FAILED state."
