name: WS61 Compile Plan Evidence

on:
  push:
    branches:
      - ws/app-implement-runtime
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  compile-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Install local DSPy proof model runtime
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ws61-ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:1.5b
      - name: Compile canonical P2-V0.15.3 plan
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:1.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: |
          python scripts/compile_spec.py specs/P2-V0.15.3.md
          python scripts/validate_spec.py --require-dspy specs/P2-V0.15.3.md
          echo '---BEGIN-P2-V0.15.3-PLAN---'
          cat specs/compiled/P2-V0.15.3.plan.json
          echo '---END-P2-V0.15.3-PLAN---'
      - uses: actions/upload-artifact@v4
        with:
          name: ws61-compiled-plan
          path: specs/compiled/P2-V0.15.3.plan.json
          if-no-files-found: error
          retention-days: 14
