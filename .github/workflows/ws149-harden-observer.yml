name: WS149 Harden Observer Redaction

on:
  push:
    branches: [integration/wave4-live-development]
    paths: ['.github/workflows/ws149-harden-observer.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/wave4-live-development
      - run: python scripts/ws149_harden_observer_redaction.py
      - run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add services/api/parallax_api/code/live_observability.py
          git diff --cached --quiet && exit 0
          git commit -m 'Harden protected observability evidence redaction'
          git push origin HEAD:integration/wave4-live-development
