name: WS580 P2-V0.23.43 Ledger Correction

on:
  push:
    branches:
      - ws/580-lineage-scoped-delivery-branch
    paths:
      - .github/workflows/ws580-ledger-correction.yml

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/580-lineage-scoped-delivery-branch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Re-prove amended protected specification
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.43.md
      - name: Apply bounded same-run delivery-ledger correction
        run: |
          echo ' ' | base64 -d > /tmp/ws580-ledger-patch.py
          python /tmp/ws580-ledger-patch.py
      - name: Run focused delivery-ledger and publication regressions
        run: |
          pytest -q \
            services/api/tests/test_source_delivery_composition.py \
            services/api/tests/test_greenfield_commit_bearing_delivery.py \
            services/api/tests/test_app_builder_source_delivery_bridge.py
      - name: Run full API and compile gates
        run: |
          pytest -q services/api/tests
          python -m compileall -q services/api/parallax_api
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.43.md
      - name: Persist bounded ledger correction
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add \
            services/api/parallax_api/code/source_delivery_composition.py \
            services/api/tests/test_source_delivery_composition.py \
            ARCHITECTURE.md
          git diff --cached --check
          git commit -m 'Complete P2-V0.23.43 lineage-scoped delivery ledger'
          git push origin HEAD:ws/580-lineage-scoped-delivery-branch
