name: WS580 P2-V0.23.43 Ledger Correction

on:
  push:
    branches:
      - ws/580-lineage-scoped-delivery-branch
    paths:
      - .github/workflows/ws580-ledger-correction.yml

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/580-lineage-scoped-delivery-branch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Re-prove amended protected specification
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.43.md
      - name: Apply bounded same-run delivery-ledger correction
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          source = Path('services/api/parallax_api/code/source_delivery_composition.py')
          old = '''    def persist(
        self,
        *,
        run: EngineeringRun,
        lineage_id: str,
        payload: dict[str, object],
    ) -> tuple[dict[str, object], bool]:
        if payload.get("project_id") != run.project_id or payload.get("run_id") != run.id:
            raise VerifiedDeliveryError("delivery record does not match canonical Engineering Run")
        if payload.get("lineage_id") != lineage_id:
            raise VerifiedDeliveryError("delivery record does not match accepted lineage")
        encoded = self._canonical(payload)
        existing = self.load(run_id=run.id, lineage_id=lineage_id)
        if existing is not None:
            if self._canonical(existing) != encoded:
                raise VerifiedDeliveryError("conflicting durable delivery record already exists")
            return existing, True

        conflicting = self.repository.session.scalar(
            select(EngineeringAttempt).where(
                EngineeringAttempt.run_id == run.id,
                EngineeringAttempt.stage == _DELIVERY_RECORD_STAGE,
            )
        )
        if conflicting is not None:
            raise VerifiedDeliveryError("Engineering Run already has a different durable delivery record")

        attempt = EngineeringAttempt(
            run_id=run.id,
            stage=_DELIVERY_RECORD_STAGE,
            attempt_number=1,
            operation_key=self.operation_key(lineage_id),
            status=_DELIVERY_RECORD_STATUS,
            program_id=_DELIVERY_RECORD_PROGRAM,
            tool_id=_DELIVERY_RECORD_TOOL,
            evidence_json=encoded,
            completed_at=utcnow(),
        )
        try:
            self.repository.session.add(attempt)
            self.repository.session.commit()
        except IntegrityError as exc:
            self.repository.session.rollback()
            replay = self.load(run_id=run.id, lineage_id=lineage_id)
            if replay is None or self._canonical(replay) != encoded:
                raise VerifiedDeliveryError("concurrent durable delivery record conflicted") from exc
            return replay, True
        return payload, False
'''
          new = '''    def _next_attempt_number(self, run_id: str) -> int:
        current = self.repository.session.scalar(
            select(EngineeringAttempt.attempt_number)
            .where(
                EngineeringAttempt.run_id == run_id,
                EngineeringAttempt.stage == _DELIVERY_RECORD_STAGE,
            )
            .order_by(EngineeringAttempt.attempt_number.desc())
            .limit(1)
        )
        if current is None:
            return 1
        if not isinstance(current, int) or current < 1:
            raise VerifiedDeliveryError("durable delivery attempt numbering is invalid")
        return current + 1

    def persist(
        self,
        *,
        run: EngineeringRun,
        lineage_id: str,
        payload: dict[str, object],
    ) -> tuple[dict[str, object], bool]:
        if payload.get("project_id") != run.project_id or payload.get("run_id") != run.id:
            raise VerifiedDeliveryError("delivery record does not match canonical Engineering Run")
        if payload.get("lineage_id") != lineage_id:
            raise VerifiedDeliveryError("delivery record does not match accepted lineage")
        encoded = self._canonical(payload)
        existing = self.load(run_id=run.id, lineage_id=lineage_id)
        if existing is not None:
            if self._canonical(existing) != encoded:
                raise VerifiedDeliveryError("conflicting durable delivery record already exists")
            return existing, True

        attempt_number = self._next_attempt_number(run.id)
        for insert_attempt in range(2):
            attempt = EngineeringAttempt(
                run_id=run.id,
                stage=_DELIVERY_RECORD_STAGE,
                attempt_number=attempt_number,
                operation_key=self.operation_key(lineage_id),
                status=_DELIVERY_RECORD_STATUS,
                program_id=_DELIVERY_RECORD_PROGRAM,
                tool_id=_DELIVERY_RECORD_TOOL,
                evidence_json=encoded,
                completed_at=utcnow(),
            )
            try:
                self.repository.session.add(attempt)
                self.repository.session.commit()
                return payload, False
            except IntegrityError as exc:
                self.repository.session.rollback()
                replay = self.load(run_id=run.id, lineage_id=lineage_id)
                if replay is not None:
                    if self._canonical(replay) != encoded:
                        raise VerifiedDeliveryError("conflicting durable delivery record already exists") from exc
                    return replay, True
                if insert_attempt != 0:
                    raise VerifiedDeliveryError("concurrent durable delivery record conflicted") from exc
                next_attempt_number = self._next_attempt_number(run.id)
