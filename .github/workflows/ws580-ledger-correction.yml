          replace_once(source, old, new)

          tests = Path('services/api/tests/test_source_delivery_composition.py')
          with tests.open('a', encoding='utf-8') as handle:
              handle.write(r'''


def _raw_delivery_record(project_id: str, run_id: str, lineage_id: str, marker: str) -> dict[str, object]:
    return {
        "project_id": project_id,
        "run_id": run_id,
        "lineage_id": lineage_id,
        "marker": marker,
    }


def test_durable_delivery_store_supports_multiple_same_run_lineages_with_monotonic_attempt_numbers(tmp_path) -> None:
    project_id, run_id = str(uuid4()), str(uuid4())
    engine = make_engine(f"sqlite:///{tmp_path / 'multi-delivery.db'}")
    Base.metadata.create_all(engine)
    Session = sessionmaker(bind=engine, expire_on_commit=False)
    with Session() as session:
        run = EngineeringRun(
            id=run_id,
            conversation_id=str(uuid4()),
            spec_id="P2-V0.23.43",
            project_id=project_id,
            state="REVIEW",
            revision=12,
        )
        session.add(run)
        session.commit()
        repository = EngineeringRunRepository(session)
        store = EngineeringAttemptDeliveryRecordStore(repository)
        first_lineage = "src:" + "1" * 64
        second_lineage = "src:" + "2" * 64
        first_payload = _raw_delivery_record(project_id, run_id, first_lineage, "first")
        second_payload = _raw_delivery_record(project_id, run_id, second_lineage, "second")

        assert store.persist(run=run, lineage_id=first_lineage, payload=first_payload) == (first_payload, False)
        assert store.persist(run=run, lineage_id=second_lineage, payload=second_payload) == (second_payload, False)

        first_attempt = repository.find_operation(run_id, store.operation_key(first_lineage))
        second_attempt = repository.find_operation(run_id, store.operation_key(second_lineage))
        assert first_attempt is not None and first_attempt.attempt_number == 1
        assert second_attempt is not None and second_attempt.attempt_number == 2
        assert first_attempt.operation_key != second_attempt.operation_key
        assert store.load(run_id=run_id, lineage_id=first_lineage) == first_payload
        assert store.load(run_id=run_id, lineage_id=second_lineage) == second_payload
        assert store.persist(run=run, lineage_id=first_lineage, payload=first_payload) == (first_payload, True)
        attempts = (
            session.query(EngineeringAttempt)
            .filter(EngineeringAttempt.run_id == run_id, EngineeringAttempt.stage == "SOURCE_DELIVERY")
            .order_by(EngineeringAttempt.attempt_number)
            .all()
        )
        assert [item.attempt_number for item in attempts] == [1, 2]
        assert run.state == "REVIEW" and run.revision == 12


def test_durable_delivery_store_reconciles_one_different_lineage_attempt_number_race(tmp_path, monkeypatch) -> None:
    project_id, run_id = str(uuid4()), str(uuid4())
    engine = make_engine(f"sqlite:///{tmp_path / 'delivery-race.db'}")
    Base.metadata.create_all(engine)
    Session = sessionmaker(bind=engine, expire_on_commit=False)
    with Session() as session:
        run = EngineeringRun(
            id=run_id,
            conversation_id=str(uuid4()),
            spec_id="P2-V0.23.43",
            project_id=project_id,
            state="REVIEW",
            revision=12,
        )
        session.add(run)
        session.commit()
        repository = EngineeringRunRepository(session)
        store = EngineeringAttemptDeliveryRecordStore(repository)
        first_lineage = "src:" + "3" * 64
        target_lineage = "src:" + "4" * 64
        competitor_lineage = "src:" + "5" * 64
        first_payload = _raw_delivery_record(project_id, run_id, first_lineage, "first")
        target_payload = _raw_delivery_record(project_id, run_id, target_lineage, "target")
        competitor_payload = _raw_delivery_record(project_id, run_id, competitor_lineage, "competitor")
        assert store.persist(run=run, lineage_id=first_lineage, payload=first_payload) == (first_payload, False)

        original_commit = session.commit
        raced = False

        def commit_with_race() -> None:
            nonlocal raced
            if not raced:
                raced = True
                with Session() as competing_session:
                    competing_session.add(
                        EngineeringAttempt(
                            run_id=run_id,
                            stage="SOURCE_DELIVERY",
                            attempt_number=2,
                            operation_key=store.operation_key(competitor_lineage),
                            status="RECORDED",
                            program_id="verified-source-delivery-v0.15.9",
                            tool_id="github+vercel",
                            evidence_json=store._canonical(competitor_payload),
                        )
                    )
                    competing_session.commit()
            original_commit()

        monkeypatch.setattr(session, "commit", commit_with_race)
        persisted, replayed = store.persist(run=run, lineage_id=target_lineage, payload=target_payload)
        assert persisted == target_payload and replayed is False
        target_attempt = repository.find_operation(run_id, store.operation_key(target_lineage))
        competitor_attempt = repository.find_operation(run_id, store.operation_key(competitor_lineage))
        assert competitor_attempt is not None and competitor_attempt.attempt_number == 2
        assert target_attempt is not None and target_attempt.attempt_number == 3
        assert run.state == "REVIEW" and run.revision == 12


def test_durable_delivery_store_resolves_same_lineage_insert_race_as_exact_replay(tmp_path, monkeypatch) -> None:
    project_id, run_id = str(uuid4()), str(uuid4())
    engine = make_engine(f"sqlite:///{tmp_path / 'delivery-exact-race.db'}")
    Base.metadata.create_all(engine)
    Session = sessionmaker(bind=engine, expire_on_commit=False)
    with Session() as session:
        run = EngineeringRun(
            id=run_id,
            conversation_id=str(uuid4()),
            spec_id="P2-V0.23.43",
            project_id=project_id,
            state="REVIEW",
            revision=12,
        )
        session.add(run)
        session.commit()
        repository = EngineeringRunRepository(session)
        store = EngineeringAttemptDeliveryRecordStore(repository)
        lineage_id = "src:" + "6" * 64
        payload = _raw_delivery_record(project_id, run_id, lineage_id, "exact")
        original_commit = session.commit
        raced = False

        def commit_with_exact_race() -> None:
            nonlocal raced
            if not raced:
                raced = True
                with Session() as competing_session:
                    competing_session.add(
                        EngineeringAttempt(
                            run_id=run_id,
                            stage="SOURCE_DELIVERY",
                            attempt_number=1,
                            operation_key=store.operation_key(lineage_id),
                            status="RECORDED",
                            program_id="verified-source-delivery-v0.15.9",
                            tool_id="github+vercel",
                            evidence_json=store._canonical(payload),
                        )
                    )
                    competing_session.commit()
            original_commit()

        monkeypatch.setattr(session, "commit", commit_with_exact_race)
        persisted, replayed = store.persist(run=run, lineage_id=lineage_id, payload=payload)
        assert persisted == payload and replayed is True
        attempts = (
            session.query(EngineeringAttempt)
            .filter(EngineeringAttempt.run_id == run_id, EngineeringAttempt.stage == "SOURCE_DELIVERY")
            .all()
        )
        assert len(attempts) == 1 and attempts[0].attempt_number == 1
        assert run.state == "REVIEW" and run.revision == 12
''')

          architecture = Path('ARCHITECTURE.md')
          old_paragraph = (
              'Architecture v3.52 makes new accepted-source publication branch identity exact-lineage scoped while preserving historical delivery replay. '
              'For one canonical Project/run and exact accepted `src:<64hex>` lineage, both ordinary and greenfield REVIEW delivery now derive the server-owned feature branch as '
              '`parallax/{project8}-{run8}-{lineage64}` using the complete lowercase lineage digest. Exact durable delivery records remain authoritative before provider mutation and continue replaying their stored historical branch names, including pre-v3.52 run-scoped refs. '
              'A different accepted lineage in the same Engineering Run therefore receives a distinct deterministic branch while prior branches, pull requests and Previews remain untouched. '
              'An unexpected pre-existing computed branch still fails through the existing provider conflict/read-back boundary; no suffixing, adoption, force update, deletion or history rewrite is introduced. '
              'P2-V0.23.42 repository-state classification, accepted-lineage authority, provider credentials/actions, default-branch restrictions, Preview ceiling, merge/production boundaries and human REVIEW completion authority are unchanged. Architecture v3.51 remains the commit-bearing-empty repository compatibility foundation.'
          )
          new_paragraph = (
              'Architecture v3.52 makes new accepted-source publication identity exact-lineage scoped across both provider refs and the durable delivery ledger while preserving historical replay. '
              'For one canonical Project/run and exact accepted `src:<64hex>` lineage, both ordinary and greenfield REVIEW delivery derive the server-owned feature branch as '
              '`parallax/{project8}-{run8}-{lineage64}` using the complete lowercase lineage digest. `EngineeringAttemptDeliveryRecordStore` retains the exact `source-delivery:{lineage_id}` operation key and now assigns the deterministic next positive `SOURCE_DELIVERY` stage attempt number, so a later accepted lineage in the same Engineering Run can persist a distinct record without replacing the earlier one. '
              'Exact durable records remain authoritative before provider mutation and continue replaying stored historical branch names, including pre-v3.52 run-scoped refs. After an insert `IntegrityError`, persistence first resolves exact-lineage replay; only a different-lineage stage-number race may trigger one bounded database-local attempt-number recomputation and insert retry, with no provider action repeated. '
              'A different accepted lineage therefore receives a distinct deterministic branch and ledger row while prior branches, pull requests, Previews and delivery attempts remain untouched. An unexpected pre-existing computed branch still fails through the existing provider conflict/read-back boundary; no suffixing, adoption, force update, deletion or history rewrite is introduced. '
              'No schema migration or Engineering Run state/revision mutation is added. P2-V0.23.42 repository-state classification, accepted-lineage authority, provider credentials/actions, default-branch restrictions, Preview ceiling, merge/production boundaries and human REVIEW completion authority are unchanged. Architecture v3.51 remains the commit-bearing-empty repository compatibility foundation.'
          )
          replace_once(architecture, old_paragraph, new_paragraph)
          PY
      - name: Run focused delivery-ledger and publication regressions
        run: |
          pytest -q \
            services/api/tests/test_source_delivery_composition.py \
            services/api/tests/test_greenfield_commit_bearing_delivery.py \
            services/api/tests/test_app_builder_source_delivery_bridge.py
      - name: Run full API and compile gates
        run: |
          pytest -q services/api/tests
          python -m compileall -q services/api/parallax_api
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.43.md
      - name: Persist bounded ledger correction
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add \
            services/api/parallax_api/code/source_delivery_composition.py \
            services/api/tests/test_source_delivery_composition.py \
            ARCHITECTURE.md
          git diff --cached --check
          git commit -m 'Complete P2-V0.23.43 lineage-scoped delivery ledger'
          git push origin HEAD:ws/580-lineage-scoped-delivery-branch
