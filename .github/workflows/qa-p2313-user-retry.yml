name: QA P2-V0.23.13 User Retry

on:
  push:
    branches:
      - qa/p2313-user-retry
    paths:
      - .github/workflows/qa-p2313-user-retry.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-p2313-user-retry
  cancel-in-progress: false

jobs:
  retry-affected-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://parallax-api-tan.vercel.app
      RUN_ID: 2b3cd15f-c5e2-481a-8266-c92c6534b08b
    steps:
      - name: Request GitHub Actions OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=parallax%3A%2F%2Fqa-production"
          token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${request_url}" | jq -r '.value')"
          test -n "${token}"
          test "${token}" != "null"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Establish bounded Parallax QA session
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --cookie-jar /tmp/parallax.cookies \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -X POST "${API_BASE}/v1/session/qa-automation" >/tmp/session.json
          jq -e '.authenticated == true' /tmp/session.json >/dev/null

      - name: Capture pre-retry durable state
        id: before
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            -o /tmp/run-before.json -w '%{http_code}' \
            "${API_BASE}/v1/engineering-runs/${RUN_ID}")"
          echo "pre-read HTTP ${status}"
          cat /tmp/run-before.json | jq '{id,state,revision,resume_stage,last_failure_code,project_id}'
          test "${status}" = "200"
          state="$(jq -r '.state' /tmp/run-before.json)"
          resume_stage="$(jq -r '.resume_stage // ""' /tmp/run-before.json)"
          revision="$(jq -r '.revision' /tmp/run-before.json)"
          test "${state}" = "FAILED"
          test "${resume_stage}" = "IMPLEMENT"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          curl --fail --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            "${API_BASE}/v1/engineering-runs/${RUN_ID}/events" >/tmp/events-before.json
          jq 'if type=="array" then .[-5:] else . end' /tmp/events-before.json

      - name: Act as user — retry failed run
        id: resume
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.before.outputs.revision }}
        run: |
          set -euo pipefail
          operation_key="qa-p2313-user-resume-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg operation_key "${operation_key}" \
            --argjson expected_revision "${EXPECTED_REVISION}" \
            '{operation_key:$operation_key,expected_revision:$expected_revision}' >/tmp/resume-request.json
          status="$(curl --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/resume-request.json \
            -o /tmp/resume-response.json -w '%{http_code}' \
            -X POST "${API_BASE}/v1/engineering-runs/${RUN_ID}/resume")"
          echo "resume HTTP ${status}"
          cat /tmp/resume-response.json | jq '.'
          test "${status}" = "200"
          state="$(jq -r '.run.state' /tmp/resume-response.json)"
          revision="$(jq -r '.run.revision' /tmp/resume-response.json)"
          test "${state}" = "PLAN"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

      - name: Act as user — continue autonomously once
        id: autonomous
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.resume.outputs.revision }}
        run: |
          set -euo pipefail
          operation_key="qa-p2313-user-autonomous-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg operation_key "${operation_key}" \
            --argjson expected_revision "${EXPECTED_REVISION}" \
            '{operation_key:$operation_key,expected_revision:$expected_revision}' >/tmp/autonomous-request.json
          status="$(curl --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/autonomous-request.json \
            -o /tmp/autonomous-response.json -w '%{http_code}' \
            -X POST "${API_BASE}/v1/engineering-runs/${RUN_ID}/autonomous")"
          echo "autonomous HTTP ${status}"
          cat /tmp/autonomous-response.json | jq '{stop_reason,run:{id:.run.id,state:.run.state,revision:.run.revision,last_failure_code:.run.last_failure_code,resume_stage:.run.resume_stage},steps,detail}'
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Capture post-retry state and next bounded failure
        if: always()
        shell: bash
        run: |
          set +e
          echo '--- run after ---'
          curl --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            "${API_BASE}/v1/engineering-runs/${RUN_ID}" >/tmp/run-after.json
          jq '{id,state,revision,resume_stage,last_failure_code,attempts:[.attempts[-6:][]? | {attempt_number,stage,status,failure_code,model_id,tool_id,evidence}]}' /tmp/run-after.json
          echo '--- worker health ---'
          curl --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            "${API_BASE}/v1/engineering-runs/${RUN_ID}/worker-health" >/tmp/worker.json
          jq '.' /tmp/worker.json
          echo '--- latest events ---'
          curl --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            "${API_BASE}/v1/engineering-runs/${RUN_ID}/events" >/tmp/events-after.json
          jq 'if type=="array" then .[-12:] else . end' /tmp/events-after.json
