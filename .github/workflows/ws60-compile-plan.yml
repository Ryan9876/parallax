name: WS60 Compile Protected Plan

on:
  push:
    branches:
      - ws/app-workspace-lineage
    paths:
      - '.github/workflows/ws60-compile-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/app-workspace-lineage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ws60-ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Compile and protect canonical P2-V0.15.2 plan
        env:
          DSPY_MODEL: ollama_chat/qwen2.5:0.5b
          DSPY_API_BASE: http://127.0.0.1:11434
          DSPY_API_KEY: ''
          DSPY_LOCAL_DEVELOPMENT: '1'
        run: |
          python scripts/compile_spec.py specs/P2-V0.15.2.md
          python scripts/validate_spec.py --require-dspy specs/P2-V0.15.2.md
      - name: Publish plan and remove validation-only workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/compiled/P2-V0.15.2.plan.json
          git rm .github/workflows/ws60-compile-plan.yml
          git commit -m 'spec: record protected DSPy plan evidence for P2-V0.15.2'
          git push origin HEAD:ws/app-workspace-lineage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ws60-compiled-plan
          path: specs/compiled/P2-V0.15.2.plan.json
          if-no-files-found: error
          retention-days: 14
