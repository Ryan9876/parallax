name: W9 S2 record reconciliation

on:
  push:
    branches:
      - records/w9-s2-release

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: records/w9-s2-release
          fetch-depth: 1

      - name: Update authoritative records
        run: python .github/scripts/w9_s2_reconcile.py

      - name: Commit record reconciliation
        run: |
          git config user.name "Ryan9876"
          git config user.email "ryansmith100@gmail.com"
          git rm .github/workflows/w9-s2-record-reconcile.yml .github/scripts/w9_s2_reconcile.py
          git add ARCHITECTURE.md CURRENT-STATE.md
          git diff --cached --check
          git commit -m "Record W9-S2 architecture and production verification"
          git push origin HEAD:records/w9-s2-release
