name: Wave 2 Vercel Bootstrap Cleanup

on:
  workflow_dispatch:
  push:
    branches: [ops/wave2-provision-run]
    paths:
      - '.github/workflows/wave2-vercel-provision-run.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: wave2-vercel-bootstrap-cleanup
  cancel-in-progress: false

jobs:
  revoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require bootstrap credential
        id: credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'BLOCKED: VERCEL_TOKEN secret is absent; no credential was revoked.'
            exit 78
          fi
          echo 'PASS: bootstrap credential is available for self-revocation.'

      - name: Revoke current Vercel authentication token
        id: revoke
        if: steps.credential.outcome == 'success'
        shell: bash
        run: |
          STATUS=$(curl -sS -o /tmp/revoke.json -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Accept: application/json' \
            'https://api.vercel.com/v3/user/tokens/current')
          rm -f /tmp/revoke.json
          if [ "$STATUS" != '200' ]; then
            echo "BLOCKED: Vercel token self-revocation returned HTTP $STATUS."
            exit 1
          fi
          echo 'PASS: temporary Vercel bootstrap token revoked.'

      - name: Prove revoked token no longer reaches Parallax API project
        id: verify
        if: steps.revoke.outcome == 'success'
        shell: bash
        run: |
          TEAM='team_JgE8AWWz36uzRbeR6V6EWg9k'
          API='prj_4lhve1AXZntfauaGHvkuaGWC6KJX'
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$API?teamId=$TEAM")
          echo "post_revoke_status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = '200' ]; then
            echo 'BLOCKED: revoked bootstrap credential still has project access.'
            exit 1
          fi
          echo "PASS: revoked bootstrap credential is rejected by Vercel (HTTP $STATUS)."

      - name: Record cleanup evidence in Control Tower
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
          REVOKE_OUTCOME: ${{ steps.revoke.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          POST_REVOKE_STATUS: ${{ steps.verify.outputs.post_revoke_status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "Wave 2 bootstrap credential cleanup at \`$HEAD_SHA\`: credential **$CREDENTIAL_OUTCOME**; Vercel self-revoke **$REVOKE_OUTCOME**; post-revoke rejection proof **$VERIFY_OUTCOME** (HTTP $POST_REVOKE_STATUS). No token value was read or reported. Run evidence: $RUN_URL"
