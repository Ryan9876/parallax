name: Wave 2 Vercel Provision Run

on:
  workflow_dispatch:
  push:
    branches: [ops/wave2-provision-run]
    paths:
      - '.github/workflows/wave2-vercel-provision-run.yml'
      - 'scripts/provision_wave2_vercel.py'
      - 'scripts/provision_wave2_vercel_ci.py'
      - 'services/api/tests/test_wave2_vercel_provisioning.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: wave2-vercel-provision-run
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CI: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require opaque Vercel management credential
        id: credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'BLOCKED: repository Actions secret VERCEL_TOKEN is not configured.'
            exit 78
          fi
          echo 'PASS: opaque Vercel credential is available to the runner.'
      - name: Verify bootstrap token reaches both registered projects
        id: token_scope
        if: steps.credential.outcome == 'success'
        shell: bash
        run: |
          TEAM='team_JgE8AWWz36uzRbeR6V6EWg9k'
          API='prj_4lhve1AXZntfauaGHvkuaGWC6KJX'
          PREVIEW='prj_wLXC5JjjetJf0H97kncRlqczD3OC'
          API_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$API?teamId=$TEAM")
          PREVIEW_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$PREVIEW?teamId=$TEAM")
          echo "api_status=$API_STATUS" >> "$GITHUB_OUTPUT"
          echo "preview_status=$PREVIEW_STATUS" >> "$GITHUB_OUTPUT"
          echo "Bootstrap token project reach: parallax-api=$API_STATUS, parallax=$PREVIEW_STATUS"
          if [ "$API_STATUS" != '200' ] || [ "$PREVIEW_STATUS" != '200' ]; then
            echo 'BLOCKED: bootstrap token must reach both registered Vercel projects.'
            exit 1
          fi
      - name: Install pinned Vercel CLI
        id: install_cli
        if: steps.credential.outcome == 'success' && steps.token_scope.outcome == 'success'
        run: npm install --global vercel@58.4.4
      - name: Seed canonical Vercel API project link
        id: seed_link
        if: steps.credential.outcome == 'success' && steps.token_scope.outcome == 'success' && steps.install_cli.outcome == 'success'
        shell: bash
        run: |
          mkdir -p services/api/.vercel
          printf '%s\n' '{"orgId":"team_JgE8AWWz36uzRbeR6V6EWg9k","projectId":"prj_4lhve1AXZntfauaGHvkuaGWC6KJX"}' > services/api/.vercel/project.json
          python -m compileall -q scripts/provision_wave2_vercel.py scripts/provision_wave2_vercel_ci.py
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import provision_wave2_vercel_ci as ci
          ci._ensure_seeded_link(Path('services/api').resolve())
          print('PASS: canonical parallax-api project link seeded and verified without resolving user identity.')
          PY
      - name: Inventory team-wide Vercel Connect records
        id: connector_inventory
        if: steps.seed_link.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess

          result = subprocess.run(
              ['vercel', 'connect', 'list', '--all-projects', '--format=json'],
              cwd='services/api',
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=False,
          )
          if result.returncode != 0:
              print('Connector inventory unavailable: command failed without exposing credentials.')
              raise SystemExit(0)
          try:
              payload = json.loads(result.stdout)
          except json.JSONDecodeError:
              print('Connector inventory unavailable: output was not JSON.')
              raise SystemExit(0)

          found = []
          def walk(value):
              if isinstance(value, dict):
                  if any(k in value for k in ('uid', 'service', 'name')):
                      item = {k: value.get(k) for k in ('id', 'uid', 'name', 'type', 'service') if isinstance(value.get(k), str)}
                      if item:
                          found.append(item)
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(payload)
          unique = []
          seen = set()
          for item in found:
              key = tuple(sorted(item.items()))
              if key not in seen:
                  seen.add(key)
                  unique.append(item)
          print('CONNECTOR_INVENTORY=' + json.dumps(unique, sort_keys=True, separators=(',', ':')))
          PY
      - name: Probe existing alizarin-feather connector against Parallax Preview
        id: existing_connector_probe
        if: steps.seed_link.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = Path('services/api')
          connector = 'github/alizarin-feather'
          project = 'prj_4lhve1AXZntfauaGHvkuaGWC6KJX'

          def run(args):
              return subprocess.run(args, cwd=repo, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)

          attached = run(['vercel', 'connect', 'attach', connector, '--project', project, '--environment', 'preview'])
          if attached.returncode != 0:
              print('EXISTING_CONNECTOR_ATTACH=failed')
              print('repo_status=attach_failed', file=open('${GITHUB_OUTPUT}', 'a'))
              raise SystemExit(0)

          token_result = run(['vercel', 'connect', 'token', connector, '--subject', 'app', '--yes', '--format=json'])
          if token_result.returncode != 0:
              print('EXISTING_CONNECTOR_TOKEN=failed')
              run(['vercel', 'connect', 'detach', connector, '--project', project, '--yes'])
              print('repo_status=token_failed', file=open('${GITHUB_OUTPUT}', 'a'))
              raise SystemExit(0)

          try:
              payload = json.loads(token_result.stdout)
          except json.JSONDecodeError:
              print('EXISTING_CONNECTOR_TOKEN=invalid_json')
              run(['vercel', 'connect', 'detach', connector, '--project', project, '--yes'])
              print('repo_status=token_invalid', file=open('${GITHUB_OUTPUT}', 'a'))
              raise SystemExit(0)

          def find_token(value):
              if isinstance(value, dict):
                  token = value.get('token')
                  if isinstance(token, str) and token:
                      return token
                  for child in value.values():
                      found = find_token(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_token(child)
                      if found:
                          return found
              return None

          token = find_token(payload)
          if not token:
              print('EXISTING_CONNECTOR_TOKEN=missing')
              run(['vercel', 'connect', 'detach', connector, '--project', project, '--yes'])
              print('repo_status=token_missing', file=open('${GITHUB_OUTPUT}', 'a'))
              raise SystemExit(0)

          request = urllib.request.Request(
              'https://api.github.com/repos/Ryan9876/parallax',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'parallax-connect-probe',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          status = 0
          body = b''
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  status = int(response.status)
                  body = response.read()
          except urllib.error.HTTPError as exc:
              status = int(exc.code)
              body = exc.read()

          permissions = {}
          if status == 200:
              try:
                  repo_payload = json.loads(body.decode('utf-8'))
                  if isinstance(repo_payload, dict) and isinstance(repo_payload.get('permissions'), dict):
                      permissions = repo_payload['permissions']
              except Exception:
                  permissions = {}

          push = bool(permissions.get('push'))
          print(f'EXISTING_CONNECTOR_REPO_STATUS={status}')
          print(f'EXISTING_CONNECTOR_PUSH={str(push).lower()}')
          with open('${GITHUB_OUTPUT}', 'a') as output:
              output.write(f'repo_status={status}\n')
              output.write(f'push={str(push).lower()}\n')

          if status != 200 or not push:
              run(['vercel', 'connect', 'detach', connector, '--project', project, '--yes'])
              print('EXISTING_CONNECTOR_DISPOSITION=detached')
          else:
              print('EXISTING_CONNECTOR_DISPOSITION=preview_attached_for_further_validation')
          PY
      - name: Provision and verify Wave 2 Vercel prerequisites
        id: provision
        if: steps.credential.outcome == 'success' && steps.token_scope.outcome == 'success' && steps.install_cli.outcome == 'success' && steps.seed_link.outcome == 'success'
        run: python scripts/provision_wave2_vercel_ci.py --provision --api-dir services/api
      - name: Record provisioning evidence in Control Tower
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
          API_STATUS: ${{ steps.token_scope.outputs.api_status }}
          PREVIEW_STATUS: ${{ steps.token_scope.outputs.preview_status }}
          CLI_OUTCOME: ${{ steps.install_cli.outcome }}
          LINK_OUTCOME: ${{ steps.seed_link.outcome }}
          EXISTING_CONNECTOR_REPO_STATUS: ${{ steps.existing_connector_probe.outputs.repo_status }}
          EXISTING_CONNECTOR_PUSH: ${{ steps.existing_connector_probe.outputs.push }}
          PROVISION_OUTCOME: ${{ steps.provision.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "Wave 2 Vercel prerequisite runner executed at \`$HEAD_SHA\`. Credential: **$CREDENTIAL_OUTCOME**. Bootstrap project reach: **parallax-api=$API_STATUS / parallax=$PREVIEW_STATUS**. CLI: **$CLI_OUTCOME**. Canonical link seed: **$LINK_OUTCOME**. Existing connector probe \`github/alizarin-feather\`: **repo=$EXISTING_CONNECTOR_REPO_STATUS / push=$EXISTING_CONNECTOR_PUSH**. Provision + verify: **$PROVISION_OUTCOME**. No secret values are reported. Run evidence: $RUN_URL"

# Existing connector probe is preview-only and detaches automatically unless repository read+push access is proven.
