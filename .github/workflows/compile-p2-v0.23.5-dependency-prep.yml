name: Recompile P2-V0.23.5 Dependency Preparation

on:
  push:
    branches:
      - p2/repository-aware-validation-toolchains
    paths:
      - .github/workflows/compile-p2-v0.23.5-dependency-prep.yml
      - specs/P2-V0.23.5.md

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/repository-aware-validation-toolchains
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Validate pre-compilation contract
        run: python scripts/validate_spec.py specs/P2-V0.23.5.md --spec-only
      - name: Select DSPy model
        id: model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/qwen2.5-coder:1.5b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
          fi
      - name: Install local DSPy LM
        if: steps.model.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull qwen2.5-coder:1.5b
      - name: Compile governed specification
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py specs/P2-V0.23.5.md
      - name: Run strict protected gate
        run: python scripts/validate_spec.py specs/P2-V0.23.5.md --require-dspy
      - name: Commit compiled plan
        run: |
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add specs/compiled/P2-V0.23.5.plan.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Recompile P2-V0.23.5 dependency preparation plan"
          git push origin HEAD:p2/repository-aware-validation-toolchains

# Retriggered after the canonical branch settled so the compiled plan binds to the revised PREPARE contract.
