name: Record CI Validation Current State

on:
  push:
    branches: [docs/ci-validation-current-state]
    paths:
      - '.github/workflows/record-ci-validation.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ci-validation-current-state
          fetch-depth: 0
      - name: Update authoritative current state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CURRENT-STATE.md')
          text = path.read_text(encoding='utf-8')

          old_status_suffix = ' / CURRENT-SOURCE OT TIME REPLAY PASSED TO REVIEW**'
          new_status_suffix = ' / CURRENT-SOURCE OT TIME REPLAY PASSED TO REVIEW / RISK-TIERED CI/CD VALIDATION MAIN-VERIFIED**'
          if old_status_suffix in text and 'RISK-TIERED CI/CD VALIDATION MAIN-VERIFIED' not in text:
              text = text.replace(old_status_suffix, new_status_suffix, 1)

          anchor = '## Current production truth\n'
          section = '''## CI/CD development pipeline optimization — MAIN-VERIFIED\n\nPR #503 changed the engineering validation topology to reduce development latency without relaxing protected promotion or production governance. Exact merge source `85d6edc2d8d9e23c97429aa0e0d6a263174180c6` is on `main`. This is a workflow/policy release; it does not claim a newer application deployment or change product runtime authority.\n\nValidated behavior:\n\n- independent API, client, protected-promotion evaluation and DSPy validation jobs no longer serialize behind the API suite, so one CI attempt can expose independent failures together;\n- ordinary pull requests validate committed DSPy plan evidence deterministically, while fresh SpecCritic/SpecCompiler execution is reserved for `main` push/manual promotion boundaries;\n- browser/Skia acceptance and dependency audit are path-scoped to client changes instead of running for unrelated API/spec/governance work;\n- Bounded Autonomy retains its protected execution/autonomy tests but no longer duplicates the full API and client suites; legacy status contexts are preserved without duplicate execution;\n- full API regression coverage, protected Code/Engineering/Reason benchmark rejection, committed DSPy evidence, production QA/replay requirements, deployment authority and the REVIEW ceiling are unchanged.\n\nValidation evidence:\n\n- PR #503 exact head `e7bdfa245754acb006ca5275339f3dbb56a23140`;\n- PR Parallax P2 CI `33347033544`: SUCCESS; API/contracts, fast client, protected promotion evaluation and deterministic committed-plan DSPy validation all passed independently;\n- PR Bounded Autonomy `33347033542`: SUCCESS; focused protected autonomy checks passed and compatibility client context completed without rerunning the client suite;\n- PR Client Visual Validation `33347033522`: SUCCESS after correcting the split workflow to use the repository's established client dependency installation;\n- post-merge main Parallax P2 CI `33347210262`: SUCCESS, including full API regression, client checks, protected promotion evaluation and fresh promotion-boundary DSPy SpecCritic/SpecCompiler validation;\n- post-merge main Client Visual Validation `33347210250`: SUCCESS.\n\nThe observed PR fast-client job completed in about 68 seconds versus about 169 seconds for the prior client job that also installed Chromium and ran browser/Skia acceptance. The larger architectural benefit is that unrelated failures no longer force later independent gates to be discovered on separate reruns.\n\n'''
          if '## CI/CD development pipeline optimization — MAIN-VERIFIED' not in text:
              if anchor not in text:
                  raise SystemExit('CURRENT-STATE anchor missing')
              text = text.replace(anchor, section + anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit current-state reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT-STATE.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record risk-tiered CI validation on main'
          git push origin HEAD:docs/ci-validation-current-state
