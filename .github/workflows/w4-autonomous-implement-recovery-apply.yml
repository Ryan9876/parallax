name: Apply W4 autonomous IMPLEMENT recovery

on:
  push:
    branches:
      - ws/w4-autonomous-implement-recovery
    paths:
      - .github/scripts/w4_autonomous_implement_recovery.py
      - .github/workflows/w4-autonomous-implement-recovery-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-autonomous-implement-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded recovery edits
        run: python .github/scripts/w4_autonomous_implement_recovery.py
      - name: Install API test dependencies
        run: python -m pip install -e 'services/api[dev]'
      - name: Run focused API recovery gates
        run: >-
          pytest -q
          services/api/tests/test_reason_context_scope.py
          services/api/tests/test_work_specifications.py
          services/api/tests/test_code_autonomy.py
          services/api/tests/test_implementation_generation_context.py
      - name: Compile API sources
        run: python -m compileall -q services/api/parallax_api
      - name: Remove temporary recovery harness
        run: rm .github/scripts/w4_autonomous_implement_recovery.py .github/workflows/w4-autonomous-implement-recovery-apply.yml
      - name: Commit recovery implementation
        run: |
          git config user.name 'parallax-recovery[bot]'
          git config user.email 'parallax-recovery@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): recover autonomous IMPLEMENT progression'
          git push origin HEAD:ws/w4-autonomous-implement-recovery
