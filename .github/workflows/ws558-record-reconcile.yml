name: WS558 Reconcile Authoritative Records

on:
  push:
    branches:
      - 'ws/558-greenfield-empty-tree-baseline'
    paths:
      - '.github/workflows/ws558-record-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/558-greenfield-empty-tree-baseline
          fetch-depth: 0
      - name: Reconcile architecture and current state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          arch = Path('ARCHITECTURE.md')
          text = arch.read_text(encoding='utf-8')
          if 'Version: 3.46' not in text:
              text = text.replace('Version: 3.45', 'Version: 3.46', 1)
          marker = '## Version relationship\n\n'
          paragraph = (
              'Architecture v3.46 corrects the real GitHub empty-repository baseline mechanism while preserving the existing deterministic two-commit greenfield invariant and every v3.45 lifecycle authority. Only after authenticated exact-repository inspection proves the canonical repository is truly empty may verified REVIEW delivery create the fixed non-executable `.parallax-greenfield` bootstrap root through the Contents API. The returned bootstrap commit, canonical default ref, commit actor/message/tree, one fixed marker blob and provenance content are read back and verified before cleanup. Production evidence disproved the earlier assumption that deleting the sole file through the Contents API leaves a durable readable empty-tree cleanup commit: GitHub can return the repository to provider-level empty state instead. The initializer therefore constructs the second commit through the Git Database surface already covered by exact-repository `contents:write`: create a tree from the verified bootstrap tree deleting only the fixed marker with `sha: null`, read back an exact empty tree, create the fixed cleanup commit with exactly one bootstrap parent, re-read the default ref to require the bootstrap head, then update that same canonical ref to the cleanup commit with `force=false` and exact final read-back. Existing baseline replay remains GET-only and accepts only the exact two-commit history, fixed actor/messages/path/content/provenance and empty head tree. Concurrent ref movement, malformed objects, unrelated history or provider conflict fails closed. No provider, connector, repository scope, permission, reusable credential, arbitrary Git mutation, source-lineage authority, accepted-source default-branch publication, PR/Preview authority, merge, REVIEW completion or production-promotion authority is added. Architecture v3.45 remains the PLAN-bound same-lineage execution-contract foundation.\n\n'
          )
          if 'Architecture v3.46 corrects the real GitHub empty-repository baseline mechanism' not in text:
              text = text.replace(marker, marker + paragraph, 1)
          arch.write_text(text, encoding='utf-8')

          current = Path('CURRENT-STATE.md')
          text = current.read_text(encoding='utf-8')
          text = text.replace('Date: 2026-09-01', 'Date: 2026-09-02', 1)
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('Status:'):
                  if 'P2-V0.23.35' not in line:
                      addition = ' / P2-V0.23.35 EXACT SCOPED CONNECT PREFLIGHT PARITY PRODUCTION-DEPLOYMENT-VERIFIED / P2-V0.23.36 EXACT-REPOSITORY VERCEL DISCOVERY PRODUCTION-DEPLOYMENT-VERIFIED / LATER BOUNDED GREENFIELD BLOCKER EXPOSED / P2-V0.23.37 DURABLE EMPTY-TREE GREENFIELD BASELINE VALIDATED / PRODUCTION PENDING'
                      lines[i] = line[:-2] + addition + '**' if line.endswith('**') else line + addition
                  break
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          sections = '''## P2-V0.23.37 — durable empty-tree greenfield baseline — VALIDATED / PRODUCTION PENDING

Workstream: #558. Release PR: #559. Governing specification: `P2-V0.23.37`. Architecture: `ARCHITECTURE.md` v3.46.

P2-V0.23.37 preserves the accepted two-commit greenfield baseline but replaces the provider-invalid cleanup mechanism exposed by the frozen W9-S1 production replay. A truly empty exact repository is still initialized only at verified REVIEW through one fixed Contents API bootstrap marker. The bootstrap root/ref/commit/tree/blob/provenance is now read back before cleanup. The second empty-tree commit is then created through Git Data by deleting only `.parallax-greenfield` from the verified bootstrap tree with `sha: null`, verifying the returned tree is empty, creating the fixed cleanup commit with exactly one bootstrap parent, rechecking the canonical default ref, and updating that ref only with `force=false`. Existing exact two-commit replay remains GET-only. No provider permission, arbitrary Git surface, lifecycle authority or REVIEW/production authority is widened.

Validated evidence before production cutover:

- pre-implementation protected spec gate `33589695641`: SUCCESS, including authentic local DSPy SpecCritic/SpecCompiler execution and strict `--require-dspy` validation;
- exact validated PR head `e05f2ca02bd9d27c6dd79095e7e5071830cd7d2d`;
- PR #559 Bounded Autonomy Pilot `33590436441`: SUCCESS;
- PR #559 Workstream Spec Validation `33590436324`: SUCCESS;
- PR #559 Parallax P2 CI `33590436269`: SUCCESS, including full API regression, client checks and protected promotion evaluation;
- exact PR API Preview deployment `dpl_C4g5u6gQKbWJFE11hmgHhagGQC55`: READY, non-production.

P2-V0.23.37 is **not yet production-deployed** at this record point. The frozen W9-S1 Engineering Run has not yet been replayed against `.37`; production acceptance remains pending exact merged-source deployment and same-run continuation.

## P2-V0.23.36 — exact-repository Vercel target discovery — PRODUCTION-DEPLOYMENT-VERIFIED / LATER BOUNDED GREENFIELD BLOCKER EXPOSED

Workstream: #556. Release PR: #557. Governing specification: `P2-V0.23.36`. Architecture remains v3.45 for this release.

P2-V0.23.36 replaces broad team-level Vercel Project discovery with exact numeric GitHub repository-filtered discovery and preserves fail-closed verification of every returned Project. Exact merge/application source is `9a23fa8581082c4b22969e5c2ad79a85cd1cd558`. Post-merge Workstream Spec Validation `33588840199` and Parallax P2 CI `33588840211` both passed. Production deployment `dpl_BGtCUGHcF1sMRDSjbv59S7rbWTBp` is READY from that exact source; canonical `/health` and `/ready` returned HTTP 200, production preflights passed and exact-deployment runtime verification was clean.

Frozen W9-S1 Engineering Run `a64d56b7-ad42-42ad-9562-891783363f4a` remained at REVIEW revision 6 and was retried under the same canonical run. Exact production request logs show Vercel discovery `GET /v9/projects?repoId=1351932371&limit=2...` returned 200, bounded Project creation/read-back succeeded for `prj_g4XtKZIenAj0OB01nCN3JDDMAPdM`, and production-deployment absence was verified. `TARGET_DISCOVERY_UNBOUNDED` did not recur. The same request then exposed a genuinely later GitHub greenfield failure: fixed `.parallax-greenfield` Contents `PUT` returned 201, the default ref later returned 409, Contents `DELETE` returned 200, and the returned cleanup commit could not be read because GitHub had returned the repository to empty state. Source delivery failed bounded as `PROVIDER_CONFLICT`; W9-S1 did not complete and human REVIEW authority remained unchanged. Evidence readback workflow `33589220623` confirmed the durable run remained REVIEW revision 6.

## P2-V0.23.35 — exact scoped Connect preflight parity — PRODUCTION-DEPLOYMENT-VERIFIED

Workstream: #553. Release PR: #554. Governing specification: `P2-V0.23.35`. Durable architecture remained v3.45.

P2-V0.23.35 restores exact-one-repository `authorizationDetails` to production provider, projected-source and runtime-readiness Connect token exchanges after GitHub App installation coverage expanded beyond one repository. Exact read scope is independently verified before source use; the existing write-scoped delivery permission boundary remains separate and unchanged. PR validation recorded 30 focused/adjacent tests passing, full API regression 1,209 passed / 1 skipped, compileall PASS and diff-check PASS. Exact merge source is `4fca5da19e24c276c8a506dfa114266ac8320ae0`; production deployment `dpl_ETNgFuWpNH9vC43uqfbx4aWQqrJ7` is READY from that exact source. P2-V0.23.36 subsequently superseded the production source while retaining this scope correction.

'''
          if '## P2-V0.23.37 — durable empty-tree greenfield baseline' not in text:
              status_end = text.find('\n', text.find('Status:'))
              insert_at = status_end + 1
              while insert_at < len(text) and text[insert_at] == '\n':
                  insert_at += 1
              text = text[:insert_at] + sections + text[insert_at:]
          current.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/ws558-record-reconcile.yml
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add ARCHITECTURE.md CURRENT-STATE.md
          git diff --cached --check
          git commit -m 'Reconcile P2-V0.23.35-.37 authoritative records'
          git push origin HEAD:ws/558-greenfield-empty-tree-baseline
