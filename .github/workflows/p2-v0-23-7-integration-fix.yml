name: P2-V0.23.7 Integration Harness Fix

on:
  push:
    branches: [work/w9-s1-repository-authorization]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/w9-s1-repository-authorization
      - name: Align temporary harness with repository client install
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/p2-v0-23-7-integration.yml')
          text = path.read_text()
          old = '          npm ci\n          npm run typecheck\n'
          new = '          npm install\n          npm run typecheck\n'
          if old not in text:
              raise SystemExit('temporary integration client install seam missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'parallax-harness-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/p2-v0-23-7-integration.yml
          git commit -m 'Align temporary integration client install'
          git push origin HEAD:work/w9-s1-repository-authorization
