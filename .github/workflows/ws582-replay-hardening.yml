name: WS582 Exact Replay Hardening

on:
  push:
    branches:
      - ws/582-partial-github-publication-recovery
    paths:
      - .github/workflows/ws582-replay-hardening.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/582-partial-github-publication-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Re-prove protected DSPy spec gate
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.44.md
      - name: Run exact replay focused regressions
        run: |
          pytest -q \
            services/api/tests/test_provider_clients.py \
            services/api/tests/test_source_delivery_composition.py \
            services/api/tests/test_greenfield_commit_bearing_delivery.py \
            services/api/tests/test_app_builder_source_delivery_bridge.py
      - name: Run full API regression and compile gate
        run: |
          pytest -q services/api/tests
          python -m compileall -q services/api/parallax_api
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.44.md
      - name: Refine Architecture v3.53 exact replay contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("ARCHITECTURE.md")
          text = path.read_text(encoding="utf-8")
          old = "whose deterministic Parallax commit message and exact expected parent must prove an exact lineage replay before PR/Preview delivery can continue."
          new = "whose deterministic Parallax commit message, exact expected parent, exact changed blob path/mode/size set, and exact expected content digests must prove an exact lineage replay before PR/Preview delivery can continue."
          if text.count(old) != 1:
              raise SystemExit("expected one Architecture v3.53 replay sentence")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Persist validated architecture refinement
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add ARCHITECTURE.md
          git diff --cached --check
          git commit -m 'Document exact P2-V0.23.44 replay tree proof'
          git push origin HEAD:ws/582-partial-github-publication-recovery
