name: W8-S2 .NET Restore Diagnostic

on:
  push:
    branches:
      - qa/w8-s2-p2-v0-23-6-replay
    paths:
      - .github/workflows/w8-s2-dotnet-restore-diagnostic.yml

permissions:
  contents: read

jobs:
  restore-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ryan9876/ot-time
          ref: fix/restore-dependencies-p2-v0-23-6
          path: ot-time
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.424
      - name: Restore
        run: dotnet restore ot-time/OtTime.sln --nologo
      - name: Build offline
        run: dotnet build ot-time/OtTime.sln --no-restore --nologo
      - name: Test offline
        run: dotnet test ot-time/OtTime.sln --no-restore --nologo
