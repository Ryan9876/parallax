name: P2-V0.23.40 Authoritative Record Reconciliation

on:
  push:
    branches: [ws/565-static-web-acceptance-evidence]
    paths:
      - .github/triggers/p2-v0-23-40-records

permissions:
  contents: write

jobs:
  reconcile-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile architecture and current state
        run: python scripts/tmp_v02340_records.py
      - name: Verify authoritative record changes
        run: |
          set -euo pipefail
          grep -q '^Version: 3.49$' ARCHITECTURE.md
          grep -q 'P2-V0.23.40 — honest static-web acceptance evidence — IMPLEMENTATION-VALIDATED / PR PENDING' CURRENT-STATE.md
          git diff --check
      - name: Persist authoritative record reconciliation
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git rm .github/workflows/p2-v0-23-40-records.yml .github/triggers/p2-v0-23-40-records scripts/tmp_v02340_records.py
          git add ARCHITECTURE.md CURRENT-STATE.md
          git diff --cached --check
          git commit -m 'Reconcile P2-V0.23.40 validated architecture state'
          git push
