name: WS570 P2-V0.23.42 Spec Gate

on:
  push:
    branches:
      - ws/570-commit-bearing-empty-delivery
    paths:
      - specs/P2-V0.23.42.md
      - .github/workflows/ws570-spec-gate.yml

permissions:
  contents: write

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPEC_PATH: specs/P2-V0.23.42.md
      DSPY_MODEL: ollama_chat/llama3.2:1b
      DSPY_API_BASE: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/570-commit-bearing-empty-delivery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate specification structure
        run: python scripts/validate_spec.py "$SPEC_PATH"
      - name: Install and start local DSPy model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull llama3.2:1b
      - name: Compile authentic DSPy plan
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Strictly validate compiled DSPy evidence
        run: python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
      - name: Persist compiled plan
        run: |
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add specs/compiled/P2-V0.23.42.plan.json
          if git diff --cached --quiet; then
            echo 'Compiled plan already persisted.'
          else
            git commit -m 'Compile P2-V0.23.42 DSPy plan'
            git push origin HEAD:ws/570-commit-bearing-empty-delivery
          fi
      - name: Upload DSPy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-v0-23-42-spec-gate
          path: |
            specs/compiled/P2-V0.23.42.plan.json
            /tmp/ollama.log
          if-no-files-found: ignore
