name: Compile P2-V0.23.11 plan
on:
  push:
    branches: [fix/human-resume-worker-rearm]
    paths: [.github/workflows/compile-p2311-plan.yml]
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'
      - run: |
          echo 'DSPY_MODEL=ollama_chat/qwen2.5:0.5b' >> "$GITHUB_ENV"
          echo 'DSPY_API_BASE=http://127.0.0.1:11434' >> "$GITHUB_ENV"
          echo 'DSPY_API_KEY=' >> "$GITHUB_ENV"
          echo 'DSPY_LOCAL_DEVELOPMENT=1' >> "$GITHUB_ENV"
      - run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - run: python scripts/compile_spec.py specs/P2-V0.23.11.md
      - run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.11.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specs/compiled/P2-V0.23.11.plan.json
          git commit -m "Compile protected P2-V0.23.11 plan"
          git push origin HEAD:fix/human-resume-worker-rearm
