name: Apply W4 mobile observability scroll correction

on:
  push:
    branches:
      - ws/w4-mobile-observability-scroll
    paths:
      - .github/workflows/w4-mobile-observability-scroll-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-mobile-observability-scroll
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded observability layout correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/client/src/components/observability/LiveBuildWorkspace.tsx')
          text = path.read_text()
          start = '  return (\n    <View style={styles.root} testID="live-build-workspace">\n'
          replacement = '  const workspaceContent = (\n    <>\n'
          if start not in text:
              raise SystemExit('LiveBuildWorkspace return start not found')
          text = text.replace(start, replacement, 1)
          tail_lines = [
              '      <View style={[styles.body, focused && styles.bodyFocused]}>',
              '        <View style={styles.primary}>{focused ? renderFocusedSection() : renderDesktopTab()}</View>',
              '        {!focused && showContext ? <ContextRail observer={observer} run={run} /> : null}',
              '      </View>',
              '    </View>',
              '  );',
              '}',
              '',
              'const styles = StyleSheet.create({',
              "  root: { flex: 1, minHeight: 0, backgroundColor: 'rgba(251,247,238,0.76)' },",
          ]
          tail = '\n'.join(tail_lines) + '\n'
          replacement_lines = [
              '      <View style={[styles.body, focused && styles.bodyFocused]}>',
              '        <View style={styles.primary}>{focused ? renderFocusedSection() : renderDesktopTab()}</View>',
              '        {!focused && showContext ? <ContextRail observer={observer} run={run} /> : null}',
              '      </View>',
              '    </>',
              '  );',
              '',
              '  return (',
              '    <View style={styles.root} testID="live-build-workspace">',
              '      {compact ? (',
              '        <ScrollView',
              '          style={styles.mobileRootScroll}',
              '          contentContainerStyle={styles.mobileRootContent}',
              '          nestedScrollEnabled',
              '          showsVerticalScrollIndicator={false}',
              '          testID="live-build-mobile-scroll"',
              '        >',
              '          {workspaceContent}',
              '        </ScrollView>',
              '      ) : workspaceContent}',
              '    </View>',
              '  );',
              '}',
              '',
              'const styles = StyleSheet.create({',
              "  root: { flex: 1, minHeight: 0, backgroundColor: 'rgba(251,247,238,0.76)' },",
              '  mobileRootScroll: { flex: 1, minHeight: 0 },',
              '  mobileRootContent: { flexGrow: 1, paddingBottom: 18 },',
          ]
          tail_replacement = '\n'.join(replacement_lines) + '\n'
          if tail not in text:
              raise SystemExit('LiveBuildWorkspace return tail not found')
          path.write_text(text.replace(tail, tail_replacement, 1))
          PY
      - name: Remove temporary mutation harness
        run: rm .github/workflows/w4-mobile-observability-scroll-apply.yml
      - name: Commit corrected client layout
        run: |
          git config user.name 'parallax-hotfix[bot]'
          git config user.email 'parallax-hotfix@users.noreply.github.com'
          git add apps/client/src/components/observability/LiveBuildWorkspace.tsx .github/workflows/w4-mobile-observability-scroll-apply.yml
          git commit -m 'fix(client): restore mobile observability scrolling'
          git push origin HEAD:ws/w4-mobile-observability-scroll
