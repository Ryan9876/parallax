name: WS148 Wire Live Build

on:
  push:
    branches: [ws/w4-live-build-ux]
    paths: ['.github/workflows/ws148-wire-live-build.yml']

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-live-build-ux
      - name: Apply audited Live Build wiring patch
        run: python scripts/ws148_wire_live_build.py
      - name: Commit integration
        run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/client/src/lib/api.ts apps/client/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Wire protected Live Build observability workspace'
          git push origin HEAD:ws/w4-live-build-ux
