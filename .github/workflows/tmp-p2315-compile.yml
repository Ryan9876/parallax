name: Temporary P2-V0.23.15 DSPy compile

on:
  push:
    branches:
      - fix/p2315-structured-output-classification
    paths:
      - .github/workflows/tmp-p2315-compile.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2315-structured-output-classification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'

      - id: model
        name: Select provider-backed or local DSPy model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi

      - name: Install local DSPy development LM
        if: steps.model.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b

      - name: Compile exact P2-V0.23.15 specification
        timeout-minutes: 8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py specs/P2-V0.23.15.md

      - name: Verify authentic compiled evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.15.md

      - name: Commit generated plan and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "parallax-qa-compiler"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/tmp-p2315-compile.yml
          git add specs/compiled/P2-V0.23.15.plan.json .github/workflows/tmp-p2315-compile.yml
          git commit -m "Compile P2-V0.23.15 DSPy plan"
          git push origin HEAD:fix/p2315-structured-output-classification
