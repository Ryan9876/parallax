name: WS144 Compile Plan

on:
  push:
    branches:
      - ws/w4-experience-contract
    paths:
      - 'specs/P2-V0.17.0.md'
      - '.github/workflows/ws144-compile-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'
      - name: Validate approved specification contract
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.17.0.md
      - name: Configure local DSPy proof model
        run: |
          echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
          echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
          echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
          echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
      - name: Install local DSPy development LM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Run DSPy SpecCritic + SpecCompiler
        timeout-minutes: 8
        run: python scripts/compile_spec.py specs/P2-V0.17.0.md
      - name: Verify generated plan evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.17.0.md
      - uses: actions/upload-artifact@v4
        with:
          name: ws144-compiled-plan
          path: specs/compiled/P2-V0.17.0.plan.json
          if-no-files-found: error
          retention-days: 14
