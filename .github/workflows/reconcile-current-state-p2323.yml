name: P2-V0.23.23 Current State Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-current-state-p2323.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile authoritative current state
        env:
          SECTION_B64: 
        run: python -c 'from pathlib import Path; import base64,os; p=Path("CURRENT-STATE.md"); t=p.read_text(); old="P2-V0.23.22 REQUEST-BOUNDED AUTONOMOUS BUILDS PRODUCTION-VERIFIED**"; new="P2-V0.23.22 REQUEST-BOUNDED AUTONOMOUS BUILDS PRODUCTION-VERIFIED / P2-V0.23.23 BOUNDED VALIDATOR REPAIR DEPLOYED-READY / PRODUCTION BEHAVIOR ACCEPTANCE PENDING**"; assert old in t; t=t.replace(old,new,1); anchor="\n## P2-V0.23.22 — request-bounded autonomous builds — PRODUCTION-VERIFIED\n"; section=base64.b64decode(os.environ["SECTION_B64"]).decode(); assert anchor in t; assert "## P2-V0.23.23 — bounded validator repair" not in t; t=t.replace(anchor,"\n"+section+anchor,1); p.write_text(t)'
      - name: Validate record diff
        run: |
          set -euo pipefail
          git diff --check
          git diff -- CURRENT-STATE.md
      - name: Commit authoritative reconciliation and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "Parallax Release Worker"
          git config user.email "parallax-release-worker@users.noreply.github.com"
          git rm .github/workflows/reconcile-current-state-p2323.yml
          git add CURRENT-STATE.md
          git commit -m "P2-V0.23.23 — record deployed-ready current state"
          git push origin HEAD:main
