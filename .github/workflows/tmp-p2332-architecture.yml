name: P2-V0.23.32 Architecture Reconciliation

on:
  push:
    branches:
      - ws/543-candidate-validation-repair
    paths:
      - .github/workflows/tmp-p2332-architecture.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/543-candidate-validation-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile architecture v3.43
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          if 'Version: 3.42' not in text:
              raise SystemExit('expected Architecture v3.42 baseline')
          anchor = '## Version relationship\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('architecture version relationship anchor drifted')
          paragraph = (
              'Architecture v3.43 converts one repairable `static-web-v1` disposable candidate BUILD/TEST/VERIFY rejection into a single bounded validation-guided replacement while preserving the existing two-candidate ceiling. The protected validator may project only one exact server-owned static-web reason code from one-line validator stderr; only fixed candidate-authored content/structure reasons are repairable, while infrastructure and policy reasons remain terminal without spending a model call. The replacement consumes the existing alternative-candidate round, discards the rejected candidate completely, starts again from authoritative accepted/base source under the same Work Specification and immutable PLAN-bound execution contract, and reruns unchanged proposal safety, SafeImplementationEngine, real disposable BUILD/TEST/VERIFY, independent evaluation and routing. A second candidate validation rejection is terminal and cannot create a third candidate. Raw validator output, rejected source/generated content, exception/provider payloads, filesystem roots, credentials and environment values never enter repair guidance or durable evidence; only the closed reason code may be added to the bounded candidate-validation diagnostic envelope. The production static-web canary remains the same immutable real Vercel sandbox replay but now reports explicit `contract=static-web-v1`, `binding=GREENFIELD_STATIC_WEB`, `ecosystem=static-web`, profile, stage set and candidate digest so execution-contract identity cannot be confused with the reused `node-v1` execution profile. Model/provider roster, 60-second hosted timeout, zero hidden provider retries, validator-repair budget, source-lineage authority, Git/deployment/lifecycle authority and the human REVIEW ceiling remain unchanged. Architecture v3.42 remains the explicit PLAN-bound execution-contract foundation.\n\n'
          text = text.replace('Version: 3.42', 'Version: 3.43', 1)
          text = text.replace(anchor, anchor + paragraph, 1)
          path.write_text(text)
          PY
      - name: Verify governed specification and architecture marker
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.32.md
          grep -q '^Version: 3.43$' ARCHITECTURE.md
          grep -q 'Architecture v3.43 converts one repairable' ARCHITECTURE.md
          git diff --check
      - name: Commit architecture and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Validator'
          git config user.email 'parallax-release@users.noreply.github.com'
          git rm .github/workflows/tmp-p2332-architecture.yml
          git add ARCHITECTURE.md
          git commit -m 'P2-V0.23.32 — architecture v3.43'
          git push origin HEAD:ws/543-candidate-validation-repair
