name: Prepare P2-V0.23.20 Empty Ref Compatibility

on:
  push:
    branches:
      - fix/p2320-empty-ref-409
    paths:
      - specs/P2-V0.23.20.md
      - .github/workflows/prepare-p2320-empty-ref-409.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-p2320-empty-ref-409
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2320-empty-ref-409
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'

      - name: Validate specification contract
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.23.20.md

      - id: model
        name: Select provider-backed or local DSPy model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi

      - name: Install local DSPy development LM
        if: steps.model.outputs.provider == 'false'
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b

      - name: Compile and verify exact DSPy plan
        timeout-minutes: 8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/compile_spec.py specs/P2-V0.23.20.md
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.20.md

      - name: Advance architecture for exact empty-ref compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          assert text.count('Version: 3.31') == 1
          text = text.replace('Version: 3.31', 'Version: 3.32', 1)
          anchor = '## Version relationship\n\n'
          addition = (
              'Architecture v3.32 makes real GitHub empty-repository ref semantics compatible with the already-governed greenfield boundary. '
              'Only after authenticated repository metadata positively proves the exact canonical repository identity and default branch may the greenfield inspector treat GitHub HTTP 409 with exact JSON message `Git Repository is empty.` as no default-branch head. '
              'Existing HTTP 404 no-head behavior remains equivalent inside that boundary; malformed responses and every other 409/422 remain fail-closed. '
              'The shared Git ref helper is unchanged, no pre-REVIEW mutation is added, and v3.21 zero-file lineage, non-empty implementation, deterministic REVIEW-only repository initialization, exact branch/PR/Preview delivery, and the human REVIEW ceiling remain authoritative. '\
              'Architecture v3.31 remains the dedicated production-QA trust contraction.\n\n'
          )
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated evidence and architecture
        run: |
          set -euo pipefail
          git config user.name "parallax-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ARCHITECTURE.md specs/compiled/P2-V0.23.20.plan.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Architecture and DSPy evidence already current'
            exit 0
          fi
          git commit -m 'Finalize P2-V0.23.20 architecture and DSPy plan'
          git push origin HEAD:fix/p2320-empty-ref-409
