name: P2-V0.23.31 Runtime Patch

on:
  push:
    branches:
      - release/p2-v0.23.31
    paths:
      - .github/workflows/tmp-p2331-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/p2-v0.23.31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch protected runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('services/api/parallax_api/code/agentic_runtime.py')
          text = path.read_text()

          def one(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one literal replacement, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          def regex(pattern: str, replacement: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f'expected one regex replacement, found {count}: {pattern[:120]!r}')

          one(
              'from .validation_toolchains import ValidationProfile, select_validation_profile\n',
              'from .validation_toolchains import (\n'
              '    ExecutionContract,\n'
              '    ValidationProfile,\n'
              '    ValidationProfileError,\n'
              '    ValidationProfileReason,\n'
              '    bind_execution_contract,\n'
              '    resolve_execution_contract,\n'
              ')\n',
          )
          one(
              'AGENTIC_RUNTIME_VERSION = "agentic-runtime-v0.19.7"\nAGENTIC_PLAN_PROGRAM_ID = "agentic-plan-v0.19.7"\n',
              'AGENTIC_RUNTIME_VERSION = "agentic-runtime-v0.19.8"\nAGENTIC_PLAN_PROGRAM_ID = "agentic-plan-v0.19.8"\n',
          )

          regex(
              r'def _candidate_admission_failure_diagnostic\(.*?\n\n@contextmanager',
              '''def _candidate_admission_failure_diagnostic(
              candidate_id: str,
              phase: str,
              exc: Exception,
          ) -> dict[str, object]:
              if phase not in _CANDIDATE_ADMISSION_PHASES:
                  raise AgenticRuntimeError("candidate admission diagnostic phase is not server-owned")
              diagnostic: dict[str, object] = {
                  "candidate_id": candidate_id,
                  "phase": phase,
                  "failure_kind": _candidate_admission_failure_kind(exc),
                  "candidate_is_canonical_lineage": False,
                  "accepts_source_lineage": False,
                  "source_lineage_accepted": False,
                  "engineering_run_transitioned": False,
                  "review_completed": False,
                  "production_deployed": False,
              }
              if isinstance(exc, ValidationProfileError):
                  diagnostic["reason_code"] = exc.code.value
              elif isinstance(exc, ExecutionPolicyError):
                  diagnostic["reason_code"] = ValidationProfileReason.EXECUTION_CONTRACT_DRIFT.value
              return diagnostic


          @contextmanager''',
          )

          regex(
              r'(    @staticmethod\n    def _transfer_source\(.*?                batch\.write_bytes\(path, content\)\n)(\n    def validate_candidate\()',
              r'''\1
              @staticmethod
              def _transfer_server_validator(instance: object, profile: ValidationProfile) -> None:
                  if profile.ecosystem != "static-web":
                      return
                  source = Path(__file__).with_name("static_web_validator.py")
                  if source.is_symlink() or not source.is_file():
                      raise ValidationProfileError(ValidationProfileReason.EXECUTION_CONTRACT_UNAVAILABLE)
                  filesystem = getattr(instance, "fs", None)
                  if filesystem is None:
                      raise AgenticRuntimeError("sandbox filesystem API is unavailable")
                  filesystem.mkdir("parallax-validator", cwd="/vercel", recursive=True)
                  with filesystem.batch(cwd="/vercel/parallax-validator") as batch:
                      batch.write_bytes("static_web_validator.py", source.read_bytes())
          \2''',
          )
          one(
              '                self._transfer_source(instance, files)\n                try:\n',
              '                self._transfer_source(instance, files)\n                self._transfer_server_validator(instance, profile)\n                try:\n',
          )

          one(
              '\n    def _team_plan(\n',
              '''
              def _execution_contract_for_plan(self, run: EngineeringRun, lineage) -> ExecutionContract:
                  if not run.project_id:
                      raise AgenticRuntimeError("execution contract requires Project-bound run")
                  identity = ProjectRunIdentity(project_id=run.project_id, run_id=run.id)
                  workspace = None
                  try:
                      workspace = self.allocator.resolve(identity, lineage.lineage_id)
                      if workspace.identity != identity:
                          raise AgenticRuntimeError("execution contract workspace identity mismatch")
                      if workspace.lineage.lineage_id != lineage.lineage_id:
                          raise AgenticRuntimeError("execution contract source lineage mismatch")
                      if workspace.lineage.content_digest != lineage.content_digest:
                          raise AgenticRuntimeError("execution contract source content mismatch")
                      return bind_execution_contract(workspace.path)
                  finally:
                      if workspace is not None:
                          self.allocator.cleanup(workspace)

              def _team_plan(
          ''',
          )
          one(
              '        lineage = self._lineage(run)\n        plan = self._team_plan(\n',
              '        lineage = self._lineage(run)\n        execution_contract = self._execution_contract_for_plan(run, lineage)\n        plan = self._team_plan(\n',
          )
          one(
              '            "base_source_content_digest": lineage.content_digest,\n',
              '            "base_source_content_digest": lineage.content_digest,\n'
              '            "execution_contract_id": execution_contract.contract_id.value,\n'
              '            "execution_contract_digest": execution_contract.digest,\n'
              '            "execution_contract_target": execution_contract.target,\n'
              '            "execution_contract_binding_reason": execution_contract.binding_reason.value,\n'
              '            "validation_profile_id": execution_contract.validation_profile.profile_id.value,\n'
              '            "validation_profile_digest": execution_contract.validation_profile.digest,\n',
          )

          regex(
              r'    def _verify_plan_evidence\(.*?\n    @staticmethod\n    def _copy_candidate_workspace',
              '''    def _verify_plan_evidence(
                  self,
                  *,
                  run: EngineeringRun,
                  base_source_lineage_ref: str,
                  source_content_digest: str,
              ) -> tuple[TeamPlan, ExecutionContract]:
                  acceptance = self._acceptance(run, self.service)
                  plan = self._team_plan(run, acceptance, source_digest=source_content_digest)
                  evidence = self._plan_attempt(run)
                  contract_id = evidence.get("execution_contract_id")
                  binding_reason = evidence.get("execution_contract_binding_reason")
                  target = evidence.get("execution_contract_target")
                  if not isinstance(contract_id, str) or not isinstance(binding_reason, str):
                      raise ValidationProfileError(ValidationProfileReason.EXECUTION_CONTRACT_DRIFT)
                  if target is not None and not isinstance(target, str):
                      raise ValidationProfileError(ValidationProfileReason.EXECUTION_CONTRACT_DRIFT)
                  contract = resolve_execution_contract(
                      contract_id,
                      binding_reason=binding_reason,
                      target=target,
                  )
                  expected = {
                      "project_id": run.project_id,
                      "run_id": run.id,
                      "work_specification_id": run.work_specification_id,
                      "work_specification_revision": run.work_specification_revision,
                      "work_specification_digest": run.work_specification_digest,
                      "base_source_lineage_ref": base_source_lineage_ref,
                      "base_source_content_digest": source_content_digest,
                      "execution_contract_id": contract.contract_id.value,
                      "execution_contract_digest": contract.digest,
                      "execution_contract_target": contract.target,
                      "execution_contract_binding_reason": contract.binding_reason.value,
                      "validation_profile_id": contract.validation_profile.profile_id.value,
                      "validation_profile_digest": contract.validation_profile.digest,
                      "orchestration_policy_digest": self._policy_digest,
                      "work_graph_digest": plan.graph.digest,
                      "roster_digest": plan.roster.digest,
                      "orchestration_identity_digest": plan.identity.digest,
                      "team_plan_id": plan.plan_id,
                      "selected_agent_digests": list(plan.selected_agent_digests),
                      "routing_policy_digest": self.routing_policy.digest,
                      "competition_policy_digest": self.competition_policy.digest,
                  }
                  for key, value in expected.items():
                      if evidence.get(key) != value:
                          raise ValidationProfileError(
                              ValidationProfileReason.EXECUTION_CONTRACT_DRIFT,
                              f"persisted agentic PLAN evidence drifted at {key}",
                          )
                  return plan, contract

              @staticmethod
              def _copy_candidate_workspace''',
          )

          one(
              '    def _adapter(self, digest: str) -> HostedImplementationAgent:\n',
              '''    @staticmethod
              def _request_for_execution_contract(
                  request: ImplementationGenerationRequest,
                  contract: ExecutionContract,
              ) -> ImplementationGenerationRequest:
                  if contract.contract_id.value != "static-web-v1":
                      return request
                  return ImplementationGenerationRequest(
                      work_specification_id=request.work_specification_id,
                      work_specification_revision=request.work_specification_revision,
                      work_specification_digest=request.work_specification_digest,
                      title=request.title,
                      objective=request.objective,
                      constraints=(
                          *request.constraints,
                          "Produce a self-contained static web app with a root index.html and local HTML, CSS, and JavaScript assets. Do not rely on package scripts, package managers, bundlers, framework build steps, or network fetches.",
                      ),
                      acceptance=request.acceptance,
                      source_context=request.source_context,
                  )

              def _adapter(self, digest: str) -> HostedImplementationAgent:
          ''',
          )

          regex(
              r'    def _candidate_validation\(.*?\n    @staticmethod\n    def _validation_refs',
              '''    def _candidate_validation(
                  self,
                  base_workspace: Path,
                  proposal: ImplementationProposal,
                  *,
                  operation_key: str,
                  candidate_id: str,
                  validation_profile: ValidationProfile,
              ) -> CandidateValidationResult:
                  if not isinstance(validation_profile, ValidationProfile):
                      raise ValidationProfileError(ValidationProfileReason.EXECUTION_CONTRACT_DRIFT)
                  with tempfile.TemporaryDirectory(prefix=f"parallax-{candidate_id}-") as temporary:
                      target = Path(temporary) / "candidate"
                      self._copy_candidate_workspace(base_workspace, target)
                      try:
                          self.implementation_engine.apply(
                              target,
                              self._implementation_request(proposal),
                          )
                      except (ImplementationError, PatchError, OSError) as exc:
                          raise AgenticRuntimeError("candidate proposal failed safe disposable application") from exc
                      return self.candidate_validator.validate_candidate(
                          target,
                          operation_key=f"{operation_key[:110]}:{candidate_id}",
                          validation_profile=validation_profile,
                      )

              @staticmethod
              def _validation_refs''',
          )

          one(
              '        base_workspace: Path,\n        proposal_validator: Callable[[ImplementationProposal], bool],\n',
              '        base_workspace: Path,\n        validation_profile: ValidationProfile,\n        proposal_validator: Callable[[ImplementationProposal], bool],\n',
          )
          one(
              '                operation_key=operation_key,\n                candidate_id=candidate_id,\n            )\n',
              '                operation_key=operation_key,\n                candidate_id=candidate_id,\n                validation_profile=validation_profile,\n            )\n',
          )

          one(
              '            primary_plan = self._verify_plan_evidence(\n',
              '            primary_plan, execution_contract = self._verify_plan_evidence(\n',
          )
          one(
              '            )\n            primary, routing_context = self._make_candidate(\n',
              '            )\n            execution_request = self._request_for_execution_contract(request, execution_contract)\n            primary, routing_context = self._make_candidate(\n',
          )
          one(
              '                request=request,\n                base_workspace=workspace_root,\n                proposal_validator=proposal_validator,\n',
              '                request=execution_request,\n                base_workspace=workspace_root,\n                validation_profile=execution_contract.validation_profile,\n                proposal_validator=proposal_validator,\n',
          )
          one(
              '                        request=request,\n                        base_workspace=workspace_root,\n                        proposal_validator=proposal_validator,\n',
              '                        request=execution_request,\n                        base_workspace=workspace_root,\n                        validation_profile=execution_contract.validation_profile,\n                        proposal_validator=proposal_validator,\n',
          )

          one(
              '                    "team_plan_id": primary_plan.plan_id,\n                    "candidate_digests": [item.validation.content_digest for item in candidates],\n',
              '                    "team_plan_id": primary_plan.plan_id,\n                    "execution_contract_id": execution_contract.contract_id.value,\n                    "execution_contract_digest": execution_contract.digest,\n                    "candidate_digests": [item.validation.content_digest for item in candidates],\n',
          )
          one(
              '                "team_plan_id": primary_plan.plan_id,\n                "orchestration_identity_digest": primary_plan.identity.digest,\n',
              '                "team_plan_id": primary_plan.plan_id,\n                "execution_contract_id": execution_contract.contract_id.value,\n                "execution_contract_digest": execution_contract.digest,\n                "execution_contract_binding_reason": execution_contract.binding_reason.value,\n                "validation_profile_id": execution_contract.validation_profile.profile_id.value,\n                "validation_profile_digest": execution_contract.validation_profile.digest,\n                "orchestration_identity_digest": primary_plan.identity.digest,\n',
          )
          one(
              '                "parallax_candidate_admission_failed candidate=%s phase=%s failure_kind=%s",\n                diagnostic.get("candidate_id"),\n                diagnostic.get("phase"),\n                diagnostic.get("failure_kind"),\n',
              '                "parallax_candidate_admission_failed candidate=%s phase=%s failure_kind=%s reason_code=%s",\n                diagnostic.get("candidate_id"),\n                diagnostic.get("phase"),\n                diagnostic.get("failure_kind"),\n                diagnostic.get("reason_code"),\n',
          )

          path.write_text(text)
          PY
      - name: Compile patched runtime
        run: python -m compileall -q services/api/parallax_api/code/agentic_runtime.py services/api/parallax_api/code/validation_toolchains.py services/api/parallax_api/code/static_web_validator.py
      - name: Commit runtime patch and remove workflow
        shell: bash
        run: |
          git config user.name 'Parallax Runtime Patcher'
          git config user.email 'parallax-runtime@users.noreply.github.com'
          git add services/api/parallax_api/code/agentic_runtime.py
          git rm .github/workflows/tmp-p2331-runtime-patch.yml
          git commit -m 'P2-V0.23.31 — bind execution contract before IMPLEMENT'
          git push origin HEAD:release/p2-v0.23.31
