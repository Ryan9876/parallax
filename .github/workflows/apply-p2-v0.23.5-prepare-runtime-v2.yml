name: Apply P2-V0.23.5 PREPARE Runtime v2

on:
  push:
    branches: [p2/repository-aware-validation-toolchains]
    paths: [.github/workflows/apply-p2-v0.23.5-prepare-runtime-v2.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/repository-aware-validation-toolchains
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Apply governed PREPARE integration and compatibility corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'anchor not found: {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          v='services/api/parallax_api/code/validation_toolchains.py'
          replace_once(v,'@dataclass(frozen=True, slots=True)\nclass ValidationProfile:\n','''@dataclass(frozen=True, slots=True)\nclass PreparationCommand:\n    tool_id: str\n    probe_command: str\n    probe_args: tuple[str, ...]\n    probe_timeout_seconds: int\n    command: str\n    args: tuple[str, ...]\n    working_directory: str\n    timeout_seconds: int\n    package_domains: tuple[str, ...]\n\n\n@dataclass(frozen=True, slots=True)\nclass ValidationProfile:\n''')
          replace_once(v,'    commands: tuple[RegisteredCommand, ...]\n\n    @property\n','    commands: tuple[RegisteredCommand, ...]\n    preparation: PreparationCommand | None = None\n\n    @property\n')
          replace_once(v,'        }\n        return sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()).hexdigest()\n','''        }\n        if self.preparation is not None:\n            payload["preparation"] = {\n                "tool_id": self.preparation.tool_id,\n                "probe_command": self.preparation.probe_command,\n                "probe_args": list(self.preparation.probe_args),\n                "probe_timeout_seconds": self.preparation.probe_timeout_seconds,\n                "command": self.preparation.command,\n                "args": list(self.preparation.args),\n                "working_directory": self.preparation.working_directory,\n                "timeout_seconds": self.preparation.timeout_seconds,\n                "package_domains": list(self.preparation.package_domains),\n            }\n        return sha256(json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()).hexdigest()\n''')
          replace_once(v,'            target=target,\n            commands=(\n','''            target=target,\n            preparation=PreparationCommand(\n                tool_id="dotnet-restore", probe_command="dotnet", probe_args=("--info",), probe_timeout_seconds=30,\n                command="dotnet", args=("restore", target, "--nologo"), working_directory=".", timeout_seconds=300,\n                package_domains=("api.nuget.org", "globalcdn.nuget.org"),\n            ),\n            commands=(\n''')
          text=Path(v).read_text(encoding='utf-8').replace('(\"test\", target, \"--no-build\", \"--no-restore\", \"--nologo\")','(\"test\", target, \"--no-restore\", \"--nologo\")')
          text=text.replace('    "ValidationProfile",\n','    "PreparationCommand",\n    "ValidationProfile",\n',1)
          Path(v).write_text(text,encoding='utf-8')

          a='services/api/parallax_api/code/agentic_runtime.py'
          replace_once(a,'from .domain import WorkflowStage\n','''from .dependency_preparation import DependencyPreparationError, preparation_network_policy, run_dependency_preparation\nfrom .domain import WorkflowStage\n''')
          replace_once(a,'                network_policy=NetworkPolicy.deny_all(),\n','                network_policy=preparation_network_policy(NetworkPolicy, profile),\n')
          replace_once(a,'                self._transfer_source(instance, files)\n                for stage in (WorkflowStage.BUILD, WorkflowStage.TEST, WorkflowStage.VERIFY):\n','''                self._transfer_source(instance, files)\n                try:\n                    preparation_evidence = run_dependency_preparation(instance, NetworkPolicy, profile, sandbox_cwd=self._sandbox_cwd)\n                except DependencyPreparationError as exc:\n                    failure_spec = profile.spec_for(WorkflowStage.BUILD, operation_key=f"{operation_key[:120]}:candidate:prepare")\n                    evidence = _bounded_evidence(failure_spec, exit_code=None, duration_ms=int(exc.evidence.get("dependency_preparation_duration_ms") or 0), stdout="", stderr=exc.code)\n                    evidence.update({**exc.evidence, "candidate_content_digest": content_digest, "candidate_file_count": len(files), "candidate_total_bytes": total_bytes, "validation_profile_id": profile.profile_id.value, "validation_profile_digest": profile.digest, "execution_snapshot_id": self.snapshot_id, "execution_snapshot_verified": True, "network_policy": "deny-all" if exc.evidence.get("validation_network_locked") is True else "prepare-bounded", "candidate_is_canonical_lineage": False, "accepts_source_lineage": False})\n                    stage_evidence.append((WorkflowStage.BUILD.value, evidence))\n                    return CandidateValidationResult(content_digest=content_digest, file_count=len(files), total_bytes=total_bytes, validation_profile_id=profile.profile_id.value, validation_profile_digest=profile.digest, stage_evidence=tuple(stage_evidence))\n                if preparation_evidence.get("validation_network_locked") is not True:\n                    raise AgenticRuntimeError("validation network lock was not proven")\n                for stage in (WorkflowStage.BUILD, WorkflowStage.TEST, WorkflowStage.VERIFY):\n''')
          replace_once(a,'                            "accepts_source_lineage": False,\n                        }\n                    )\n','                            "accepts_source_lineage": False,\n                            **preparation_evidence,\n                        }\n                    )\n')

          l='services/api/parallax_api/code/lineage_sandbox_execution.py'
          replace_once(l,'from .execution import ExecutionPolicyError, ExecutionSpec, ProtectedCommandPolicy\n','from .dependency_preparation import preparation_network_policy, run_dependency_preparation\nfrom .execution import ExecutionPolicyError, ExecutionSpec, ProtectedCommandPolicy\n')
          replace_once(l,'        cleanup_error: Exception | None = None\n','''        cleanup_error: Exception | None = None\n        preparation_evidence: dict[str, object] = {"dependency_preparation_required": False, "dependency_preparation_succeeded": False, "validation_network_locked": False}\n''')
          replace_once(l,'                    network_policy=NetworkPolicy.deny_all(),\n','                    network_policy=preparation_network_policy(NetworkPolicy, profile),\n')
          replace_once(l,'                    self._transfer_source(instance, files)\n                    result = instance.run_process(\n','''                    self._transfer_source(instance, files)\n                    preparation_evidence = run_dependency_preparation(instance, NetworkPolicy, profile, sandbox_cwd=self._sandbox_cwd)\n                    if preparation_evidence.get("validation_network_locked") is not True:\n                        raise SameLineageExecutionError("validation network lock was not proven")\n                    result = instance.run_process(\n''')
          replace_once(l,'                    "execution_working_directory": self._sandbox_cwd(execution_spec.working_directory),\n                }\n            )\n','''                    "execution_working_directory": self._sandbox_cwd(execution_spec.working_directory),\n                    **preparation_evidence,\n                }\n            )\n''')
          replace_once(l,'                    "validation_profile_digest": validation_profile_digest,\n                }\n            )\n','''                    "validation_profile_digest": validation_profile_digest,\n                    **preparation_evidence,\n                }\n            )\n''')

          t='services/api/tests/test_validation_toolchains.py'
          p=Path(t); s=p.read_text(encoding='utf-8').replace('(\"test\", \"OtTime.sln\", \"--no-build\", \"--no-restore\", \"--nologo\")','(\"test\", \"OtTime.sln\", \"--no-restore\", \"--nologo\")'); p.write_text(s,encoding='utf-8')
          t='services/api/tests/test_lineage_sandbox_execution.py'
          p=Path(t); s=p.read_text(encoding='utf-8').replace('assert tuple(args) == ("-m", "compileall", "-q", ".")','assert tuple(args) == ProtectedCommandRegistry().invocation_for(WorkflowStage.BUILD)[1]'); p.write_text(s,encoding='utf-8')

          Path('services/api/tests/test_dependency_preparation.py').write_text('''from pathlib import Path\nfrom types import SimpleNamespace\nimport pytest\nfrom parallax_api.code.dependency_preparation import DependencyPreparationError, preparation_network_policy, run_dependency_preparation\nfrom parallax_api.code.validation_toolchains import select_validation_profile\nclass P:\n    def __init__(self,mode,allow=None): self.mode=mode; self.allow=allow or {}\nclass N:\n    @staticmethod\n    def deny_all(): return P("deny-all")\n    @staticmethod\n    def custom(*,allow): return P("custom",allow)\nclass I:\n    def __init__(self,probe=0,prepare=0,lock="deny-all",boom=False): self.probe=probe; self.prepare=prepare; self.lock=lock; self.boom=boom; self.calls=[]; self.policies=[]\n    def run_process(self,c,a,**kw): self.calls.append((c,tuple(a),kw)); return SimpleNamespace(returncode=self.probe if len(self.calls)==1 else self.prepare,stdout="x",stderr="")\n    def update_network_policy(self,p): self.policies.append(p);\n        if self.boom: raise RuntimeError("lock")\n        return SimpleNamespace(network_policy=P(self.lock))\ndef profile(tmp_path:Path): (tmp_path/"OtTime.sln").write_text("x"); return select_validation_profile(tmp_path.resolve())\ndef test_policy(tmp_path): assert set(preparation_network_policy(N,profile(tmp_path)).allow)=={"api.nuget.org","globalcdn.nuget.org"}\ndef test_success(tmp_path):\n    i=I(); e=run_dependency_preparation(i,N,profile(tmp_path),sandbox_cwd=lambda _:"/vercel/sandbox"); assert i.calls[1][0:2]==("dotnet",("restore","OtTime.sln","--nologo")); assert e["validation_network_locked"] is True\ndef test_prepare_failure_locks(tmp_path):\n    with pytest.raises(DependencyPreparationError) as e: run_dependency_preparation(I(prepare=1),N,profile(tmp_path),sandbox_cwd=lambda _:"/vercel/sandbox")\n    assert e.value.code=="DEPENDENCY_PREPARATION_FAILED" and e.value.evidence["validation_network_locked"] is True\ndef test_lock_failure(tmp_path):\n    with pytest.raises(DependencyPreparationError) as e: run_dependency_preparation(I(boom=True),N,profile(tmp_path),sandbox_cwd=lambda _:"/vercel/sandbox")\n    assert e.value.code=="VALIDATION_NETWORK_LOCK_FAILED"\n''',encoding='utf-8')
          PY
          python -m compileall -q services/api/parallax_api
          git diff --check
          pytest -q services/api/tests/test_dependency_preparation.py services/api/tests/test_validation_toolchains.py services/api/tests/test_lineage_sandbox_execution.py services/api/tests/test_w6_candidate_validation_diagnostics.py services/api/tests/test_w6_s3_evidence_separation.py
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/parallax_api/code/dependency_preparation.py services/api/parallax_api/code/validation_toolchains.py services/api/parallax_api/code/agentic_runtime.py services/api/parallax_api/code/lineage_sandbox_execution.py services/api/tests/test_dependency_preparation.py services/api/tests/test_validation_toolchains.py services/api/tests/test_lineage_sandbox_execution.py
          git diff --cached --check
          git commit -m "Add bounded dependency preparation for protected validation"
          git push origin HEAD:p2/repository-aware-validation-toolchains
