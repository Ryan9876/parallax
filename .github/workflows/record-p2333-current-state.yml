- post-merge Parallax P2 CI `33503578716`: SUCCESS, including full API regression, client checks, protected promotion evaluation, and fresh promotion-boundary DSPy SpecCritic/SpecCompiler compilation and verification;
- production API deployment `dpl_6ahCYmgKUyaFCZJVAEB2cMfQNGMD`: target production, state `READY`, exact application source `4e5b1e3d3962221b655630891bb7cae25cb66f01`, canonical alias `parallax-api-tan.vercel.app`;
