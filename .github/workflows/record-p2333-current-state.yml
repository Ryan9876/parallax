              raise SystemExit("expected P2-V0.23.32 status tail not found")
          text = text.replace(old_tail, new_tail, 1)

          marker = "\n## P2-V0.23.31 — explicit execution contract and end-to-end acceptance replay — PRODUCTION-BEHAVIOR-ACCEPTED / LATER BOUNDED BLOCKER EXPOSED\n"
