    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: records/p2333-production-acceptance
          fetch-depth: 0

      - name: Reconcile authoritative current state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("CURRENT-STATE.md")
          text = path.read_text(encoding="utf-8")

