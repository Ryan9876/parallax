name: W8-S2 QA Canonical Replay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/w8-s2-qa-replay.yml
      - services/api/parallax_api/services/github_actions_identity.py

permissions:
  contents: read
  id-token: write

concurrency:
  group: w8-s2-qa-canonical-replay
  cancel-in-progress: false

jobs:
  replay-public-ot-time-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://parallax-api-tan.vercel.app
      REPOSITORY_REF: github:Ryan9876/ot-time
      COOKIE_JAR: /tmp/parallax.cookies
    steps:
      - name: Request GitHub Actions OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=parallax%3A%2F%2Fqa-production"
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${request_url}" | jq -r '.value')"
          test -n "${token}"
          test "${token}" != "null"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Establish bounded Parallax QA session
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          authenticated=0
          for attempt in $(seq 1 36); do
            status="$(curl --silent --show-error \
              --output /tmp/session.json \
              --write-out '%{http_code}' \
              --cookie-jar "${COOKIE_JAR}" \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -X POST "${API_BASE}/v1/session/qa-automation" || true)"
            if [ "${status}" = "200" ] && jq -e '.authenticated == true' /tmp/session.json >/dev/null 2>&1; then
              authenticated=1
              break
            fi
            sleep 10
          done
          test "${authenticated}" = "1"

      - name: Create or reuse QA-owned OT Time Project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              --cookie "${COOKIE_JAR}" \
              -H "X-Parallax-Session: 1" \
              -H "Content-Type: application/json" \
              "$@"
          }
          api "${API_BASE}/v1/projects" >/tmp/projects.json
          project_id="$(jq -r --arg repo "${REPOSITORY_REF}" '.[] | select((.repository_ref // "" | ascii_downcase) == ($repo | ascii_downcase)) | .id' /tmp/projects.json | head -n1)"
          if [ -z "${project_id}" ]; then
            jq -n --arg repo "${REPOSITORY_REF}" '{name:"QA OT Time Source-Only Acceptance",repository_ref:$repo,delivery_mode:"source-only"}' >/tmp/project-create.json
            api --data-binary @/tmp/project-create.json -X POST "${API_BASE}/v1/projects" >/tmp/project.json
            project_id="$(jq -r '.id' /tmp/project.json)"
          else
            jq -n '{delivery_mode:"source-only"}' >/tmp/project-delivery.json
            api --data-binary @/tmp/project-delivery.json -X PATCH "${API_BASE}/v1/projects/${project_id}/delivery" >/tmp/project.json
          fi
          test "$(jq -r '.delivery_mode' /tmp/project.json)" = "source-only"
          echo "project_id=${project_id}" >> "${GITHUB_OUTPUT}"
          echo "QA-owned public OT Time Project: ${project_id}"

      - name: Create approved OT Time work plan and Engineering Run
        id: fixture
        shell: bash
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              --cookie "${COOKIE_JAR}" \
              -H "X-Parallax-Session: 1" \
              -H "Content-Type: application/json" \
              "$@"
          }
          jq -n --arg project_id "${PROJECT_ID}" '{mode:"code",project_id:$project_id}' >/tmp/conversation-create.json
          api --data-binary @/tmp/conversation-create.json -X POST "${API_BASE}/v1/conversations" >/tmp/conversation.json
          conversation_id="$(jq -r '.id' /tmp/conversation.json)"

          prompt='For the OT Time QA acceptance, make one small safe source-only improvement: add a concise PARALLAX_QA.md file that states this is the P2-V0.23.4 public-source acceptance fixture. Do not delete or rename existing files. Success means the new text file exists in the verified accepted lineage, existing application source remains intact, and no hosting deployment is required.'
          jq -n --arg content "${prompt}" '{content:$content,material_scope_change:false}' >/tmp/response-request.json
          response_status="$(curl --silent --show-error --max-time 300 \
            --output /tmp/response.sse --write-out '%{http_code}' \
            --cookie "${COOKIE_JAR}" \
            -H "X-Parallax-Session: 1" \
            -H "Content-Type: application/json" \
            -H "Accept: text/event-stream" \
            --data-binary @/tmp/response-request.json \
            -X POST "${API_BASE}/v1/conversations/${conversation_id}/responses" || true)"
          test "${response_status}" = "200"

          api -X POST "${API_BASE}/v1/conversations/${conversation_id}/work-specifications/draft" >/tmp/spec.json
          spec_id="$(jq -r '.id' /tmp/spec.json)"
          api -X POST "${API_BASE}/v1/work-specifications/${spec_id}/approve" >/tmp/approved-spec.json
          jq -n --arg conversation_id "${conversation_id}" --arg work_specification_id "${spec_id}" \
            '{conversation_id:$conversation_id,work_specification_id:$work_specification_id}' >/tmp/activate.json
          api --data-binary @/tmp/activate.json -X POST "${API_BASE}/v1/engineering-runs/activate" >/tmp/run.json
          run_id="$(jq -r '.id' /tmp/run.json)"
          state="$(jq -r '.state' /tmp/run.json)"
          revision="$(jq -r '.revision' /tmp/run.json)"
          test "${state}" = "PLAN"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "initial_revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "QA OT Time Engineering Run: ${run_id}; state=${state}; revision=${revision}"

      - name: Advance protected public-source run through REVIEW
        shell: bash
        env:
          RUN_ID: ${{ steps.fixture.outputs.run_id }}
          INITIAL_REVISION: ${{ steps.fixture.outputs.initial_revision }}
        run: |
          set -euo pipefail
          api() {
            curl --fail-with-body --silent --show-error \
              --cookie "${COOKIE_JAR}" \
              -H "X-Parallax-Session: 1" \
              -H "Content-Type: application/json" \
              "$@"
          }

          for cycle in $(seq 1 7); do
            api "${API_BASE}/v1/engineering-runs/${RUN_ID}" >/tmp/run-current.json
            state="$(jq -r '.state' /tmp/run-current.json)"
            revision="$(jq -r '.revision' /tmp/run-current.json)"
            failure="$(jq -r '.last_failure_code // ""' /tmp/run-current.json)"
            echo "Cycle ${cycle}: state=${state}; revision=${revision}; failure=${failure:-none}"
            test "${failure}" != "source_bootstrap_failed"
            if [ "${state}" = "REVIEW" ]; then
              break
            fi
            case "${state}" in PLAN|IMPLEMENT|BUILD|TEST|VERIFY) ;; *) echo "Unexpected protected state: ${state}" >&2; exit 1 ;; esac
            operation_key="qa-p2-v0-23-4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${cycle}"
            jq -n --arg operation_key "${operation_key}" --argjson expected_revision "${revision}" \
              '{operation_key:$operation_key,expected_revision:$expected_revision}' >/tmp/autonomous.json
            status="$(curl --silent --show-error --max-time 900 \
              --output /tmp/autonomous-result.json --write-out '%{http_code}' \
              --cookie "${COOKIE_JAR}" \
              -H "X-Parallax-Session: 1" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/autonomous.json \
              -X POST "${API_BASE}/v1/engineering-runs/${RUN_ID}/autonomous" || true)"
            if [ "${status}" != "200" ]; then
              cat /tmp/autonomous-result.json >&2 || true
              exit 1
            fi
            if grep -q 'REPOSITORY_AUTHORIZATION_REQUIRED' /tmp/autonomous-result.json; then
              echo "Public source incorrectly required repository provider authorization" >&2
              exit 1
            fi
          done

          api "${API_BASE}/v1/engineering-runs/${RUN_ID}" >/tmp/run-final.json
          final_state="$(jq -r '.state' /tmp/run-final.json)"
          final_revision="$(jq -r '.revision' /tmp/run-final.json)"
          failure="$(jq -r '.last_failure_code // ""' /tmp/run-final.json)"
          test "${final_revision}" -gt "${INITIAL_REVISION}"
          test "${final_state}" = "REVIEW"
          test "${failure}" != "source_bootstrap_failed"
          echo "Public OT Time source-only run reached REVIEW: revision=${final_revision}; failure=${failure:-none}"

      - name: Verify authenticated source-only handoff ZIP
        shell: bash
        env:
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          RUN_ID: ${{ steps.fixture.outputs.run_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --cookie "${COOKIE_JAR}" \
            -H "X-Parallax-Session: 1" \
            "${API_BASE}/v1/projects/${PROJECT_ID}/engineering-runs/${RUN_ID}/source-download" \
            --output /tmp/ot-time-source.zip
          unzip -t /tmp/ot-time-source.zip
          unzip -l /tmp/ot-time-source.zip | grep -F 'PARALLAX_QA.md'
          echo "Authenticated source-only handoff verified; no Vercel target or Preview was required."
