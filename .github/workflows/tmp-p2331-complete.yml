name: P2-V0.23.31 Complete Implementation

on:
  push:
    branches: [release/p2-v0.23.31]
    paths: [.github/workflows/tmp-p2331-complete.yml]

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/p2-v0.23.31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -e 'services/api[dev]'
      - name: Apply compatibility and diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          agent = Path('services/api/parallax_api/code/agentic_runtime.py')
          text = agent.read_text(encoding='utf-8')
          text = text.replace(
              '_CANDIDATE_ADMISSION_PHASES = frozenset(\n    {\n        "PROPOSAL_ASSEMBLY",',
              '_CANDIDATE_ADMISSION_PHASES = frozenset(\n    {\n        "EXECUTION_CONTRACT_VERIFICATION",\n        "PROPOSAL_ASSEMBLY",',
              1,
          )
          old = '''    def _verify_plan_evidence(\n        self,\n        *,\n        run: EngineeringRun,\n        base_source_lineage_ref: str,\n        source_content_digest: str,\n    ) -> tuple[TeamPlan, ExecutionContract]:\n'''
          new = '''    def _verify_plan_evidence(\n        self,\n        *,\n        run: EngineeringRun,\n        base_source_lineage_ref: str,\n        source_content_digest: str,\n    ) -> TeamPlan:\n        plan, _ = self._verify_plan_and_execution_contract(\n            run=run,\n            base_source_lineage_ref=base_source_lineage_ref,\n            source_content_digest=source_content_digest,\n        )\n        return plan\n\n    def _verify_plan_and_execution_contract(\n        self,\n        *,\n        run: EngineeringRun,\n        base_source_lineage_ref: str,\n        source_content_digest: str,\n    ) -> tuple[TeamPlan, ExecutionContract]:\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'def _verify_plan_and_execution_contract(' not in text:
              raise SystemExit('plan verification anchor drifted')
          old = '''            primary_plan, execution_contract = self._verify_plan_evidence(\n                run=run,\n                base_source_lineage_ref=base_source_lineage_ref,\n                source_content_digest=lineage.content_digest,\n            )\n'''
          new = '''            with _candidate_admission_phase(\n                "candidate-primary",\n                "EXECUTION_CONTRACT_VERIFICATION",\n            ):\n                primary_plan, execution_contract = self._verify_plan_and_execution_contract(\n                    run=run,\n                    base_source_lineage_ref=base_source_lineage_ref,\n                    source_content_digest=lineage.content_digest,\n                )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'primary_plan, execution_contract = self._verify_plan_and_execution_contract(' not in text:
              raise SystemExit('protected generation anchor drifted')
          if '"EXECUTION_CONTRACT_VERIFICATION"' not in text:
              raise SystemExit('contract verification phase missing')
          agent.write_text(text, encoding='utf-8')

          runtime = Path('services/api/parallax_api/code/implementation_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          old = '''        allowed_phase_fields = {\n            "candidate_id",\n            "phase",\n            "failure_kind",\n            "candidate_is_canonical_lineage",\n            "accepts_source_lineage",\n            "source_lineage_accepted",\n            "engineering_run_transitioned",\n            "review_completed",\n            "production_deployed",\n        }\n        if set(raw_phase) != allowed_phase_fields:\n            raise ValueError("candidate admission diagnostics contain a non-admitted field")\n'''
          new = '''        required_phase_fields = {\n            "candidate_id",\n            "phase",\n            "failure_kind",\n            "candidate_is_canonical_lineage",\n            "accepts_source_lineage",\n            "source_lineage_accepted",\n            "engineering_run_transitioned",\n            "review_completed",\n            "production_deployed",\n        }\n        allowed_phase_fields = {*required_phase_fields, "reason_code"}\n        if set(raw_phase) - allowed_phase_fields or not required_phase_fields <= set(raw_phase):\n            raise ValueError("candidate admission diagnostics contain a non-admitted field")\n'''
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace(
              '        phases = {\n            "PROPOSAL_ASSEMBLY",',
              '        phases = {\n            "EXECUTION_CONTRACT_VERIFICATION",\n            "PROPOSAL_ASSEMBLY",',
              1,
          )
          text = text.replace(
              '            "OS_BOUNDARY_ERROR",\n            "AGENTIC_CONTRACT_ERROR",',
              '            "OS_BOUNDARY_ERROR",\n            "VALIDATION_PROFILE_ERROR",\n            "AGENTIC_CONTRACT_ERROR",',
              1,
          )
          old = '''        normalized_phase: dict[str, object] = {\n            "candidate_id": candidate_id,\n            "phase": phase,\n            "failure_kind": failure_kind,\n        }\n        for claim in (\n'''
          new = '''        normalized_phase: dict[str, object] = {\n            "candidate_id": candidate_id,\n            "phase": phase,\n            "failure_kind": failure_kind,\n        }\n        reason_code = raw_phase.get("reason_code")\n        profile_reason_codes = {\n            "UNSUPPORTED_VALIDATION_ECOSYSTEM",\n            "AMBIGUOUS_VALIDATION_ECOSYSTEM",\n            "AMBIGUOUS_DOTNET_TARGET",\n            "PYTHON_FIXED_VALIDATION_UNAVAILABLE",\n            "NODE_FIXED_VALIDATION_UNAVAILABLE",\n            "EXECUTION_CONTRACT_DRIFT",\n            "EXECUTION_CONTRACT_UNAVAILABLE",\n            "EXECUTION_SNAPSHOT_UNAVAILABLE",\n            "INVALID_VALIDATION_PROFILE",\n            "INVALID_VALIDATION_TARGET",\n        }\n        if failure_kind == "VALIDATION_PROFILE_ERROR":\n            if reason_code not in profile_reason_codes:\n                raise ValueError("candidate admission diagnostics contain an invalid validation reason")\n            normalized_phase["reason_code"] = reason_code\n        elif reason_code is not None:\n            raise ValueError("candidate admission diagnostics contain an unexpected reason code")\n        for claim in (\n'''
          if old in text:
              text = text.replace(old, new, 1)
          if 'profile_reason_codes = {' not in text:
              raise SystemExit('diagnostic reason-code sanitizer missing')
          runtime.write_text(text, encoding='utf-8')
          PY

          cat > services/api/tests/test_execution_contract_diagnostics_v02331.py <<'PY'
          from parallax_api.code.agentic_runtime import _candidate_admission_failure_diagnostic
          from parallax_api.code.implementation_runtime import ImplementationRuntimeError, _bounded_implementation_failure_evidence
          from parallax_api.code.validation_toolchains import ValidationProfileError, ValidationProfileReason

          def test_execution_contract_diagnostic_is_closed_and_durable():
              diagnostic = _candidate_admission_failure_diagnostic(
                  "candidate-primary",
                  "EXECUTION_CONTRACT_VERIFICATION",
                  ValidationProfileError(ValidationProfileReason.EXECUTION_CONTRACT_DRIFT),
              )
              admitted = _bounded_implementation_failure_evidence({"candidate_admission_failure": diagnostic})
              assert admitted["candidate_admission_failure"]["failure_kind"] == "VALIDATION_PROFILE_ERROR"
              assert admitted["candidate_admission_failure"]["reason_code"] == "EXECUTION_CONTRACT_DRIFT"
              assert admitted["candidate_admission_failure"]["production_deployed"] is False

          def test_unknown_contract_reason_is_not_persisted():
              diagnostic = {
                  "candidate_id": "candidate-primary",
                  "phase": "EXECUTION_CONTRACT_VERIFICATION",
                  "failure_kind": "VALIDATION_PROFILE_ERROR",
                  "reason_code": "RAW_PROVIDER_DETAIL",
                  "candidate_is_canonical_lineage": False,
                  "accepts_source_lineage": False,
                  "source_lineage_accepted": False,
                  "engineering_run_transitioned": False,
                  "review_completed": False,
                  "production_deployed": False,
              }
              error = ImplementationRuntimeError("failure", diagnostic_evidence={"candidate_admission_failure": diagnostic})
              assert error.diagnostic_evidence is None
          PY
      - name: Focused validation
        run: |
          python -m compileall -q services/api/parallax_api services/api/scripts
          pytest -q \
            services/api/tests/test_execution_contract_v02331.py \
            services/api/tests/test_execution_contract_diagnostics_v02331.py \
            services/api/tests/test_static_web_validator_v02331.py \
            services/api/tests/test_validation_toolchains.py \
            services/api/tests/test_agentic_runtime_activation.py \
            services/api/tests/test_vercel_build_preflights.py
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.31.md
      - name: Full API regression
        run: pytest -q services/api/tests
      - name: Record architecture v3.42
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          if 'Version: 3.42' not in text:
              if text.count('Version: 3.41') != 1:
                  raise SystemExit('architecture version anchor drifted')
              text = text.replace('Version: 3.41', 'Version: 3.42', 1)
          if 'Architecture v3.42 binds one immutable server-owned execution contract' not in text:
              anchor = '## Version relationship\n\n'
              paragraph = ('Architecture v3.42 binds one immutable server-owned execution contract during protected PLAN to the exact accepted source lineage and work-specification identity, then requires IMPLEMENT to resolve and verify that closed-catalog contract before model generation or disposable candidate validation. Established Parallax Python and bounded root .NET source retain their governed profiles; marker-free greenfield lineage binds the narrow `static-web-v1` contract, whose validator is server-owned code transferred outside candidate source and uses only deterministic HTML/local-reference and JavaScript syntax checks under the released common execution snapshot. Candidate-authored marker files, package scripts, command text, network policy, snapshot identities and validator source cannot change that authority. Production publication is fail-closed on an immutable static-web fixture replay through the same `VercelCandidateValidationExecutor` and real disposable BUILD/TEST/VERIFY sandbox path. Execution-contract admission failures persist only a server-owned phase, failure kind and closed reason-code vocabulary; raw exception/provider/source material is rejected. Existing SafeImplementationEngine, source lineage, independent evaluation, Luna/Terra/Sol routing, deployment authority and human REVIEW boundaries remain unchanged. Architecture v3.41 remains the accepted-source profile-pinning foundation.\n\n')
              if text.count(anchor) != 1:
                  raise SystemExit('architecture relationship anchor drifted')
              text = text.replace(anchor, anchor + paragraph, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit validated release and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Validator'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add ARCHITECTURE.md services/api/parallax_api/code/agentic_runtime.py services/api/parallax_api/code/implementation_runtime.py services/api/tests/test_execution_contract_diagnostics_v02331.py
          git rm .github/workflows/tmp-p2331-complete.yml
          git commit -m 'P2-V0.23.31 — validate explicit execution contract release'
          git push origin HEAD:release/p2-v0.23.31
