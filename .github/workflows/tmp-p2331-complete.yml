name: P2-V0.23.31 Complete Implementation

on:
  push:
    branches:
      - release/p2-v0.23.31
    paths:
      - .github/workflows/tmp-p2331-complete.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/p2-v0.23.31
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Focused P2-V0.23.31 validation
        run: |
          python -m compileall -q services/api/parallax_api services/api/scripts
          pytest -q \
            services/api/tests/test_execution_contract_v02331.py \
            services/api/tests/test_static_web_validator_v02331.py \
            services/api/tests/test_validation_toolchains.py \
            services/api/tests/test_source_anchored_candidate_validation_profile_v02330.py \
            services/api/tests/test_execution_snapshot_profiles.py \
            services/api/tests/test_dependency_preparation.py \
            services/api/tests/test_candidate_dependency_preparation_failure.py \
            services/api/tests/test_agentic_runtime_activation.py \
            services/api/tests/test_failed_implement_plan_refresh.py
          python scripts/validate_spec.py --require-dspy specs/P2-V0.23.31.md
      - name: Full API regression
        run: pytest -q services/api/tests
      - name: Advance authoritative architecture to v3.42
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          if 'Version: 3.41' not in text:
              raise SystemExit('architecture version anchor drifted')
          text = text.replace('Version: 3.41', 'Version: 3.42', 1)
          anchor = '## Version relationship\n\n'
          paragraph = (
              'Architecture v3.42 binds one immutable server-owned execution contract during protected PLAN to the exact accepted source lineage and work-specification identity, then requires IMPLEMENT to resolve and verify that closed-catalog contract before model generation or disposable candidate validation. Established Parallax Python and bounded root .NET source retain their governed profiles; a marker-free greenfield lineage binds the narrow `static-web-v1` contract, whose validator is server-owned code transferred outside candidate source and uses only deterministic HTML/local-reference and JavaScript syntax checks under the released common execution snapshot. Candidate-authored marker files, package scripts, command text, network policy, snapshot identities and validator source cannot change that bound authority. Production publication is fail-closed on an immutable static-web fixture replay through the same `VercelCandidateValidationExecutor` and real disposable BUILD/TEST/VERIFY sandbox path before another signed-in Engineering Run retry is requested. The canary has no Project, Engineering Run, source-lineage, Git, delivery, lifecycle or REVIEW mutation authority. SafeImplementationEngine, bounded dependency preparation, deny-all validation networking, independent evaluation, canonical source lineage, Luna/Terra/Sol routing, hosted timeout/retry ceilings, deployment authority and the human REVIEW boundary are unchanged. Architecture v3.41 remains the accepted-source validation-profile pinning foundation.\n\n'
          )
          if anchor not in text:
              raise SystemExit('architecture relationship anchor drifted')
          text = text.replace(anchor, anchor + paragraph, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify release diff and commit
        shell: bash
        run: |
          grep -F 'Version: 3.42' ARCHITECTURE.md
          grep -F 'Architecture v3.42 binds one immutable server-owned execution contract' ARCHITECTURE.md
          git config user.name 'Parallax Release Validator'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add ARCHITECTURE.md
          git rm .github/workflows/tmp-p2331-complete.yml
          git commit -m 'P2-V0.23.31 — validate explicit execution contract release'
          git push origin HEAD:release/p2-v0.23.31
