name: WS568 Client Implementation

on:
  push:
    branches:
      - ws/568-review-rework
    paths:
      - .github/workflows/ws568-client-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/568-review-rework
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair final package test anchor and apply bounded client patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ws568_client_patch.py')
          text = path.read_text(encoding='utf-8')
          anchor = '\nreplace_once(\n    "apps/client/package.json",'
          if anchor not in text:
              raise SystemExit('package test anchor block was not found')
          prefix = text.rsplit(anchor, 1)[0]
          fixed = '''
replace_once(
    "apps/client/package.json",
    'node scripts/test-workflow-guidance.cjs"',
    'node scripts/test-workflow-guidance.cjs && node scripts/review-rework-contract.mjs"',
)
'''
          path.write_text(prefix + fixed, encoding='utf-8')
          PY
          python3 scripts/ws568_client_patch.py
      - name: Install client dependencies
        working-directory: apps/client
        run: npm install
      - name: Run client contract and state checks
        working-directory: apps/client
        run: npm run test:state
      - name: Typecheck
        working-directory: apps/client
        run: npm run typecheck
      - name: Export web build
        working-directory: apps/client
        run: npm run export:web
      - name: Commit validated client implementation and remove temporary harnesses
        run: |
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add apps/client
          git rm .github/workflows/ws568-client-implementation.yml scripts/ws568_client_patch.py
          git commit -m 'Expose P2-V0.23.41 review rework in client'
          git push origin HEAD:ws/568-review-rework
