name: Apply Wave 6 live source-context digest fix

on:
  push:
    branches:
      - hotfix/w6-live-source-context-digest

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/w6-live-source-context-digest
          fetch-depth: 0
      - name: Apply correction and regression
        run: |
          python .github/apply_w6_source_context_digest.py
          git diff --check
          git rm -f .github/workflows/apply-w6-live-source-context-digest.yml
          git rm -f .github/apply_w6_source_context_digest.py
          git add services/api/parallax_api/code/agentic_runtime_live.py services/api/tests/test_agentic_runtime_activation.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(w6): bind live agent task to source-context digest'
          git push origin HEAD:hotfix/w6-live-source-context-digest
