name: P2-V0.23.23 Focused Implementation

on:
  push:
    branches: [fix/p2323-bounded-validator-repair]
    paths:
      - '.github/workflows/p2323-implement.yml'

permissions:
  contents: write

concurrency:
  group: p2323-focused-implementation
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2323-bounded-validator-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'

      - name: Apply bounded validator repair patch
        run: python scripts/p2323_apply.py

      - name: Verify protected spec evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.23.md

      - name: Compile changed runtime
        run: python -m compileall -q services/api/parallax_api/code/agentic_candidate_recovery.py

      - name: Run focused candidate recovery regressions
        run: |
          pytest -q \
            services/api/tests/test_agentic_candidate_recovery.py \
            services/api/tests/test_candidate_repair_guidance_v0239.py \
            services/api/tests/test_agentic_runtime_activation.py

      - name: Confirm collision-sensitive file remains untouched
        run: |
          set -euo pipefail
          if git diff --name-only | grep -Fx 'services/api/parallax_api/code/implementation_runtime.py'; then
            echo 'implementation_runtime.py is owned by open PR #429 and must remain untouched' >&2
            exit 1
          fi

      - name: Record Architecture v3.34 after focused validation
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("ARCHITECTURE.md"); t=p.read_text(); assert "Version: 3.33" in t; marker="## Version relationship\n\n"; assert marker in t; paragraph="Architecture v3.34 adds one finite validator-repair opportunity after distinct admitted implementation agents are exhausted. Only a server-classified VALIDATION_EXHAUSTED result can authorize the repair, the selected identity is the most recent validator-rejected agent already admitted for the same work unit, and the budget is exactly one additional generation per work unit. The repair receives the existing static safe-patch guidance and then passes through the unchanged typed proposal schema, exact acceptance ownership, strict patch canonicalization and verification, disposable candidate validation, independent evaluation, canonical source writer, delivery authority, and human REVIEW ceiling. Provider-only failure cannot authorize this retry, a repair provider failure consumes the one repair budget, the 60-second hosted-model timeout and zero hidden transport retries remain unchanged, and no new model, provider, credential, queue, source authority, Git authority, deployment authority, lifecycle authority, or REVIEW-completion authority is added. Architecture v3.33 remains the request-bounded autonomous execution and typed hosted-generation foundation."; t=t.replace("Version: 3.33", "Version: 3.34", 1).replace(marker, marker+paragraph+"\n\n", 1); p.write_text(t)'

      - name: Final diff and temporary-tool cleanup
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/p2323-prepare.yml .github/workflows/p2323-implement.yml scripts/p2323_apply.py
          git diff --check
          test "$(git diff --name-only -- services/api/parallax_api/code/implementation_runtime.py)" = ""

      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name "Parallax Release Worker"
          git config user.email "parallax-release-worker@users.noreply.github.com"
          git add ARCHITECTURE.md services/api/parallax_api/code/agentic_candidate_recovery.py services/api/tests/test_agentic_candidate_recovery.py .github/workflows/p2323-prepare.yml .github/workflows/p2323-implement.yml scripts/p2323_apply.py
          git commit -m "P2-V0.23.23 — add bounded final validator repair"
          git push origin HEAD:fix/p2323-bounded-validator-repair
