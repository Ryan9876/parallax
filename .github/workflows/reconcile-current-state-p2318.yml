name: Reconcile P2-V0.23.18 Current State

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-current-state-p2318.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile authoritative current state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('CURRENT-STATE.md')
          text = path.read_text()

          old_status = "Status: **WAVES 1–8 DEPLOYMENT-VERIFIED / PYTHON AND .NET SOURCE-ONLY FULL EXPERIENCE PRODUCTION-ACCEPTED / P2-V0.23.10 LUNA-FIRST HOSTED SELECTION PRODUCTION-ACCEPTED / P2-V0.23.13 FAILED-IMPLEMENT HUMAN REPLAN PRODUCTION-ACCEPTED / P2-V0.23.14 RECOVERED-WORKER PLAN REBIND PRODUCTION-ACCEPTED / P2-V0.23.15 STRUCTURED-OUTPUT ROUTING CLASSIFICATION PRODUCTION-ACCEPTED / P2-V0.23.16 WEBGL PREFLIGHT REDUCED-GRAPHICS FALLBACK PRODUCTION-ACCEPTED / CURRENT-SOURCE OT TIME REPLAY PASSED TO REVIEW / RISK-TIERED CI/CD VALIDATION MAIN-VERIFIED**"
          new_status = "Status: **WAVES 1–8 DEPLOYMENT-VERIFIED / PYTHON AND .NET SOURCE-ONLY FULL EXPERIENCE PRODUCTION-ACCEPTED / P2-V0.23.10 LUNA-FIRST HOSTED SELECTION PRODUCTION-ACCEPTED / P2-V0.23.13 FAILED-IMPLEMENT HUMAN REPLAN PRODUCTION-ACCEPTED / P2-V0.23.14 RECOVERED-WORKER PLAN REBIND PRODUCTION-ACCEPTED / P2-V0.23.15 STRUCTURED-OUTPUT ROUTING CLASSIFICATION PRODUCTION-ACCEPTED / P2-V0.23.16 WEBGL PREFLIGHT REDUCED-GRAPHICS FALLBACK PRODUCTION-ACCEPTED / P2-V0.23.17 DEDICATED QA REPOSITORY PRODUCTION-PROVEN / P2-V0.23.18 EXACT MODEL PATCH CANONICALIZATION PRODUCTION-ACCEPTED / RISK-TIERED CI/CD VALIDATION MAIN-VERIFIED**"
          assert text.count(old_status) == 1
          text = text.replace(old_status, new_status, 1)

          anchor = "The observed PR fast-client job completed in about 68 seconds versus about 169 seconds for the prior client job that also installed Chromium and ran browser/Skia acceptance. The larger architectural benefit is that unrelated failures no longer force later independent gates to be discovered on separate reruns.\n\n## Current production truth"
          section = """The observed PR fast-client job completed in about 68 seconds versus about 169 seconds for the prior client job that also installed Chromium and ran browser/Skia acceptance. The larger architectural benefit is that unrelated failures no longer force later independent gates to be discovered on separate reruns.

## P2-V0.23.17 / P2-V0.23.18 — dedicated QA proof and exact model patch canonicalization — PRODUCTION-ACCEPTED

P2-V0.23.17 / Architecture v3.29 moved standing production-QA identity to the dedicated `Ryan9876/parallax-qa` repository and bound authorization to an exact signed `(repository, repository_id, workflow_ref)` tuple. The dedicated repository path is now behaviorally production-proven. Temporary legacy application-repository QA tuples remain admitted only until the planned contraction release removes them.

P2-V0.23.18 / Architecture v3.30 adds a server-owned exact patch-intent canonicalization boundary only for protected model-generated IMPLEMENT proposals. Mechanical unified-diff headers, counts, positions and an anchored stale model base digest may be recovered only when exact current protected source proves the edit intent. Ambiguous, fuzzy, semantic, unanchored stale-base, unsafe-target, secret-sensitive, size-limit and other protected failures remain fail-closed, and every recovered patch is re-parsed by the unchanged strict `TextPatchEngine` before candidate admission or mutation.

Release and production evidence:

- workstream: #501; release PR: #502;
- exact green PR head: `8fbcb6ff320289f0d13e9a56f10201768a32199c`;
- application merge / deployed API source: `8e9efa4afec667b644a6a94063a463d72d10cd58`;
- production deployment: `dpl_2zTNwf1m59cZmNRAWqWXdZ1pw9tw`, target production, state `READY`;
- canonical production alias: `parallax-api-tan.vercel.app`;
- post-merge Workstream Spec Validation `33348830525`: SUCCESS;
- post-merge Parallax P2 CI `33348830492`: SUCCESS, including full API regression, client checks, protected promotion evaluation and promotion-boundary DSPy validation;
- production `/health`: HTTP 200;
- production `/ready`: HTTP 200 with database/providers ready and one provider target;
- exact dedicated-repository acceptance workflow `Ryan9876/parallax-qa` run `33349444286`: SUCCESS;
- dedicated Python source-only job: SUCCESS;
- dedicated P2-V0.23.18 OT Time existing-file acceptance job `99359771040`: SUCCESS;
- OT Time Engineering Run `a3a6f6bc-b341-4cb4-98b8-dbc3219ed49b` advanced PLAN -> IMPLEMENT -> BUILD -> TEST -> VERIFY -> REVIEW, revision 6, with `last_failure_code=null`;
- IMPLEMENT passed using `safe-source-implementation-v1` against an existing `README.md` edit rather than the prior new-file smoke path;
- authenticated source-only ZIP handoff verified 31 entries / 74,567 bytes and contained the exact accepted README marker;
- source publication: false; application deployment by the generated workload: false.

This closes the P2-V0.23.18 workload-sensitive candidate-validation blocker without widening model count, retry ceilings, source-lineage authority, Git/deployment authority, or the human REVIEW boundary. The next security cleanup is the already-planned P2-V0.23.17 trust contraction: remove the two legacy application-repository QA identities and workflow files now that the dedicated repository path is production-proven.

## Current production truth"""
          assert text.count(anchor) == 1
          text = text.replace(anchor, section, 1)

          old_trust = "The production API trust surface now admits only the two continuing exact main-branch QA workflow identities: `.github/workflows/qa-production-replay.yml` and `.github/workflows/w8-s2-qa-replay.yml`. The temporary `.github/workflows/qa-p2313-production-retry.yml` workflow was deleted, its `P2313_QA_AUTOMATION_WORKFLOW_REF` allowlist entry was removed, and the former positive identity regression was replaced by a fail-closed test proving that retired workflow reference is rejected. Repository, `refs/heads/main`, GitHub-hosted runner, event-name and `parallax://qa-production` audience checks are unchanged."
          new_trust = "The earlier retry-specific QA workflow remains retired. P2-V0.23.17 subsequently admitted the exact dedicated `Ryan9876/parallax-qa` repository ID/workflow tuple and temporarily retained the two application-repository QA tuples for migration safety. The dedicated repository replay is now production-proven; removing those two legacy tuples and workflow files is the next bounded trust-contraction release. Repository-ID binding, `refs/heads/main`, GitHub-hosted runner, event-name and `parallax://qa-production` audience checks remain fail-closed."
          assert text.count(old_trust) == 1
          text = text.replace(old_trust, new_trust, 1)

          api_marker = "### API\n\nCurrent deployment-verified production API:\n\n"
          head, sep, tail = text.partition(api_marker)
          assert sep
          replacements = [
              ("- source: `51e1c95873a813464b45c6c4ce50b8c2f35e1111`;", "- source: `8e9efa4afec667b644a6a94063a463d72d10cd58`;"),
              ("- production deployment: `dpl_G2TFSXDgxZXyGKGZMfKH33F44s3H`;", "- production deployment: `dpl_2zTNwf1m59cZmNRAWqWXdZ1pw9tw`;"),
              ("- architecture: `ARCHITECTURE.md` v3.28.", "- architecture: `ARCHITECTURE.md` v3.30."),
          ]
          for old, new in replacements:
              assert tail.count(old) >= 1
              tail = tail.replace(old, new, 1)
          text = head + sep + tail

          open_old = "## Other open governed work\n\n- #442 — P2-V0.23.7 empty-greenfield authority is implementation- and deployment-verified; canonical Decision Ledger acceptance remains pending a fresh approved empty target because the prior disposable target was consumed by legacy QA fixture activity."
          open_new = "## Other open governed work\n\n- #499 — P2-V0.23.17 dedicated QA repository admission is production-proven; the planned follow-up trust contraction still must remove the two legacy `Ryan9876/parallax` QA identities and workflow files, leaving only the exact `Ryan9876/parallax-qa` standing identity.\n- #442 — P2-V0.23.7 empty-greenfield authority is implementation- and deployment-verified; canonical Decision Ledger acceptance remains pending a fresh approved empty target because the prior disposable target was consumed by legacy QA fixture activity."
          assert text.count(open_old) == 1
          text = text.replace(open_old, open_new, 1)

          append = """

Latest authoritative reconciliation: P2-V0.23.18 is production-accepted on exact API source `8e9efa4afec667b644a6a94063a463d72d10cd58` / deployment `dpl_2zTNwf1m59cZmNRAWqWXdZ1pw9tw`. Dedicated `parallax-qa` workflow run `33349444286` passed both routine jobs; the release-specific OT Time existing-file run `a3a6f6bc-b341-4cb4-98b8-dbc3219ed49b` reached REVIEW revision 6 with IMPLEMENT, BUILD, TEST and VERIFY passed and a verified source-only ZIP. `ARCHITECTURE.md` is authoritative at v3.30. `DESIGN-SYSTEM.md` and `PROJECT-CONSTITUTION.md` require no change because this release changes neither durable visual-system rules nor constitutional authority principles. Issue #501 is complete; #499 trust contraction and #442 canonical greenfield acceptance remain open.
"""
          assert "Latest authoritative reconciliation: P2-V0.23.18" not in text
          text = text.rstrip() + append
          path.write_text(text)
          PY

      - name: Commit authoritative state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "parallax-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT-STATE.md
          git diff --cached --check
          git commit -m "Record P2-V0.23.18 production acceptance"
          git push origin HEAD:main
