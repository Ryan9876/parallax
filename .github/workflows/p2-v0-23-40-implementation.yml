name: P2-V0.23.40 Bounded Implementation

on:
  push:
    branches: [ws/565-static-web-acceptance-evidence]
    paths:
      - scripts/tmp_v02340_patch_*.py
      - .github/workflows/p2-v0-23-40-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'
      - name: Require exact DSPy-authorized plan
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.40.md
      - name: Apply bounded semantic patch
        run: |
          python scripts/tmp_v02340_patch_protected.py
          python scripts/tmp_v02340_patch_service.py
          python scripts/tmp_v02340_patch_runtime.py
          python scripts/tmp_v02340_patch_tests.py
      - name: Compile API
        run: python -m compileall -q services/api/parallax_api services/api/tests
      - name: Run focused P2-V0.23.40 regressions
        run: pytest -q services/api/tests/test_code_protected_boundaries.py services/api/tests/test_code_autonomy.py services/api/tests/test_runtime_composition.py
      - name: Run full API regression suite
        run: pytest -q services/api/tests
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit only validated durable changes
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git rm .github/workflows/p2-v0-23-40-spec-gate.yml .github/workflows/p2-v0-23-40-implementation.yml scripts/tmp_v02340_patch_protected.py scripts/tmp_v02340_patch_service.py scripts/tmp_v02340_patch_runtime.py scripts/tmp_v02340_patch_tests.py
          git add services/api/parallax_api/code/protected.py services/api/parallax_api/code/service.py services/api/parallax_api/code/autonomy.py services/api/parallax_api/code/live_observability.py services/api/tests/test_code_protected_boundaries.py services/api/tests/test_code_autonomy.py services/api/tests/test_runtime_composition.py specs/P2-V0.23.40.md specs/compiled/P2-V0.23.40.plan.json
          git diff --cached --check
          git commit -m 'Implement P2-V0.23.40 honest static-web acceptance evidence'
          git push
