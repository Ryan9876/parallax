name: P2-V0.23.30 Repair Focused Workflow

on:
  push:
    branches:
      - fix/p2330-source-anchored-validation-profile
    paths:
      - .github/workflows/tmp-p2330-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2330-source-anchored-validation-profile
      - name: Preserve existing test setup while rewriting direct validator calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/tmp-p2330-implement.yml')
          text = path.read_text()
          old = "lines[index - 1:index + 1] = ["
          new = "lines[index:index + 1] = ["
          if text.count(old) != 1:
              raise SystemExit(f'expected one faulty slice, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair and remove temporary repair workflow
        shell: bash
        run: |
          git config user.name 'Parallax Runtime Implementer'
          git config user.email 'parallax-runtime@users.noreply.github.com'
          git add .github/workflows/tmp-p2330-implement.yml
          git rm .github/workflows/tmp-p2330-repair.yml
          git commit -m 'P2-V0.23.30 — preserve validator test setup'
          git push origin HEAD:fix/p2330-source-anchored-validation-profile
