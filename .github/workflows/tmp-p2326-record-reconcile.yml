name: Temporary P2-V0.23.26 record reconciliation

on:
  push:
    branches:
      - record/p2326-deployment-verification

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record/p2326-deployment-verification
          fetch-depth: 0
      - name: Reconcile authoritative current state
        env:
          RECORD_SCRIPT_B64: 
        run: |
          python -c 'import os,base64; exec(base64.b64decode(os.environ["RECORD_SCRIPT_B64"]))'
          rm .github/workflows/tmp-p2326-record-reconcile.yml
          git config user.name "Parallax Record Reconciler"
          git config user.email "parallax-records@users.noreply.github.com"
          git add CURRENT-STATE.md .github/workflows/tmp-p2326-record-reconcile.yml
          git diff --cached --check
          git commit -m "P2-V0.23.26 — record deployment-verified current state"
          git push origin HEAD:record/p2326-deployment-verification