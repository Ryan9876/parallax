name: WS149 Finalize Authoritative Record Preservation

on:
  push:
    branches: [integration/wave4-live-development]
    paths: ['.github/workflows/ws149-restore-records.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/wave4-live-development
      - name: Remove duplicate architecture node and verify preserved detail
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          duplicate = '  ├─ protected evaluation + observable execution/provider evidence\n  ├─ protected evaluation + observable execution/provider evidence\n'
          if duplicate in text:
              text = text.replace(duplicate, '  ├─ protected evaluation + observable execution/provider evidence\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          test $(wc -l < ARCHITECTURE.md) -ge 360
          test $(wc -l < DESIGN-SYSTEM.md) -ge 300
          test $(grep -c 'protected evaluation + observable execution/provider evidence' ARCHITECTURE.md) -eq 1
          grep -q '### Protected observation read plane and Live Build' ARCHITECTURE.md
      - name: Commit finalized records
        run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ARCHITECTURE.md
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize preserved Wave 4 architecture record'
          git push origin HEAD:integration/wave4-live-development
