name: Temporary P2-V0.23.27 convergence validation

on:
  push:
    branches:
      - fix/p2327-incremental-implement-convergence

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2327-incremental-implement-convergence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Compile protected runtime
        run: python -m compileall -q services/api/parallax_api
      - name: Prove P2-V0.23.27 convergence behavior
        run: |
          python -m pytest \
            services/api/tests/test_incremental_implement_convergence_v02327.py \
            services/api/tests/test_agentic_candidate_recovery.py \
            services/api/tests/test_candidate_repair_guidance_v0239.py \
            services/api/tests/test_implementation_proposal_preflight.py \
            services/api/tests/test_agentic_runtime_activation.py -q
      - name: Verify governed specification evidence
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.27.md
      - name: Advance durable architecture after focused validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          if 'Version: 3.37' not in text:
              raise SystemExit('expected Architecture v3.37 baseline')
          text = text.replace('Version: 3.37', 'Version: 3.38', 1)
          marker = '## Version relationship\n\n'
          paragraph = (
              'Architecture v3.38 changes the resilient live IMPLEMENT admission boundary from whole-proposal regeneration to bounded incremental convergence without widening model or mutation authority. '
              'The protected implementation runtime now exposes a callable safe-preflight gate whose read-only reason seam maps only server-owned exception classes to a fixed sanitized reason-code vocabulary. '
              'Within one existing finite work-unit candidate loop, canonical patches that independently pass the unchanged SafeImplementationEngine may be retained as non-authoritative intent while rejected patches are isolated; subsequent admitted generations receive only bounded retained target names and sanitized rejection codes, never retained or rejected content, raw model output, exception text, source digests, filesystem roots or provider payloads. '
              'A retained target cannot be overwritten, ancestor/descendant conflicts fail before retention, and current-generation additions are discarded if the combined retained proposal fails the unchanged whole-proposal safe preflight. '
              'Work-unit completion still requires a combined safe proposal, disposable BUILD/TEST/VERIFY, independent evaluation, final commit-time SafeImplementationEngine revalidation, source-lineage acceptance and the existing human REVIEW ceiling. '
              'Luna/Terra/Sol routing, the 60-second hosted timeout, distinct-agent recovery ceiling, single final validator repair, request autonomy budget, zero hidden provider retries, Git/deployment authority and lifecycle authority are unchanged. '
              'Architecture v3.37 remains the server-canonicalized semantic file-content generation foundation.\n\n'
          )
          if paragraph not in text:
              if marker not in text:
                  raise SystemExit('architecture version relationship marker missing')
              text = text.replace(marker, marker + paragraph, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/tmp-p2327-focused-validation.yml
          git config user.name "Parallax Architecture Validator"
          git config user.email "parallax-architecture@users.noreply.github.com"
          git add ARCHITECTURE.md .github/workflows/tmp-p2327-focused-validation.yml
          git diff --cached --check
          git commit -m "P2-V0.23.27 — record incremental convergence architecture"
          git push origin HEAD:fix/p2327-incremental-implement-convergence