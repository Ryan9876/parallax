name: Reconcile P2-V0.23.39 Production Record

on:
  push:
    branches:
      - 'records/p2-v0-23-39-production-acceptance'
    paths:
      - '.github/workflows/reconcile-p2-v0-23-39-production.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: records/p2-v0-23-39-production-acceptance
          fetch-depth: 0

      - name: Apply production acceptance record
        run: python scripts/reconcile_p2_v0_23_39_production.py

      - name: Validate authoritative-record diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = "CURRENT-STATE.md"
          grep -F 'P2-V0.23.39 CANONICAL EMPTY-TREE REPLAY COMPATIBILITY PRODUCTION-ACCEPTED / W9-S1 SOURCE DELIVERY SUCCEEDED / HUMAN REVIEW REQUIRED' CURRENT-STATE.md
          grep -F 'dpl_7osi75NqdV4PSUnkzQGtdGtBwGwd' CURRENT-STATE.md
          grep -F '33642165365' CURRENT-STATE.md
          grep -F 'stop_reason=REVIEW_REQUIRED' CURRENT-STATE.md

      - name: Commit record and remove temporary reconciliation machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add CURRENT-STATE.md
          git rm .github/workflows/reconcile-p2-v0-23-39-production.yml scripts/reconcile_p2_v0_23_39_production.py
          git diff --cached --check
          git commit -m 'Record P2-V0.23.39 production acceptance'
          git push origin HEAD:records/p2-v0-23-39-production-acceptance
