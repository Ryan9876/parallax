name: P2-V0.23.22 Focused Implementation

on:
  push:
    branches:
      - ws/p2322-request-bounded-autonomy
    paths:
      - scripts/p2322_apply.py
      - .github/workflows/p2322-implementation.yml
  workflow_dispatch:

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/p2322-request-bounded-autonomy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Apply governed implementation patch
        run: python scripts/p2322_apply.py
      - name: Validate compiled governing specification
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.22.md
      - name: Compile Python sources
        run: python -m compileall -q services/api/parallax_api services/api/tests
      - name: Run focused API regressions
        run: |
          python -m pytest \
            services/api/tests/test_request_bounded_autonomy_v02322.py \
            services/api/tests/test_structured_output_classification_v02315.py \
            services/api/tests/test_dspy_gateway_routing.py \
            services/api/tests/test_agentic_runtime_activation.py \
            services/api/tests/test_candidate_repair_guidance_v0239.py \
            -q
      - name: Install client dependencies
        working-directory: apps/client
        run: npm install --no-audit --no-fund
      - name: Run client typecheck and continuation policy
        working-directory: apps/client
        run: |
          npm run typecheck
          npm run test:state
      - name: Remove temporary implementation tooling
        run: rm scripts/p2322_apply.py .github/workflows/p2322-implementation.yml
      - name: Verify durable diff has no temporary tooling
        run: |
          set -euo pipefail
          test ! -e scripts/p2322_apply.py
          test ! -e .github/workflows/p2322-implementation.yml
          git status --short
      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Worker'
          git config user.email 'parallax-release-worker@users.noreply.github.com'
          git add -A
          git commit -m 'P2-V0.23.22 — bound autonomous build requests'
          git push origin HEAD:ws/p2322-request-bounded-autonomy
