name: P2-V0.23.6 Focused Regression

on:
  push:
    branches:
      - work/w8-s2-profile-snapshots
    paths:
      - services/api/parallax_api/execution_environment.py
      - services/api/parallax_api/code/agentic_runtime.py
      - services/api/parallax_api/code/lineage_sandbox_execution.py
      - services/api/scripts/production_execution_snapshot_preflight.py
      - services/api/tests/test_execution_snapshot_profiles.py
      - services/api/tests/test_candidate_dependency_preparation_failure.py
      - .github/workflows/p2-v0-23-6-focused.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Compile changed runtime
        run: |
          python -m py_compile \
            services/api/parallax_api/execution_environment.py \
            services/api/parallax_api/code/agentic_runtime.py \
            services/api/parallax_api/code/lineage_sandbox_execution.py \
            services/api/scripts/production_execution_snapshot_preflight.py
      - name: Run focused snapshot and dependency tests
        run: |
          pytest -q \
            services/api/tests/test_execution_snapshot_profiles.py \
            services/api/tests/test_candidate_dependency_preparation_failure.py \
            services/api/tests/test_lineage_sandbox_execution.py \
            services/api/tests/test_validation_toolchains.py \
            services/api/tests/test_dependency_preparation.py
