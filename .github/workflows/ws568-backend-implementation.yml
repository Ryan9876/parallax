name: WS568 Backend Implementation

on:
  push:
    branches:
      - ws/568-review-rework
    paths:
      - .github/workflows/ws568-backend-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/568-review-rework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded REVIEW-rework backend implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Request contract.
          replace_once(
              'services/api/parallax_api/schemas.py',
              '''class EngineeringOperation(BaseModel):\n    operation_key: str = Field(min_length=1, max_length=160)\n    expected_revision: int = Field(ge=0)\n\n\nclass EngineeringAdvance(EngineeringOperation):\n''',
              '''class EngineeringOperation(BaseModel):\n    operation_key: str = Field(min_length=1, max_length=160)\n    expected_revision: int = Field(ge=0)\n\n\nclass EngineeringReviewRework(EngineeringOperation):\n    model_config = ConfigDict(extra="forbid")\n    acceptance_ids: list[str] = Field(min_length=1, max_length=32)\n    finding: str = Field(min_length=1, max_length=1200)\n\n\nclass EngineeringAdvance(EngineeringOperation):\n'''
          )

