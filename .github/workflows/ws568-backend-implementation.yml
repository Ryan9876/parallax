name: WS568 Backend Implementation

on:
  push:
    branches:
      - ws/568-review-rework
    paths:
      - .github/workflows/ws568-backend-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/568-review-rework
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded backend patch
        run: python scripts/ws568_backend_patch.py
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Compile backend sources
        run: python -m compileall -q services/api/parallax_api services/api/tests/test_review_rework_v02341.py
      - name: Run focused REVIEW-rework regressions
        run: pytest -q services/api/tests/test_review_rework_v02341.py services/api/tests/test_worker_recovery.py services/api/tests/test_resume_route_snapshot.py
      - name: Commit validated backend implementation and remove temporary harnesses
        run: |
          git config user.name 'Parallax Release Automation'
          git config user.email 'parallax-release@users.noreply.github.com'
          git add services/api/parallax_api services/api/tests/test_review_rework_v02341.py
          git rm .github/workflows/ws568-backend-implementation.yml scripts/ws568_backend_patch.py
          git commit -m 'Implement P2-V0.23.41 review rework backend'
          git push origin HEAD:ws/568-review-rework
