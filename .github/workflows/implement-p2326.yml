name: P2-V0.23.26 Focused Implementation

on:
  push:
    branches:
      - fix/p2326-server-canonicalized-content
    paths:
      - .github/workflows/implement-p2326.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2326-server-canonicalized-content
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Apply bounded implementation transform
        run: python scripts/_p2326_apply.py
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Compile changed Python sources
        run: |
          python -m compileall -q services/api/parallax_api/intelligence/implementation_generation.py
          python -m compileall -q services/api/parallax_api/code/agentic_candidate_recovery.py
          python -m compileall -q services/api/tests/test_server_canonicalized_content_generation_v02326.py
      - name: Run focused P2-V0.23.26 regressions
        run: |
          pytest -q services/api/tests/test_server_canonicalized_content_generation_v02326.py
          pytest -q services/api/tests/test_structured_output_classification_v02315.py
          pytest -q services/api/tests/test_agentic_candidate_recovery.py
      - name: Verify protected spec evidence remains current
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.23.26.md
      - name: Audit bounded release diff
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          python - <<'PY'
          from pathlib import Path
          import subprocess
          allowed = {
              'ARCHITECTURE.md',
              'services/api/parallax_api/code/agentic_candidate_recovery.py',
              'services/api/parallax_api/intelligence/implementation_generation.py',
              'services/api/tests/test_server_canonicalized_content_generation_v02326.py',
              'services/api/tests/test_structured_output_classification_v02315.py',
              'specs/P2-V0.23.26.md',
              'specs/compiled/P2-V0.23.26.plan.json',
              'scripts/_p2326_apply.py',
              '.github/workflows/implement-p2326.yml',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '441160bd09e7b9560c4765b4b9d19ab152efea47...HEAD']).decode().splitlines())
          changed.update(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected release paths: {unexpected}')
          PY
      - name: Commit validated implementation and remove temporary tooling
        run: |
          set -euo pipefail
          rm -f scripts/_p2326_apply.py .github/workflows/implement-p2326.yml
          git config user.name "Parallax Release Worker"
          git config user.email "parallax-release-worker@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "P2-V0.23.26 — server-canonicalize implementation content edits"
          git push origin HEAD:fix/p2326-server-canonicalized-content
