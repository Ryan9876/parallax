name: Record W4 mobile observability scroll hotfix

on:
  push:
    branches:
      - record/w4-mobile-observability-scroll-state
    paths:
      - .github/workflows/w4-mobile-observability-state-record.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record/w4-mobile-observability-scroll-state
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile current state
        run: python .github/scripts/record_mobile_observability_state.py
      - name: Remove temporary record helpers
        run: |
          rm .github/workflows/w4-mobile-observability-state-record.yml
          rm .github/scripts/record_mobile_observability_state.py
      - name: Commit authoritative state record
        run: |
          git config user.name 'parallax-state[bot]'
          git config user.email 'parallax-state@users.noreply.github.com'
          git add CURRENT-STATE.md .github/workflows/w4-mobile-observability-state-record.yml .github/scripts/record_mobile_observability_state.py
          git commit -m 'docs(state): record mobile observability scroll hotfix deployment'
          git push origin HEAD:record/w4-mobile-observability-scroll-state
