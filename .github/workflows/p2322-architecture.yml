name: P2-V0.23.22 Architecture Reconciliation

on:
  push:
    branches:
      - ws/p2322-request-bounded-autonomy
    paths:
      - .github/workflows/p2322-architecture.yml
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/p2322-request-bounded-autonomy
          fetch-depth: 0
      - name: Update authoritative architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          version = 'Version: 3.32\n'
          if text.count(version) != 1:
              raise SystemExit('Expected exact Architecture v3.32 header')
          text = text.replace(version, 'Version: 3.33\n', 1)
          marker = '## Version relationship\n\n'
          if text.count(marker) != 1:
              raise SystemExit('Expected exact Version relationship marker')
          paragraph = (
              'Architecture v3.33 makes ordinary production autonomous engineering request-bounded without changing canonical lifecycle authority. Each `/autonomous` HTTP invocation may execute at most one protected PLAN, IMPLEMENT, BUILD, TEST, or VERIFY transition; the client may request the next transition only from the newly returned canonical Engineering Run revision and is itself bounded to eight consecutive continuations. After a request consumes its step budget, the server reclassifies the resulting authoritative state before returning, so a VERIFY transition that reaches REVIEW still returns the existing `REVIEW_REQUIRED` boundary and preserves verified source-delivery behavior. Revision checks, idempotent operation keys, durable worker checkpoints, accepted source lineage, protected BUILD/TEST/VERIFY, delivery authority, and the human REVIEW ceiling remain server-owned.\n\n'
              'Architecture v3.33 also strengthens hosted implementation generation at the existing non-authoritative model boundary. The DSPy implementation signature uses typed acceptance-ID and patch fields under the JSON structured adapter instead of JSON encoded inside a free string. The same closed `ImplementationProposal` schema, exact ordered acceptance ownership, strict patch canonicalization/verifier, disposable candidate validation, independent evaluation, and single canonical source writer remain authoritative after decoding. Production OpenAI models routed through Vercel AI Gateway receive a fixed 60-second call timeout and zero hidden transport retries; explicit bounded candidate recovery across admitted model identities remains the governed retry mechanism. Provider/transport failure is not converted to validation success, rejected raw model output is not persisted, and no queue, provider capability, credential, Git authority, deployment authority, or REVIEW-completion authority is added. Architecture v3.32 remains the exact GitHub empty-repository ref compatibility boundary.\n\n'
          )
          text = text.replace(marker, marker + paragraph, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/p2322-architecture.yml
      - name: Verify architecture identity and clean temporary workflow
        run: |
          set -euo pipefail
          grep -q '^Version: 3.33$' ARCHITECTURE.md
          grep -q 'Architecture v3.33 makes ordinary production autonomous engineering request-bounded' ARCHITECTURE.md
          test ! -e .github/workflows/p2322-architecture.yml
          git diff --check
      - name: Commit architecture record
        run: |
          set -euo pipefail
          git config user.name 'Parallax Release Worker'
          git config user.email 'parallax-release-worker@users.noreply.github.com'
          git add -A
          git commit -m 'P2-V0.23.22 — record Architecture v3.33'
          git push origin HEAD:ws/p2322-request-bounded-autonomy
