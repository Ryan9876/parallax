name: Temporary Component Health Record Reconciliation

on:
  push:
    branches:
      - docs/component-health-client-release
    paths:
      - .github/workflows/tmp-component-health-records.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/component-health-client-release
      - name: Reconcile deployed client state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CURRENT-STATE.md')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          old_status = 'Status: **WAVES 1–8 DEPLOYMENT-VERIFIED / PYTHON AND .NET SOURCE-ONLY FULL EXPERIENCE ACCEPTED / P2-V0.23.9 VALIDATOR-GUIDED CANDIDATE REPAIR DEPLOYMENT-VERIFIED + NORMAL-PATH PRODUCTION-ACCEPTED / P2-V0.23.8 BOUNDED CANDIDATE RECOVERY DEPLOYMENT-VERIFIED / W9-S1 P2-V0.23.7 GREENFIELD AUTHORITY IMPLEMENTED + API DEPLOYMENT-VERIFIED / CANONICAL GREENFIELD ACCEPTANCE PENDING FRESH APPROVED EMPTY TARGET / W9-S2 API PRODUCTION-DEPLOYMENT-VERIFIED / SAFE-DELETION DEPLOYMENT-VERIFIED + PRODUCTION-ACCEPTED**'
          new_status = 'Status: **WAVES 1–8 DEPLOYMENT-VERIFIED / PYTHON AND .NET SOURCE-ONLY FULL EXPERIENCE ACCEPTED / P2-V0.23.9 VALIDATOR-GUIDED CANDIDATE REPAIR DEPLOYMENT-VERIFIED + NORMAL-PATH PRODUCTION-ACCEPTED / P2-V0.23.8 BOUNDED CANDIDATE RECOVERY DEPLOYMENT-VERIFIED / W9-S1 P2-V0.23.7 GREENFIELD AUTHORITY IMPLEMENTED + API DEPLOYMENT-VERIFIED / CANONICAL GREENFIELD ACCEPTANCE PENDING FRESH APPROVED EMPTY TARGET / W9-S2 API PRODUCTION-DEPLOYMENT-VERIFIED / SAFE-DELETION DEPLOYMENT-VERIFIED + PRODUCTION-ACCEPTED / RESUMED COMPONENT HEALTH CLIENT CORRECTION DEPLOYMENT-VERIFIED**'
          replace_once(old_status, new_status, 'status')

          truth_anchor = 'P2-V0.23.9 / Architecture v3.23 is now production-deployment-verified and has a successful authenticated normal-path production replay. The production incident showed that all already-admitted alternates could independently return provider-successful proposals that the protected safe-patch validator rejected; later admitted candidates now receive only fixed server-owned validator-repair guidance after a bounded `VALIDATION_EXHAUSTED` classification. Provider/rate-limit failures remain separate, retry bounds are unchanged, and no mutation authority is added. The corrected post-deploy OT Time replay reached REVIEW at revision 6 with no failure and verified the authenticated source-only ZIP handoff. The replay did not artificially induce candidate rejection; branch-specific validator-guided recovery is established by deterministic protected tests.\n'
          truth_addition = truth_anchor + '\nThe production client now projects resumed component health against the latest persisted control boundary rather than treating an older worker failure as current health forever. Historical failure events remain visible and unchanged. After a later persisted `RUN_CONTROL / RESUMED` event, an older dedicated worker failure is presented as `Awaiting evidence` until fresh worker evidence arrives. Worker IDs and source-lineage references on unrelated failed events are observation references only; they no longer cause Worker runtime or Source lineage to inherit that event failure. Dedicated lineage acceptance evidence remains authoritative for lineage health.\n'
          replace_once(truth_anchor, truth_addition, 'production truth')

          replace_once(
              '- application source: `4f812bd2cd6a5939c3d39ede457c091bac7b6e0f`;\n- production deployment: `dpl_CbuQzRDz3iJgF8rnqEpivmfmpQaM`;',
              '- application source: `77cf04086211e260c39733aba6b95dd1f2cc5c19`;\n- production deployment: `dpl_7rLxgFh9CH3aY9sdoSCTnD1xHDV3`;',
              'client deployment',
          )

          section_anchor = '## P2-V0.23.9 — Validator-guided alternate-candidate repair — DEPLOYMENT-VERIFIED / NORMAL-PATH PRODUCTION-ACCEPTED\n'
          if text.count(section_anchor) != 1:
              raise SystemExit(f'section anchor count={text.count(section_anchor)}')
          section = '''## Client resumed-component health projection — DEPLOYMENT-VERIFIED

Production observation showed a truthful event history but a stale current-health projection: persisted event #11 recorded a failed Worker state (`AGENTIC_CANDIDATE_EXHAUSTED`), event #12 recorded failed IMPLEMENT (`AUTONOMOUS_IMPLEMENT_FAILED`), and later event #13 recorded `RUN_CONTROL / RESUMED`, while the authoritative Engineering Run was active in IMPLEMENT. The Component Health card nevertheless continued to show Worker runtime and Source lineage as current `Attention` from #11.

The defect was client-only. `componentHealth()` treated any event carrying `worker_execution_id` or `source_lineage_ref` as direct health evidence for those components and had no resume supersession rule. That allowed an unrelated failure to contaminate component health and allowed a historical worker failure to remain current after a persisted resume.

Correction and release evidence:

- release PR: #461;
- merged/deployed client source: `77cf04086211e260c39733aba6b95dd1f2cc5c19`;
- production client deployment: `dpl_7rLxgFh9CH3aY9sdoSCTnD1xHDV3`;
- deployment state: `READY`;
- production alias observed by the user: `parallax-ashy-one-20.vercel.app`;
- Bounded Autonomy workflow `33291202942`: SUCCESS;
- Parallax P2 CI workflow `33291202984`: SUCCESS;
- Fast API/contracts, Fast client/typecheck/state/export/browser/Skia, protected promotion and DSPy release compilation: PASS.

Current-health projection now separates dedicated component evidence from reference-only evidence. A newer persisted resume boundary supersedes an older dedicated worker failure for current-health presentation, yielding `Awaiting evidence` until fresh component evidence exists; it does not erase or rewrite the historical failure event. Source lineage uses dedicated lineage/acceptance evidence when available, while a lineage reference on another subsystem's failed event is observation-only. Worker execution references receive the same observation-only treatment. GitHub and Vercel remain `Unavailable` until their own persisted evidence exists.

This release changes no API, persisted event, Engineering Run state-machine, source-lineage authority, provider authority, deployment ceiling or REVIEW boundary.

'''
          text = text.replace(section_anchor, section + section_anchor, 1)

          auth_anchor = '## Authoritative-record update\n\n'
          auth_addition = auth_anchor + '`CURRENT-STATE.md` was updated again after deployment verification of the resumed-component-health client correction. It records the production symptom, client-only projection root cause, exact merged source and READY deployment, successful release gates, and the rule that historical failures remain intact while current health follows later persisted resume/component evidence.\n\n`ARCHITECTURE.md` remains authoritative at v3.23 because this correction changes no durable lifecycle, authority, persistence, recovery or provider contract; it fixes only how existing persisted evidence is projected in the client.\n\n`DESIGN-SYSTEM.md` was not changed because no durable visual token, component pattern or interaction rule changed.\n\n`PROJECT-CONSTITUTION.md` was not changed because no constitutional product or authority principle changed.\n\n'
          replace_once(auth_anchor, auth_addition, 'authoritative record heading')

          path.write_text(text)
          PY
      - name: Validate and commit authoritative record
        shell: bash
        run: |
          set -euo pipefail
          grep -q '77cf04086211e260c39733aba6b95dd1f2cc5c19' CURRENT-STATE.md
          grep -q 'dpl_7rLxgFh9CH3aY9sdoSCTnD1xHDV3' CURRENT-STATE.md
          grep -q '## Client resumed-component health projection — DEPLOYMENT-VERIFIED' CURRENT-STATE.md
          git diff --check
          git config user.name parallax-record-reconciler
          git config user.email actions@users.noreply.github.com
          git add CURRENT-STATE.md
          git commit -m 'Record resumed component health client deployment'
          git push origin HEAD:docs/component-health-client-release
