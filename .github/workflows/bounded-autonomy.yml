name: Bounded Autonomy Pilot

on:
  pull_request:
    branches: [main]
  push:
    branches: [p2/v0.13.0-bounded-autonomy]

permissions:
  contents: read

jobs:
  spec-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Validate approved v0.13 specification
        run: python scripts/validate_spec.py specs/P2-V0.13.0.md --spec-only
      - name: Install API and test dependencies
        working-directory: services/api
        run: python -m pip install -e '.[dev]'
      - name: Compile API
        run: python -m compileall -q services/api/parallax_api scripts
      - name: Run protected execution and autonomy tests
        working-directory: services/api
        run: python -m pytest -q tests/test_code_execution_kernel.py tests/test_code_autonomy.py
      - name: Run full API regression suite
        working-directory: services/api
        run: python -m pytest -q

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Install client dependencies
        working-directory: apps/client
        run: npm ci
      - name: Typecheck client
        working-directory: apps/client
        run: npm run typecheck
      - name: Run client state tests
        working-directory: apps/client
        run: npm test -- --runInBand
      - name: Export web client
        working-directory: apps/client
        run: npm run export:web
