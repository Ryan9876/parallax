name: Bounded Autonomy Pilot

on:
  pull_request:
    branches: [main, integration/wave7-productization]
  push:
    branches: [p2/v0.13.0-bounded-autonomy]

concurrency:
  group: bounded-autonomy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spec-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Validate approved v0.13 autonomy contract
        run: python scripts/validate_spec.py specs/P2-V0.13.0.md --spec-only
      - name: Install API and test dependencies
        run: python -m pip install -e 'services/api[dev]'
      - name: Compile API
        run: python -m compileall -q services/api/parallax_api scripts
      - name: Run protected execution and autonomy tests
        working-directory: services/api
        run: python -m pytest -q tests/test_code_execution_kernel.py tests/test_code_autonomy.py

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delegate duplicate client validation
        run: echo 'Client validation is provided by Parallax P2 CI / Fast client checks; this compatibility check preserves the existing status context without rerunning the suite.'
