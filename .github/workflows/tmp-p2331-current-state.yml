name: P2-V0.23.31 Current State Reconciliation

on:
  push:
    branches:
      - record/p2331-deployment-verification
    paths:
      - .github/workflows/tmp-p2331-current-state.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: record/p2331-deployment-verification
          fetch-depth: 0
      - name: Reconcile CURRENT-STATE
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path('CURRENT-STATE.md')
          text = path.read_text(encoding='utf-8')
          old_status = 'P2-V0.23.31 EXPLICIT EXECUTION CONTRACT + END-TO-END ACCEPTANCE REPLAY ACTIVE**'
          new_status = 'P2-V0.23.31 EXPLICIT EXECUTION CONTRACT + END-TO-END ACCEPTANCE REPLAY PRODUCTION-DEPLOYMENT-VERIFIED / PRE-USER CANDIDATE CANARY VERIFIED / AUTHENTICATED REAL-PATH ACCEPTANCE PENDING**'
          if old_status not in text:
              raise SystemExit('P2-V0.23.31 status anchor drifted')
          text = text.replace(old_status, new_status, 1)
          anchor = '## P2-V0.23.30 — source-anchored candidate validation profile — PRODUCTION-BEHAVIOR-ACCEPTED / LATER BOUNDED BLOCKER EXPOSED\n'
          if text.count(anchor) != 1:
              raise SystemExit('P2-V0.23.30 section anchor drifted')
          section_b64 = ''
          section = base64.b64decode(section_b64).decode('utf-8')
          path.write_text(text.replace(anchor, section + anchor, 1), encoding='utf-8')
          PY
      - name: Verify authoritative record delta
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'P2-V0.23.31 — explicit execution contract and end-to-end acceptance replay' CURRENT-STATE.md
          grep -q 'dpl_FDuJ3JKRHnvHf14mzJX59cVGasAY' CURRENT-STATE.md
          grep -q 'f2e8320d210228539bd8c44a9a2d62dccea66d4e7d29f81389b71ba148a483a4' CURRENT-STATE.md
          test "$(git diff --name-only | sort)" = 'CURRENT-STATE.md'
      - name: Commit record and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Parallax State Reconciler'
          git config user.email 'parallax-state@users.noreply.github.com'
          git add CURRENT-STATE.md
          git rm .github/workflows/tmp-p2331-current-state.yml
          git commit -m 'P2-V0.23.31 — record deployment and candidate-canary verification'
          git push origin HEAD:record/p2331-deployment-verification
