name: QA Production Replay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qa-production-replay.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-production-replay
  cancel-in-progress: false

jobs:
  replay-w8-s2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Request GitHub Actions OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=parallax%3A%2F%2Fqa-production"
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${request_url}" | jq -r '.value')"
          test -n "${token}"
          test "${token}" != "null"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Establish bounded Parallax QA session
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          API_BASE: https://parallax-api-tan.vercel.app
        run: |
          set -euo pipefail
          authenticated=0
          for attempt in $(seq 1 36); do
            status="$(curl --silent --show-error \
              --output /tmp/session.json \
              --write-out '%{http_code}' \
              --cookie-jar /tmp/parallax.cookies \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -X POST "${API_BASE}/v1/session/qa-automation" || true)"
            if [ "${status}" = "200" ] && jq -e '.authenticated == true' /tmp/session.json >/dev/null 2>&1; then
              authenticated=1
              break
            fi
            sleep 10
          done
          if [ "${authenticated}" != "1" ]; then
            echo "QA automation endpoint did not become ready" >&2
            exit 1
          fi

      - name: Verify owner-scoped historical run remains isolated
        shell: bash
        env:
          API_BASE: https://parallax-api-tan.vercel.app
          HISTORICAL_RUN_ID: af617b0b-5297-427c-a40d-90d58f59a20a
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/historical.json \
            --write-out '%{http_code}' \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            "${API_BASE}/v1/engineering-runs/${HISTORICAL_RUN_ID}")"
          if [ "${status}" != "404" ]; then
            echo "Expected owner-scoped historical run to remain isolated; received HTTP ${status}" >&2
            exit 1
          fi
          echo "Owner-scoped historical run remains isolated from QA identity"

      - name: Ensure QA-owned OT Time Project
        id: project
        shell: bash
        env:
          API_BASE: https://parallax-api-tan.vercel.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            "${API_BASE}/v1/projects" >/tmp/projects.json
          project_id="$(jq -r '.[] | select(.repository_ref == "github:Ryan9876/ot-time") | .id' /tmp/projects.json | head -n1)"
          if [ -z "${project_id}" ]; then
            jq -n '{name:"W8 S2 QA OT Time",slug:"w8-s2-qa-ot-time",description:"Canonical QA-owned W8-S2 production acceptance fixture.",repository_ref:"github:Ryan9876/ot-time"}' >/tmp/project-create.json
            curl --fail-with-body --silent --show-error \
              --cookie /tmp/parallax.cookies \
              -H "X-Parallax-Session: 1" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/project-create.json \
              -X POST "${API_BASE}/v1/projects" >/tmp/project.json
            project_id="$(jq -r '.id' /tmp/project.json)"
          fi
          test -n "${project_id}"
          echo "project_id=${project_id}" >> "${GITHUB_OUTPUT}"
          echo "Canonical QA Project: ${project_id}"

      - name: Create canonical conversation and approved Work Specification
        id: spec
        shell: bash
        env:
          API_BASE: https://parallax-api-tan.vercel.app
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          set -euo pipefail
          jq -n --arg project_id "${PROJECT_ID}" '{mode:"code",project_id:$project_id}' >/tmp/conversation-create.json
          curl --fail-with-body --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/conversation-create.json \
            -X POST "${API_BASE}/v1/conversations" >/tmp/conversation.json
          conversation_id="$(jq -r '.id' /tmp/conversation.json)"

          objective="Implement an About page in the bound project repository and verify that it is accessible, renders correctly, and integrates with the existing application. Preserve the existing application structure, styling conventions, and behavior outside the About page."
          jq -n --arg content "${objective}" '{role:"user",content:$content}' >/tmp/message.json
          curl --fail-with-body --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/message.json \
            -X POST "${API_BASE}/v1/conversations/${conversation_id}/messages" >/tmp/message-response.json

          curl --fail-with-body --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            -X POST "${API_BASE}/v1/conversations/${conversation_id}/work-specifications/draft" >/tmp/spec-draft.json
          spec_id="$(jq -r '.id' /tmp/spec-draft.json)"
          curl --fail-with-body --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            -X POST "${API_BASE}/v1/work-specifications/${spec_id}/approve" >/tmp/spec-approved.json
          jq -e '.status == "APPROVED"' /tmp/spec-approved.json >/dev/null

          echo "conversation_id=${conversation_id}" >> "${GITHUB_OUTPUT}"
          echo "spec_id=${spec_id}" >> "${GITHUB_OUTPUT}"
          echo "Canonical Work Specification: ${spec_id}"

      - name: Activate canonical Engineering Run
        id: run
        shell: bash
        env:
          API_BASE: https://parallax-api-tan.vercel.app
          CONVERSATION_ID: ${{ steps.spec.outputs.conversation_id }}
          SPEC_ID: ${{ steps.spec.outputs.spec_id }}
        run: |
          set -euo pipefail
          jq -n --arg conversation_id "${CONVERSATION_ID}" --arg work_specification_id "${SPEC_ID}" '{conversation_id:$conversation_id,work_specification_id:$work_specification_id}' >/tmp/activate.json
          curl --fail-with-body --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/activate.json \
            -X POST "${API_BASE}/v1/engineering-runs/activate" >/tmp/run-before.json
          run_id="$(jq -r '.id' /tmp/run-before.json)"
          revision="$(jq -r '.revision' /tmp/run-before.json)"
          state="$(jq -r '.state' /tmp/run-before.json)"
          test -n "${run_id}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "Canonical run before replay: id=${run_id}, state=${state}, revision=${revision}"

      - name: Retry protected autonomous continuation
        shell: bash
        env:
          API_BASE: https://parallax-api-tan.vercel.app
          RUN_ID: ${{ steps.run.outputs.run_id }}
          EXPECTED_REVISION: ${{ steps.run.outputs.revision }}
        run: |
          set -euo pipefail
          operation_key="qa-w8-s2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg operation_key "${operation_key}" \
            --argjson expected_revision "${EXPECTED_REVISION}" \
            '{operation_key:$operation_key,expected_revision:$expected_revision}' >/tmp/autonomous.json
          curl --fail-with-body --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/autonomous.json \
            -X POST "${API_BASE}/v1/engineering-runs/${RUN_ID}/autonomous" >/tmp/replay.json
          jq '{stop_reason,run:{id:.run.id,state:.run.state,revision:.run.revision,last_failure_code:.run.last_failure_code},steps}' /tmp/replay.json

      - name: Verify former W8-S2 defect does not reproduce
        shell: bash
        env:
          API_BASE: https://parallax-api-tan.vercel.app
          RUN_ID: ${{ steps.run.outputs.run_id }}
          BEFORE_REVISION: ${{ steps.run.outputs.revision }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --cookie /tmp/parallax.cookies \
            -H "X-Parallax-Session: 1" \
            "${API_BASE}/v1/engineering-runs/${RUN_ID}" >/tmp/run-after.json
          after_revision="$(jq -r '.revision' /tmp/run-after.json)"
          state="$(jq -r '.state' /tmp/run-after.json)"
          failure="$(jq -r '.last_failure_code // ""' /tmp/run-after.json)"
          if [ "${failure}" = "source_bootstrap_failed" ]; then
            echo "Former W8-S2 source bootstrap defect reproduced" >&2
            exit 1
          fi
          if [ "${after_revision}" -le "${BEFORE_REVISION}" ]; then
            echo "Run did not durably advance: before=${BEFORE_REVISION}, after=${after_revision}, state=${state}" >&2
            exit 1
          fi
          echo "W8-S2 canonical replay advanced: run=${RUN_ID}, state=${state}, revision=${after_revision}, failure=${failure:-none}"
