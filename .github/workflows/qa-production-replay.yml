name: QA Production Replay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qa-production-replay.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-production-replay
  cancel-in-progress: false

jobs:
  w9-s1-decision-ledger-reference-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Request GitHub Actions OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=parallax%3A%2F%2Fqa-production"
          token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${request_url}" | jq -r '.value')"
          test -n "${token}"
          test "${token}" != "null"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Run controlled Decision Ledger reference trial
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          API_BASE: https://parallax-api-tan.vercel.app
        run: bash scripts/w9_s1_reference_trial.sh

      - name: Verify structured authorization boundary when consent is absent
        shell: bash
        run: |
          set -euo pipefail
          observed=0
          for candidate in /tmp/response.sse /tmp/autonomous-result.json /tmp/run-final.json; do
            if [ -f "${candidate}" ] && grep -q 'REPOSITORY_AUTHORIZATION_REQUIRED' "${candidate}"; then
              echo "Observed deployed REPOSITORY_AUTHORIZATION_REQUIRED in ${candidate}"
              observed=1
            fi
          done
          if [ "${observed}" = "1" ]; then
            refs="$(git ls-remote https://github.com/Ryan9876/sickbeard.git)"
            test -z "${refs}"
            echo "No-consent boundary verified: target remains greenfield and unmodified."
          else
            echo "No authorization boundary was emitted; inspect the trial output for full-flow evidence."
          fi
