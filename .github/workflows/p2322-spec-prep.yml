name: P2-V0.23.22 Spec Preparation

on:
  push:
    branches:
      - ws/p2322-request-bounded-autonomy
    paths:
      - specs/P2-V0.23.22.md
      - .github/workflows/p2322-spec-prep.yml
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SPEC_PATH: specs/P2-V0.23.22.md
      DSPY_MODEL: ollama_chat/qwen2.5:0.5b
      DSPY_API_BASE: http://127.0.0.1:11434
      DSPY_API_KEY: ""
      DSPY_LOCAL_DEVELOPMENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Validate specification contract
        run: python scripts/validate_spec.py --spec-only "$SPEC_PATH"
      - name: Start local DSPy proof model
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama-p2322.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          ollama pull qwen2.5:0.5b
      - name: Compile specification with DSPy SpecCritic and SpecCompiler
        run: python scripts/compile_spec.py "$SPEC_PATH"
      - name: Validate protected DSPy plan evidence
        run: python scripts/validate_spec.py --require-dspy "$SPEC_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2322-spec-plan
          path: |
            specs/compiled/P2-V0.23.22.plan.json
            /tmp/ollama-p2322.log
          if-no-files-found: warn
          retention-days: 7
