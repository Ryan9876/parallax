name: Repair bounded PREPARE failure projection

on:
  push:
    branches:
      - fix/p2-v0-23-5-prepare-failure-projection
    paths:
      - .github/workflows/fix-prepare-failure-projection.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2-v0-23-5-prepare-failure-projection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Remove unbound PREPARE evidence spread
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/api/parallax_api/code/agentic_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '                            "accepts_source_lineage": False,\n                            **preparation_evidence,\n'
          new = '                            "accepts_source_lineage": False,\n'
          if old not in text:
              raise SystemExit('PREPARE failure projection anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run focused regression
        run: |
          python -m compileall -q services/api/parallax_api
          pytest -q services/api/tests/test_candidate_dependency_preparation_failure.py services/api/tests/test_dependency_preparation.py services/api/tests/test_validation_toolchains.py
          git diff --check
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/parallax_api/code/agentic_runtime.py services/api/tests/test_candidate_dependency_preparation_failure.py
          git rm .github/workflows/fix-prepare-failure-projection.yml
          git diff --cached --check
          git commit -m "Keep PREPARE failure projection bounded"
          git push origin HEAD:fix/p2-v0-23-5-prepare-failure-projection
