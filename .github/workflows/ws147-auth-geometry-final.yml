name: WS147 Final Auth Geometry

on:
  push:
    branches: [ws/w4-editorial-shell]
    paths: ['.github/workflows/ws147-auth-geometry-final.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-editorial-shell
      - name: Preserve mobile access panel while clearing mode controls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/client/src/WebAuthRoot.tsx')
          text = path.read_text(encoding='utf-8')
          old = "accountLayerCompact: { top: 9, left: 16, right: undefined }"
          new = "accountLayerCompact: { top: 9, right: 156 }"
          if old not in text:
              raise SystemExit('expected compact account geometry not found')
          text = text.replace(old, new)
          old_panel = "accessPanelCompact: { position: 'absolute', top: 53, right: -136, maxHeight: 560, marginTop: 0, padding: 16, borderRadius: 20 }"
          new_panel = "accessPanelCompact: { position: 'absolute', top: 53, right: -144, maxHeight: 560, marginTop: 0, padding: 16, borderRadius: 20 }"
          if old_panel not in text:
              raise SystemExit('expected compact access panel geometry not found')
          text = text.replace(old_panel, new_panel)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/client/src/WebAuthRoot.tsx
          git commit -m 'Resolve mobile account and mode-control overlap'
          git push origin HEAD:ws/w4-editorial-shell
