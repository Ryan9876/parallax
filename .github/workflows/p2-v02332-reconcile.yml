name: P2-V0.23.32 Current-State Reconciliation

on:
  push:
    branches:
      - ws/546-candidate-repair-plan-identity
    paths:
      - .github/workflows/p2-v02332-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile deployment-verified authenticated acceptance evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CURRENT-STATE.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Date: 2026-08-31': 'Date: 2026-09-01',
              'P2-V0.23.32 BOUNDED CANDIDATE VALIDATION REPAIR + EXPLICIT CANARY IDENTITY PRODUCTION-DEPLOYMENT-VERIFIED / PRE-USER CANDIDATE CANARY VERIFIED / AUTHENTICATED REAL-PATH ACCEPTANCE PENDING**': 'P2-V0.23.32 BOUNDED CANDIDATE VALIDATION REPAIR + EXPLICIT CANARY IDENTITY PRODUCTION-BEHAVIOR-ACCEPTED / LATER BOUNDED BLOCKER EXPOSED**',
              '## P2-V0.23.32 — bounded candidate validation repair and explicit canary contract identity — PRODUCTION-DEPLOYMENT-VERIFIED / PRE-USER CANDIDATE CANARY VERIFIED / AUTHENTICATED REAL-PATH ACCEPTANCE PENDING': '## P2-V0.23.32 — bounded candidate validation repair and explicit canary contract identity — PRODUCTION-BEHAVIOR-ACCEPTED / LATER BOUNDED BLOCKER EXPOSED',
              'The release is therefore deployment-verified and its deterministic real-sandbox static-web canary is green on the exact production source. The remaining P2-V0.23.32 completion boundary is authenticated real-path behavior acceptance. Trusted QA may exercise an equivalent exact marker-free greenfield run through the dedicated QA OIDC session and ordinary production endpoints; this is allowed because it preserves the same product/session ownership boundaries rather than bypassing them. Acceptance requires the prior terminal primary BUILD pattern to recover through the bounded replacement and advance canonical IMPLEMENT, or to expose a genuinely later bounded blocker. Repeating the same unrepaired primary BUILD failure does not pass. Workstream #543 remains open until that evidence exists.': 'Authenticated real-path acceptance for P2-V0.23.32 is complete under the workstream’s explicit later-bounded-blocker alternative. Trusted dedicated-QA replay `33481570167` / job `99772133148` exercised Engineering Run `171a4d64-6cf1-4c13-bac9-ddea01bb0b22` through ordinary production endpoints on exact deployment `dpl_BgLMFQY3k2q1ZSF3yL6bjJbCedCs`. The real marker-free path preserved Project, Work Specification, accepted source lineage and the immutable `static-web-v1` contract, reached primary candidate convergence with durable `CANDIDATE_PARTIAL_PROGRESS`, then later `AGENT_RESULT` and `AGENT_PROPOSAL`, and advanced into the P2-V0.23.32 validation-repair branch. Exact runtime logs show bounded Luna then Terra hosted calls during the primary proposal convergence and then `parallax_candidate_admission_failed candidate=candidate-repair phase=PROPOSAL_ASSEMBLY failure_kind=AGENTIC_CONTRACT_ERROR`; no additional repair hosted call is evidenced. The prior terminal unrepaired primary BUILD boundary therefore did not recur. This exposes a genuinely later bounded blocker: the candidate-local challenger `TeamPlan` used for alternate producer/dispatch identity is incorrectly projected into the durable worker checkpoint `plan_ref`, which is allowed to change only through an explicit human-authorized protected PLAN refresh. Workstream #543 is closed completed; successor #546 / P2-V0.23.33 owns the canonical-PLAN versus candidate-local selection identity correction. Terra in this replay is primary incremental convergence evidence, not the candidate-repair hosted generation itself.'
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one CURRENT-STATE replacement, found {count}: {old[:90]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit reconciled authoritative state
        run: |
          set -euo pipefail
          git add CURRENT-STATE.md
          git config user.name 'parallax-state-reconciler'
          git config user.email 'parallax-state-reconciler@users.noreply.github.com'
          git commit -m 'P2-V0.23.32 — reconcile authenticated production acceptance'
          git push origin HEAD:ws/546-candidate-repair-plan-identity
