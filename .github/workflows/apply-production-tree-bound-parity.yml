name: Apply production tree-bound parity correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'hotfix/w6-production-tree-bound-parity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/w6-production-tree-bound-parity
          fetch-depth: 0
      - name: Align production preflight bounds and add parity regression
        shell: bash
        run: |
          for file in \
            services/api/scripts/production_provider_preflight.py \
            services/api/scripts/production_projected_source_preflight.py \
            services/api/scripts/production_lineage_composition_preflight.py; do
            test "$(grep -c '^_MAX_TREE_ENTRIES = 512$' "$file")" -eq 1
            sed -i 's/^_MAX_TREE_ENTRIES = 512$/_MAX_TREE_ENTRIES = 1024/' "$file"
          done

          cat > services/api/tests/test_production_tree_bound_parity.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re

          from parallax_api.tools.providers.github import MAX_TREE_ENTRIES


          API_ROOT = Path(__file__).resolve().parents[1]
          PREFLIGHTS = (
              API_ROOT / "scripts" / "production_provider_preflight.py",
              API_ROOT / "scripts" / "production_projected_source_preflight.py",
              API_ROOT / "scripts" / "production_lineage_composition_preflight.py",
          )
          BOUND = re.compile(r"^_MAX_TREE_ENTRIES = (\d+)$", re.MULTILINE)


          def _tree_bound(path: Path) -> int:
              match = BOUND.search(path.read_text(encoding="utf-8"))
              assert match is not None, f"{path.name} must declare an explicit protected tree-entry bound"
              return int(match.group(1))


          def test_production_preflight_tree_bounds_match_runtime_provider_contract() -> None:
              assert MAX_TREE_ENTRIES == 1024
              assert {_tree_bound(path) for path in PREFLIGHTS} == {MAX_TREE_ENTRIES}
          PY

          git rm .github/workflows/apply-production-tree-bound-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/scripts services/api/tests/test_production_tree_bound_parity.py
          git diff --cached --check
          git commit -m "fix(release): align production source-tree preflight bounds"
          git push origin HEAD:hotfix/w6-production-tree-bound-parity
