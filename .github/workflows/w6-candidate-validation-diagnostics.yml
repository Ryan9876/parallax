name: Apply W6 candidate validation diagnostics

on:
  push:
    branches:
      - hotfix/w6-candidate-validation-diagnostics

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[w6-diag-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/w6-candidate-validation-diagnostics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact bounded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "services/api/parallax_api/intelligence/implementation_generation.py",
              '''class ImplementationGenerationFailure(RuntimeError):\n    pass\n''',
              '''class ImplementationGenerationFailure(RuntimeError):\n    def __init__(\n        self,\n        message: str,\n        *,\n        diagnostic_evidence: dict[str, object] | None = None,\n    ) -> None:\n        super().__init__(message)\n        self.diagnostic_evidence = diagnostic_evidence\n''',
          )

          replace_once(
              "services/api/parallax_api/code/agentic_runtime.py",
              '''class AgenticRuntimeError(ValueError):\n    """Fail-closed Wave 6 runtime activation error."""\n\n\n@dataclass(frozen=True, slots=True)\nclass CandidateValidationResult:\n''',
              '''class AgenticRuntimeError(ValueError):\n    """Fail-closed Wave 6 runtime activation error."""\n\n\nclass CandidateValidationFailure(AgenticRuntimeError):\n    """Bounded protected-candidate rejection with sanitized diagnostics only."""\n\n    def __init__(self, message: str, *, diagnostic_evidence: dict[str, object]) -> None:\n        super().__init__(message)\n        self.diagnostic_evidence = diagnostic_evidence\n\n\n@dataclass(frozen=True, slots=True)\nclass CandidateValidationResult:\n''',
          )

          replace_once(
              "services/api/parallax_api/code/agentic_runtime.py",
              '''    @property\n    def duration_seconds(self) -> float:\n        return sum(\n            max(0, int(evidence.get("duration_ms") or 0))\n            for _, evidence in self.stage_evidence\n        ) / 1000.0\n\n\nclass CandidateValidationExecutor(Protocol):\n''',
              '''    @property\n    def duration_seconds(self) -> float:\n        return sum(\n            max(0, int(evidence.get("duration_ms") or 0))\n            for _, evidence in self.stage_evidence\n        ) / 1000.0\n\n\ndef _sha256_value(value: object) -> str | None:\n    if (\n        isinstance(value, str)\n        and len(value) == 64\n        and all(ch in "0123456789abcdef" for ch in value)\n    ):\n        return value\n    return None\n\n\ndef _candidate_validation_failure_diagnostic(\n    candidate_id: str,\n    validation: CandidateValidationResult,\n) -> dict[str, object] | None:\n    """Project only non-secret protected-stage identity for a failed candidate."""\n\n    failed = next(\n        (item for item in validation.stage_evidence if item[1].get("protected_success") is not True),\n        None,\n    )\n    if failed is None:\n        return None\n    stage, evidence = failed\n    if stage not in {WorkflowStage.BUILD.value, WorkflowStage.TEST.value, WorkflowStage.VERIFY.value}:\n        return None\n\n    raw_exit_code = evidence.get("exit_code")\n    exit_code = (\n        raw_exit_code\n        if isinstance(raw_exit_code, int) and not isinstance(raw_exit_code, bool)\n        else None\n    )\n    diagnostic: dict[str, object] = {\n        "candidate_id": candidate_id,\n        "failed_stage": stage,\n        "protected_success": False,\n        "exit_code_present": exit_code is not None,\n        "exit_code": exit_code,\n        "timed_out": evidence.get("timed_out") is True,\n        "candidate_is_canonical_lineage": False,\n        "accepts_source_lineage": False,\n        "source_lineage_accepted": False,\n        "production_deployed": False,\n    }\n    for key in ("invocation_digest", "stdout_digest", "stderr_digest"):\n        digest = _sha256_value(evidence.get(key))\n        if digest is not None:\n            diagnostic[key] = digest\n    content_digest = _sha256_value(validation.content_digest)\n    if content_digest is not None:\n        diagnostic["candidate_content_digest"] = content_digest\n    for key, limit in (("tool_id", 80), ("execution_snapshot_id", 180)):\n        value = evidence.get(key)\n        if (\n            isinstance(value, str)\n            and 0 < len(value) <= limit\n            and value.strip() == value\n            and all(ord(ch) >= 32 for ch in value)\n        ):\n            diagnostic[key] = value\n    return diagnostic\n\n\nclass CandidateValidationExecutor(Protocol):\n''',
          )

          replace_once(
              "services/api/parallax_api/code/agentic_runtime.py",
              '''            routing_record = route_outcomes(routing_request)\n            if routing_record.selected_strategy_id is None:\n                raise AgenticRuntimeError(\n                    f"agentic outcome routing stopped: {routing_record.reason_code}"\n                )\n''',
              '''            routing_record = route_outcomes(routing_request)\n            if routing_record.selected_strategy_id is None:\n                diagnostic = _candidate_validation_failure_diagnostic(\n                    primary.candidate_id,\n                    primary.validation,\n                )\n                if diagnostic is not None:\n                    raise CandidateValidationFailure(\n                        f"agentic outcome routing stopped after protected candidate validation: {routing_record.reason_code}",\n                        diagnostic_evidence=diagnostic,\n                    )\n                raise AgenticRuntimeError(\n                    f"agentic outcome routing stopped: {routing_record.reason_code}"\n                )\n''',
          )

          replace_once(
              "services/api/parallax_api/code/agentic_runtime.py",
              '''        except ImplementationGenerationFailure:\n            raise\n        except (AgenticRuntimeError, ValueError, ImplementationError, PatchError, OSError) as exc:\n            raise ImplementationGenerationFailure(\n                "agentic runtime could not admit a protected implementation candidate"\n            ) from exc\n''',
              '''        except ImplementationGenerationFailure:\n            raise\n        except CandidateValidationFailure as exc:\n            raise ImplementationGenerationFailure(\n                "agentic runtime rejected a protected implementation candidate",\n                diagnostic_evidence={\n                    "candidate_validation_failure": dict(exc.diagnostic_evidence),\n                },\n            ) from exc\n        except (AgenticRuntimeError, ValueError, ImplementationError, PatchError, OSError) as exc:\n            raise ImplementationGenerationFailure(\n                "agentic runtime could not admit a protected implementation candidate"\n            ) from exc\n''',
          )

          replace_once(
              "services/api/parallax_api/code/implementation_runtime.py",
              '''class ImplementationRuntimeError(RuntimeError):\n    def __init__(self, message: str, *, mutation_applied: bool = False) -> None:\n        super().__init__(message)\n        self.mutation_applied = mutation_applied\n''',
              '''class ImplementationRuntimeError(RuntimeError):\n    def __init__(\n        self,\n        message: str,\n        *,\n        mutation_applied: bool = False,\n        diagnostic_evidence: object | None = None,\n    ) -> None:\n        super().__init__(message)\n        self.mutation_applied = mutation_applied\n        if diagnostic_evidence is None:\n            self.diagnostic_evidence = None\n        else:\n            try:\n                self.diagnostic_evidence = _bounded_implementation_failure_evidence(diagnostic_evidence)\n            except ValueError:\n                # Diagnostics are observation only. Invalid or sensitive diagnostic\n                # material must be dropped rather than changing fail-closed behavior.\n                self.diagnostic_evidence = None\n''',
          )

          replace_once(
              "services/api/parallax_api/code/implementation_runtime.py",
              '''        except (ImplementationGenerationFailure, TypeError, ValueError) as exc:\n            raise ImplementationContractError("protected implementation generation failed") from exc\n''',
              '''        except ImplementationGenerationFailure as exc:\n            raise ImplementationContractError(\n                "protected implementation generation failed",\n                diagnostic_evidence=exc.diagnostic_evidence,\n            ) from exc\n        except (TypeError, ValueError) as exc:\n            raise ImplementationContractError("protected implementation generation failed") from exc\n''',
          )

          replace_once(
              "services/api/parallax_api/code/implementation_runtime.py",
              '''    return normalized\n\n\ndef _bounded_identity(value: str, name: str) -> str:\n''',
              '''    return normalized\n\n\ndef _bounded_implementation_failure_evidence(value: object) -> dict[str, object]:\n    """Allow only sanitized protected candidate failure diagnostics into durable failure evidence."""\n\n    if not isinstance(value, dict) or set(value) != {"candidate_validation_failure"}:\n        raise ValueError("implementation failure diagnostics have an invalid envelope")\n    raw = value["candidate_validation_failure"]\n    if not isinstance(raw, dict):\n        raise ValueError("candidate validation diagnostics must be an object")\n\n    allowed = {\n        "candidate_id",\n        "failed_stage",\n        "protected_success",\n        "exit_code_present",\n        "exit_code",\n        "timed_out",\n        "tool_id",\n        "invocation_digest",\n        "stdout_digest",\n        "stderr_digest",\n        "execution_snapshot_id",\n        "candidate_content_digest",\n        "candidate_is_canonical_lineage",\n        "accepts_source_lineage",\n        "source_lineage_accepted",\n        "production_deployed",\n    }\n    if set(raw) - allowed:\n        raise ValueError("candidate validation diagnostics contain a non-admitted field")\n\n    candidate_id = _bounded_identity(raw.get("candidate_id"), "candidate_id")\n    stage = raw.get("failed_stage")\n    if stage not in {WorkflowStage.BUILD.value, WorkflowStage.TEST.value, WorkflowStage.VERIFY.value}:\n        raise ValueError("candidate validation diagnostics contain an invalid stage")\n    if raw.get("protected_success") is not False:\n        raise ValueError("candidate validation failure cannot claim protected success")\n    if not isinstance(raw.get("exit_code_present"), bool):\n        raise ValueError("candidate validation exit-code presence must be boolean")\n    exit_code = raw.get("exit_code")\n    if exit_code is not None and (not isinstance(exit_code, int) or isinstance(exit_code, bool)):\n        raise ValueError("candidate validation exit code must be integer or null")\n    if raw["exit_code_present"] is not (exit_code is not None):\n        raise ValueError("candidate validation exit-code presence drifted")\n    if not isinstance(raw.get("timed_out"), bool):\n        raise ValueError("candidate validation timeout state must be boolean")\n\n    normalized_failure: dict[str, object] = {\n        "candidate_id": candidate_id,\n        "failed_stage": stage,\n        "protected_success": False,\n        "exit_code_present": raw["exit_code_present"],\n        "exit_code": exit_code,\n        "timed_out": raw["timed_out"],\n    }\n    for key in ("candidate_is_canonical_lineage", "accepts_source_lineage", "source_lineage_accepted", "production_deployed"):\n        if raw.get(key) is not False:\n            raise ValueError("candidate validation diagnostics asserted authority they do not own")\n        normalized_failure[key] = False\n\n    for key in ("invocation_digest", "stdout_digest", "stderr_digest", "candidate_content_digest"):\n        if key not in raw:\n            continue\n        digest = raw[key]\n        if (\n            not isinstance(digest, str)\n            or len(digest) != 64\n            or any(ch not in "0123456789abcdef" for ch in digest)\n        ):\n            raise ValueError("candidate validation diagnostics contain an invalid SHA-256 digest")\n        normalized_failure[key] = digest\n\n    for key, limit in (("tool_id", 80), ("execution_snapshot_id", 180)):\n        if key not in raw:\n            continue\n        field = raw[key]\n        if (\n            not isinstance(field, str)\n            or not field\n            or len(field) > limit\n            or field.strip() != field\n            or any(ord(ch) < 32 for ch in field)\n        ):\n            raise ValueError("candidate validation diagnostics contain an invalid bounded identity")\n        normalized_failure[key] = field\n\n    normalized = {"candidate_validation_failure": normalized_failure}\n    encoded = json.dumps(normalized, sort_keys=True, separators=(",", ":"), ensure_ascii=True)\n    if len(encoded.encode("utf-8")) > 4_096:\n        raise ValueError("candidate validation diagnostics exceed durable evidence bound")\n    return normalized\n\n\ndef _bounded_identity(value: str, name: str) -> str:\n''',
          )

          replace_once(
              "services/api/parallax_api/code/autonomy.py",
              '''                    try:\n                        failed = self.service.complete_stage(\n                            run_id=run.id,\n                            stage=WorkflowStage.IMPLEMENT,\n                            operation_key=stage_key,\n                            expected_revision=run.revision,\n                            passed=False,\n                            evidence={\n                                "error_class": type(exc).__name__,\n                                "mutation_applied": False,\n                            },\n                            failure_code="AUTONOMOUS_IMPLEMENT_FAILED",\n                            program_id="protected-implementation-runtime-v0.15.4",\n                            tool_id="safe-source-implementation-v1",\n                        )\n''',
              '''                    failure_evidence: dict[str, object] = {\n                        "error_class": type(exc).__name__,\n                        "mutation_applied": False,\n                    }\n                    if exc.diagnostic_evidence is not None:\n                        failure_evidence["diagnostic_evidence"] = exc.diagnostic_evidence\n                    try:\n                        failed = self.service.complete_stage(\n                            run_id=run.id,\n                            stage=WorkflowStage.IMPLEMENT,\n                            operation_key=stage_key,\n                            expected_revision=run.revision,\n                            passed=False,\n                            evidence=failure_evidence,\n                            failure_code="AUTONOMOUS_IMPLEMENT_FAILED",\n                            program_id="protected-implementation-runtime-v0.15.4",\n                            tool_id="safe-source-implementation-v1",\n                        )\n''',
          )

          Path("services/api/tests/test_w6_candidate_validation_diagnostics.py").write_text(
              '''from __future__ import annotations\n\nimport json\n\nfrom sqlalchemy.orm import sessionmaker\n\nfrom parallax_api.code.agentic_runtime import (\n    CandidateValidationResult,\n    _candidate_validation_failure_diagnostic,\n)\nfrom parallax_api.code.autonomy import AutonomyCoordinator, AutonomyStopReason\nfrom parallax_api.code.execution import ExecutionSpec\nfrom parallax_api.code.implementation_runtime import ImplementationContractError, ImplementationRuntimeError\nfrom parallax_api.code.service import EngineeringRunService\nfrom parallax_api.db import Base, make_engine\nfrom parallax_api.intelligence.work_specification import WorkSpecificationDraft\nfrom parallax_api.repositories.conversations import ConversationRepository\nfrom parallax_api.repositories.engineering_runs import EngineeringRunRepository\nfrom parallax_api.repositories.work_specifications import WorkSpecificationRepository\n\n\ndef _diagnostic() -> dict[str, object]:\n    return {\n        "candidate_validation_failure": {\n            "candidate_id": "candidate-primary",\n            "failed_stage": "TEST",\n            "protected_success": False,\n            "exit_code_present": True,\n            "exit_code": 1,\n            "timed_out": False,\n            "tool_id": "test",\n            "invocation_digest": "a" * 64,\n            "stdout_digest": "b" * 64,\n            "stderr_digest": "c" * 64,\n            "execution_snapshot_id": "snap_validation-test",\n            "candidate_content_digest": "d" * 64,\n            "candidate_is_canonical_lineage": False,\n            "accepts_source_lineage": False,\n            "source_lineage_accepted": False,\n            "production_deployed": False,\n        }\n    }\n\n\ndef test_candidate_validation_failure_projection_omits_raw_output_and_authority() -> None:\n    result = CandidateValidationResult(\n        content_digest="d" * 64,\n        file_count=10,\n        total_bytes=1000,\n        stage_evidence=(\n            (\n                "BUILD",\n                {\n                    "tool_id": "build",\n                    "exit_code": 0,\n                    "protected_success": True,\n                },\n            ),\n            (\n                "TEST",\n                {\n                    "tool_id": "test",\n                    "invocation_digest": "a" * 64,\n                    "exit_code": 1,\n                    "stdout_digest": "b" * 64,\n                    "stdout_excerpt": "must never persist",\n                    "stderr_digest": "c" * 64,\n                    "stderr_excerpt": "Bearer must-never-persist",\n                    "timed_out": False,\n                    "protected_success": False,\n                    "execution_snapshot_id": "snap_validation-test",\n                },\n            ),\n        ),\n    )\n\n    diagnostic = _candidate_validation_failure_diagnostic("candidate-primary", result)\n\n    assert diagnostic is not None\n    assert diagnostic["failed_stage"] == "TEST"\n    assert diagnostic["exit_code"] == 1\n    assert diagnostic["candidate_content_digest"] == "d" * 64\n    assert diagnostic["candidate_is_canonical_lineage"] is False\n    assert diagnostic["accepts_source_lineage"] is False\n    assert diagnostic["source_lineage_accepted"] is False\n    assert diagnostic["production_deployed"] is False\n    assert "stdout_excerpt" not in diagnostic\n    assert "stderr_excerpt" not in diagnostic\n\n\ndef test_implementation_failure_diagnostics_drop_non_admitted_sensitive_fields() -> None:\n    safe = ImplementationRuntimeError(\n        "bounded failure",\n        diagnostic_evidence=_diagnostic(),\n    )\n    assert safe.diagnostic_evidence == _diagnostic()\n\n    unsafe = _diagnostic()\n    unsafe["candidate_validation_failure"]["stdout_excerpt"] = "must never persist"  # type: ignore[index]\n    rejected = ImplementationRuntimeError(\n        "bounded failure",\n        diagnostic_evidence=unsafe,\n    )\n    assert rejected.diagnostic_evidence is None\n\n\nclass _Executor:\n    def probe(self, *, operation_key: str) -> dict[str, object]:\n        return {\n            "tool_id": "python",\n            "exit_code": 0,\n            "protected_success": True,\n        }\n\n    def execute(self, spec: ExecutionSpec) -> dict[str, object]:\n        raise AssertionError("execution must not continue past failed IMPLEMENT")\n\n\nclass _DiagnosticImplementationRuntime:\n    def execute(self, **_kwargs):\n        raise ImplementationContractError(\n            "protected candidate validation rejected the proposal",\n            mutation_applied=False,\n            diagnostic_evidence=_diagnostic(),\n        )\n\n\ndef _service(tmp_path):\n    engine = make_engine(f"sqlite:///{tmp_path / 'candidate-diagnostics.db'}")\n    Base.metadata.create_all(engine)\n    Session = sessionmaker(bind=engine, expire_on_commit=False)\n    session = Session()\n    conversations = ConversationRepository(session)\n    runs = EngineeringRunRepository(session)\n    work_specs = WorkSpecificationRepository(session)\n    service = EngineeringRunService(runs, conversations, work_specs)\n\n    conversation = conversations.create("code", spec_id="P2-V0.19.7")\n    draft = work_specs.create_draft(\n        conversation_id=conversation.id,\n        draft=WorkSpecificationDraft(\n            title="Candidate validation diagnostics",\n            objective="Persist only sanitized failure evidence.",\n            constraints=["Do not mutate canonical source on candidate failure."],\n            acceptance_criteria=[\n                "Candidate failure evidence identifies the protected stage.",\n                "Sensitive model or provider material is never persisted.",\n            ],\n            risks=["Diagnostics could accidentally become an authority or secret channel."],\n            open_questions=[],\n            confidence=0.99,\n            program_version="w6-candidate-diagnostics-test",\n        ),\n        model_id="test-model",\n    )\n    approved = work_specs.approve(draft)\n    run = service.activate_run(\n        conversation_id=conversation.id,\n        work_specification_id=approved.id,\n    )\n    return session, service, run\n\n\ndef test_failed_implement_persists_only_bounded_candidate_diagnostic(tmp_path) -> None:\n    session, service, run = _service(tmp_path)\n    try:\n        planned = AutonomyCoordinator(service, _Executor()).run(\n            run_id=run.id,\n            operation_key="candidate-diagnostic-plan",\n            expected_revision=run.revision,\n        )\n        assert planned.run.state == "IMPLEMENT"\n\n        result = AutonomyCoordinator(\n            service,\n            _Executor(),\n            implementation_runtime=_DiagnosticImplementationRuntime(),\n        ).run(\n            run_id=run.id,\n            operation_key="candidate-diagnostic-implement",\n            expected_revision=planned.run.revision,\n        )\n\n        assert result.stop_reason is AutonomyStopReason.IMPLEMENTATION_FAILED\n        assert result.run.state == "FAILED"\n        attempt = next(item for item in result.run.attempts if item.stage == "IMPLEMENT")\n        evidence = json.loads(attempt.evidence_json)\n        assert evidence["error_class"] == "ImplementationContractError"\n        assert evidence["mutation_applied"] is False\n        assert evidence["diagnostic_evidence"] == _diagnostic()\n        encoded = json.dumps(evidence, sort_keys=True)\n        assert "stdout_excerpt" not in encoded\n        assert "stderr_excerpt" not in encoded\n        assert "Bearer" not in encoded\n        assert evidence["diagnostic_evidence"]["candidate_validation_failure"]["source_lineage_accepted"] is False\n        assert evidence["diagnostic_evidence"]["candidate_validation_failure"]["production_deployed"] is False\n    finally:\n        session.close()\n''',
              encoding="utf-8",
          )

          workflow = Path(".github/workflows/w6-candidate-validation-diagnostics.yml")
          workflow.unlink()
          PY

      - name: Install API development dependencies
        run: python -m pip install -e 'services/api[dev]'

      - name: Run focused diagnostics regression
        run: python -m pytest -q services/api/tests/test_w6_candidate_validation_diagnostics.py

      - name: Commit bounded hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/parallax_api/intelligence/implementation_generation.py \
                  services/api/parallax_api/code/agentic_runtime.py \
                  services/api/parallax_api/code/implementation_runtime.py \
                  services/api/parallax_api/code/autonomy.py \
                  services/api/tests/test_w6_candidate_validation_diagnostics.py \
                  .github/workflows/w6-candidate-validation-diagnostics.yml
          git commit -m "[w6-diag-patched] Persist bounded candidate validation diagnostics"
          git push origin HEAD:hotfix/w6-candidate-validation-diagnostics
