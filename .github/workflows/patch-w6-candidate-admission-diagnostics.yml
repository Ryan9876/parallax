name: Patch Wave 6 candidate admission diagnostics

on:
  push:
    branches: [hotfix/w6-candidate-admission-diagnostics]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/w6-candidate-admission-diagnostics
          fetch-depth: 0
      - name: Apply bounded runtime patch
        run: python .github/patch-w6-candidate-admission-diagnostics.py
      - name: Install API test dependencies
        run: python -m pip install -e 'services/api[dev]'
      - name: Run focused diagnostics regressions
        run: python -m pytest -q services/api/tests/test_w6_candidate_validation_diagnostics.py services/api/tests/test_w6_candidate_admission_diagnostics.py
      - name: Verify durable diff and self-remove temporary tooling
        run: |
          git diff --check
          git rm .github/workflows/patch-w6-candidate-admission-diagnostics.yml
          git rm .github/patch-w6-candidate-admission-diagnostics.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/parallax_api/code/agentic_runtime.py services/api/parallax_api/code/implementation_runtime.py services/api/tests/test_w6_candidate_admission_diagnostics.py
          git commit -m 'fix(w6): persist bounded candidate admission phase diagnostics'
          git push origin HEAD:hotfix/w6-candidate-admission-diagnostics
