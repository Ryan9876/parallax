name: Repair bounded PREPARE evidence admission

on:
  push:
    branches:
      - fix/p2-v0-23-5-prepare-evidence-admission
    paths:
      - .github/workflows/fix-prepare-evidence-admission.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p2-v0-23-5-prepare-evidence-admission
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'
      - name: Admit fixed PREPARE diagnostic fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/parallax_api/code/implementation_runtime.py')
          text = path.read_text(encoding='utf-8')

          old = '''        "stdout_digest",\n        "stderr_digest",\n        "execution_snapshot_id",\n'''
          new = '''        "stdout_digest",\n        "stderr_digest",\n        "dependency_stdout_digest",\n        "dependency_stderr_digest",\n        "dependency_preparation_code",\n        "dependency_preparation_required",\n        "dependency_preparation_succeeded",\n        "validation_network_locked",\n        "dependency_probe_exit_code",\n        "dependency_prepare_exit_code",\n        "execution_snapshot_id",\n'''
          if old not in text:
              raise SystemExit('candidate diagnostic allowlist anchor not found')
          text = text.replace(old, new, 1)

          old = '''    for key in ("invocation_digest", "stdout_digest", "stderr_digest", "candidate_content_digest"):\n'''
          new = '''    for key in (\n        "invocation_digest",\n        "stdout_digest",\n        "stderr_digest",\n        "dependency_stdout_digest",\n        "dependency_stderr_digest",\n        "candidate_content_digest",\n    ):\n'''
          if old not in text:
              raise SystemExit('candidate digest loop anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''    for key, limit in (("tool_id", 80), ("execution_snapshot_id", 180), ("validation_profile_id", 80)):\n'''
          insert = '''    if "dependency_preparation_code" in raw:\n        code = raw["dependency_preparation_code"]\n        if code not in {\n            "NOT_REQUIRED",\n            "READY",\n            "EXECUTION_PROFILE_UNAVAILABLE",\n            "DEPENDENCY_PREPARATION_FAILED",\n            "VALIDATION_NETWORK_LOCK_FAILED",\n        }:\n            raise ValueError("candidate validation diagnostics contain an invalid dependency preparation code")\n        normalized_failure["dependency_preparation_code"] = code\n\n    for key in (\n        "dependency_preparation_required",\n        "dependency_preparation_succeeded",\n        "validation_network_locked",\n    ):\n        if key not in raw:\n            continue\n        value = raw[key]\n        if not isinstance(value, bool):\n            raise ValueError("candidate validation dependency state must be boolean")\n        normalized_failure[key] = value\n\n    for key in ("dependency_probe_exit_code", "dependency_prepare_exit_code"):\n        if key not in raw:\n            continue\n        value = raw[key]\n        if value is not None and (not isinstance(value, int) or isinstance(value, bool)):\n            raise ValueError("candidate validation dependency exit code must be integer or null")\n        normalized_failure[key] = value\n\n'''
          if anchor not in text:
              raise SystemExit('candidate bounded identity anchor not found')
          text = text.replace(anchor, insert + anchor, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('services/api/tests/test_w6_candidate_validation_diagnostics.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_implementation_failure_diagnostics_drop_non_admitted_sensitive_fields() -> None:\n'
          if marker not in tests:
              raise SystemExit('candidate diagnostic test anchor not found')
          addition = '''def test_dependency_preparation_diagnostics_survive_failure_sanitizer() -> None:\n    result = CandidateValidationResult(\n        content_digest="d" * 64,\n        file_count=10,\n        total_bytes=1000,\n        validation_profile_id="dotnet-v1",\n        validation_profile_digest="e" * 64,\n        stage_evidence=((\n            "BUILD",\n            {\n                "tool_id": "build",\n                "protected_success": False,\n                "exit_code": None,\n                "timed_out": False,\n                "execution_snapshot_id": "snap_validation-test",\n                "dependency_preparation_required": True,\n                "dependency_preparation_succeeded": False,\n                "dependency_preparation_code": "DEPENDENCY_PREPARATION_FAILED",\n                "dependency_probe_exit_code": 0,\n                "dependency_prepare_exit_code": 1,\n                "dependency_stdout_digest": "f" * 64,\n                "dependency_stderr_digest": "1" * 64,\n                "validation_network_locked": True,\n                "dependency_raw_output": "Bearer must-never-persist",\n            },\n        ),),\n    )\n    projected = _candidate_validation_failure_diagnostic("candidate-primary", result)\n    assert projected is not None\n\n    safe = ImplementationRuntimeError(\n        "bounded PREPARE failure",\n        diagnostic_evidence={"candidate_validation_failure": projected},\n    )\n\n    diagnostic = safe.diagnostic_evidence\n    assert diagnostic is not None\n    failure = diagnostic["candidate_validation_failure"]\n    assert failure["dependency_preparation_code"] == "DEPENDENCY_PREPARATION_FAILED"\n    assert failure["dependency_preparation_required"] is True\n    assert failure["dependency_preparation_succeeded"] is False\n    assert failure["dependency_probe_exit_code"] == 0\n    assert failure["dependency_prepare_exit_code"] == 1\n    assert failure["dependency_stdout_digest"] == "f" * 64\n    assert failure["dependency_stderr_digest"] == "1" * 64\n    assert failure["validation_network_locked"] is True\n    encoded = json.dumps(diagnostic, sort_keys=True)\n    assert "dependency_raw_output" not in encoded\n    assert "Bearer" not in encoded\n\n\n'''
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Run focused diagnostics regression
        run: |
          python -m compileall -q services/api/parallax_api
          pytest -q services/api/tests/test_w6_candidate_validation_diagnostics.py services/api/tests/test_dependency_preparation.py
          git diff --check
      - name: Commit repair without temporary workflow
        run: |
          git config user.name "Parallax Release Bot"
          git config user.email "parallax-release-bot@users.noreply.github.com"
          git add services/api/parallax_api/code/implementation_runtime.py services/api/tests/test_w6_candidate_validation_diagnostics.py
          git rm .github/workflows/fix-prepare-evidence-admission.yml
          git diff --cached --check
          git commit -m "Preserve bounded PREPARE failure evidence"
          git push origin HEAD:fix/p2-v0-23-5-prepare-evidence-admission
