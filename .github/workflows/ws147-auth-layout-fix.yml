name: WS147 Warm Auth Layout Fix

on:
  push:
    branches: [ws/w4-editorial-shell]
    paths: ['.github/workflows/ws147-auth-layout-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-editorial-shell
      - name: Fix compact account geometry and warm auth material
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/client/src/WebAuthRoot.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = {
            "ambientOne: { position: 'absolute', width: 560, height: 560, borderRadius: 280, backgroundColor: 'rgba(143,99,216,0.14)'": "ambientOne: { position: 'absolute', width: 560, height: 560, borderRadius: 280, backgroundColor: 'rgba(196,74,27,0.08)'",
            "ambientTwo: { position: 'absolute', width: 480, height: 480, borderRadius: 240, backgroundColor: 'rgba(125,231,255,0.06)'": "ambientTwo: { position: 'absolute', width: 480, height: 480, borderRadius: 240, backgroundColor: 'rgba(0,132,135,0.05)'",
            "backgroundColor: 'rgba(17,21,37,0.82)'": "backgroundColor: 'rgba(245,238,223,0.96)'",
            "accountLayerCompact: { top: 9, right: 148 }": "accountLayerCompact: { top: 9, left: 16, right: undefined }",
            "backgroundColor: 'rgba(11,16,25,0.90)'": "backgroundColor: 'rgba(245,238,223,0.98)'",
            "backgroundColor: 'rgba(11,16,25,0.98)'": "backgroundColor: 'rgba(251,247,238,0.99)'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected WebAuthRoot pattern: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/client/src/WebAuthRoot.tsx
          git commit -m 'Fix warm editorial mobile account geometry'
          git push origin HEAD:ws/w4-editorial-shell
