name: WS147 Warm Editorial Acceptance Patch

on:
  push:
    branches: [ws/w4-editorial-shell]
    paths:
      - '.github/workflows/ws147-warm-editorial-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws/w4-editorial-shell
      - name: Update visual acceptance language and selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/client/scripts/visual-smoke.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "The response is being inscribed line by line. The optical head should follow the active wrapped line, leave a short cool-blue energized edge on fresh glyphs, and then cool into normal selectable text without disturbing the calm surface behind it.": "The response streams into the warm editorial workspace as normal selectable text. A restrained live trace may mark current output without delaying content or implying progress beyond server evidence.",
              "Optical response behavior": "Warm editorial response behavior",
              "Preserve the calm Parallax conversation while verifying durable specification capture and optical response behavior.": "Preserve the calm Parallax conversation while verifying durable specification capture and warm editorial live-response behavior.",
              "Specification chrome could compete with the conversation.": "Shell chrome could compete with the conversation.",
              "Parallax animated knot mark": "Parallax orbital planet mark",
              "approved knot identity was not rendered": "approved orbital identity was not rendered",
              "Show the optical printing behavior on a wrapped response.": "Show the live response behavior on a wrapped response.",
              "OPTICAL ENGRAVING ACTIVE": "Live response",
              "live optical inscription": "live response",
              "Optical engraving head": "Live response trace",
              "compact optical engraving head": "compact live response trace",
              "The response is being inscribed line by line": "The response streams into the warm editorial workspace",
              "rounded optical material": "rounded editorial material",
              "opticalTypesetter": "liveResponseTreatment",
              "engravingHeadRendered": "liveTraceRendered",
              "roundedOpticalMaterial": "roundedEditorialMaterial",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit acceptance update
        run: |
          git config user.name 'Parallax Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/client/scripts/visual-smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Update visual acceptance for warm editorial shell'
          git push origin HEAD:ws/w4-editorial-shell
