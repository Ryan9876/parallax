name: Parallax P2 CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: parallax-p2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VALIDATION: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}

jobs:
  spec-and-api:
    name: Fast API + contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Validate specifications
        run: |
          python scripts/validate_spec.py specs/P2-V0.1.0.md
          for SPEC in $(find specs -maxdepth 1 -type f -name 'P2-V*.md' | sort -V); do
            if [ "$SPEC" = "specs/P2-V0.1.0.md" ]; then
              continue
            fi
            python scripts/validate_spec.py --spec-only "$SPEC"
          done
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Compile Python sources
        run: python -m compileall -q services/api/parallax_api scripts
      - name: Run API tests
        run: python -m pytest services/api/tests -q

  client:
    name: Fast client checks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install client dependencies
        working-directory: apps/client
        run: npm install
      - name: Typecheck
        working-directory: apps/client
        run: npm run typecheck
      - name: Response state tests
        working-directory: apps/client
        run: npm run test:state
      - name: Export web build
        working-directory: apps/client
        run: npm run export:web
      - name: Record production dependency audit
        if: env.RELEASE_VALIDATION == 'true'
        working-directory: apps/client
        run: npm audit --omit=dev --json > npm-audit.json || true
      - name: Install release browser runtime
        if: env.RELEASE_VALIDATION == 'true'
        working-directory: apps/client
        run: npx playwright install --with-deps chromium
      - name: Run browser/Skia acceptance suite
        if: env.RELEASE_VALIDATION == 'true'
        working-directory: apps/client
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always() && env.RELEASE_VALIDATION == 'true'
        with:
          name: client-build-evidence
          path: |
            apps/client/package-lock.json
            apps/client/npm-audit.json
            apps/client/dist
            apps/client/visual-evidence
          if-no-files-found: error
          retention-days: 14

  evaluation:
    name: Protected promotion evaluation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    needs: spec-and-api
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'

      - name: Validate engineering and Reason benchmark suites
        run: |
          python scripts/validate_benchmark.py benchmarks/parallax-engineering/development-v0.1.json
          python scripts/validate_benchmark.py benchmarks/parallax-engineering/promotion-v0.1.json
          python scripts/validate_benchmark.py benchmarks/parallax-engineering/reason-development-v0.1.json
          python scripts/validate_benchmark.py benchmarks/parallax-engineering/reason-promotion-v0.1.json
          python scripts/validate_benchmark.py benchmarks/parallax-engineering/code-development-v0.4.json
          python scripts/validate_benchmark.py benchmarks/parallax-engineering/code-promotion-v0.4.json

      - name: Evaluate protected Code baseline and equivalent challenger
        run: |
          python scripts/evaluate_recorded.py \
            benchmarks/parallax-engineering/code-promotion-v0.4.json \
            benchmarks/parallax-engineering/fixtures/code-baseline.json \
            --evidence-dir evaluation-evidence/code-promotion-baseline
          python scripts/evaluate_recorded.py \
            benchmarks/parallax-engineering/code-promotion-v0.4.json \
            benchmarks/parallax-engineering/fixtures/code-equivalent.json \
            --evidence-dir evaluation-evidence/code-promotion-challenger
          BASELINE=$(find evaluation-evidence/code-promotion-baseline -type f -name 'eval-*.json' | head -1)
          CHALLENGER=$(find evaluation-evidence/code-promotion-challenger -type f -name 'eval-*.json' | head -1)
          python scripts/compare_evaluations.py "$BASELINE" "$CHALLENGER" \
            --evidence-dir evaluation-evidence/code-promotion-decision

      - name: Prove Code regressions are rejected
        run: |
          for FIXTURE in \
            code-stage-regression.json \
            code-status-regression.json \
            code-spec-regression.json \
            code-unsafe-regression.json; do
            set +e
            python scripts/evaluate_recorded.py \
              benchmarks/parallax-engineering/code-promotion-v0.4.json \
              "benchmarks/parallax-engineering/fixtures/$FIXTURE" \
              --evidence-dir "evaluation-evidence/code-rejected-$FIXTURE"
            RC=$?
            set -e
            if [ "$RC" -eq 0 ]; then
              echo "FAIL: Code regression unexpectedly passed: $FIXTURE"
              exit 1
            fi
          done

      - name: Evaluate recorded engineering development fixture
        run: |
          python scripts/evaluate_recorded.py \
            benchmarks/parallax-engineering/development-v0.1.json \
            benchmarks/parallax-engineering/fixtures/development-good.json \
            --evidence-dir evaluation-evidence/development

      - name: Evaluate protected engineering promotion baseline and equivalent challenger
        run: |
          python scripts/evaluate_recorded.py \
            benchmarks/parallax-engineering/promotion-v0.1.json \
            benchmarks/parallax-engineering/fixtures/promotion-baseline.json \
            --evidence-dir evaluation-evidence/promotion-baseline
          python scripts/evaluate_recorded.py \
            benchmarks/parallax-engineering/promotion-v0.1.json \
            benchmarks/parallax-engineering/fixtures/promotion-equivalent.json \
            --evidence-dir evaluation-evidence/promotion-challenger
          BASELINE=$(find evaluation-evidence/promotion-baseline -type f -name 'eval-*.json' | head -1)
          CHALLENGER=$(find evaluation-evidence/promotion-challenger -type f -name 'eval-*.json' | head -1)
          python scripts/compare_evaluations.py "$BASELINE" "$CHALLENGER" \
            --evidence-dir evaluation-evidence/promotion-decision

      - name: Prove an inherited engineering protected regression is rejected
        run: |
          set +e
          python scripts/evaluate_recorded.py \
            benchmarks/parallax-engineering/promotion-v0.1.json \
            benchmarks/parallax-engineering/fixtures/promotion-regression.json \
            --evidence-dir evaluation-evidence/rejected-regression
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo 'FAIL: known engineering protected regression unexpectedly passed'
            exit 1
          fi
          echo "PASS: known engineering protected regression rejected with rc=$RC"

      - name: Evaluate recorded Reason development fixture
        run: |
          python scripts/evaluate_recorded.py \
            benchmarks/parallax-engineering/reason-development-v0.1.json \
            benchmarks/parallax-engineering/fixtures/reason-development-good.json \
            --evidence-dir evaluation-evidence/reason-development

      - name: Evaluate protected Reason baseline and equivalent challenger
        run: |
          python scripts/evaluate_recorded.py \
            benchmarks/parallax-engineering/reason-promotion-v0.1.json \
            benchmarks/parallax-engineering/fixtures/reason-baseline.json \
            --evidence-dir evaluation-evidence/reason-promotion-baseline
          python scripts/evaluate_recorded.py \
            benchmarks/parallax-engineering/reason-promotion-v0.1.json \
            benchmarks/parallax-engineering/fixtures/reason-equivalent.json \
            --evidence-dir evaluation-evidence/reason-promotion-challenger
          BASELINE=$(find evaluation-evidence/reason-promotion-baseline -type f -name 'eval-*.json' | head -1)
          CHALLENGER=$(find evaluation-evidence/reason-promotion-challenger -type f -name 'eval-*.json' | head -1)
          python scripts/compare_evaluations.py "$BASELINE" "$CHALLENGER" \
            --evidence-dir evaluation-evidence/reason-promotion-decision

      - name: Prove Reason continuity, status, and scope regressions are rejected
        run: |
          BASELINE=$(find evaluation-evidence/reason-promotion-baseline -type f -name 'eval-*.json' | head -1)
          if [ -z "$BASELINE" ]; then
            echo 'FAIL: Reason baseline evidence was not produced'
            exit 1
          fi

          for regression in continuity status scope; do
            case "$regression" in
              continuity) FIXTURE="reason-continuity-regression.json" ;;
              status) FIXTURE="reason-status-regression.json" ;;
              scope) FIXTURE="reason-scope-regression.json" ;;
            esac
            OUT="evaluation-evidence/reason-rejected-${regression}"
            DECISION="evaluation-evidence/reason-rejected-${regression}-decision"

            set +e
            python scripts/evaluate_recorded.py \
              benchmarks/parallax-engineering/reason-promotion-v0.1.json \
              "benchmarks/parallax-engineering/fixtures/${FIXTURE}" \
              --evidence-dir "$OUT"
            EVAL_RC=$?
            REGRESSION_EVIDENCE=$(find "$OUT" -type f -name 'eval-*.json' | head -1)
            if [ -z "$REGRESSION_EVIDENCE" ]; then
              echo "FAIL: $regression regression produced no evaluation evidence"
              exit 1
            fi
            python scripts/compare_evaluations.py "$BASELINE" "$REGRESSION_EVIDENCE" \
              --evidence-dir "$DECISION"
            COMPARE_RC=$?
            set -e

            if [ "$EVAL_RC" -eq 0 ] || [ "$COMPARE_RC" -eq 0 ]; then
              echo "FAIL: Reason $regression regression was not rejected by both protected evaluation and promotion comparison"
              exit 1
            fi
            echo "PASS: Reason $regression regression rejected; evaluate=$EVAL_RC compare=$COMPARE_RC"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-evidence
          path: evaluation-evidence
          if-no-files-found: error
          retention-days: 14

  dspy-development:
    name: DSPy release compilation
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    needs: spec-and-api
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'

      - name: Resolve active release specification
        run: |
          RELEASE_SPEC=$(find specs -maxdepth 1 -type f -name 'P2-V*.md' | sort -V | tail -1)
          if [ -z "$RELEASE_SPEC" ]; then
            echo 'FAIL: no versioned Parallax release specification found'
            exit 1
          fi
          RELEASE_STEM=$(basename "$RELEASE_SPEC" .md)
          echo "PARALLAX_RELEASE_SPEC=$RELEASE_SPEC" >> "$GITHUB_ENV"
          echo "PARALLAX_RELEASE_STEM=$RELEASE_STEM" >> "$GITHUB_ENV"
          echo "Resolved active release specification: $RELEASE_SPEC"

      - id: model
        name: Select provider-backed or local DSPy model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "name=openai/gpt-5.6-sol" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "name=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi

      - name: Install local DSPy development LM
        if: steps.model.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b

      - name: Run DSPy SpecCritic + SpecCompiler for active release contract
        timeout-minutes: 8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/compile_spec.py "$PARALLAX_RELEASE_SPEC"
          cp "specs/compiled/${PARALLAX_RELEASE_STEM}.plan.json" specs/compiled/active-release.plan.json

      - name: Verify compiled plan against protected active release contract
        run: python scripts/validate_spec.py --require-dspy "$PARALLAX_RELEASE_SPEC"

      - name: Record DSPy development status
        if: success()
        env:
          PROVIDER: ${{ steps.model.outputs.provider }}
          MODEL: ${{ steps.model.outputs.name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          stem = os.environ['PARALLAX_RELEASE_STEM']
          Path('specs/compiled/dspy-run-status.json').write_text(json.dumps({
              'executed': True,
              'spec_id': stem,
              'spec_compiler_executed': True,
              'spec_critic_executed': True,
              'model': os.environ['MODEL'],
              'provider_backed': os.environ['PROVIDER'] == 'true',
              'artifact': f'{stem}.plan.json',
              'protected_metrics_required': True
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspy-development-evidence
          path: |
            specs/compiled/active-release.plan.json
            specs/compiled/dspy-run-status.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
