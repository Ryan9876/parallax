name: Parallax P2 CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spec-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate v0.1.0 foundation spec and bootstrap plan
        run: python scripts/validate_spec.py specs/P2-V0.1.0.md
      - name: Validate v0.2.0 approved spec before DSPy compilation
        run: python scripts/validate_spec.py --spec-only specs/P2-V0.2.0.md
      - run: pip install -e 'services/api[dev]'
      - run: python -m compileall -q services/api/parallax_api scripts
      - run: python -m pytest services/api/tests -q

  dspy-development:
    runs-on: ubuntu-latest
    needs: spec-and-api
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e 'services/api[dev]'

      - id: model
        name: Select provider-backed or local DSPy model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "name=openai/gpt-5.6-sol" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "name=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi

      - name: Install local DSPy development LM
        if: steps.model.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b

      - name: Run DSPy SpecCritic + SpecCompiler for P2-V0.2.0
        timeout-minutes: 8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py specs/P2-V0.2.0.md

      - name: Verify compiled plan against protected v0.2.0 contract
        run: python scripts/validate_spec.py --require-dspy specs/P2-V0.2.0.md

      - name: Record DSPy development status
        if: success()
        env:
          PROVIDER: ${{ steps.model.outputs.provider }}
          MODEL: ${{ steps.model.outputs.name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('specs/compiled/dspy-run-status.json').write_text(json.dumps({
              'executed': True,
              'spec_id': 'P2-V0.2.0',
              'spec_compiler_executed': True,
              'spec_critic_executed': True,
              'model': os.environ['MODEL'],
              'provider_backed': os.environ['PROVIDER'] == 'true',
              'artifact': 'P2-V0.2.0.plan.json',
              'protected_metrics_required': True
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dspy-development-evidence
          path: |
            specs/compiled/P2-V0.2.0.plan.json
            specs/compiled/dspy-run-status.json
            /tmp/ollama.log
          if-no-files-found: error
          retention-days: 14

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - working-directory: apps/client
        run: npm install
      - working-directory: apps/client
        run: npm audit --omit=dev --json > npm-audit.json || true
      - working-directory: apps/client
        run: npm run typecheck
      - working-directory: apps/client
        run: npm run test:state
      - working-directory: apps/client
        run: npm run export:web
      - working-directory: apps/client
        run: npx playwright install --with-deps chromium
      - working-directory: apps/client
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-build-evidence
          path: |
            apps/client/package-lock.json
            apps/client/npm-audit.json
            apps/client/dist
            apps/client/visual-evidence
          if-no-files-found: error
          retention-days: 14
