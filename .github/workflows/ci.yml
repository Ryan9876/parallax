name: Parallax P2 CI

on:
  pull_request:
    branches: [main, integration/wave7-productization]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: parallax-p2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spec-and-api:
    name: Fast API + contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Validate baseline specifications
        run: |
          python scripts/validate_spec.py specs/P2-V0.1.0.md
          for spec in \
            specs/P2-V0.2.0.md \
            specs/P2-V0.3.0.md \
            specs/P2-V0.4.0.md \
            specs/P2-V0.5.0.md \
            specs/P2-V0.6.2.md \
            specs/P2-V0.6.3.md \
            specs/P2-V0.7.0.md \
            specs/P2-V0.8.0.md \
            specs/P2-V0.9.0.md \
            specs/P2-V0.9.1.md \
            specs/P2-V0.10.0.md \
            specs/P2-V0.11.0.md \
            specs/P2-V0.11.1.md \
            specs/P2-V0.12.0.md; do
            python scripts/validate_spec.py --spec-only "$spec"
          done
      - name: Install API development dependencies
        run: pip install -e 'services/api[dev]'
      - name: Compile Python sources
        run: python -m compileall -q services/api/parallax_api scripts
      - name: Run API regression suite
        run: python -m pytest services/api/tests -q

  client:
    name: Fast client checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install client dependencies
        working-directory: apps/client
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/client
        run: npm run typecheck
      - name: Response state tests
        working-directory: apps/client
        run: npm run test:state
      - name: Export web build
        working-directory: apps/client
        run: npm run export:web

  evaluation:
    name: Protected promotion evaluation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'

      - name: Validate protected benchmark suites
        run: |
          for benchmark in \
            benchmarks/parallax-engineering/development-v0.1.json \
            benchmarks/parallax-engineering/promotion-v0.1.json \
            benchmarks/parallax-engineering/reason-development-v0.1.json \
            benchmarks/parallax-engineering/reason-promotion-v0.1.json \
            benchmarks/parallax-engineering/code-development-v0.4.json \
            benchmarks/parallax-engineering/code-promotion-v0.4.json; do
            python scripts/validate_benchmark.py "$benchmark"
          done

      - name: Evaluate protected Code baseline and equivalent challenger
        run: |
          python scripts/evaluate_recorded.py benchmarks/parallax-engineering/code-promotion-v0.4.json benchmarks/parallax-engineering/fixtures/code-baseline.json --evidence-dir evaluation-evidence/code-promotion-baseline
          python scripts/evaluate_recorded.py benchmarks/parallax-engineering/code-promotion-v0.4.json benchmarks/parallax-engineering/fixtures/code-equivalent.json --evidence-dir evaluation-evidence/code-promotion-challenger
          BASELINE=$(find evaluation-evidence/code-promotion-baseline -type f -name 'eval-*.json' | head -1)
          CHALLENGER=$(find evaluation-evidence/code-promotion-challenger -type f -name 'eval-*.json' | head -1)
          python scripts/compare_evaluations.py "$BASELINE" "$CHALLENGER" --evidence-dir evaluation-evidence/code-promotion-decision

      - name: Prove Code regressions are rejected
        run: |
          for fixture in code-stage-regression.json code-status-regression.json code-spec-regression.json code-unsafe-regression.json; do
            set +e
            python scripts/evaluate_recorded.py benchmarks/parallax-engineering/code-promotion-v0.4.json "benchmarks/parallax-engineering/fixtures/$fixture" --evidence-dir "evaluation-evidence/code-rejected-$fixture"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "FAIL: Code regression unexpectedly passed: $fixture"
              exit 1
            fi
          done

      - name: Evaluate engineering development and promotion fixtures
        run: |
          python scripts/evaluate_recorded.py benchmarks/parallax-engineering/development-v0.1.json benchmarks/parallax-engineering/fixtures/development-good.json --evidence-dir evaluation-evidence/development
          python scripts/evaluate_recorded.py benchmarks/parallax-engineering/promotion-v0.1.json benchmarks/parallax-engineering/fixtures/promotion-baseline.json --evidence-dir evaluation-evidence/promotion-baseline
          python scripts/evaluate_recorded.py benchmarks/parallax-engineering/promotion-v0.1.json benchmarks/parallax-engineering/fixtures/promotion-equivalent.json --evidence-dir evaluation-evidence/promotion-challenger
          BASELINE=$(find evaluation-evidence/promotion-baseline -type f -name 'eval-*.json' | head -1)
          CHALLENGER=$(find evaluation-evidence/promotion-challenger -type f -name 'eval-*.json' | head -1)
          python scripts/compare_evaluations.py "$BASELINE" "$CHALLENGER" --evidence-dir evaluation-evidence/promotion-decision

      - name: Prove inherited engineering regression is rejected
        run: |
          set +e
          python scripts/evaluate_recorded.py benchmarks/parallax-engineering/promotion-v0.1.json benchmarks/parallax-engineering/fixtures/promotion-regression.json --evidence-dir evaluation-evidence/rejected-regression
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'FAIL: known engineering protected regression unexpectedly passed'
            exit 1
          fi

      - name: Evaluate protected Reason fixtures
        run: |
          python scripts/evaluate_recorded.py benchmarks/parallax-engineering/reason-development-v0.1.json benchmarks/parallax-engineering/fixtures/reason-development-good.json --evidence-dir evaluation-evidence/reason-development
          python scripts/evaluate_recorded.py benchmarks/parallax-engineering/reason-promotion-v0.1.json benchmarks/parallax-engineering/fixtures/reason-baseline.json --evidence-dir evaluation-evidence/reason-promotion-baseline
          python scripts/evaluate_recorded.py benchmarks/parallax-engineering/reason-promotion-v0.1.json benchmarks/parallax-engineering/fixtures/reason-equivalent.json --evidence-dir evaluation-evidence/reason-promotion-challenger
          BASELINE=$(find evaluation-evidence/reason-promotion-baseline -type f -name 'eval-*.json' | head -1)
          CHALLENGER=$(find evaluation-evidence/reason-promotion-challenger -type f -name 'eval-*.json' | head -1)
          python scripts/compare_evaluations.py "$BASELINE" "$CHALLENGER" --evidence-dir evaluation-evidence/reason-promotion-decision

      - name: Prove Reason regressions are rejected
        run: |
          BASELINE=$(find evaluation-evidence/reason-promotion-baseline -type f -name 'eval-*.json' | head -1)
          test -n "$BASELINE"
          for regression in continuity status scope; do
            case "$regression" in
              continuity) fixture=reason-continuity-regression.json ;;
              status) fixture=reason-status-regression.json ;;
              scope) fixture=reason-scope-regression.json ;;
            esac
            out="evaluation-evidence/reason-rejected-$regression"
            decision="evaluation-evidence/reason-rejected-$regression-decision"
            set +e
            python scripts/evaluate_recorded.py benchmarks/parallax-engineering/reason-promotion-v0.1.json "benchmarks/parallax-engineering/fixtures/$fixture" --evidence-dir "$out"
            eval_rc=$?
            evidence=$(find "$out" -type f -name 'eval-*.json' | head -1)
            if [ -z "$evidence" ]; then
              echo "FAIL: $regression regression produced no evaluation evidence"
              exit 1
            fi
            python scripts/compare_evaluations.py "$BASELINE" "$evidence" --evidence-dir "$decision"
            compare_rc=$?
            set -e
            if [ "$eval_rc" -eq 0 ] || [ "$compare_rc" -eq 0 ]; then
              echo "FAIL: Reason $regression regression was not rejected by both protected checks"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-evidence
          path: evaluation-evidence
          if-no-files-found: error
          retention-days: 14

  dspy-development:
    name: DSPy release compilation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e 'services/api[dev]'

      - id: spec
        name: Select latest governed specification
        shell: bash
        run: |
          set -euo pipefail
          latest=$(find specs -maxdepth 1 -type f -name 'P2-V*.md' -printf '%f\n' | sort -V | tail -1)
          test -n "$latest"
          echo "path=specs/$latest" >> "$GITHUB_OUTPUT"
          echo "id=${latest%.md}" >> "$GITHUB_OUTPUT"

      - name: Validate committed DSPy evidence on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/validate_spec.py --require-dspy "${{ steps.spec.outputs.path }}"

      - id: model
        name: Select provider-backed or local DSPy model
        if: github.event_name != 'pull_request'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "provider=true" >> "$GITHUB_OUTPUT"
            echo "name=openai/gpt-5.6-sol" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=openai/gpt-5.6-sol" >> "$GITHUB_ENV"
          else
            echo "provider=false" >> "$GITHUB_OUTPUT"
            echo "name=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_OUTPUT"
            echo "DSPY_MODEL=ollama_chat/qwen2.5:0.5b" >> "$GITHUB_ENV"
            echo "DSPY_API_BASE=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "DSPY_API_KEY=" >> "$GITHUB_ENV"
            echo "DSPY_LOCAL_DEVELOPMENT=1" >> "$GITHUB_ENV"
          fi

      - name: Install local DSPy release LM
        if: github.event_name != 'pull_request' && steps.model.outputs.provider == 'false'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b

      - name: Run DSPy SpecCritic + SpecCompiler at promotion boundary
        if: github.event_name != 'pull_request'
        timeout-minutes: 8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/compile_spec.py "${{ steps.spec.outputs.path }}"

      - name: Verify freshly compiled plan at promotion boundary
        if: github.event_name != 'pull_request'
        run: python scripts/validate_spec.py --require-dspy "${{ steps.spec.outputs.path }}"

      - name: Record DSPy promotion status
        if: github.event_name != 'pull_request' && success()
        env:
          PROVIDER: ${{ steps.model.outputs.provider }}
          MODEL: ${{ steps.model.outputs.name }}
          SPEC_ID: ${{ steps.spec.outputs.id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          spec_id = os.environ['SPEC_ID']
          Path('specs/compiled/dspy-run-status.json').write_text(json.dumps({
              'executed': True,
              'spec_id': spec_id,
              'spec_compiler_executed': True,
              'spec_critic_executed': True,
              'model': os.environ['MODEL'],
              'provider_backed': os.environ['PROVIDER'] == 'true',
              'artifact': f'{spec_id}.plan.json',
              'protected_metrics_required': True,
              'boundary': 'promotion'
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: dspy-promotion-evidence
          path: |
            specs/compiled/${{ steps.spec.outputs.id }}.plan.json
            specs/compiled/dspy-run-status.json
            /tmp/ollama.log
          if-no-files-found: warn
          retention-days: 14
