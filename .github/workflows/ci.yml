name: Parallax P2 CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  hotfix-246-record-sync:
    if: github.event.pull_request.head.ref == 'p2/hotfix-246-state-record'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2/hotfix-246-state-record
          fetch-depth: 0
      - name: Reconcile deployment-verified state and restore canonical workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('CURRENT-STATE.md')
          text = path.read_text()

          release = (
              'Release: Wave 5 remains the deployment-verified generalized-delivery base, with production API hotfix #246 '
              '**deployment-verified on top of that release**. Exact hotfix candidate `7eaa290fd57a2a333976ed882f29075f9d022e3f` '
              'merged through PR #247 to `main` as `36548611c3806d08d6fbfcdb686fe2a025956194`; production API deployment '
              '`dpl_3FdvRJbf34KZfaL9mgE8eWJ6wZGB` is READY on that exact merge SHA. The hotfix contains no client-runtime '
              'change, so deployment-verified client `dpl_HxCGSRkEuJJ6qmHwokwPSM6XMcEn` remains current production.'
          )
          text, count = re.subn(r'^Release: .*$', release, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f'expected one Release line, found {count}')

          status = (
              'Status: **WAVE 5 BASE RELEASE / HOTFIX #246 PRODUCTION DEPLOYMENT-VERIFIED / API READY / '
              'CLIENT RETAINED AND VERIFIED / OPERATOR FUNCTIONAL RETEST PENDING / HUMAN REVIEW BOUNDARY PRESERVED / '
              'ROLLBACK AVAILABLE / SINGLE-USER PRODUCTION PROMOTION STANDING AUTHORITY ACTIVE**'
          )
          text, count = re.subn(r'^Status: .*$', status, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f'expected one Status line, found {count}')

          marker = '## Wave 5 production release and deployment verification\n'
          hotfix_section = '''## Production hotfix #246 — first Code objective bootstrap

Production acceptance testing on 2026-08-25 created Project `9e898865-b98e-41d3-b000-bdc87bad377f` (`OT Time`) with the correct canonical repository `github:ryan9876/ot-time`, then fresh Code conversation `a3ea40d6-dbf9-4694-970d-8ff4b2f87024` with objective `Add an about page`. The first-turn `/responses` path unnecessarily invoked model-backed protected scope/reason coordination before any approved objective existed and surfaced `PROTECTED_SCOPE_FAILURE`; `Capture Spec` then exhausted the model route and returned HTTP 503 without persisting a Work Specification. Issue #246 records this production regression. The earlier wrong-repository defect remains separately tracked by #244, and failed-IMPLEMENT observability remains separately tracked by #245.

PR #247 corrects only the redundant first-turn inference boundary. A fresh `ACTIVE` Code conversation with no prior durable user objective now persists that first objective once and returns a deterministic handoff to Work Specification capture without initializing model-backed response/scope coordination. Work Specification generation, explicit approval, Project/repository authority, Engineering Run activation, provider delivery, REVIEW/HUMAN_REQUIRED and deployment authority are unchanged. Reason mode and established Code follow-ups continue through the protected scope/reason path. The model router also emits bounded operational diagnostics containing only model identity, route status, duration and exception class; prompts, generated output, exception messages, credentials and hidden reasoning remain excluded.

Exact hotfix candidate `7eaa290fd57a2a333976ed882f29075f9d022e3f` passed Workstream Spec Validation #352 (`32921051668`), Bounded Autonomy #554 (`32921051600`), Parallax P2 CI #913 (`32921051574`), full API tests, client typecheck/state/export, browser/Skia acceptance, protected Code/Engineering/Reason promotion and regression rejection, release DSPy compilation, and both Vercel Preview checks. PR #247 merged that candidate to `main` as `36548611c3806d08d6fbfcdb686fe2a025956194`.

Production API deployment `dpl_3FdvRJbf34KZfaL9mgE8eWJ6wZGB` is `READY`, target `production`, and bound to exact merge SHA `36548611c3806d08d6fbfcdb686fe2a025956194`. Its build passed registered-provider/source-tree/private-Blob preflight, exact repository delivery-permission preflight, projected-source verification, private Blob immutable get/put/get, lineage composition with metadata rollback, projected bootstrap with engineering-runtime/process-recreation/replay/no-stage-mutation/project rollback, execution-snapshot deny-all/offline-dependency verification, and the Wave 4 run-event schema guard. Post-cutover `https://parallax-api-tan.vercel.app/health` and `/ready` returned HTTP 200; `/ready` reported `database=ok`, `providers=ok`, and one provider target, and deployment-scoped runtime logs prove those requests were served by `dpl_3FdvRJbf34KZfaL9mgE8eWJ6wZGB`.

The production client is unchanged and remains `dpl_HxCGSRkEuJJ6qmHwokwPSM6XMcEn`. Immediate API rollback is the preceding READY Wave 5 deployment `dpl_9fdjDUX73b8VDcRA2ipVuXhwtgKc`. No migration, environment/configuration mutation, credential change or provider-authority expansion is part of #246.

Operator functional retest remains pending. Deployment verification proves the corrected first-Code-objective path, exact-head regression gates and production service health; it does **not** yet prove that the subsequent real provider-backed Work Specification draft succeeds for the operator session. If `Capture Spec` still exhausts routing, the new bounded diagnostics are the required production evidence for distinguishing provider failure from protected-output validation failure. Issue #246 remains open until that functional retest is resolved.

'''
          if '## Production hotfix #246 — first Code objective bootstrap' not in text:
              if marker not in text:
                  raise SystemExit('Wave 5 section marker missing')
              text = text.replace(marker, hotfix_section + marker, 1)

          production_api = (
              'The deployment-verified production API/runtime binary is Vercel deployment '
              '`dpl_3FdvRJbf34KZfaL9mgE8eWJ6wZGB` from hotfix merge '
              '`main@36548611c3806d08d6fbfcdb686fe2a025956194`. It is `READY`, target `production`, and the live production '
              'aliases serve its health/readiness traffic. The Wave 5 generalized-delivery capability base remains '
              '`main@c39b5352be940f4052baa65c7cdd9d7c3ec773bb`; #246 advances the production API binary only with the bounded '
              'first-Code-objective bootstrap correction and model-route diagnostics.'
          )
          text, count = re.subn(
              r'The deployment-verified production API/runtime binary is Vercel deployment `dpl_9fdjDUX73b8VDcRA2ipVuXhwtgKc`.*?\n\n',
              production_api + '\n\n', text, count=1, flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'expected one prior current-production API paragraph, found {count}')

          rollback = (
              'The immediately preceding known-good API production deployment '
              '`dpl_9fdjDUX73b8VDcRA2ipVuXhwtgKc` from Wave 5 application merge '
              '`main@c39b5352be940f4052baa65c7cdd9d7c3ec773bb` remains `READY` and is the immediate rollback reference for '
              'hotfix #246. The earlier known-good deployment `dpl_ExFCK2iMVDbJbRiBZcL4faspHaw5` remains available as a '
              'secondary application rollback reference, with `dpl_2L4R6g3em7LJc7XWdRp5rueGFRK1` retained as the older '
              'reference. Routine rollback remains non-destructive and follows the existing flag-first/application-deployment policy.'
          )
          text, count = re.subn(
              r'The immediately preceding known-good API production deployment `dpl_ExFCK2iMVDbJbRiBZcL4faspHaw5`.*?\n\n',
              rollback + '\n\n', text, count=1, flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'expected one prior rollback paragraph, found {count}')

          record_note = (
              'This `CURRENT-STATE.md` update is a record-only reconciliation after hotfix #246 production deployment verification. '
              'When this record-only change is merged, it must not redefine the application/runtime deployment identity: current '
              'production API identity remains `main@36548611c3806d08d6fbfcdb686fe2a025956194` / '
              '`dpl_3FdvRJbf34KZfaL9mgE8eWJ6wZGB`, while the retained production client remains '
              '`dpl_HxCGSRkEuJJ6qmHwokwPSM6XMcEn`.'
          )
          text, count = re.subn(
              r'This post-cutover `CURRENT-STATE\.md` reconciliation is a record-only repository change\..*?\n\n',
              record_note + '\n\n', text, count=1, flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'expected one prior record-only paragraph, found {count}')

          path.write_text(text)
          PY

          git checkout 36548611c3806d08d6fbfcdb686fe2a025956194 -- .github/workflows/ci.yml .github/workflows/optimize-spec.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT-STATE.md .github/workflows/ci.yml .github/workflows/optimize-spec.yml
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/ci.yml' '.github/workflows/optimize-spec.yml' 'CURRENT-STATE.md' | sort)"
          test "$staged" = "$expected"
          git commit -m 'docs(state): record hotfix 246 deployment verification'
          git push origin HEAD:p2/hotfix-246-state-record
