name: Parallax P2 CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  spec-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/validate_spec.py specs/P2-V0.1.0.md
      - run: pip install -e 'services/api[dev]'
      - run: python -m pytest services/api/tests -q

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - working-directory: apps/client
        run: npm install
      - working-directory: apps/client
        run: npm audit --omit=dev --audit-level=high
      - working-directory: apps/client
        run: npm run typecheck
      - working-directory: apps/client
        run: npm run test:state
      - working-directory: apps/client
        run: npm run export:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-package-lock
          path: apps/client/package-lock.json
          if-no-files-found: error
