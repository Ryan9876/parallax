name: Reconcile P2-V0.23.16 Current State

on:
  push:
    branches:
      - docs/p2316-production-acceptance
    paths:
      - .github/workflows/reconcile-p2316-current-state.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p2316-production-acceptance
          fetch-depth: 0
      - name: Update authoritative current state
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit authoritative record update
        run: |
          if git diff --quiet -- CURRENT-STATE.md; then
            echo "CURRENT-STATE.md already reconciled"
            exit 0
          fi
          git config user.name "parallax-record-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CURRENT-STATE.md
          git commit -m "Record P2-V0.23.16 production acceptance"
          git push origin HEAD:docs/p2316-production-acceptance
