[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-api"
version = "0.1.0"
description = "Parallax 2.0 intelligence and persistence service"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.128,<0.129",
  "uvicorn[standard]>=0.48,<1",
  "sqlalchemy>=2.0.50,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "dspy>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["parallax_api*"]

[tool.vercel]
entrypoint = "parallax_api.main:app"
